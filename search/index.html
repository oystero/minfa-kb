</div> <div id="search-results" class="space-y-3"></div> <div id="initial-state" class="text-center py-12"> <svg class="w-10 h-10 mx-auto mb-4 text-gray-300 dark:text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg> <p class="text-gray-500 dark:text-gray-400">输入关键词开始搜索</p> <p class="text-sm text-gray-400 dark:text-gray-500 mt-2">支持搜索文章标题、内容摘要和标签</p> </div> </div> <script type="application/json" id="search-data">[{"id":"代理制度","title":"代理制度","excerpt":"代理是指代理人以被代理人名义实施民事法律行为，其法律后果由被代理人承担的法律制度。代理制度是民事主体借助他人行为扩展自己行为空间的重要工具，在商事活动中具有广泛应用。实务中，代理纠纷主要集中在无权代理、表见代理和代理权滥用等领域。 代理类型 法律依据 产生基础 典型场景 委托代理 《民法典》第163条第1款 被代理人的委托授权 律师代理诉讼、公司员工签约 法定代理 《民法典》第163条第2款 法律","slug":"代理制度","module":"00-总论","moduleName":"总论","tags":["民法","总论","代理","委托代理","表见代理","无权代理"],"wordCount":4259,"created":"2026-05-28","updated":"2026-05-28","content":"# 代理制度\n\n## 概述\n\n代理是指代理人以被代理人名义实施民事法律行为，其法律后果由被代理人承担的法律制度。代理制度是民事主体借助他人行为扩展自己行为空间的重要工具，在商事活动中具有广泛应用。实务中，代理纠纷主要集中在无权代理、表见代理和代理权滥用等领域。\n\n## 核心内容\n\n### 一、代理的类型\n\n| 代理类型 | 法律依据 | 产生基础 | 典型场景 |\n|----------|----------|----------|----------|\n| 委托代理 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第163条|《民法典》第163条]]第1款 | 被代理人的委托授权 | 律师代理诉讼、公司员工签约 |\n| 法定代理 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第163条|《民法典》第163条]]第2款 | 法律的直接规定 | 父母代理未成年子女 |\n\n### 二、委托代理\n\n**法律依据**：[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第162条|《民法典》第162条]]、[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第163条|第163条]]、[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第165条|第165-172条]]\n\n**（一）代理权的授予**\n\n| 要素 | 具体内容 | 法律依据 |\n|------|----------|----------|\n| 授权方式 | 书面或口头，法律规定书面的应书面 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第165条|《民法典》第165条]] |\n| 授权范围 | 代理人在代理权限内实施代理行为 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第162条|《民法典》第162条]] |\n| 授权委托书 | 应载明代理人姓名或名称、代理事项、权限和期限 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第165条|《民法典》第165条]] |\n\n**（二）代理权的限制**\n\n| 限制类型 | 具体内容 | 法律依据 |\n|----------|----------|----------|\n| 自己代理 | 代理人不得以被代理人名义与自己实施民事法律行为 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第168条|《民法典》第168条]]第1款 |\n| 双方代理 | 代理人不得以被代理人的名义与自己同时代理的其他人实施民事法律行为 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第168条|《民法典》第168条]]第2款 |\n| 恶意串通 | 代理人与相对人恶意串通，损害被代理人合法权益的，代理人和相对人承担连带责任 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第164条|《民法典》第164条]]第2款 |\n\n### 三、无权代理\n\n**法律依据**：[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第171条|《民法典》第171条]]\n\n**类型**：\n1. **没有代理权**：自始未获得授权\n2. **超越代理权**：超出了授权范围\n3. **代理权终止后**：代理权已经消灭仍以被代理人名义行事\n\n**法律效果**：\n\n| 情形 | 法律效果 | 法律依据 |\n|------|----------|----------|\n| 被代理人追认 | 对被代理人发生效力 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第171条|《民法典》第171条]]第1款 |\n| 被代理人拒绝追认 | 对被代理人不发生效力 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第171条|《民法典》第171条]]第1款 |\n| 善意相对人催告 | 被代理人自收到通知之日起30日内未作表示的，视为拒绝追认 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第171条|《民法典》第171条]]第2款 |\n| 善意相对人撤销 | 在被代理人追认前，善意相对人有撤销的权利 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第171条|《民法典》第171条]]第2款 |\n\n**无权代理人的责任**：\n\n| 情形 | 责任承担 | 法律依据 |\n|------|----------|----------|\n| 相对人善意 | 有权请求行为人履行债务或者就其受到的损害请求行为人赔偿 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第171条|《民法典》第171条]]第3款 |"},{"id":"民事法律行为效力","title":"民事法律行为效力","excerpt":"民事法律行为的效力问题是民法的核心问题之一，直接决定了当事人的权利义务关系。根据《民法典》的规定，民事法律行为的效力分为四种：有效、无效、可撤销、效力待定。掌握这些效力状态的认定标准，是处理合同纠纷的基础。 构成要件 ： 要件 具体内容 法律依据 行为人适格 具有相应的民事行为能力 《民法典》第143条第1项 意思真实 意思表示真实 《民法典》第143条第2项 内容合法 不违反法律、行政法规的强制","slug":"民事法律行为效力","module":"00-总论","moduleName":"总论","tags":["民法","总论","法律行为","行为效力"],"wordCount":3497,"created":"2026-05-28","updated":"2026-05-28","content":"# 民事法律行为效力\n\n## 概述\n\n民事法律行为的效力问题是民法的核心问题之一，直接决定了当事人的权利义务关系。根据《民法典》的规定，民事法律行为的效力分为四种：有效、无效、可撤销、效力待定。掌握这些效力状态的认定标准，是处理合同纠纷的基础。\n\n## 效力体系\n\n### 一、有效民事法律行为\n\n**构成要件**：\n\n| 要件 | 具体内容 | 法律依据 |\n|------|----------|----------|\n| 行为人适格 | 具有相应的民事行为能力 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第143条|《民法典》第143条]]第1项 |\n| 意思真实 | 意思表示真实 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第143条|《民法典》第143条]]第2项 |\n| 内容合法 | 不违反法律、行政法规的强制性规定 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第143条|《民法典》第143条]]第3项 |\n| 不违背公序良俗 | 不违背公序良俗 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第143条|《民法典》第143条]]第3项 |\n\n**实务要点**：\n\n- **民事行为能力的判断**：以行为时的年龄和精神状态为准\n- **意思表示真实的推定**：原则上推定意思表示真实，主张不真实的一方承担举证责任\n- **强制性规定的识别**：区分效力性强制规定和管理性强制规定\n\n### 二、无效民事法律行为\n\n**法定情形**：\n\n| 无效情形 | 法律依据 | 典型案例 |\n|----------|----------|----------|\n| 无民事行为能力人实施 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第144条|《民法典》第144条]] | 8岁儿童购买手机 |\n| 虚假意思表示 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第146条|《民法典》第146条]] | 阴阳合同 |\n| 违反强制性规定 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第153条|《民法典》第153条]]第1款 | 违法分包合同 |\n| 违背公序良俗 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第153条|《民法典》第153条]]第2款 | 包养协议 |\n| 恶意串通 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第154条|《民法典》第154条]] | 转移财产逃避债务 |\n\n**裁判规则**：\n\n1. **效力性强制规定的识别标准**：\n   - 法律、行政法规明确规定违反将导致合同无效的\n   - 法律、行政法规虽未明确规定，但合同继续有效将损害国家利益或社会公共利益的\n   - 管理性强制规定不影响合同效力\n\n2. **虚假意思表示的认定**：\n   - 双方通谋表示与真意不符\n   - 相对人知道或应当知道真意\n   - 虚假表示无效，隐藏行为依其效力规则判断\n\n3. **恶意串通的举证**：\n   - 需证明双方存在通谋\n   - 需证明损害他人合法权益\n   - 举证责任较重，需达到高度盖然性标准\n\n**无效后果**：\n\n- 自始无效、当然无效、绝对无效\n- 返还财产、折价补偿、赔偿损失\n- 收缴非法所得（限于恶意串通损害国家利益）\n\n### 三、可撤销民事法律行为\n\n**法定情形**：\n\n| 撤销事由 | 法律依据 | 除斥期间 | 起算点 |\n|----------|----------|----------|--------|\n| 重大误解 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第147条|《民法典》第147条]] | 90日 | 知道或应当知道 |\n| 欺诈 | 《民法典》第148、149条 | 1年 | 知道或应当知道 |\n| 胁迫 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第150条|《民法典》第150条]] | 1年 | 胁迫行为终止 |\n| 显失公平 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第151条|《民法典》第151条]] | 1年 | 知道或应当知道 |\n\n**重大误解的认定**：\n\n| 误解类型 | 具体情形 | 是否可撤销 |\n|----------|----------|------------|\n| 对行为性质的误解 | 误将买卖当赠与 | 可撤销 |\n| 对标的物的误解 | 对品种、规格、数量的误解 | 视重要性而定 |\n| 对当事人的误解 | 基于信任关系的误解 | 可撤销 |\n| 动机错误 | 对"},{"id":"民法基本原则","title":"民法基本原则","excerpt":"民法基本原则是贯穿整个民事法律体系的指导性规则，是法官在个案中行使自由裁量权的重要依据。在实务中，基本原则往往在法律规则不明确或存在漏洞时发挥 兜底 作用，是律师论证和法官说理的重要工具。 法律依据 ：《民法典》第7条 条文内容 ：民事主体从事民事活动，应当遵循诚信原则，秉持诚实，恪守承诺。 实务适用场景 ： 适用领域 具体表现 典型案例 合同订立 缔约过失、恶意磋商 指导案例72号 合同履行 附","slug":"民法基本原则","module":"00-总论","moduleName":"总论","tags":["民法","总论","基本原则","诚实信用"],"wordCount":2305,"created":"2026-05-28","updated":"2026-05-28","content":"# 民法基本原则\n\n## 概述\n\n民法基本原则是贯穿整个民事法律体系的指导性规则，是法官在个案中行使自由裁量权的重要依据。在实务中，基本原则往往在法律规则不明确或存在漏洞时发挥\"兜底\"作用，是律师论证和法官说理的重要工具。\n\n## 核心原则\n\n### 一、诚实信用原则（帝王条款）\n\n**法律依据**：[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第7条|《民法典》第7条]]\n\n**条文内容**：民事主体从事民事活动，应当遵循诚信原则，秉持诚实，恪守承诺。\n\n**实务适用场景**：\n\n| 适用领域 | 具体表现 | 典型案例 |\n|----------|----------|----------|\n| 合同订立 | 缔约过失、恶意磋商 | 指导案例72号 |\n| 合同履行 | 附随义务、通知协助义务 | 指导案例67号 |\n| 合同解除 | 解除权行使的正当性审查 | 指导案例67号 |\n| 权利行使 | 禁止权利滥用、禁反言 | 指导性案例229号 |\n| 诉讼程序 | 禁止虚假诉讼、诚信举证 | — |\n\n**裁判规则**：\n\n1. **缔约过失责任**：当事人在订立合同过程中，故意隐瞒与订立合同有关的重要事实或者提供虚假情况，给对方造成损失的，应当承担赔偿责任。\n\n2. **禁反言规则**：当事人在诉讼中作出的陈述或承认，非经对方同意或有充分证据推翻，不得随意撤回或否认。\n\n3. **权利失效理论**：权利人长期不行使权利，导致义务人产生合理信赖，权利人再行使权利将导致明显不公的，法院可不予支持。\n\n### 二、公序良俗原则\n\n**法律依据**：[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第8条|《民法典》第8条]]、[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第153条|第153条]]第2款\n\n**条文内容**：民事主体从事民事活动，不得违反法律，不得违背公序良俗。违背公序良俗的民事法律行为无效。\n\n**实务适用场景**：\n\n| 类型 | 具体情形 | 司法态度 |\n|------|----------|----------|\n| 违反性道德 | \"包养协议\"、\"代孕协议\" | 无效 |\n| 违反家庭伦理 | \"断绝父子关系协议\" | 无效 |\n| 违反人格尊严 | \"卖身契\"、\"奴隶合同\" | 无效 |\n| 射幸行为 | 赌博债务、高利贷 | 无效或部分无效 |\n| 损害公共利益 | 环境污染协议 | 无效 |\n\n**裁判规则**：\n\n1. **公序良俗的认定标准**：应当以社会一般人的道德观念为标准，结合行为的具体情节、后果等因素综合判断。\n\n2. **举证责任**：主张合同违背公序良俗的一方，应当承担举证责任。\n\n3. **部分无效**：合同部分条款违背公序良俗的，该条款无效，不影响其他条款的效力。\n\n### 三、自愿原则（意思自治）\n\n**法律依据**：[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第5条|《民法典》第5条]]\n\n**条文内容**：民事主体从事民事活动，应当遵循自愿原则，按照自己的意思设立、变更、终止民事法律关系。\n\n**实务适用场景**：\n\n| 适用领域 | 具体表现 | 限制情形 |\n|----------|----------|----------|\n| 合同自由 | 缔约自由、内容自由、形式自由 | 强制缔约义务 |\n| 遗嘱自由 | 处分个人财产的自由 | 必留份制度 |\n| 婚姻自由 | 结婚自由、离婚自由 | 离婚冷静期 |\n| 法人自治 | 公司章程、合伙协议 | 法定最低标准 |\n\n**裁判规则**：\n\n1. **意思表示解释**：有相对人的意思表示的解释，应当按照所使用的词句，结合相关条款、行为的性质和目的、习惯以及诚信原则，确定意思表示的含义。\n\n2. **真意保留**：行为人与相对人以虚假的意思表示实施的民事法律行为无效。以虚假的意思表示隐藏的民事法律行为的效力，依照有关法律规定处理。\n\n### 四、公平原则\n\n**法律依据**：[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第6条|《民法典》第6条]]\n\n**条文内容**：民事主体从事民事活动，应当遵循公平原则，合理确定各方的权利和义务。\n\n**实务适用场景**：\n\n| 适用领域 | 具体表现 | 法律后果 |\n|----------|----------|----------|\n| 合同显失公平 | 利用优势地位签订不平等合同 | 可撤销 |\n| 格式条款 | 免除己方责任、加重对方责任 | 无效 |\n| 损害赔偿 | 过失相抵、损益相抵 | 调整赔偿额 |\n\n## 典型案例\n\n### 案例一：指导性案例227号——胡某某、王某"},{"id":"诉讼时效制度","title":"诉讼时效制度","excerpt":"诉讼时效是指权利人在法定期间内不行使权利，即丧失请求人民法院依诉讼程序强制义务人履行义务的权利的法律制度。诉讼时效制度的核心价值在于： 维护交易秩序的稳定性 、 督促权利人及时行使权利 、 避免证据灭失 。 法律依据 ：《民法典》第188条第1款 期间 ： 3年 起算点 ：权利人知道或者应当知道权利受到损害以及义务人之日 实务要点 ： 知道 是指权利人实际知道权利受到侵害 应当知道 是指根据一般人","slug":"诉讼时效制度","module":"00-总论","moduleName":"总论","tags":["民法","总论","诉讼时效","时效中断"],"wordCount":4529,"created":"2026-05-28","updated":"2026-05-28","content":"# 诉讼时效制度\n\n## 概述\n\n诉讼时效是指权利人在法定期间内不行使权利，即丧失请求人民法院依诉讼程序强制义务人履行义务的权利的法律制度。诉讼时效制度的核心价值在于：**维护交易秩序的稳定性**、**督促权利人及时行使权利**、**避免证据灭失**。\n\n## 诉讼时效的类型\n\n### 一、普通诉讼时效\n\n**法律依据**：[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第188条|《民法典》第188条]]第1款\n\n**期间**：**3年**\n\n**起算点**：权利人知道或者应当知道权利受到损害以及义务人之日\n\n**实务要点**：\n\n- \"知道\"是指权利人实际知道权利受到侵害\n- \"应当知道\"是指根据一般人的认知水平，在当时情况下能够知道\n- 两个条件必须同时具备：知道权利受损 + 知道义务人\n\n### 二、特殊诉讼时效\n\n| 时效类型 | 期间 | 适用情形 | 法律依据 |\n|----------|------|----------|----------|\n| 短期时效 | 1年 | 身体受到伤害要求赔偿（原规定，现为3年） | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第188条|《民法典》第188条]] |\n| 长期时效 | 4年 | 国际货物买卖合同和技术进出口合同争议 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第594条|《民法典》第594条]] |\n| 最长时效 | 20年 | 自权利受到损害之日 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第188条|《民法典》第188条]]第2款 |\n\n### 三、最长诉讼时效\n\n**法律依据**：[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第188条|《民法典》第188条]]第2款\n\n**期间**：**20年**\n\n**起算点**：自权利受到损害之日\n\n**特殊性**：\n- 不适用中止、中断的规定\n- 有特殊情况的，人民法院可以根据权利人的申请决定延长\n- 20年期间的性质是除斥期间还是诉讼时效存在争议，通说认为是除斥期间\n\n## 诉讼时效的起算\n\n### 一、一般规则\n\n**法律依据**：[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第188条|《民法典》第188条]]第2款\n\n**规则**：诉讼时效期间自权利人知道或者应当知道权利受到损害以及义务人之日起计算。\n\n**实务认定标准**：\n\n| 情形 | 起算点 |\n|------|--------|\n| 合同之债 | 约定的履行期限届满之日 |\n| 侵权之债 | 知道或应当知道损害及侵权人之日 |\n| 不当得利 | 知道或应当知道得利人之日 |\n| 无因管理 | 管理行为结束之日 |\n\n### 二、特殊起算规则\n\n| 特殊情形 | 起算规则 | 法律依据 |\n|----------|----------|----------|\n| 未约定履行期限 | 宽限期届满之日 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第511条|《民法典》第511条]]第4项 |\n| 分期履行 | 最后一期履行期限届满之日 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第189条|《民法典》第189条]] |\n| 未成年人遭受性侵害 | 年满18周岁之日 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第191条|《民法典》第191条]] |\n| 无民事行为能力人 | 法定代理人知道或应当知道之日 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第190条|《民法典》第190条]] |\n\n## 诉讼时效的中止\n\n### 一、中止事由\n\n**法律依据**：[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第194条|《民法典》第194条]]\n\n**法定事由**：\n\n| 中止事由 | 具体情形 | 法律效果 |\n|----------|----------|----------|\n| 不可抗力 | 自然灾害、疫情、战争等 | 中止事由消除后继续计算 |\n| 无民事行为能力人或限制民事行为能力人没有法定代理人 | 法定代理人缺位 | 待法定代理人确定后继续计算 |\n| 继承开始后未确定继承人或遗产管理人 | 继承人或管理人缺位 | 待确定后继续计算 |\n| 权利人被义务人或者其他人控制 | 被拘禁、被绑架等 | 控制消除后继续计算 |\n| 其他导致权利人不能行使请求权的障碍 | 兜底条款 | 障碍消除后继续计算 |\n\n### 二、中止的时间要求\n\n**关键规则**：中止事由必须发生在诉讼时效期间的**最后6个月内**，才能产生中"},{"id":"可撤销合同","title":"可撤销合同","excerpt":"可撤销合同在被撤销前是有效的，其效力取决于享有撤销权的当事人是否行使撤销权。与无效合同不同，可撤销合同体现的是对当事人意思自治的尊重——法律赋予受害方选择权：要么撤销合同恢复原状，要么维持合同继续履行。撤销权属于形成权，须在除斥期间内行使，逾期则权利消灭。实务中，可撤销合同的认定和撤销权的行使是高频争议焦点。 条文 内容要点 第147条 基于重大误解实施的民事法律行为，行为人有权请求撤销 第148","slug":"可撤销合同","module":"01-合同法","moduleName":"合同法","tags":["民法","合同法","合同效力","可撤销","重大误解","欺诈","胁迫","显失公平"],"wordCount":2754,"created":"2026-05-28","updated":"2026-05-28","content":"# 可撤销合同\n\n## 概述\n\n可撤销合同在被撤销前是有效的，其效力取决于享有撤销权的当事人是否行使撤销权。与无效合同不同，可撤销合同体现的是对当事人意思自治的尊重——法律赋予受害方选择权：要么撤销合同恢复原状，要么维持合同继续履行。撤销权属于形成权，须在除斥期间内行使，逾期则权利消灭。实务中，可撤销合同的认定和撤销权的行使是高频争议焦点。\n\n## 核心内容\n\n### 法律依据\n\n| 条文 | 内容要点 |\n|------|----------|\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第147条|第147条]] | 基于重大误解实施的民事法律行为，行为人有权请求撤销 |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第148条|第148条]] | 一方以欺诈手段使对方违背真实意思实施的民事法律行为，受欺诈方有权请求撤销 |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第149条|第149条]] | 第三人实施欺诈，对方知道或应当知道的，受欺诈方有权请求撤销 |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第150条|第150条]] | 一方或第三人以胁迫手段使对方违背真实意思实施的民事法律行为，受胁迫方有权请求撤销 |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第151条|第151条]] | 一方利用对方处于危困状态、缺乏判断能力等情形致民事法律行为成立时显失公平的，受损方有权请求撤销 |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第152条|第152条]] | 撤销权消灭：（1）重大误解90日内/其他1年内未行使；（2）知道后明确表示或以行为表明放弃；（3）胁迫行为终止后1年内未行使 |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第155条|第155条]] | 被撤销的合同自始没有法律约束力 |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第157条|第157条]] | 合同被撤销后财产返还、折价补偿、损害赔偿的规则 |\n\n### 可撤销事由的构成要件\n\n| 事由 | 构成要件 | 撤销权人 | 除斥期间 |\n|------|----------|----------|----------|\n| 重大误解 | （1）对行为性质、对方当事人、标的物品种/质量/规格/数量等产生错误认识；（2）因错误认识作出了意思表示；（3）错误认识达到\"重大\"程度 | 误解方 | 知道或应当知道之日起90日 |\n| 欺诈 | （1）欺诈方有欺诈故意；（2）实施了告知虚假信息或隐瞒真实信息的行为；（3）受欺诈方因此陷入错误认识并作出意思表示 | 受欺诈方 | 知道或应当知道之日起1年 |\n| 第三人欺诈 | 同欺诈要件，但欺诈行为由第三人实施，且合同相对方知道或应当知道 | 受欺诈方 | 知道或应当知道之日起1年 |\n| 胁迫 | （1）胁迫方有胁迫故意；（2）实施了以损害相要挟的行为；（3）受胁迫方因恐惧而作出意思表示 | 受胁迫方 | 胁迫行为终止之日起1年 |\n| 显失公平 | （1）一方利用对方危困状态、缺乏判断能力等；（2）合同成立时权利义务明显不对等 | 受损方 | 知道或应当知道之日起1年 |\n\n### 裁判规则\n\n| 裁判规则 | 说明 |\n|----------|------|\n| 撤销权的行使方式 | 须向法院或仲裁机构请求，不能以通知方式自行撤销 |\n| 撤销与变更的选择 | 撤销权人可以请求撤销，也可以请求变更（民法典[[⚖️ 民法实务知识库/08-法规全文/合同编通则司法解释|合同编通则司法解释]]） |\n| 欺诈的认定标准 | 不以相对方主观过错为要件，只要客观上告知虚假信息或隐瞒应披露信息即可 |\n| 消费欺诈的特殊性 | 经营者欺诈适用《消费者权益保护法》第55条三倍赔偿，与民法典撤销权并行 |\n| 重大误解与欺诈的区别 | 关键看错误认识的成因：欺诈→对方行为所致；重大误解→自身原因所致 |\n| 显失公平的时间节点 | 以合同**成立时**为准，合同履行后市场变化导致的不公平不构成显失公平 |\n| 撤销后的法律后果 | 合同自始无效，适用[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第157条|第157条]]返还规则 |\n| 胁迫的持续性 | 胁迫手段可能是持续的，除斥期间从胁迫**行为终止**之日起算 |\n\n### 实务要点\n\n1. **撤销权的消灭——催告与沉默**：相对方可催告撤销权人在合理期限内行使，沉默视为放弃。实务中应注意保存催告证据。\n2. **变更优先原则**：法院审理中认为合同可"},{"id":"合同成立与生效","title":"合同成立与生效","excerpt":"合同成立与生效是合同效力体系的起点。成立解决 合同是否存在的事实判断 ，生效解决 合同是否受法律保护的价值判断 。二者在时间上可能一致，也可能分离（如附条件、附期限合同）。实务中，准确区分成立与生效，直接关系到当事人能否主张违约责任还是缔约过失责任，是合同纠纷诉讼的基础性问题。 条文 内容要点 第483条 承诺生效时合同成立，法律另有规定或当事人另有约定的除外 第490条 当事人采用合同书形式的，","slug":"合同成立与生效","module":"01-合同法","moduleName":"合同法","tags":["民法","合同法","合同效力","合同成立","合同生效"],"wordCount":3390,"created":"2026-05-28","updated":"2026-05-28","content":"# 合同成立与生效\n\n## 概述\n\n合同成立与生效是合同效力体系的起点。成立解决\"合同是否存在的事实判断\"，生效解决\"合同是否受法律保护的价值判断\"。二者在时间上可能一致，也可能分离（如附条件、附期限合同）。实务中，准确区分成立与生效，直接关系到当事人能否主张违约责任还是缔约过失责任，是合同纠纷诉讼的基础性问题。\n\n## 核心内容\n\n### 法律依据\n\n| 条文 | 内容要点 |\n|------|----------|\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第483条|第483条]] | 承诺生效时合同成立，法律另有规定或当事人另有约定的除外 |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第490条|第490条]] | 当事人采用合同书形式的，自当事人均签名、盖章或按指印时成立；一方已履行主要义务且对方接受时，合同成立 |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第491条|第491条]] | 信件、数据电文等形式的合同，签订确认书时成立；网络提交订单成功时合同成立 |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第502条|第502条]]第1款 | 依法成立的合同，自成立时生效，法律另有规定或当事人另有约定的除外 |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第502条|第502条]]第2款 | 须办理批准等手续的合同，依照规定；未办理的不影响履行报批义务等条款的效力 |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第158条|第158条]] | 附生效条件的合同，自条件成就时生效 |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第160条|第160条]] | 附生效期限的合同，自期限届至时生效 |\n\n### 合同成立的构成要件\n\n1. **当事人**：具备缔约资格的两方或多方\n2. **标的**：合同权利义务指向的对象须确定或可得确定\n3. **意思表示一致**：要约与承诺达成合意（\"合意\"不要求对所有条款一致，主要条款一致即可）\n4. **形式要求**：法律有特别形式要求的（如书面），需满足；但欠缺形式的合同并非一律不成立\n\n### 合同生效的附加要件\n\n在成立的基础上，生效还要求：\n\n1. **当事人具有相应行为能力**\n2. **意思表示真实**（不存在欺诈、胁迫、重大误解等）\n3. **不违反法律、行政法规的强制性规定**（[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第153条|第153条]]）\n4. **不违背公序良俗**（[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第153条|第153条]]第2款）\n5. **特殊要件**：批准、登记等手续（如中外合资经营合同须经审批）\n\n### 成立与生效的区分——裁判规则\n\n| 裁判规则 | 说明 |\n|----------|------|\n| 未生效合同≠无效合同 | 未生效合同可能在条件成就或手续办理后生效，无效合同自始绝对无效 |\n| 成立未生效合同有形式拘束力 | 当事人不得擅自撤回要约或承诺，违反的承担缔约过失责任而非违约责任 |\n| 报批条款独立生效 | 须批准的合同未获批的，报批义务条款及相关违约条款仍独立生效（[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第502条|第502条]]第2款） |\n| 履行治愈形式瑕疵 | 一方已履行主要义务、对方接受的，即使欠缺书面等形式，合同仍成立（[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第490条|第490条]]） |\n| 附条件合同的期待权保护 | 条件成就前，当事人恶意阻止条件成就的，视为条件已成就（[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第159条|第159条]]） |\n\n### 实务要点\n\n1. **诉讼请求的选择**：合同未成立→主张缔约过失；合同成立但未生效→主张缔约过失或依报批条款主张违约；合同成立且生效→主张违约责任。选错请求可能导致败诉。\n2. **合同书上仅一方签字**：合同未成立，但如另一方已实际履行且对方接受，可主张合同成立。\n3. **批准生效合同的诉讼策略**：最高法院明确，法院应判决相对人限期办理报批手续，而非直接确认合同有效或判令履行合同义务。\n4. **电子合同的成立时间**：电子商务经营者发布的商品信息符合要约条件的，用户选择商品并提交订单成功→合同成立；经营者不得以未发货主张合同未成立。\n5. **预约合同与本约的区分**：认购书、订购书等具备本约主要条款的，应认定为本约而非预约。\n\n## 典型案例\n\n"},{"id":"合同无效的情形","title":"合同无效的情形","excerpt":"合同无效是最严厉的效力瑕疵，意味着合同自始、当然、绝对不发生当事人预期的法律效果。无效合同不因当事人追认、时间经过或条件成就而转为有效。实务中，合同无效的认定直接决定当事人的权利义务分配，涉及财产返还、折价补偿和损害赔偿等一系列后果，是合同纠纷中最核心的争点之一。 条文 内容要点 第144条 无民事行为能力人实施的民事法律行为无效 第146条 以虚假意思表示实施的民事法律行为无效（隐藏行为依法处理","slug":"合同无效的情形","module":"01-合同法","moduleName":"合同法","tags":["民法","合同法","合同效力","合同无效","强制性规定","公序良俗"],"wordCount":3684,"created":"2026-05-28","updated":"2026-05-28","content":"# 合同无效的情形\n\n## 概述\n\n合同无效是最严厉的效力瑕疵，意味着合同自始、当然、绝对不发生当事人预期的法律效果。无效合同不因当事人追认、时间经过或条件成就而转为有效。实务中，合同无效的认定直接决定当事人的权利义务分配，涉及财产返还、折价补偿和损害赔偿等一系列后果，是合同纠纷中最核心的争点之一。\n\n## 核心内容\n\n### 法律依据\n\n| 条文 | 内容要点 |\n|------|----------|\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第144条|第144条]] | 无民事行为能力人实施的民事法律行为无效 |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第146条|第146条]] | 以虚假意思表示实施的民事法律行为无效（隐藏行为依法处理） |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第153条|第153条]]第1款 | 违反法律、行政法规的强制性规定的民事法律行为无效，但该强制性规定不导致无效的除外 |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第153条|第153条]]第2款 | 违背公序良俗的民事法律行为无效 |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第154条|第154条]] | 行为人与相对人恶意串通损害他人合法权益的民事法律行为无效 |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第506条|第506条]] | 免除造成人身损害责任的免责条款无效；免除因故意或重大过失造成财产损失责任的免责条款无效 |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第497条|第497条]] | 格式条款无效的情形（详见[[格式条款效力]]） |\n\n### 合同无效的具体情形\n\n#### 一、绝对无效事由\n\n| 无效类型 | 构成要件 | 典型情形 |\n|----------|----------|----------|\n| 无行为能力 | 一方为无民事行为能力人 | 8周岁以下未成年人、不能辨认自己行为的成年人签订的合同 |\n| 虚假意思表示 | 双方通谋的虚伪表示 | 为逃避债务虚假转让财产、\"名为买卖实为借贷\"中的买卖合同 |\n| 违反效力性强制规定 | 违反法律、行政法规的强制性规定，且该规定旨在否定行为效力 | 违反招投标法强制招标规定签订的\"黑白合同\"中的黑合同 |\n| 违背公序良俗 | 合同内容或目的违背公共秩序或善良风俗 | 包养协议、赌博债务合同、代孕合同 |\n| 恶意串通 | 双方通谋损害第三人利益 | 债务人与第三人串通低价转让财产逃避执行 |\n\n#### 二、部分条款无效\n\n| 条款类型 | 法律依据 | 效力规则 |\n|----------|----------|----------|\n| 免责条款 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第506条|第506条]] | 造成人身损害的免责条款一律无效；故意或重大过失造成财产损失的免责条款无效 |\n| 格式条款 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第497条|第497条]] | 不合理免责、不合理加重对方责任、排除对方主要权利的格式条款无效 |\n| 争议解决条款 | 独立性原则 | 合同无效不影响仲裁条款等争议解决条款的效力 |\n\n### 效力性强制规定与管理性强制规定的区分\n\n这是实务中认定合同无效的**最大难点**。区分标准：\n\n| 判断维度 | 效力性强制规定（违反→无效） | 管理性强制规定（违反→不一定无效） |\n|----------|--------------------------|--------------------------------|\n| 规范目的 | 否定行为效力，保护公共利益 | 管理市场秩序，可行政处罚 |\n| 法律后果 | 明确规定\"无效\"\"不得\" | 仅规定行政处罚、资质管理 |\n| 利益保护 | 涉及不特定第三人或公共利益 | 仅涉及行政管理秩序 |\n| 典型举例 | 未取得建设工程规划许可证的施工合同 | 未办理施工许可的施工合同 |\n\n### 裁判规则\n\n| 裁判规则 | 说明 |\n|----------|------|\n| 无效合同不因履行而有效 | 即使已实际履行多年，无效合同仍为无效 |\n| 合同部分无效不影响其他部分 | 无效部分不影响其他部分效力的，其他部分仍然有效（[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第156条|第156条]]） |\n| 无效合同中的独立条款 | 结算和清理条款、争议解决条款独立于合同效力（第507条、[[⚖"},{"id":"效力待定合同","title":"效力待定合同","excerpt":"效力待定合同是指合同虽已成立，但因主体资格欠缺（限制行为能力人、无权代理人、无权处分人）或法律规定须经批准等特殊生效要件，而效力悬而未决，有待有权人追认、拒绝或审批机关批准、不批准才能确定其最终效力的合同。与无效合同不同，效力待定合同有 治愈 的可能；与可撤销合同不同，效力待定合同的最终效力取决于第三人（追认权人或审批机关）而非当事人自身。该制度的核心价值在于：在保护限制行为能力人、被代理人利益的","slug":"效力待定合同","module":"01-合同法","moduleName":"合同法","tags":["民法","合同法","合同效力","效力待定","无权代理","限制行为能力","行政审批"],"wordCount":3845,"created":"2026-05-28","updated":"2026-06-04","content":"# 效力待定合同\n\n## 概述\n\n效力待定合同是指合同虽已成立，但因主体资格欠缺（限制行为能力人、无权代理人、无权处分人）或法律规定须经批准等特殊生效要件，而效力悬而未决，有待有权人追认、拒绝或审批机关批准、不批准才能确定其最终效力的合同。与无效合同不同，效力待定合同有\"治愈\"的可能；与可撤销合同不同，效力待定合同的最终效力取决于第三人（追认权人或审批机关）而非当事人自身。该制度的核心价值在于：在保护限制行为能力人、被代理人利益的同时，兼顾交易安全和善意相对人的合理期待。\n\n## 核心内容\n\n### 法律依据\n\n| 条文 | 内容要点 |\n|------|----------|\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第145条|第145条]] | 限制民事行为能力人实施的纯获利益或与其年龄/智力/精神状况相适应的行为有效；其他行为须法定代理人追认 |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第171条|第171条]] | 无权代理行为未经被代理人追认对被代理人不发生效力；善意相对人有权撤销；行为人承担履行或赔偿责任 |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第172条|第172条]] | 表见代理——相对人有理由相信代理人有代理权的，代理行为有效 |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第503条|第503条]] | 无权代理人以被代理人名义订立合同，被代理人已开始履行的，视为追认 |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第152条|第152条]] | 追认权的行使期限参照适用撤销权的除斥期间 |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第502条|第502条第2款]] | 须办理批准等手续的合同，未办理的不影响报批义务等条款的效力 |\n\n### 效力待定合同的类型\n\n| 类型 | 法律依据 | 效力确定主体 | 效力确定方式 |\n|------|----------|----------|----------|\n| 限制行为能力人签订的合同 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第145条|第145条]] | 法定代理人 | 明示追认或默示追认 |\n| 无权代理签订的合同 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第171条|第171条]] | 被代理人 | 明示追认或以行为追认 |\n| 无权处分签订的合同 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第311条|第311条]]（善意取得参照） | 权利人 | 明示追认或以行为追认 |\n| 须经批准生效的合同 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第502条|第502条第2款]] | 审批机关 | 批准或不批准 |\n\n### 构成要件\n\n#### 一、限制行为能力人签订的合同\n\n1. 行为人系8周岁以上的未成年人或不能完全辨认自己行为的成年人\n2. 实施的行为不属于纯获利益的行为（如接受赠与）\n3. 实施的行为与其年龄、智力、精神状况不相适应\n4. 法定代理人未事先同意\n\n#### 二、无权代理签订的合同\n\n1. 行为人没有代理权（自始无权）、超越代理权或代理权终止后仍以被代理人名义行事\n2. 行为人以被代理人名义签订合同\n3. 不构成表见代理（[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第172条|第172条]]）\n\n#### 三、无权处分签订的合同\n\n1. 处分人对标的物无处分权\n2. 以自己名义签订合同（区别于无权代理以他人名义签订）\n\n#### 四、须经批准生效的合同\n\n1. 法律、行政法规规定合同应当办理批准等手续方能生效（[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第502条|第502条第2款]]）\n2. 当事人尚未办理批准等手续\n3. 合同已依法成立（双方意思表示一致）\n4. 常见类型：采矿权转让、国有资产转让、外商投资企业变更、金融企业股权转让（超过一定比例）等\n\n### 裁判规则\n\n| 裁判规则 | 说明 |\n|----------|------|\n| 追认的方式 | 可明示（书面/口头同意）或默示（实际履行、接受履行等） |\n| 追认的溯及力 | 追认后合同自成立时生效，而非从追认时生效 |\n| 善意相对人的撤销权 | 在追认前，善意相对人有权以通知方式撤销合同（《民法典》第171条第2款） |\n| 善意的认定标准 | \"善意\"指不知道且不应当知道行为人无权，相对人负有基本审查义务 |\n| 无权处分不影响合同效力 | 《民法典》第5"},{"id":"格式条款效力","title":"格式条款效力","excerpt":"格式条款是当事人为了重复使用而预先拟定、并在订立合同时未与对方协商的条款（第496条第1款）。格式条款在现代经济生活中无处不在——保险合同、银行贷款合同、电信服务协议、网购平台用户协议等均为典型。格式条款提高了交易效率，但也因双方信息和谈判能力的不对等，容易成为优势方转嫁风险、规避责任的工具。法律对格式条款的规制体现了合同正义对合同自由的矫正。 条文 内容要点 第496条 格式条款的定义；提供方应","slug":"格式条款效力","module":"01-合同法","moduleName":"合同法","tags":["民法","合同法","合同效力","格式条款","消费者权益","公平原则"],"wordCount":2556,"created":"2026-05-28","updated":"2026-05-28","content":"# 格式条款效力\n\n## 概述\n\n格式条款是当事人为了重复使用而预先拟定、并在订立合同时未与对方协商的条款（[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第496条|第496条]]第1款）。格式条款在现代经济生活中无处不在——保险合同、银行贷款合同、电信服务协议、网购平台用户协议等均为典型。格式条款提高了交易效率，但也因双方信息和谈判能力的不对等，容易成为优势方转嫁风险、规避责任的工具。法律对格式条款的规制体现了合同正义对合同自由的矫正。\n\n## 核心内容\n\n### 法律依据\n\n| 条文 | 内容要点 |\n|------|----------|\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第496条|第496条]] | 格式条款的定义；提供方应以合理方式提示并说明与对方有重大利害关系的条款 |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第497条|第497条]] | 格式条款无效的三种情形 |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第498条|第498条]] | 格式条款的解释规则——不利于提供方的解释（不利解释原则） |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第496条|第496条]]第2款 | 未履行提示说明义务的法律后果：对方可主张该条款不成为合同内容 |\n\n### 格式条款的认定标准\n\n| 判断要素 | 具体内容 |\n|----------|----------|\n| 预先拟定 | 由一方当事人或第三方事先制定，非双方协商的结果 |\n| 重复使用 | 以向不特定多数人适用为目的（注意：不以\"实际多次使用\"为要件） |\n| 未经协商 | 对方对条款内容没有实质修改的机会 |\n| 表现形式 | 不限于书面，电子合同、APP用户协议等均包含在内 |\n\n### 格式条款的规制体系\n\n```\n格式条款规制\n    │\n    ├── 程序控制（第496条第2款）\n    │       ├── 提示义务：以合理方式提请对方注意\n    │       │       └── 字体、符号、颜色等足以引起注意\n    │       └── 说明义务：应对方要求予以说明\n    │               └── 未履行→对方可主张条款不成为合同内容\n    │\n    ├── 内容控制（第497条）\n    │       ├── 绝对无效：民法典第153条（违法、违背公序良俗）\n    │       ├── 绝对无效：不合理免除己方责任\n    │       ├── 绝对无效：不合理加重对方责任\n    │       └── 绝对无效：排除对方主要权利\n    │\n    └── 解释控制（第498条）\n            ├── 通常理解解释\n            ├── 两种以上解释→不利于提供方的解释\n            └── 非格式条款优先于格式条款\n```\n\n### 格式条款无效的具体情形\n\n| 无效类型 | 判断标准 | 典型案例场景 |\n|----------|----------|------------|\n| 不合理免除己方责任 | 免除的是否属于其应承担的基本义务；是否超出合理风险分配 | \"快递丢失概不赔偿\"\"售出商品概不退换\" |\n| 不合理加重对方责任 | 要求对方承担的风险或义务是否超出交易性质和公平原则 | \"买方逾期付款日违约金1%\"（而卖方逾期交货无对等条款） |\n| 排除对方主要权利 | 是否剥夺了对方依据合同性质和交易习惯应享有的核心权利 | \"消费者不得提起诉讼\"\"放弃一切索赔权利\" |\n| 未尽提示说明义务 | 对于与对方有重大利害关系的条款，是否以合理方式提请注意 | 保险免责条款用极小字体打印、隐藏在附件中 |\n\n### 裁判规则\n\n| 裁判规则 | 说明 |\n|----------|------|\n| 提示方式的合理性 | 应采用足以引起对方注意的文字、字体、符号、标识等特殊标识；在网络合同中应以弹窗、加粗、下划线等方式提示 |\n| 说明义务的范围 | 不限于对方主动询问；对于免除或限制己方责任的条款，应主动说明 |\n| \"不合理\"的判断标准 | 应综合考虑合同性质、交易习惯、双方地位、风险与收益是否匹配等因素 |\n| 格式条款与非格式条款并存 | 非格式条款（手写条款、补充协议）与格式条款不一致的，以非格式条款为准 |\n| 保险合同的特殊规则 | 保险合同中免责条款未尽提示说明义务的，该条款不产生效力（《保险法》第17条） |\n| 电子商务格式条款 | 电子商务平台用户协议中的\"一键同意\"不当然免除提示说明义务 |\n| \"最终解释权"},{"id":"不可抗力","title":"不可抗力","excerpt":"不可抗力是合同法中最重要的免责事由之一，指不能预见、不能避免且不能克服的客观情况。当不可抗力导致合同不能履行时，根据影响程度不同，当事人可以部分或全部免除责任，甚至解除合同。实务中，不可抗力的认定标准、通知义务、证明责任以及与情势变更的区分，是最常见的争议焦点。 条文 内容要点 第180条 因不可抗力不能履行民事义务的，不承担民事责任。法律另有规定的，依照其规定 第590条 当事人一方因不可抗力不","slug":"不可抗力","module":"01-合同法","moduleName":"合同法","tags":["民法","合同法","合同履行","不可抗力","免责事由","合同解除"],"wordCount":3380,"created":"2026-05-28","updated":"2026-05-28","content":"# 不可抗力\n\n## 概述\n\n不可抗力是合同法中最重要的免责事由之一，指不能预见、不能避免且不能克服的客观情况。当不可抗力导致合同不能履行时，根据影响程度不同，当事人可以部分或全部免除责任，甚至解除合同。实务中，不可抗力的认定标准、通知义务、证明责任以及与情势变更的区分，是最常见的争议焦点。\n\n## 核心内容\n\n### 一、法律依据\n\n| 条文 | 内容要点 |\n|------|----------|\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第180条|第180条]] | 因不可抗力不能履行民事义务的，不承担民事责任。法律另有规定的，依照其规定 |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第590条|第590条]] | 当事人一方因不可抗力不能履行合同的，根据不可抗力的影响，部分或者全部免除责任，但法律另有规定的除外。因不可抗力不能履行合同的，应当及时通知对方，以减轻可能给对方造成的损失，并应当在合理期限内提供证明 |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第563条|第563条]]第1项 | 因不可抗力致使不能实现合同目的，当事人可以解除合同 |\n\n### 二、不可抗力的构成要件\n\n| 要件 | 具体要求 | 认定标准 |\n|------|----------|----------|\n| 不能预见 | 当事人在订立合同时无法预见该事件的发生 | 以同行业、同类型交易的一般认知水平为标准 |\n| 不能避免 | 即使尽到合理注意义务也无法阻止该事件发生 | 事件的发生不以当事人的意志为转移 |\n| 不能克服 | 当事人无法通过自身努力消除该事件的影响 | 事件导致合同客观上无法履行 |\n\n三个要件必须**同时满足**，缺一不可。\n\n### 三、不可抗力的常见类型\n\n| 类型 | 典型情形 | 实务认定 |\n|------|----------|----------|\n| 自然灾害 | 地震、洪水、台风、海啸、泥石流 | 一般可以直接认定，需提供气象、地质等官方证明 |\n| 社会事件 | 战争、武装冲突、暴乱、罢工 | 需结合事件性质和对合同履行的实际影响判断 |\n| 政府行为 | 征收征用、禁运、进出口管制、行政命令 | 需审查政府行为的合法性及对合同履行的直接影响 |\n| 传染病疫情 | 新冠肺炎、SARS等突发公共卫生事件 | 需结合疫情防控措施对合同履行的具体影响判断 |\n\n### 四、不可抗力的法律效果\n\n**1. 对合同履行的影响：**\n\n| 履行状态 | 法律效果 |\n|----------|----------|\n| 全部不能履行 | 全部免除责任，当事人可以解除合同 |\n| 部分不能履行 | 部分免除责任，不能履行的部分免责 |\n| 暂时不能履行 | 延期履行，待不可抗力消除后继续履行 |\n| 迟延履行后发生不可抗力 | 不免除责任（[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第590条|第590条]]第2款） |\n\n**2. 免责范围：**\n- 免除的是**违约责任**（损害赔偿、违约金等）\n- 不免除**返还义务**（已收取的预付款、定金等仍应返还）\n- 不免除**通知义务和减损义务**\n\n### 五、当事人的附随义务\n\n| 义务 | 具体要求 | 法律后果 |\n|------|----------|----------|\n| 及时通知 | 不可抗力发生后应及时通知对方 | 未及时通知导致损失扩大的，对扩大部分承担责任 |\n| 提供证明 | 在合理期限内提供不可抗力的证明材料 | 无法提供证明的，可能不被认定为不可抗力 |\n| 减损义务 | 采取合理措施减少损失 | 未采取减损措施的，对扩大的损失承担责任 |\n\n**证明材料来源：**\n- 政府公告、命令、通知\n- 气象局、地震局等官方证明\n- 行业协会出具的证明\n- 公证机关出具的不可抗力证明\n- 中国贸促会出具的不可抗力证明书（涉外合同）\n\n### 六、不可抗力与情势变更的区分\n\n| 区分维度 | 不可抗力 | 情势变更 |\n|----------|----------|----------|\n| 对履行的影响 | 导致合同**不能履行** | 导致合同**履行艰难**（能履行但显失公平） |\n| 法律效果 | 免除违约责任、可解除合同 | 变更或解除合同、损失分担 |\n| 适用条件 | 不能预见、不能避免、不能克服 | 不能预见、不属于商业风险、明显不公平 |\n| 当事人选择 | 可以选择主张不可抗力免责 | 可以选择请求变更或解除合同 |\n| 竞合处理 | 同一事件可能同时构成不可抗力和情势变更，当事人可以选择对自己有利的救济途径 |\n\n### 七"},{"id":"合同保全","title":"合同保全","excerpt":"合同保全是债权人在债务人怠于行使权利或不当处分财产、危及债权实现时的法定救济手段。核心工具是代位权和撤销权——前者解决 债务人有权利却不行使 的问题，后者解决 债务人不当处分财产 的问题。实务中，合同保全常用于执行难案件，是债权人突破 合同相对性 限制的重要武器。 条文 内容 第535条 代位权——债务人怠于行使其到期债权或有关从权利，影响债权人到期债权实现的，债权人可以向法院请求以自己的名义代位","slug":"合同保全","module":"01-合同法","moduleName":"合同法","tags":["民法","合同法","合同履行","合同保全","代位权","撤销权"],"wordCount":3444,"created":"2026-05-28","updated":"2026-05-28","content":"# 合同保全\n\n## 概述\n\n合同保全是债权人在债务人怠于行使权利或不当处分财产、危及债权实现时的法定救济手段。核心工具是代位权和撤销权——前者解决\"债务人有权利却不行使\"的问题，后者解决\"债务人不当处分财产\"的问题。实务中，合同保全常用于执行难案件，是债权人突破\"合同相对性\"限制的重要武器。\n\n## 核心内容\n\n### 一、法律依据\n\n| 条文 | 内容 |\n|------|------|\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第535条|第535条]] | 代位权——债务人怠于行使其到期债权或有关从权利，影响债权人到期债权实现的，债权人可以向法院请求以自己的名义代位行使 |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第536条|第536条]] | 保存行为的代位——债权人的债权到期前，债务人的权利存在诉讼时效期间届满或未及时申报破产债权等情形的，债权人可以代位向相对人请求 |\n| 第537条 | 代位权的效力——代位权成立的，由相对人向债权人履行义务；多个债权人的，按照债权比例清偿 |\n| 第538条 | 撤销权（无偿处分）——债务人无偿处分财产权益影响债权实现的，债权人可以请求法院撤销 |\n| 第539条 | 撤销权（有偿处分）——债务人以明显不合理低价转让财产或以明显不合理高价受让财产，且相对人知道或应当知道的，债权人可以请求撤销 |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第540条|第540条]] | 撤销权的行使范围——以债权人的债权为限，行使撤销权的必要费用由债务人负担 |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第541条|第541条]] | 撤销权的除斥期间——自债权人知道或应当知道撤销事由之日起一年内行使，自债务人行为发生之日起五年内没有行使的消灭 |\n\n### 二、代位权\n\n#### 1. 构成要件\n\n| 要件 | 具体要求 |\n|------|----------|\n| 债权合法 | 债权人对债务人的债权合法有效 |\n| 债务人怠于行使权利 | 债务人未以诉讼或仲裁方式向次债务人主张权利 |\n| 影响债权实现 | 债务人怠于行使权利的行为影响债权人债权的实现 |\n| 权利非专属 | 代位行使的权利不属于债务人自身（如人身损害赔偿请求权） |\n\n#### 2. \"怠于行使\"的认定\n\n- **核心标准：** 债务人未以诉讼或仲裁方式向次债务人主张权利\n- **不考虑因素：** 债务人是否以其他方式（如催告、协商）主张过权利不影响\"怠于\"的认定\n- **举证责任：** 债务人或次债务人主张债务人已行使权利的，应承担举证责任\n\n#### 3. 代位权的行使方式\n\n```\n债权人 -> 以自己名义起诉 -> 以债务人为被告，次债务人为第三人\n        -> 法院认定代位权成立 -> 次债务人直接向债权人履行\n```\n\n#### 4. 代位权的效力（[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第537条|第537条]]）\n\n| 情形 | 效力 |\n|------|------|\n| 代位权成立 | 相对人（次债务人）直接向债权人履行 |\n| 多个债权人 | 按照各债权人的债权比例清偿 |\n| 履行后 | 债权人与债务人、债务人与相对人之间相应的债权债务关系消灭 |\n\n### 三、撤销权\n\n#### 1. 构成要件\n\n**无偿处分（[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第538条|第538条]]）：**\n\n| 要件 | 具体要求 |\n|------|----------|\n| 债务人无偿处分 | 放弃债权、放弃债权担保、无偿转让财产、恶意延长到期债权的履行期 |\n| 影响债权实现 | 债务人的处分行为导致其责任财产减少，影响债权实现 |\n| 相对人主观 | 不要求相对人知道或应当知道（善意亦可撤销） |\n\n**有偿处分（[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第539条|第539条]]）：**\n\n| 要件 | 具体要求 |\n|------|----------|\n| 债务人有偿处分 | 以明显不合理低价转让、以明显不合理高价受让、为他人的债务提供担保 |\n| 影响债权实现 | 同上 |\n| 相对人主观 | 相对人知道或应当知道该情形 |\n\n#### 2. \"明显不合理\"的价格判断\n\n根据司法解释，转让价格低于交易时交易地的指导价或市场交易价**70%**的，一般可以视为明显不合理低价；转让价格高于当地指导价或市场交易价**30%**的，一般可以视为明显不合理高价。\n\n#### 3. 撤销权的除斥期间（[[⚖️ 民法实务知识库/08"},{"id":"合同履行原则","title":"合同履行原则","excerpt":"合同履行原则是合同法的核心支柱，决定了当事人应当如何执行合同义务。实务中，大量合同纠纷的争议焦点并非 是否违约 ，而是 如何才算正确履行 。掌握履行原则，有助于在缔约阶段预设合理条款，在争议阶段精准判断对方是否构成违约。 条文 内容 第509条 全面履行原则——当事人应当按照约定全面履行自己的义务；遵循诚信原则，根据合同的性质、目的和交易习惯履行通知、协助、保密等义务 第510条 补充协议与交易习","slug":"合同履行原则","module":"01-合同法","moduleName":"合同法","tags":["民法","合同法","合同履行","履行原则","全面履行","诚信履行"],"wordCount":2589,"created":"2026-05-28","updated":"2026-05-28","content":"# 合同履行原则\n\n## 概述\n\n合同履行原则是合同法的核心支柱，决定了当事人应当如何执行合同义务。实务中，大量合同纠纷的争议焦点并非\"是否违约\"，而是\"如何才算正确履行\"。掌握履行原则，有助于在缔约阶段预设合理条款，在争议阶段精准判断对方是否构成违约。\n\n## 核心内容\n\n### 一、法律依据\n\n| 条文 | 内容 |\n|------|------|\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第509条|第509条]] | 全面履行原则——当事人应当按照约定全面履行自己的义务；遵循诚信原则，根据合同的性质、目的和交易习惯履行通知、协助、保密等义务 |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第510条|第510条]] | 补充协议与交易习惯——合同生效后，当事人就质量、价款、履行地点等内容没有约定或约定不明的，可以协议补充；不能达成补充协议的，按照合同相关条款或交易习惯确定 |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第511条|第511条]] | 推定规则——质量要求不明确的，按照强制性国家标准；价款不明确的，按照订立时履行地的市场价格 |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第534条|第534条]] | 格式条款的履行——对格式条款的理解发生争议，应当按照通常理解予以解释；有两种以上解释的，应当作出不利于提供格式条款一方的解释 |\n\n### 二、三大履行原则\n\n#### 1. 全面履行原则（[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第509条|第509条]]第1款）\n\n**含义：** 当事人应当按照合同约定的标的、数量、质量、价款、期限、地点、方式等全面完成义务。\n\n**\"全面\"的判断标准：**\n\n| 维度 | 判断要点 |\n|------|----------|\n| 标的 | 是否符合合同约定的种类、规格、型号 |\n| 数量 | 交付数量是否在合理误差范围内 |\n| 质量 | 是否符合约定标准，无约定时是否符合国家/行业标准 |\n| 期限 | 是否在约定期限内完成，提前履行是否损害对方利益 |\n| 地点 | 是否在约定地点交付，变更地点是否经对方同意 |\n| 方式 | 包装、运输、安装等是否符合约定或交易习惯 |\n\n**实务要点：**\n- 部分履行不等于全面履行，守约方有权拒绝接受部分履行（[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第531条|第531条]]）\n- 但若部分履行不损害债权人利益，债权人不得拒绝（如分批交货合同中的正常批次）\n\n#### 2. 诚实信用原则（[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第509条|第509条]]第2款）\n\n**附随义务体系：**\n\n| 义务类型 | 内容 | 典型场景 |\n|----------|------|----------|\n| 通知义务 | 告知影响合同履行的重要事项 | 标的物风险转移、不可抗力通知 |\n| 协助义务 | 配合对方完成履行行为 | 提供必要的技术资料、场地条件 |\n| 保密义务 | 不泄露对方商业秘密或个人隐私 | 承揽合同中的设计图纸保密 |\n| 保护义务 | 妥善保管对方财产 | 承运人对货物的保管义务 |\n\n**违反附随义务的法律后果：**\n- 造成损失的，应当承担损害赔偿责任\n- 不构成根本违约的，通常不产生合同解除权\n\n#### 3. 情势变更原则（[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第533条|第533条]]）\n\n详见 -> [[情势变更]]\n\n### 三、裁判规则\n\n| 序号 | 裁判规则 | 裁判要旨 |\n|------|----------|----------|\n| 1 | 履行期限不明时的催告 | 债务人可以随时履行，债权人也可以随时请求履行，但应当给对方必要的准备时间 |\n| 2 | 履行方式不明时的解释 | 应按照有利于实现合同目的的方式履行 |\n| 3 | 质量标准不明时的认定 | 优先适用强制性国家标准->推荐性国家标准->行业标准->通常标准或符合合同目的的特定标准 |\n| 4 | 附随义务的独立可诉性 | 附随义务可以独立请求，违反附随义务造成损失的应独立赔偿 |\n| 5 | 交易习惯的举证责任 | 主张适用交易习惯的一方承担举证责任，需证明该习惯在特定地区、行业或当事人之间反复适用 |\n\n## 典型案例\n\n### 案例一：东莞市某新能源有限公司诉上海某信息技术有限公司网络服务合同纠纷案（全面履行原则的适用）\n\n**案号**：一审：（2020）沪0105民初15710号；二审：（2021）沪01民终4422号"},{"id":"情势变更","title":"情势变更","excerpt":"情势变更是合同履行中最重要的例外规则。当合同成立后发生当事人无法预见的重大变化，继续履行将导致明显不公平时，法律允许当事人重新协商或请求法院变更、解除合同。实务中，情势变更的适用一直存在严格限制，核心难点在于区分 情势变更 与 商业风险 。疫情期间，大量合同纠纷涉及情势变更问题，该制度的实务价值进一步凸显。 条文 内容 第533条 情势变更——合同成立后，合同的基础条件发生了当事人在订立合同时无法","slug":"情势变更","module":"01-合同法","moduleName":"合同法","tags":["民法","合同法","合同履行","情势变更","商业风险","合同变更","合同解除"],"wordCount":2413,"created":"2026-05-28","updated":"2026-05-28","content":"# 情势变更\n\n## 概述\n\n情势变更是合同履行中最重要的例外规则。当合同成立后发生当事人无法预见的重大变化，继续履行将导致明显不公平时，法律允许当事人重新协商或请求法院变更、解除合同。实务中，情势变更的适用一直存在严格限制，核心难点在于区分\"情势变更\"与\"商业风险\"。疫情期间，大量合同纠纷涉及情势变更问题，该制度的实务价值进一步凸显。\n\n## 核心内容\n\n### 一、法律依据\n\n| 条文 | 内容 |\n|------|------|\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第533条|第533条]] | 情势变更——合同成立后，合同的基础条件发生了当事人在订立合同时无法预见的、不属于商业风险的重大变化，继续履行合同对于当事人一方明显不公平的，受不利影响的当事人可以与对方重新协商；在合理期限内协商不成的，可以请求法院或仲裁机构变更或解除合同 |\n\n### 二、构成要件\n\n| 要件 | 具体要求 | 举证责任 |\n|------|----------|----------|\n| 时间要件 | 变化发生在合同成立之后 | 主张方举证 |\n| 不可预见性 | 当事人在订立合同时无法预见该变化 | 主张方举证 |\n| 非商业风险 | 该变化不属于正常的商业风险 | 对方可以此抗辩 |\n| 重大变化 | 合同的基础条件发生重大变化 | 主张方举证 |\n| 明显不公平 | 继续履行将导致一方明显不公平 | 主张方举证 |\n\n### 三、情势变更与商业风险的区分\n\n| 区分维度 | 情势变更 | 商业风险 |\n|----------|----------|----------|\n| 性质 | 异常的、根本性的变化 | 正常的市场波动 |\n| 可预见性 | 当事人无法预见 | 当事人应当预见 |\n| 影响程度 | 动摇合同基础 | 未动摇合同基础 |\n| 归责性 | 不可归责于任何一方 | 属于当事人应承担的风险 |\n| 典型情形 | 政策突变、自然灾害、战争 | 价格涨跌、供求变化、汇率波动 |\n\n**判断要点：**\n- 价格涨跌幅度是重要参考指标，但不是唯一标准\n- 应结合行业特点、合同性质、履行期限等因素综合判断\n- 当事人的预见能力应以同行业、同类型交易的一般认知水平为标准\n\n### 四、适用程序\n\n```\n情势变更发生 -> 受不利影响方提出重新协商 -> 协商不成 -> 请求法院/仲裁机构变更或解除\n      |\n    未协商直接起诉 -> 法院应先行调解 -> 调解不成 -> 依法裁判\n```\n\n**程序要点：**\n- **协商前置：** 当事人应当先进行重新协商，但协商并非诉讼的绝对前置程序\n- **法院不得主动适用：** 情势变更须经当事人主张，法院不得依职权主动适用\n- **仲裁与诉讼：** 当事人可以通过诉讼或仲裁途径请求变更或解除\n\n### 五、法律效果\n\n| 效果 | 具体内容 |\n|------|----------|\n| 变更合同 | 调整合同价格、数量、履行期限等条款，恢复利益平衡 |\n| 解除合同 | 变更仍不能消除不公平的，可以解除合同 |\n| 损失分担 | 合同解除后，损失由双方合理分担，而非由一方全部承担 |\n| 不承担违约责任 | 因情势变更变更或解除合同的，不承担违约责任 |\n\n### 六、裁判规则\n\n| 序号 | 裁判规则 | 裁判要旨 |\n|------|----------|----------|\n| 1 | 不可预见的判断时点 | 以合同订立时为判断时点，订立后出现的风险分配条款不影响情势变更的认定 |\n| 2 | 重新协商的性质 | 重新协商是权利而非义务，对方拒绝协商不构成违约，但法院在裁判时会予以考量 |\n| 3 | 变更优先于解除 | 法院应优先考虑变更合同，只有在变更仍不能消除不公平时才判令解除 |\n| 4 | 情势变更与不可抗力的竞合 | 同一事件可能同时构成不可抗力和情势变更，当事人可以选择对自己有利的救济途径 |\n| 5 | 价格波动的幅度 | 价格涨跌超过30%的，一般可以认定为不属于商业风险，但需结合具体案情判断 |\n| 6 | 长期合同的适用 | 长期合同（如长期供货合同、租赁合同）更易适用情势变更，因为风险分配的预期更不稳定 |\n| 7 | 损失分担的原则 | 合同解除后的损失分担应综合考虑双方的过错程度、风险分配、利益平衡等因素 |\n\n## 典型案例\n\n### 案例：秦岭环保政策变化——民法典后最高法首次适用情势变更\n\n**案号/入库编号**：入库编号：2023-08-2-269-006\n\n**审理法院**：最高人民法院（再审）\n\n**基本案情**：广州某商务服务公司诉陕西某电子工程公司、陕西某实业公司、陕西某投资公司等股权转让纠纷案"},{"id":"抗辩权体系","title":"抗辩权体系","excerpt":"抗辩权是合同履行中最重要的防御工具。当对方请求履行时，具备法定条件的一方可以暂时拒绝履行而不构成违约。实务中，正确行使抗辩权是保护自身权益的关键——用对了是合法防御，用错了则可能构成违约。三大抗辩权（同时履行、先履行、不安）构成一个完整体系，分别适用于不同的履行顺序场景。 条文 内容 第525条 同时履行抗辩权——当事人互负债务，没有先后履行顺序的，应当同时履行 第526条 先履行抗辩权——当事人","slug":"抗辩权体系","module":"01-合同法","moduleName":"合同法","tags":["民法","合同法","合同履行","抗辩权","同时履行抗辩权","先履行抗辩权","不安抗辩权"],"wordCount":2488,"created":"2026-05-28","updated":"2026-05-28","content":"# 抗辩权体系\n\n## 概述\n\n抗辩权是合同履行中最重要的防御工具。当对方请求履行时，具备法定条件的一方可以暂时拒绝履行而不构成违约。实务中，正确行使抗辩权是保护自身权益的关键——用对了是合法防御，用错了则可能构成违约。三大抗辩权（同时履行、先履行、不安）构成一个完整体系，分别适用于不同的履行顺序场景。\n\n## 核心内容\n\n### 一、法律依据\n\n| 条文 | 内容 |\n|------|------|\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第525条|第525条]] | 同时履行抗辩权——当事人互负债务，没有先后履行顺序的，应当同时履行 |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第526条|第526条]] | 先履行抗辩权——当事人互负债务，有先后履行顺序，先履行一方未履行的，后履行一方有权拒绝其履行请求 |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第527条|第527条]] | 不安抗辩权——先履行一方有确切证据证明后履行一方存在法定情形的，可以中止履行 |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第528条|第528条]] | 不安抗辩权的效力——中止履行后，对方在合理期限内未恢复履行能力且未提供适当担保的，中止履行的一方可以解除合同 |\n\n### 二、三大抗辩权对比\n\n| 对比维度 | 同时履行抗辩权(525) | 先履行抗辩权(526) | 不安抗辩权(527-528) |\n|----------|---------------------|-------------------|---------------------|\n| **适用主体** | 双方均可行使 | 仅后履行方 | 仅先履行方 |\n| **前提条件** | 无先后顺序 | 有先后顺序 | 有先后顺序 |\n| **行使事由** | 对方未履行或履行不符合约定 | 先履行方未履行或履行不符合约定 | 对方丧失或可能丧失履行能力 |\n| **法律效果** | 暂时拒绝履行 | 拒绝相应的履行请求 | 中止履行->可解除合同 |\n| **举证责任** | 证明对方未履行 | 证明先履行方未履行 | 证明对方存在法定不安事由 |\n\n### 三、构成要件详解\n\n#### 1. 同时履行抗辩权（[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第525条|第525条]]）\n\n**构成要件：**\n- 双方互负债务（对待给付关系）\n- 没有约定先后履行顺序，或法律未规定先后顺序\n- 对方未履行债务或履行不符合约定\n\n**\"对待给付\"的判断：**\n- 须基于同一双务合同\n- 两个债务之间具有对价关系（牵连性）\n- 主债务与从债务之间通常不构成对待给付关系\n\n**行使限制：**\n- 不得就对方的轻微瑕疵行使抗辩权（比例原则）\n- 已部分履行的，只能就未履行部分行使\n\n#### 2. 先履行抗辩权（[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第526条|第526条]]）\n\n**构成要件：**\n- 双方互负债务且有先后履行顺序\n- 先履行一方未履行或履行不符合约定\n- 后履行方面临对待给付的请求\n\n**\"先后顺序\"的来源：**\n- 合同明确约定\n- 法律规定\n- 交易习惯\n\n**实务要点：**\n- 先履行方部分履行的，后履行方只能拒绝\"相应\"部分的履行请求（比例原则）\n- 先履行方已履行但不符合约定的，后履行方可以拒绝相应的履行\n\n#### 3. 不安抗辩权（[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第527条|第527条]]）\n\n**法定不安事由（[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第527条|第527条]]列举）：**\n\n| 序号 | 不安事由 |\n|------|----------|\n| 1 | 经营状况严重恶化 |\n| 2 | 转移财产、抽逃资金，以逃避债务 |\n| 3 | 丧失商业信誉 |\n| 4 | 有丧失或者可能丧失履行债务能力的其他情形 |\n\n**行使程序：**\n\n```\n发现不安事由 -> 中止履行 -> 及时通知对方 -> 对方提供担保则恢复履行\n                                        -> 对方未提供担保且未恢复能力 -> 解除合同\n```\n\n**\"确切证据\"的要求：**\n- 不能仅凭怀疑或市场传言\n- 需要客观证据（如涉诉信息、财务报告、行政处罚等）\n- 证据标准低于诉讼证明标准，但需达到合理可信的程度\n\n### 四、裁判规则\n\n| 序号 | 裁判规则 | 裁判要旨 |\n|------|----------|---"},{"id":"定金罚则","title":"定金罚则","excerpt":"定金是合同当事人为担保合同履行，由一方预先向对方给付一定数额金钱的担保方式。定金罚则的核心是 给付定金一方违约，无权请求返还；收受定金一方违约，双倍返还 。 条文 内容要点 《民法典》第586条 定金合同的成立与限额（主合同标的额的20%） 《民法典》第587条 定金罚则（核心条文） 《民法典》第588条 违约金与定金的选择适用 1. 形式要件 必须以书面形式约定 约定中须明确 定金 字样 合同中","slug":"定金罚则","module":"01-合同法","moduleName":"合同法","tags":["民法","合同法","违约责任","定金","担保"],"wordCount":1386,"created":"2026-05-28","updated":"2026-05-28","content":"# 定金罚则\n\n## 概述\n\n定金是合同当事人为担保合同履行，由一方预先向对方给付一定数额金钱的担保方式。定金罚则的核心是\"给付定金一方违约，无权请求返还；收受定金一方违约，双倍返还\"。\n\n## 核心内容\n\n### 一、法律依据\n\n| 条文 | 内容要点 |\n|------|----------|\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第586条|《民法典》第586条]] | 定金合同的成立与限额（主合同标的额的20%） |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第587条|《民法典》第587条]] | 定金罚则（核心条文） |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第588条|《民法典》第588条]] | 违约金与定金的选择适用 |\n\n### 二、定金的成立要件\n\n**1. 形式要件**\n- 必须以书面形式约定\n- 约定中须明确\"定金\"字样\n- 合同中应载明定金数额和交付期限\n\n**2. 实质要件**\n- 定金合同是实践合同：定金实际交付时成立\n- 定金数额不得超过主合同标的额的20%，超过部分不产生定金效力\n\n### 三、定金罚则的适用\n\n**给付定金一方违约：**\n- 无权请求返还定金\n- 定金归收受方所有\n\n**收受定金一方违约：**\n- 应当双倍返还定金\n- 返还数额 = 原收定金 + 等额返还\n\n### 四、定金与相关概念的区分\n\n**1. 定金与预付款**\n\n| 区别 | 定金 | 预付款 |\n|------|------|--------|\n| 性质 | 担保方式 | 付款方式 |\n| 功能 | 担保合同履行 | 提前支付部分价款 |\n| 违约后果 | 适用定金罚则 | 按不当得利返还 |\n| 限额 | 不超过主合同标的额20% | 无限制 |\n\n**2. 定金与订金**\n- \"订金\"一般认定为预付款，不适用定金罚则\n- 关键看当事人的真实意思表示\n\n### 五、裁判规则\n\n| 规则 | 要旨 | 实务指引 |\n|------|------|----------|\n| 实际交付原则 | 未实际交付定金，定金合同不成立 | 转账时备注\"定金\"二字 |\n| 限额规则 | 超过主合同标的额20%的部分不适用定金罚则 | 签约时注意定金比例 |\n| 部分违约 | 部分履行的，按比例适用定金罚则 | 法院会根据履行比例酌情处理 |\n| 不可抗力 | 因不可抗力不能履行的，不适用定金罚则 | 定金应予返还 |\n\n## 典型案例\n\n### 案例：定金性质认定与行政强制停产免责\n\n**案号/入库编号**：（2014）民二终字第197号\n\n**审理法院**：最高人民法院\n\n**基本案情**：天铁集团诉恒远公司合同纠纷案。双方签订合同并支付款项，后因行政强制停产导致合同无法履行。争议焦点包括：所付款项的性质是定金还是预付款、定金数额是否超过法定限额、行政强制停产是否构成免责事由。\n\n**裁判要旨**：当事人在合同中虽使用\"定金\"字样，但未明确约定定金性质的，应结合合同整体内容和当事人真实意思表示认定。定金数额超过主合同标的额20%的部分不产生定金效力。因行政强制停产导致合同不能履行的，不适用定金罚则。\n\n**实务要点**：\n1. 定金性质的认定应结合合同整体约定，不能仅凭\"定金\"字样确定\n2. 定金数额不得超过主合同标的额的20%，超过部分不产生定金效力\n3. 因行政强制等不可归责于当事人的原因导致合同不能履行的，不适用定金罚则，定金应予返还\n4. 转账时备注\"定金\"二字对定金合同的成立具有重要证据意义\n\n**与知识点的关联**：本案涉及定金罚则适用的多个核心问题，包括定金性质认定、数额限制和免责事由，是[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第586条|《民法典》第586-588条]]的综合适用案例。\n\n## 参考来源\n\n- 《中华人民共和国民法典》第586-588条\n- [[⚖️ 民法实务知识库/08-法规全文/合同编通则司法解释|《最高人民法院关于适用〈中华人民共和国民法典〉合同编通则若干问题的解释》]]\n\n## 相关主题\n\n- [[违约责任构成]] — 违约责任的基础理论\n- [[违约金调整]] — 违约金与定金的选择适用\n- [[损害赔偿范围]] — 损失赔偿的计算方法"},{"id":"损害赔偿范围","title":"损害赔偿范围","excerpt":"损害赔偿是违约责任最主要、最常见的承担方式。确定损害赔偿范围是合同诉讼的核心问题，涉及可预见性规则、损益相抵、减损义务等多个重要制度。 条文 内容要点 《民法典》第584条 损害赔偿范围（核心条文：可预见性规则） 《民法典》第591条 减损义务 《民法典》第592条 双方违约的责任分担 《民法典》第584条确立的赔偿范围： 当事人一方不履行合同义务或者履行合同义务不符合约定，造成对方损失的，损失赔","slug":"损害赔偿范围","module":"01-合同法","moduleName":"合同法","tags":["民法","合同法","违约责任","损害赔偿","可预见性规则"],"wordCount":1801,"created":"2026-05-28","updated":"2026-05-28","content":"# 损害赔偿范围\n\n## 概述\n\n损害赔偿是违约责任最主要、最常见的承担方式。确定损害赔偿范围是合同诉讼的核心问题，涉及可预见性规则、损益相抵、减损义务等多个重要制度。\n\n## 核心内容\n\n### 一、法律依据\n\n| 条文 | 内容要点 |\n|------|----------|\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第584条|《民法典》第584条]] | 损害赔偿范围（核心条文：可预见性规则） |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第591条|《民法典》第591条]] | 减损义务 |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第592条|《民法典》第592条]] | 双方违约的责任分担 |\n\n### 二、损害赔偿的范围\n\n**[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第584条|《民法典》第584条]]确立的赔偿范围：**\n\n> 当事人一方不履行合同义务或者履行合同义务不符合约定，造成对方损失的，损失赔偿额应当相当于因违约所造成的损失，包括合同履行后可以获得的利益；但是，不得超过违约一方订立合同时预见到或者应当预见到的因违约可能造成的损失。\n\n**具体包括：**\n\n| 损失类型 | 定义 | 举例 |\n|----------|------|------|\n| **直接损失** | 现有财产的减少 | 已支付的价款、运费、保管费 |\n| **可得利益损失** | 合同正常履行可获得的利益 | 转售利润、生产利润、经营利润 |\n| **信赖利益损失** | 因信赖合同而支出的费用 | 签约费用、准备履行的费用 |\n\n### 三、可得利益的计算方法\n\n**1. 差额法**\n- 可得利益 = 合同正常履行时的财产状况 - 违约后的财产状况\n\n**2. 类比法**\n- 参照同类交易的平均利润率计算\n\n**3. 估算法**\n- 法院根据案件情况酌情确定\n\n### 四、可预见性规则\n\n**构成要件：**\n\n1. **预见主体**：违约方\n2. **预见时间**：订立合同时（非违约时）\n3. **预见标准**：一般理性人的合理预见能力\n4. **预见内容**：损失的类型，不要求预见具体数额\n\n### 五、减损义务（[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第591条|第591条]]）\n\n**1. 义务内容**\n- 守约方应采取适当措施防止损失扩大\n- 未采取适当措施致使损失扩大的，不得就扩大的损失请求赔偿\n\n**2. 合理措施的判断标准**\n- 措施在当时情况下是否合理可行\n- 不应苛求守约方承担过大风险或成本\n\n### 六、裁判规则\n\n| 规则 | 要旨 | 实务指引 |\n|------|------|----------|\n| 完全赔偿原则 | 赔偿范围包括直接损失和可得利益 | 全面收集损失证据 |\n| 可预见性限制 | 赔偿不超过缔约时的合理预见范围 | 特殊损失需事先告知对方 |\n| 损益相抵 | 因违约获得的利益应从赔偿中扣除 | 如节省的成本、转售收益 |\n| 减损义务 | 守约方应采取合理措施防止损失扩大 | 未减损部分不得主张赔偿 |\n\n## 典型案例\n\n### 案例：CISG可预见性规则在涉外买卖合同中的适用\n\n**案号/入库编号**：一审：（2018）津01民初669号；二审：（2020）津民终433号\n\n**审理法院**：一审：天津市第一中级人民法院；二审：天津市高级人民法院\n\n**基本案情**：涉外国际货物买卖合同纠纷案。卖方违约未按约交货，买方主张赔偿包括转售利润在内的损失。法院依据《联合国国际货物销售合同公约》（CISG）[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第74条|第74条]]可预见性规则，审查损害赔偿范围。\n\n**裁判要旨**：损害赔偿范围应限于违约造成的包括利润在内的损失，但不得超过违约方在订立合同时预见到或应当预见到的可能损失。可预见性的判断应以合同订立时为时点，以同行业一般理性人的认知水平为标准。\n\n**实务要点**：\n1. 可预见性规则的适用以合同订立时为判断时点，而非违约时\n2. 损失的类型需要预见，但不要求预见具体数额\n3. 特殊损失（如高额转售利润）需事先告知对方，否则可能超出合理预见范围\n4. 涉外合同中CISG[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第74条|第74条]]与[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第584条|《民法典》第584条]]在可预见性规则上具有一致性\n\n**与知识点的关联**：本案是可预见性规则在涉外合同中的典型适用，体现了[[⚖️ 民法实务知识库/08-"},{"id":"违约与侵权竞合","title":"违约与侵权竞合","excerpt":"违约与侵权竞合是指同一行为既构成违约又构成侵权，权利人享有两个请求权的情形。实务中，请求权的选择直接影响诉讼时效、举证责任、赔偿范围等关键问题。 条文 内容要点 《民法典》第186条 请求权竞合的选择权（核心条文） 《民法典》第996条 违约精神损害赔偿 比较维度 违约责任 侵权责任 归责原则 严格责任为主 过错责任为主 举证责任 原告证明违约事实 原告通常需证明过错 赔偿范围 直接损失+可得利益","slug":"违约与侵权竞合","module":"01-合同法","moduleName":"合同法","tags":["民法","合同法","违约责任","侵权责任","请求权竞合"],"wordCount":1293,"created":"2026-05-28","updated":"2026-05-28","content":"# 违约与侵权竞合\n\n## 概述\n\n违约与侵权竞合是指同一行为既构成违约又构成侵权，权利人享有两个请求权的情形。实务中，请求权的选择直接影响诉讼时效、举证责任、赔偿范围等关键问题。\n\n## 核心内容\n\n### 一、法律依据\n\n| 条文 | 内容要点 |\n|------|----------|\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第186条|《民法典》第186条]] | 请求权竞合的选择权（核心条文） |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第996条|《民法典》第996条]] | 违约精神损害赔偿 |\n\n### 二、违约与侵权的主要区别\n\n| 比较维度 | 违约责任 | 侵权责任 |\n|----------|----------|----------|\n| **归责原则** | 严格责任为主 | 过错责任为主 |\n| **举证责任** | 原告证明违约事实 | 原告通常需证明过错 |\n| **赔偿范围** | 直接损失+可得利益 | 直接损失+精神损害赔偿 |\n| **精神损害** | 原则不赔（[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第996条|第996条]]例外） | 可以主张精神损害赔偿 |\n| **诉讼时效** | 3年 | 3年 |\n\n### 三、请求权选择策略\n\n**选择违约责任更有利的情形：**\n\n1. **举证责任较轻**：无需证明对方过错\n2. **有明确合同约定**：合同中有利的违约金、赔偿条款\n3. **可得利益可预期**：有明确的利润损失证据\n\n**选择侵权责任更有利的情形：**\n\n1. **需主张精神损害赔偿**：人身伤害、人格权侵害\n2. **合同存在瑕疵**：合同可能无效或未成立\n3. **需追究第三人责任**：侵权可将多方纳入诉讼\n\n### 四、裁判规则\n\n| 规则 | 要旨 | 实务指引 |\n|------|------|----------|\n| 选择权原则 | 权利人可择一行使请求权 | 一审开庭前必须作出选择 |\n| 不得双重获赔 | 选择一个请求权后不得再主张另一个 | 选择需慎重，不可逆 |\n| 诉讼中变更 | 一审开庭前可变更请求权 | 开庭后不得变更 |\n\n## 典型案例\n\n### 案例：产品质量损害赔偿中的违约与侵权竞合选择\n\n**案号/入库编号**：入库编号 2024-01-2-504-002\n\n**审理法院**：人民法院案例库参考案例\n\n**基本案情**：因购买产品而提起的诉讼，因原告的诉讼请求或争议标的不同，既可能构成产品质量损害赔偿纠纷（侵权责任），也可能构成买卖合同纠纷（违约责任）。当事人在违约责任与侵权责任竞合时，需择一行使请求权。\n\n**裁判要旨**：因当事人一方的违约行为，损害对方人身权益、财产权益的，受损害方有权选择请求其承担违约责任或者侵权责任。当事人在一审开庭前可以变更其请求权基础的选择。\n\n**实务要点**：\n1. 违约与侵权竞合时，当事人必须择一行使请求权，不得同时主张两个请求权\n2. 选择侵权之诉可主张精神损害赔偿，选择违约之诉举证责任相对较轻\n3. 请求权选择应在一审开庭前作出，开庭后原则上不得变更\n\n**与知识点的关联**：本案是[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第186条|民法典第186条]]请求权竞合规则的典型适用。产品质量纠纷中，消费者既可基于买卖合同主张违约责任，也可基于产品侵权主张侵权责任，两种请求权在举证责任、赔偿范围、诉讼时效等方面存在差异，选择需慎重。\n\n> **查看原文**：[人民法院案例库——入库编号2024-01-2-504-002](https://rmfyalk.court.gov.cn/view/content.html?id=Gdq2lSaMPbDpWKfB8wvsxFoa8nNdIQ8fyoj23T%252FXCI0%253D&lib=ck&qw=%EF%BC%882023%EF%BC%89%E5%86%85%E6%B0%91%E8%BE%9659%E5%8F%B7%E6%B0%91%E4%BA%8B%E8%A3%81%E5%AE%9A)\n\n## 参考来源\n\n- 《中华人民共和国民法典》第186条、[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第996条|第996条]]\n- 王利明：《违约责任论》，中国政法大学出版社\n\n## 相关主题\n\n- [[违约责任构成]] — 违约责任的构成要件\n- [[损害赔偿范围]] — 赔偿范围的具体计算\n- [[侵权责任构成要件]] — 侵权责任的构成要件"},{"id":"违约责任构成","title":"违约责任构成","excerpt":"违约责任是合同法的核心制度，指当事人不履行合同义务或履行不符合约定时应承担的民事法律后果。我国采用严格责任为主、过错责任为辅的归责体系，实务中需准确把握举证责任分配。 条文 内容要点 《民法典》第577条 违约责任的一般规定：继续履行、补救措施、赔偿损失 《民法典》第578条 预期违约（明示/默示毁约） 《民法典》第580条 非金钱债务的继续履行限制 《民法典》第584条 损害赔偿范围（可预见性规","slug":"违约责任构成","module":"01-合同法","moduleName":"合同法","tags":["民法","合同法","违约责任","构成要件","归责原则"],"wordCount":2148,"created":"2026-05-28","updated":"2026-05-28","content":"# 违约责任构成\n\n## 概述\n\n违约责任是合同法的核心制度，指当事人不履行合同义务或履行不符合约定时应承担的民事法律后果。我国采用严格责任为主、过错责任为辅的归责体系，实务中需准确把握举证责任分配。\n\n## 核心内容\n\n### 一、法律依据\n\n| 条文 | 内容要点 |\n|------|----------|\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第577条|《民法典》第577条]] | 违约责任的一般规定：继续履行、补救措施、赔偿损失 |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第578条|《民法典》第578条]] | 预期违约（明示/默示毁约） |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第580条|《民法典》第580条]] | 非金钱债务的继续履行限制 |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第584条|《民法典》第584条]] | 损害赔偿范围（可预见性规则） |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第590条|《民法典》第590条]] | 不可抗力的免责事由 |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第591条|《民法典》第591条]] | 减损义务 |\n\n### 二、构成要件\n\n**一般构成要件（严格责任原则下）：**\n\n1. **存在有效合同** — 违约责任的前提\n2. **有违约行为** — 不履行或不适当履行\n3. **无法定或约定免责事由**\n\n**特殊情形下的额外要件：**\n\n- 赠与合同等无偿合同：需证明故意或重大过失\n- 委托合同：需证明受托人过错\n- 保管合同（无偿）：需证明保管人重大过失\n\n### 三、违约行为形态\n\n| 类型 | 定义 | 法律后果 |\n|------|------|----------|\n| **不履行** | 完全未履行合同义务 | 继续履行+赔偿损失 |\n| **迟延履行** | 超过约定时间履行 | 继续履行+迟延赔偿 |\n| **瑕疵履行** | 履行不符合质量要求 | 补救措施+赔偿损失 |\n| **预期违约** | 履行期届满前明确表示不履行 | 可提前主张违约责任 |\n| **部分履行** | 只履行了部分义务 | 继续履行+赔偿损失 |\n\n### 四、裁判规则\n\n| 规则 | 要旨 | 实务指引 |\n|------|------|----------|\n| 严格责任原则 | 非法定免责事由，有违约行为即担责 | 原告无需证明被告过错 |\n| 举证责任分配 | 原告证明合同存在+违约事实；被告证明免责事由 | 保留履约证据至关重要 |\n| 双方违约 | 双方均有违约行为，各自承担相应责任 | 注意区分违约与行使抗辩权 |\n| 第三人原因 | 原则上不免除违约责任 | 合同相对性原则的体现 |\n\n### 五、免责事由\n\n**1. 不可抗力（[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第590条|第590条]]）**\n- 不能预见、不能避免、不能克服的客观情况\n- 通知义务：应及时通知对方并在合理期限内提供证明\n- 法律后果：根据影响程度部分或全部免责\n\n**2. 债权人过错**\n- 因债权人原因导致合同不能履行\n- 债权人迟延受领期间的风险自担\n\n**3. 约定免责条款**\n- 不得免除造成对方人身损害的责任\n- 不得免除因故意或重大过失造成财产损失的责任\n\n### 六、实务要点\n\n1. **违约与风险负担的区分**：标的物毁损灭失可能是风险负担问题，不一定是违约\n2. **合同解除与违约责任可并行主张**：解除合同不影响主张违约金或损害赔偿\n3. **诉讼时效**：普通合同纠纷3年诉讼时效，国际货物买卖4年\n4. **违约行为持续时**：诉讼时效从违约行为终了之日起算\n\n## 典型案例\n\n### 案例一：新宇公司诉冯玉梅商铺买卖合同纠纷案\n\n**案号**：一审：南京市玄武区人民法院；二审：南京市中级人民法院\n\n**审理法院**：南京市中级人民法院\n\n**基本案情**：新宇公司将南京新街口时代广场的商铺分割出售给150余家业主，冯玉梅购买了其中一间22.50平方米的商铺并付清全款。后因商场两次停业，新宇公司为盘活资产拟对时代广场重新布局，陆续与大部分小业主解除了商铺买卖合同回收商铺。但冯玉梅坚持不退商铺，导致新宇公司6万平方米建筑闲置，冯玉梅的22.50平方米商铺也无法正常经营。新宇公司起诉请求解除合同，愿退还购房款并赔偿商铺增值款及补偿金。\n\n**裁判要旨**：当违约方继续履行所需的财力、物力超过合同双方基于合同履行所能获得的利益，合同已不具备继续履行的条件时，为"},{"id":"违约金调整","title":"违约金调整","excerpt":"违约金是当事人预先约定的违约赔偿数额，《民法典》允许当事人请求法院或仲裁机构调整过高或过低的违约金。实务中，违约金调整是合同纠纷中最常见的争议焦点之一。 条文 内容要点 《民法典》第585条 违约金的约定与调整（核心条文） 《民法典合同编通则解释》第64条 违约金过高的认定标准 《民法典合同编通则解释》第65条 违约金调整的具体规则 司法解释确立的核心标准： 当事人约定的违约金超过造成损失的百分之","slug":"违约金调整","module":"01-合同法","moduleName":"合同法","tags":["民法","合同法","违约责任","违约金","调整规则"],"wordCount":1479,"created":"2026-05-28","updated":"2026-05-28","content":"# 违约金调整\n\n## 概述\n\n违约金是当事人预先约定的违约赔偿数额，《民法典》允许当事人请求法院或仲裁机构调整过高或过低的违约金。实务中，违约金调整是合同纠纷中最常见的争议焦点之一。\n\n## 核心内容\n\n### 一、法律依据\n\n| 条文 | 内容要点 |\n|------|----------|\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第585条|《民法典》第585条]] | 违约金的约定与调整（核心条文） |\n| [[⚖️ 民法实务知识库/08-法规全文/合同编通则司法解释#第64条|《民法典合同编通则解释》第64条]] | 违约金过高的认定标准 |\n| [[⚖️ 民法实务知识库/08-法规全文/合同编通则司法解释#第65条|《民法典合同编通则解释》第65条]] | 违约金调整的具体规则 |\n\n### 二、违约金过高的认定标准\n\n**司法解释确立的核心标准：**\n\n> 当事人约定的违约金超过造成损失的百分之三十的，一般可以认定为过分高于造成的损失。\n\n**具体考量因素：**\n\n| 因素 | 说明 |\n|------|------|\n| 实际损失 | 包括直接损失和可得利益损失 |\n| 合同履行情况 | 已履行部分应酌情考虑 |\n| 当事人过错程度 | 故意违约可适当提高 |\n| 预期利益 | 合同正常履行可获得的利益 |\n| 当事人缔约地位 | 格式条款中的违约金应从严审查 |\n\n### 三、裁判规则\n\n| 规则 | 要旨 | 实务指引 |\n|------|------|----------|\n| 申请调整原则 | 法院不主动调整，需当事人申请 | 被告应在一审辩论终结前提出调整请求 |\n| 举证责任 | 主张过高方承担举证责任 | 被告需证明违约金与损失的差距 |\n| 调整幅度 | 超过损失30%一般认定过高 | 30%是参考标准，非绝对界限 |\n| 恶意违约 | 故意违约的，违约金调整应从严 | 可适当高于30%的标准 |\n\n### 四、实务要点\n\n**1. 起诉时的策略选择**\n- 作为原告：在诉请中明确违约金计算依据，准备损失证据\n- 作为被告：及时提出调整申请，举证证明违约金过高\n\n**2. 违约金与损害赔偿的关系**\n- 约定违约金低于损失：可请求增加至实际损失数额\n- 约定违约金高于损失：违约方可请求适当减少\n\n## 典型案例\n\n### 案例一：恶意违约方请求调减违约金不予支持（指导案例166号）\n\n**案号/入库编号**：（2017）京02民终8676号 / 入库编号：2021-18-2-483-001\n\n**审理法院**：北京市第二中级人民法院\n\n**基本案情**：隆昌贸易公司与城建重工公司买卖合同纠纷一案，一审判决城建重工公司支付货款528万余元及利息。上诉期间双方签订和解协议，约定城建重工公司分期付款，如未按期足额支付应向隆昌贸易公司支付违约金80万元；隆昌贸易公司申请解除对城建重工公司财产的保全措施。城建重工公司按约支付首期300万元后，隆昌贸易公司申请解除了保全。但城建重工公司未依约支付剩余277万余元。\n\n**裁判要旨**：当事人双方就债务清偿达成和解协议，约定解除财产保全措施及违约责任。一方当事人依约申请人民法院解除了保全措施后，另一方当事人违反诚实信用原则不履行和解协议，并在和解协议违约金诉讼中请求减少违约金的，人民法院不予支持。\n\n**实务要点**：\n1. 恶意违约方请求调减违约金的，法院一般不予支持——违约方作为商事主体自愿承诺高额违约金后故意违约，具有主观恶意\n2. 违约金兼具补偿性与惩罚性——当事人约定了惩罚性违约金条款的，在不违反法律强制性规定的情况下应予尊重\n3. 诚实信用原则是判断是否酌减违约金的重要考量因素——\"假和解、真逃债\"的行为不应得到司法保护\n\n**案例来源**：最高人民法院第30批指导性案例（2021年11月发布）\n\n> **查看原文**：[最高人民法院——指导案例166号：北京隆昌伟业贸易有限公司诉北京城建重工有限公司合同纠纷案](https://www.court.gov.cn/fabu/xiangqing/331171.html)\n\n## 参考来源\n\n- 《中华人民共和国民法典》第585条\n- [[⚖️ 民法实务知识库/08-法规全文/合同编通则司法解释#第64条|《最高人民法院关于适用〈中华人民共和国民法典〉合同编通则若干问题的解释》第64-65条]]\n\n## 相关主题\n\n- [[违约责任构成]] — 违约责任的基础理论\n- [[损害赔偿范围]] — 损失计算的具体方法\n- [[定金罚则]] — 违约金与定金的选择适用"},{"id":"合同解除的后果","title":"合同解除的后果","excerpt":"合同解除后，尚未履行的，终止履行；已经履行的，根据履行情况和合同性质，当事人可以请求恢复原状或者采取其他补救措施，并有权请求赔偿损失。合同解除的后果是合同纠纷中的重要问题。 条文 内容要点 《民法典》第566条 合同解除的一般后果 《民法典》第567条 结算和清理条款的效力 1. 尚未履行的部分 效果 具体内容 终止履行 尚未履行的，终止履行 恢复原状 已经履行的，根据履行情况和合同性质，可以请求","slug":"合同解除的后果","module":"01-合同法","moduleName":"合同法","tags":["民法","合同法","合同解除","法律后果","恢复原状"],"wordCount":1683,"created":"2026-05-28","updated":"2026-05-28","content":"# 合同解除的后果\n\n## 概述\n\n合同解除后，尚未履行的，终止履行；已经履行的，根据履行情况和合同性质，当事人可以请求恢复原状或者采取其他补救措施，并有权请求赔偿损失。合同解除的后果是合同纠纷中的重要问题。\n\n## 核心内容\n\n### 一、法律依据\n\n| 条文 | 内容要点 |\n|------|----------|\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第566条|《民法典》第566条]] | 合同解除的一般后果 |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第567条|《民法典》第567条]] | 结算和清理条款的效力 |\n\n### 二、合同解除的法律后果\n\n**1. 尚未履行的部分**\n\n| 效果 | 具体内容 |\n|------|----------|\n| 终止履行 | 尚未履行的，终止履行 |\n| 恢复原状 | 已经履行的，根据履行情况和合同性质，可以请求恢复原状 |\n\n**2. 已经履行的部分**\n\n| 效果 | 具体内容 |\n|------|----------|\n| 恢复原状 | 能够恢复原状的，应当恢复原状 |\n| 采取其他补救措施 | 不能恢复原状的，采取其他补救措施 |\n| 赔偿损失 | 有权请求赔偿损失 |\n\n**3. 结算和清理条款**\n\n| 效果 | 具体内容 |\n|------|----------|\n| 继续有效 | 合同解除后，结算和清理条款继续有效 |\n| 争议解决条款 | 仲裁条款、管辖条款继续有效 |\n\n### 三、恢复原状的适用\n\n**适用条件：**\n\n| 条件 | 具体内容 |\n|------|----------|\n| 能够恢复原状 | 原物存在、能够返还 |\n| 合同性质允许 | 非持续性合同 |\n\n**恢复原状的方式：**\n\n| 方式 | 适用情形 |\n|------|----------|\n| 返还原物 | 原物存在 |\n| 返还价款 | 已支付的价款 |\n| 折价补偿 | 不能返还的 |\n\n### 四、赔偿损失的范围\n\n**赔偿范围：**\n\n| 损失类型 | 是否赔偿 | 说明 |\n|----------|----------|------|\n| 直接损失 | 赔偿 | 因合同解除造成的直接财产损失 |\n| 可得利益损失 | 视情况 | 合同正常履行可获得的利益 |\n| 信赖利益损失 | 赔偿 | 因信赖合同而支出的费用 |\n\n### 五、裁判规则\n\n| 规则 | 要旨 | 实务指引 |\n|------|------|----------|\n| 解除后终止履行 | 尚未履行的，终止履行 | 解除通知到达时合同解除 |\n| 恢复原状优先 | 能够恢复原状的，应当恢复原状 | 保留原物、返还价款 |\n| 结算条款有效 | 结算和清理条款继续有效 | 违约金条款可继续适用 |\n| 赔偿损失 | 有权请求赔偿损失 | 包括直接损失和可得利益 |\n\n### 六、实务要点\n\n1. **解除时间**：解除通知到达对方时合同解除\n2. **恢复原状**：能够返还的应当返还，不能返还的折价补偿\n3. **赔偿范围**：包括直接损失和可得利益损失\n4. **违约金条款**：合同解除后，违约金条款仍可适用\n5. **证据保留**：保留解除通知、损失证据等\n\n## 典型案例\n\n### 案例一：向某诉某公司养老服务合同纠纷案（合同解除后的返还）\n\n**案号**：最高人民法院民法典颁布五周年典型案例\n\n**审理法院**：人民法院\n\n**基本案情**：向某与某公司签署《某养老机构服务合同》，约定由某公司为向某提供养老服务。合同期限为五年，向某预缴了部分养老服务费3万余元。合同签订后，向某至合同约定的位于重庆的养老基地居住生活并接受养老服务。第二年，该养老基地暂停经营，向某被安排至云南、四川等地。之后，向某返回重庆，未再接受某公司的养老服务。向某诉至法院，请求判令某公司退还未消费的养老服务费用。\n\n**裁判要旨**：养老服务合同因服务提供方未依约履行被解除的，服务提供方应退还未消费的预付费用；合同解除后恢复原状是基本法律后果。\n\n**裁判理由**：法院认为，向某与某公司形成的服务合同合法有效，双方当事人应依约履行。某公司频繁变更提供养老服务的地点，给向某带来不便，亦违反合同约定，向某有权解除合同并要求退还剩余的养老服务费用。故判决某公司退还养老服务费1万余元和押金1千余元。\n\n**实务要点**：\n1. 合同解除后，已支付但未获得对价的预付款应予返还，属于恢复原状的范畴\n2. 养老服务机构未基于老年人身心特点和实际需求适当履行合同的，消费者有权解除合同\n3. 合同解除不影响违约责任的主张，守约方可同时要求退还费用和赔偿损失\n\n**案例来源**：最高人"},{"id":"法定解除权","title":"法定解除权","excerpt":"法定解除权是指法律规定的解除事由发生时，当事人享有的解除合同的权利。法定解除权是合同解除制度的核心，实务中因法定解除权引发的纠纷最为常见。 条文 内容要点 《民法典》第563条 法定解除权的五种情形（核心条文） 《民法典》第564条 解除权行使期限 《民法典》第565条 解除权行使方式 《民法典》第566条 合同解除的法律后果 《民法典》第563条规定： 情形 具体内容 典型案例 不可抗力 因不可","slug":"法定解除权","module":"01-合同法","moduleName":"合同法","tags":["民法","合同法","合同解除","法定解除","根本违约"],"wordCount":1979,"created":"2026-05-28","updated":"2026-05-28","content":"# 法定解除权\n\n## 概述\n\n法定解除权是指法律规定的解除事由发生时，当事人享有的解除合同的权利。法定解除权是合同解除制度的核心，实务中因法定解除权引发的纠纷最为常见。\n\n## 核心内容\n\n### 一、法律依据\n\n| 条文 | 内容要点 |\n|------|----------|\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第563条|《民法典》第563条]] | 法定解除权的五种情形（核心条文） |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第564条|《民法典》第564条]] | 解除权行使期限 |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第565条|《民法典》第565条]] | 解除权行使方式 |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第566条|《民法典》第566条]] | 合同解除的法律后果 |\n\n### 二、法定解除的五种情形\n\n**[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第563条|《民法典》第563条]]规定：**\n\n| 情形 | 具体内容 | 典型案例 |\n|------|----------|----------|\n| 不可抗力 | 因不可抗力致使不能实现合同目的 | 疫情导致合同无法履行 |\n| 预期违约 | 履行期限届满前，当事人一方明确表示或者以行为表明不履行主要债务 | 卖方明确表示不交货 |\n| 迟延履行主要债务 | 当事人一方迟延履行主要债务，经催告后在合理期限内仍未履行 | 买方迟延付款经催告仍未支付 |\n| 根本违约 | 当事人一方迟延履行债务或者有其他违约行为致使不能实现合同目的 | 交付的货物完全不符合约定 |\n| 兜底条款 | 法律规定的其他情形 | 分期付款未达1/5等 |\n\n### 三、根本违约的认定\n\n**认定标准：**\n\n| 标准 | 具体内容 |\n|------|----------|\n| 违约程度 | 违约行为导致合同目的不能实现 |\n| 利益损害 | 非违约方的合同利益受到根本性损害 |\n| 无法补救 | 违约行为无法通过补救措施纠正 |\n\n**常见情形：**\n\n| 情形 | 是否构成根本违约 |\n|------|------------------|\n| 交付的货物质量严重不合格 | 是 |\n| 迟延交货导致合同目的落空 | 是 |\n| 部分交货但不影响合同目的 | 否 |\n| 轻微的质量瑕疵 | 否 |\n\n### 四、裁判规则\n\n| 规则 | 要旨 | 实务指引 |\n|------|------|----------|\n| 催告程序 | 迟延履行需先催告 | 保留催告证据 |\n| 合理期限 | 催告后给予合理期限 | 合理期限需个案判断 |\n| 根本违约 | 致使合同目的不能实现 | 重点证明合同目的落空 |\n| 解除权行使 | 通知对方即可 | 保留通知证据 |\n\n### 五、实务要点\n\n1. **催告的重要性**：迟延履行需先催告，否则解除权可能不成立\n2. **合理期限的判断**：需根据合同性质、交易习惯等因素综合判断\n3. **解除通知**：解除权行使应当通知对方，通知到达时合同解除\n4. **证据保留**：保留催告函、解除通知等书面证据\n\n## 典型案例\n\n### 案例一：某污水处理厂诉某街道办事处投资协议纠纷案（根本违约致法定解除权行使）\n\n**案号**：一审：（2019）渝0120民初号；再审：重庆市高级人民法院（2023年再审判决）\n\n**审理法院**：重庆市高级人民法院（再审）\n\n**基本案情**：2005年8月，某公司与某街道办事处签订《投资协议》，约定某公司出资300万元修建污水处理站，街道办事处向排污户收取污水处置费并按核定单价向某公司支付排污费。协议还约定，如遇国家政策变化致协议不能履行时，由双方协商解除合同。2015年4月，国务院要求城镇污水处理设施应于2017年底前全面达到一级A排放标准。2016年12月，案外公司在街道办事处辖区新修建污水处理厂。2018年7月1日起，街道办事处将辖区污水交由案外公司处理，停止向某污水处理厂供应污水，也未支付排污费，但未与某污水处理厂协商解除合同，亦未发出通知。\n\n**裁判要旨**：政策调整不构成情势变更，合同仍有继续履行可能的，一方当事人未予通知协商，单方停止履行合同主要义务，属于以自己的行为表明不履行主要债务，构成根本违约，守约方有权依据法定解除权解除合同。\n\n**裁判理由**：法院认为，相关政策文件仅对污水排放标准提出要求，某污水处理厂仍可通过升级改造满足排放标准从而继续履行合同，国家政策的变化尚不足以导致协议不能履行，不构成情势变更。某街道办事处未与对方协商，单方截"},{"id":"约定解除权","title":"约定解除权","excerpt":"约定解除权是指当事人在合同中约定的解除条件成就时，解除权人享有的解除合同的权利。约定解除权体现了合同自由原则，是当事人意思自治的重要体现。 条文 内容要点 《民法典》第562条 约定解除（核心条文） 类型 具体内容 法律依据 协商解除 当事人协商一致，可以解除合同 《民法典》第562条第1款 约定解除权 当事人可以约定一方解除合同的事由 《民法典》第562条第2款 行使条件： 条件 具体内容 解除","slug":"约定解除权","module":"01-合同法","moduleName":"合同法","tags":["民法","合同法","合同解除","约定解除","解除条件"],"wordCount":1444,"created":"2026-05-28","updated":"2026-05-28","content":"# 约定解除权\n\n## 概述\n\n约定解除权是指当事人在合同中约定的解除条件成就时，解除权人享有的解除合同的权利。约定解除权体现了合同自由原则，是当事人意思自治的重要体现。\n\n## 核心内容\n\n### 一、法律依据\n\n| 条文 | 内容要点 |\n|------|----------|\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第562条|《民法典》第562条]] | 约定解除（核心条文） |\n\n### 二、约定解除的类型\n\n| 类型 | 具体内容 | 法律依据 |\n|------|----------|----------|\n| 协商解除 | 当事人协商一致，可以解除合同 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第562条|《民法典》第562条]]第1款 |\n| 约定解除权 | 当事人可以约定一方解除合同的事由 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第562条|《民法典》第562条]]第2款 |\n\n### 三、约定解除权的行使\n\n**行使条件：**\n\n| 条件 | 具体内容 |\n|------|----------|\n| 解除条件成就 | 合同约定的解除条件已经成就 |\n| 解除权人行使 | 解除权人行使解除权 |\n| 通知对方 | 解除权人通知对方 |\n\n**行使方式：**\n\n| 方式 | 具体内容 |\n|------|----------|\n| 通知 | 解除权人通知对方 |\n| 起诉 | 解除权人也可以直接起诉解除 |\n\n### 四、裁判规则\n\n| 规则 | 要旨 | 实务指引 |\n|------|------|----------|\n| 条件成就 | 约定的解除条件必须已经成就 | 证明条件成就的事实 |\n| 意思真实 | 约定解除条件应当明确、具体 | 避免模糊约定 |\n| 诚实信用 | 解除权行使应当遵循诚实信用原则 | 不得滥用解除权 |\n\n### 五、实务要点\n\n1. **明确约定**：解除条件应当明确、具体，避免模糊约定\n2. **条件成就**：解除条件必须已经成就，方可行使解除权\n3. **通知义务**：解除权人应当通知对方\n4. **诚实信用**：解除权行使应当遵循诚实信用原则\n\n## 典型案例\n\n### 案例一：明珠实业公司与港龙公司租赁合同纠纷案（约定解除权的行使限制）\n\n**案号**：（2018）最高法民再125号\n\n**审理法院**：最高人民法院\n\n**基本案情**：明珠实业公司与港龙公司签订长期房屋租赁合同，合同约定了详细的解除条款。履行过程中，港龙公司因经营困难等原因存在逾期支付租金等轻微违约行为，达到合同约定的解除条件。明珠实业公司据此主张行使约定解除权，要求解除租赁合同。\n\n**裁判要旨**：合同约定的解除条件成就时，守约方以此为由请求解除合同的，人民法院应当审查违约方的违约程度是否显著轻微，是否影响守约方合同目的实现，根据诚实信用原则，确定合同应否解除。违约方的违约程度显著轻微，不影响守约方合同目的实现的，约定解除权人不得据此解除合同。\n\n**裁判理由**：法院认为，港龙公司的违约行为系因经营困难等客观原因所致，并无恶意违约的故意，且未给明珠实业公司造成显著损失，没有破坏合同履行基础。双方仍然选择继续履行长期租赁合同。在违约行为仅构成显著轻微违约的情形下，明珠实业公司不能依约行使解除权，否则将导致双方利益严重失衡，有违诚实信用原则。\n\n**实务要点**：\n1. [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第562条|《民法典》第562条]]规定的约定解除权并非绝对权利，其行使受诚实信用原则限制\n2. 约定解除条件成就但违约程度显著轻微、不影响守约方合同目的实现的，法院不予支持解除\n3. 判断是否属于\"显著轻微违约\"应综合考虑违约程度、违约原因、对合同目的的影响及解除后双方利益是否失衡等因素\n\n**案例来源**：最高人民法院（2018年再审裁判）\n\n> **查看原文**：[合同约定解除权行使的限制——显著轻微违约的认定](https://www.rhrlawyer.com/site/zh/falvshijie/shiwuwenzhang/1592691420973232130.html)\n\n## 参考来源\n\n- 《中华人民共和国民法典》第562条\n- [[⚖️ 民法实务知识库/08-法规全文/合同编通则司法解释|《最高人民法院关于适用〈中华人民共和国民法典〉合同编通则若干问题的解释》]]\n\n## 相关主题\n\n- [[法定解除权]] — 法定解除的五种情形\n- [[合同解除的后果]] — 解除后的法律后果\n- [[解除权行使期限]] — 解除权的行使期限"},{"id":"解除权行使期限","title":"解除权行使期限","excerpt":"解除权行使期限是指解除权人行使解除权的法定或约定期限。解除权属于形成权，受除斥期间限制，逾期不行使的，解除权消灭。 条文 内容要点 《民法典》第564条 解除权行使期限（核心条文） 情形 期限 法律依据 法律规定 法律规定的期限 《民法典》第564条 当事人约定 当事人约定的期限 《民法典》第564条 催告后合理期限 对方催告后的合理期限 《民法典》第564条 一年 没有约定的，自解除权人知道或者","slug":"解除权行使期限","module":"01-合同法","moduleName":"合同法","tags":["民法","合同法","合同解除","解除权","除斥期间"],"wordCount":1555,"created":"2026-05-28","updated":"2026-05-28","content":"# 解除权行使期限\n\n## 概述\n\n解除权行使期限是指解除权人行使解除权的法定或约定期限。解除权属于形成权，受除斥期间限制，逾期不行使的，解除权消灭。\n\n## 核心内容\n\n### 一、法律依据\n\n| 条文 | 内容要点 |\n|------|----------|\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第564条|《民法典》第564条]] | 解除权行使期限（核心条文） |\n\n### 二、解除权行使期限的确定\n\n| 情形 | 期限 | 法律依据 |\n|------|------|----------|\n| 法律规定 | 法律规定的期限 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第564条|《民法典》第564条]] |\n| 当事人约定 | 当事人约定的期限 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第564条|《民法典》第564条]] |\n| 催告后合理期限 | 对方催告后的合理期限 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第564条|《民法典》第564条]] |\n| 一年 | 没有约定的，自解除权人知道或者应当知道解除事由之日起一年 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第564条|《民法典》第564条]] |\n\n### 三、解除权消灭的情形\n\n| 情形 | 法律后果 |\n|------|----------|\n| 逾期不行使 | 解除权消灭 |\n| 经对方催告后在合理期限内不行使 | 解除权消灭 |\n| 当事人约定的期限届满 | 解除权消灭 |\n\n### 四、裁判规则\n\n| 规则 | 要旨 | 实务指引 |\n|------|------|----------|\n| 除斥期间 | 解除权行使期限为除斥期间 | 不适用中止、中断 |\n| 一年期限 | 没有约定的，自知道解除事由之日起一年 | 注意起算时间 |\n| 催告后合理期限 | 对方催告后的合理期限内行使 | 合理期限需个案判断 |\n\n### 五、实务要点\n\n1. **及时行使**：解除权人应当在法定或约定期限内行使解除权\n2. **起算时间**：自解除权人知道或者应当知道解除事由之日起算\n3. **催告后的期限**：对方催告后的合理期限内行使\n4. **证据保留**：保留解除通知、催告函等书面证据\n\n## 典型案例\n\n### 案例一：李婷与菏泽富邦公司车位使用权转让协议纠纷案（解除权因除斥期间届满而消灭）\n\n**案号**：（2022）鲁17民终5559号\n\n**审理法院**：山东省菏泽市中级人民法院\n\n**基本案情**：李婷与富邦公司签订《车位/车库使用权转让协议》，约定富邦公司于2020年7月31日前交付车位，逾期超过30日的，李婷有权解除协议。因富邦公司一直未交付车位，李婷已于2020年8月31日依约享有合同解除权，但双方未约定解除权的行使期限，富邦公司亦未催告李婷行使解除权。李婷未在解除权发生之日起一年内提起诉讼或通知解除，后诉至法院请求解除协议。\n\n**裁判要旨**：合同解除权属于形成权，受除斥期间限制。法律没有规定或者当事人没有约定解除权行使期限的，解除权人应当自知道或者应当知道解除事由之日起一年内行使；逾期不行使的，解除权消灭。\n\n**裁判理由**：法院认为，李婷于2020年8月31日即知道解除事由发生，但未在一年内行使解除权。参照《最高人民法院关于审理商品房买卖合同纠纷案件适用法律若干问题的解释》（现[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第564条|《民法典》第564条]]已将该规则一般化），对方当事人没有催告的，解除权应当在解除权发生之日起一年内行使，逾期不行使的，解除权消灭。李婷享有的合同解除权因超过一年的除斥期间而归于消灭，其诉请解除合同于法无据，不予支持。\n\n**实务要点**：\n1. 解除权的除斥期间自解除权人知道或应当知道解除事由之日起算，为期一年，不适用中止、中断规则\n2. 即使合同约定了明确的解除条件，解除权人仍须在法定或约定期限内行使，否则权利消灭\n3. 当事人发现解除事由后应及时行使解除权，保留行使解除权的书面证据\n\n**案例来源**：山东省菏泽市中级人民法院（2022年裁判）\n\n> **查看原文**：[合同解除权除斥期间，典型裁判观点及建议——WELEGAL法盟](https://www.welegal.net/nd.jsp?id=824)\n\n## 参考来源\n\n- 《中华人民共和国民法典》第564条\n- [[⚖️ 民法实务知识库/08-法规全文/合同编通则司法解释|《最高人民法院关于适用〈中华人民共和国民法典〉合同编通则若干问题的解释》]]\n\n## 相关主题\n\n- [[法定解除"},{"id":"买卖合同","title":"买卖合同","excerpt":"买卖合同是实务中最常见、纠纷量最大的合同类型。核心争议集中在：标的物质量瑕疵、交付与风险转移、价款支付、合同解除条件等。 条文 内容要点 民法典第595-647条 买卖合同专章（共53条） 第604条 风险转移基本规则 ：标的物毁损灭失的风险，交付前由出卖人承担，交付后由买受人承担 第610条 因标的物质量不符合要求致使不能实现合同目的的，买受人可以拒绝接受或解除合同 第621条 质量异议期限 ：","slug":"买卖合同","module":"01-合同法","moduleName":"合同法","tags":["民法","合同法","典型合同","买卖合同","风险转移","质量异议"],"wordCount":1932,"created":"2026-05-28","updated":"2026-05-28","content":"# 买卖合同\n\n## 概述\n\n买卖合同是实务中最常见、纠纷量最大的合同类型。核心争议集中在：标的物质量瑕疵、交付与风险转移、价款支付、合同解除条件等。\n\n## 核心内容\n\n### 法律依据\n\n| 条文 | 内容要点 |\n|------|----------|\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第595条|民法典第595-647条]] | 买卖合同专章（共53条） |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第604条|第604条]] | **风险转移基本规则**：标的物毁损灭失的风险，交付前由出卖人承担，交付后由买受人承担 |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第610条|第610条]] | 因标的物质量不符合要求致使不能实现合同目的的，买受人可以拒绝接受或解除合同 |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第621条|第621条]] | **质量异议期限**：约定检验期内通知；无约定的，最长不超过收到之日起2年 |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第634条|第634条]] | 分期付款买卖：未付到期价款达全部价款1/5的，出卖人可要求支付全部价款或解除合同 |\n\n### 风险转移规则\n\n- **交付主义**：以交付为风险转移时点（[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第604条|第604条]]），不以所有权转移为准\n- **在途货物**：合同成立时起风险由买受人承担\n- **约定优先**：当事人可约定风险转移规则\n\n### 检验与通知义务\n\n- 买受人应当在检验期内检验并通知出卖人（[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第620条|第620条]]）\n- **沉默视为认可**：约定检验期内未通知的，视为质量或数量符合约定\n- **2年最长异议期**：无约定检验期的，自收到之日起2年内未通知的，视为符合约定\n\n### 裁判规则\n\n| 序号 | 裁判规则 | 实务要点 |\n|------|----------|----------|\n| 1 | 风险转移以\"交付\"为准 | 注意区分交付方式 |\n| 2 | 买受人在合理期间内未提出质量异议，丧失质量瑕疵请求权 | 及时检验、及时通知 |\n| 3 | 标的物质量不符合约定，买受人可选择修理、更换、减价、退货等 | 买受人有权选择 |\n| 4 | 分期付款买卖中，未付到期价款达1/5的，出卖人可解除合同 | 1/5是强制性规定 |\n\n### 实务要点\n\n1. **标的物信息明确化**：品名、规格、型号、数量、质量标准等应具体\n2. **检验期约定**：应根据标的物性质合理约定\n3. **及时检验**：收到货物后应立即检验，发现问题及时书面通知\n4. **保留证据**：收货单、检验报告、沟通记录等均应妥善保存\n\n## 典型案例\n\n### 案例一：某材料公司与某工程公司买卖合同纠纷案（约定检验期限过短的处理规则）\n\n**案号**：（2019）苏01民终1230号\n\n**审理法院**：江苏省南京市中级人民法院\n\n**基本案情**：某材料公司（出卖人）与某工程公司（买受人）签订买卖合同，约定由材料公司向工程公司供应建筑材料，合同约定了较短的检验期限。工程公司收货后在约定检验期内未提出质量异议，但事后以标的物存在隐蔽瑕疵为由主张质量违约，要求材料公司承担违约责任。材料公司则抗辩称工程公司未在约定检验期内提出异议，应视为质量合格。\n\n**裁判要旨**：买受人主张合同约定的隐蔽瑕疵检验期间过短的，应当综合当事人交易行为、标的物及瑕疵情况、检验方法及时间等因素，依据诚实信用原则进行判断。约定检验期限仅适用于外观瑕疵的，对隐蔽瑕疵应另行确定合理检验期限。\n\n**裁判理由**：法院认为，根据[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第622条|《民法典》第622条]]（原《合同法》第158条参照适用），当事人约定的检验期限过短，根据标的物的性质和交易习惯，买受人在检验期限内难以完成全面检验的，该期限仅视为买受人对标的物的外观瑕疵提出异议的期限。本案中，材料公司供应的建筑材料中部分质量问题属于隐蔽瑕疵，需要经过安装使用或专业检测才能发现，在约定的短期检验期内难以完成全面检验。因此，约定检验期仅适用于外观瑕疵的异议，对隐蔽瑕疵应依据司法解释确定合理的异议期限。有证据证明买受人能够在约定的检验期内完成全面检验而怠于检验并提出质量异议的，则应当承担不利的法律后果。\n\n**实务要点**：\n1. [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第621条|《民法典》第"},{"id":"保证合同","title":"保证合同","excerpt":"保证合同是担保制度的核心组成部分，实务中广泛存在于借贷、买卖、工程等合同关系中。核心争议集中在：保证方式的认定、保证期间的计算、保证人的抗辩权、公司对外担保的效力等。 条文 内容要点 民法典第681-702条 保证合同专章（共22条） 第686条 保证方式 ：约定不明时推定为一般保证 第692条 保证期间 ：保证期间是除斥期间，不发生中止、中断和延长 第693条 一般保证的债权人未在保证期间内对债","slug":"保证合同","module":"01-合同法","moduleName":"合同法","tags":["民法","合同法","典型合同","保证合同","一般保证","连带保证","保证期间"],"wordCount":1576,"created":"2026-05-28","updated":"2026-05-28","content":"# 保证合同\n\n## 概述\n\n保证合同是担保制度的核心组成部分，实务中广泛存在于借贷、买卖、工程等合同关系中。核心争议集中在：保证方式的认定、保证期间的计算、保证人的抗辩权、公司对外担保的效力等。\n\n## 核心内容\n\n### 法律依据\n\n| 条文 | 内容要点 |\n|------|----------|\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第681条|民法典第681-702条]] | 保证合同专章（共22条） |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第686条|第686条]] | **保证方式**：约定不明时推定为一般保证 |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第692条|第692条]] | **保证期间**：保证期间是除斥期间，不发生中止、中断和延长 |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第693条|第693条]] | 一般保证的债权人未在保证期间内对债务人提起诉讼或仲裁的，保证人不再承担保证责任 |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第694条|第694条]] | 连带责任保证的债权人未在保证期间内请求保证人承担保证责任的，保证人不再承担保证责任 |\n\n### 一般保证与连带保证\n\n| 区分项 | 一般保证 | 连带责任保证 |\n|--------|----------|--------------|\n| **民法典推定** | 约定不明时推定为一般保证 | 需明确约定\"连带责任\" |\n| 先诉抗辩权 | 有 | 无 |\n| 保证期间内主张方式 | 对债务人提起诉讼或仲裁 | 请求保证人承担保证责任 |\n\n### 保证期间的确定\n\n| 情形 | 保证期间 |\n|------|----------|\n| 当事人有约定 | 按约定 |\n| 约定不明 | 主债务履行期限届满之日起6个月 |\n| 没有约定 | 主债务履行期限届满之日起6个月 |\n\n### 裁判规则\n\n| 序号 | 裁判规则 | 实务要点 |\n|------|----------|----------|\n| 1 | 约定不明时推定为一般保证 | 注意审查合同用语 |\n| 2 | 保证期间为除斥期间 | 不适用诉讼时效中止、中断 |\n| 3 | 债权人未在保证期间内依法主张权利的，保证人免除保证责任 | 严格在保证期间内主张权利 |\n| 4 | 公司对外担保须经股东会或董事会决议 | 债权人应审查公司决议 |\n\n### 实务要点\n\n1. **保证方式明确**：如需连带保证，必须明确写明\"连带责任保证\"\n2. **保证期间约定**：建议约定合理的保证期间\n3. **公司对外担保**：审查公司章程和股东会/董事会决议\n4. **及时主张权利**：在保证期间内及时主张权利\n\n## 典型案例\n\n### 案例：保证人在特定财产范围内承担保证责任的效力认定\n\n**案号/入库编号**：入库编号 2024-08-2-103-012\n\n**审理法院**：江苏省靖江市人民法院（一审）\n\n**基本案情**：张某等出借人与郭某书等借款人签订7000万元借款合同，安顺市某房地产公司出具担保函，约定仅以该公司欣某国际2、3区项目的土地使用权和在建工程、销售款（以7000万元为限）承担连带保证责任，不包括该公司其他资产。借款到期后借款人未还款，出借人诉请房地产公司在全部资产范围内承担保证责任。\n\n**裁判要旨**：1.基于意思自治原则，在保证担保合同中，当事人可以约定保证人在特定的财产范围内承担保证责任。该约定不违反法律、行政法规的强制性规定以及公序良俗，应当依法认定有效。2.合同当事人约定担保人以一定的不动产对债务承担担保责任，但并未就约定的财产办理相关抵押登记手续的，该约定实际仍为保证。保证人承担保证责任的范围应当以约定的抵押财产范围为限。\n\n**实务要点**：\n1. 保证人可以约定在特定财产范围内承担保证责任，法律不禁止此类约定\n2. 未办理抵押登记的不动产担保约定，性质上仍为保证而非抵押\n3. 约定连带保证的，债权人可直接要求保证人在约定范围内承担责任\n\n**与知识点的关联**：本案体现了保证合同中意思自治原则的适用。当事人约定保证人在特定财产范围内承担连带保证责任，属于\"双方认为需要约定的其他事项\"，不违反法律强制性规定，应认定有效。这对于理解一般保证与连带保证的灵活运用具有参考价值。\n\n## 参考来源\n\n- 《民法典》第三编第十三章（[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第681条|第681-702条]]）\n- [[⚖️ 民法实务知识库/08-法规全文/担保制度司法解释|最高人民法院《关于适用〈中"},{"id":"借款合同","title":"借款合同","excerpt":"借款合同分为金融借款合同和民间借贷合同两大类，实务中纠纷量极大。核心争议集中在：利率上限、砍头息认定、利息计算、逾期违约金、担保效力等。 条文 内容要点 民法典第667-680条 借款合同专章（共14条） 第670条 砍头息禁止 ：借款的利息不得预先在本金中扣除 第679条 自然人之间的借款合同，自贷款人提供借款时成立 第680条 禁止高利放贷，借款的利率不得违反国家有关规定 根据最高人民法院《关","slug":"借款合同","module":"01-合同法","moduleName":"合同法","tags":["民法","合同法","典型合同","借款合同","民间借贷","利率上限","砍头息"],"wordCount":1413,"created":"2026-05-28","updated":"2026-05-28","content":"# 借款合同\n\n## 概述\n\n借款合同分为金融借款合同和民间借贷合同两大类，实务中纠纷量极大。核心争议集中在：利率上限、砍头息认定、利息计算、逾期违约金、担保效力等。\n\n## 核心内容\n\n### 法律依据\n\n| 条文 | 内容要点 |\n|------|----------|\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第667条|民法典第667-680条]] | 借款合同专章（共14条） |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第670条|第670条]] | **砍头息禁止**：借款的利息不得预先在本金中扣除 |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第679条|第679条]] | 自然人之间的借款合同，自贷款人提供借款时成立 |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第680条|第680条]] | 禁止高利放贷，借款的利率不得违反国家有关规定 |\n\n### 民间借贷利率上限\n\n根据最高人民法院《关于审理民间借贷案件适用法律若干问题的规定》：\n\n- **利率保护上限**：合同成立时一年期贷款市场报价利率（LPR）的四倍\n- **超过部分**：超过LPR四倍的利息约定无效\n- **2020年8月20日前成立的合同**：适用旧规定（年利率24%以内的受保护）\n\n### 砍头息认定\n\n**认定标准：**\n- 直接从本金中扣除利息\n- 要求借款人支付\"咨询费\"\"服务费\"\"管理费\"等变相砍头息\n- 要求借款人购买理财产品、保险等作为放款条件\n\n**裁判规则：**\n- 本金认定以实际交付的借款数额为准\n- 利息计算以实际本金为基数\n\n### 裁判规则\n\n| 序号 | 裁判规则 | 实务要点 |\n|------|----------|----------|\n| 1 | 民间借贷利率超过LPR四倍的部分无效 | 超过部分利息约定无效 |\n| 2 | 砍头息应从本金中扣除 | 保留银行流水 |\n| 3 | 逾期利率不得超过LPR的四倍 | 逾期利息、违约金、其他费用总计不得超过四倍LPR |\n| 4 | 套取金融机构贷款转贷的，民间借贷合同无效 | 资金来源审查是关键 |\n\n### 实务要点\n\n1. **书面合同**：应签订书面借款合同或借条\n2. **转账支付**：尽量通过银行转账支付借款\n3. **利率约定**：明确约定年利率，避免约定模糊\n4. **砍头息风险**：注意实际到账金额与合同约定是否一致\n\n## 典型案例\n\n### 案例：借款人在放款前支付利息的砍头息认定\n\n**案号/入库编号**：入库编号 2024-08-2-103-008\n\n**审理法院**：人民法院案例库参考案例\n\n**基本案情**：张某诉某物流公司等借款合同纠纷案。借款人在放款前（或当日）向出借人支付了利息，双方就该笔预先支付的利息是否应当认定为\"砍头息\"产生争议。出借人主张该款项为独立的咨询服务费，借款人主张系变相砍头息。\n\n**裁判要旨**：借款的利息不得预先在本金中扣除。借款人于放款前或放款当日即向出借人支付款项，如果该款项的支付与借款的发放具有关联性，实质上属于预先在本金中扣除利息的行为，应当认定为\"砍头息\"，按照实际出借的金额认定本金并计算利息。\n\n**实务要点**：\n1. 砍头息不限于直接从本金中扣除，放款前或放款当日支付的关联款项也可认定\n2. 本金认定以实际交付的借款数额为准，利息计算以实际本金为基数\n3. 出借人以\"咨询费\"\"服务费\"等名义收取的款项，实质为砍头息的应予扣除\n\n**与知识点的关联**：本案是[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第670条|民法典第670条]]\"砍头息禁止\"规则的典型适用。根据民间借贷司法解释，预先在本金中扣除利息的，人民法院应当将实际出借的金额认定为本金，有效保护借款人利益。\n\n## 参考来源\n\n- 《民法典》第三编第十二章（[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第667条|第667-680条]]）\n- 最高人民法院《关于审理民间借贷案件适用法律若干问题的规定》\n\n## 相关主题\n\n- [[保证合同]]\n- [[抵押权]]\n- [[合同成立与生效]]\n- [[诉讼时效制度]]\n\n> 📖 详见 [[案例-民间借贷系列]] 中的详细分析"},{"id":"建设工程合同","title":"建设工程合同","excerpt":"建设工程合同是实务中法律关系最复杂、标的额最大、争议最多的合同类型之一。核心争议集中在：工程价款结算、优先受偿权行使、实际施工人权利保护、工程质量责任、工期延误责任等。 条文 内容要点 民法典第788-808条 建设工程合同专章（共21条） 第791条 禁止转包 ：承包人不得将其承包的全部建设工程转包给第三人 第793条 建设工程施工合同无效，但建设工程经验收合格的，可参照合同关于工程价款的约定折","slug":"建设工程合同","module":"01-合同法","moduleName":"合同法","tags":["民法","合同法","典型合同","建设工程合同","优先受偿权","实际施工人"],"wordCount":1622,"created":"2026-05-28","updated":"2026-05-28","content":"# 建设工程合同\n\n## 概述\n\n建设工程合同是实务中法律关系最复杂、标的额最大、争议最多的合同类型之一。核心争议集中在：工程价款结算、优先受偿权行使、实际施工人权利保护、工程质量责任、工期延误责任等。\n\n## 核心内容\n\n### 法律依据\n\n| 条文 | 内容要点 |\n|------|----------|\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第788条|民法典第788-808条]] | 建设工程合同专章（共21条） |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第791条|第791条]] | **禁止转包**：承包人不得将其承包的全部建设工程转包给第三人 |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第793条|第793条]] | 建设工程施工合同无效，但建设工程经验收合格的，可参照合同关于工程价款的约定折价补偿 |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第807条|第807条]] | **优先受偿权**：承包人可以就建设工程的价款优先受偿 |\n\n### 优先受偿权（实务重点）\n\n**权利主体**：与发包人签订建设工程施工合同的承包人\n\n**行使条件**：\n1. 工程质量合格\n2. 发包人未按约支付价款\n3. 行使期限：自发包人应当给付建设工程价款之日起18个月内行使\n\n**优先受偿的范围**：\n- 包括：承包人为建设工程实际支出的费用\n- 不包括：因发包人违约造成的损失\n- 优先于抵押权\n\n### 实际施工人权利保护\n\n**实际施工人的认定**：\n- 转包关系中的实际施工人\n- 违法分包关系中的实际施工人\n- 借用资质（挂靠）的实际施工人\n\n**实际施工人的权利**：\n- 可以直接起诉发包人\n- 发包人在欠付工程价款范围内对实际施工人承担责任\n- 不享有优先受偿权\n\n### 裁判规则\n\n| 序号 | 裁判规则 | 实务要点 |\n|------|----------|----------|\n| 1 | 建设工程施工合同无效，但工程验收合格的，可参照合同约定折价补偿 | 合同无效不影响工程款请求权 |\n| 2 | 优先受偿权优先于抵押权 | 承包人应在18个月内行使 |\n| 3 | 实际施工人可突破合同相对性，直接起诉发包人 | 发包人仅在欠付工程款范围内承担责任 |\n| 4 | 建设工程未经竣工验收，发包人擅自使用的，视为验收合格 | 地基基础和主体结构除外 |\n\n### 实务要点\n\n1. **合同效力审查**：审查承包人资质、招投标程序\n2. **工程签证**：及时办理工程签证，保留签证资料\n3. **结算资料**：及时提交竣工结算资料\n4. **优先受偿权**：在18个月除斥期间内行使\n\n## 典型案例\n\n### 案例：建设工程价款优先受偿权不及于土地使用权\n\n**案号/入库编号**：入库编号 2025-17-5-202-010\n\n**审理法院**：上海市第一中级人民法院（执行异议）/上海市高级人民法院（复议）\n\n**基本案情**：仲某公司与南某能源公司建设工程施工合同纠纷经仲裁裁决，南某能源公司支付工程款1.069亿余元，仲某公司享有建设工程价款优先受偿权。执行中案涉房产经两轮流拍后以物抵债给仲某公司。某银行上海分行作为抵押权人提出异议，主张建设工程价款优先受偿权不及于土地使用权，以物抵债损害了抵押权人利益。\n\n**裁判要旨**：承包人享有的建设工程价款优先权属于法定优先权，依法优先于抵押权和其他债权，但其效力范围应限于施工者的劳动及投入的材料结合形成的建设工程部分，并不及于该建筑占用范围内的建设用地使用权。在对建筑物进行整体拍卖后，拍卖款应当区分建设工程对应的价值和土地使用权对应的价值，并由相应优先权人分别优先受偿。\n\n**实务要点**：\n1. 建设工程价款优先受偿权优先于抵押权，但效力范围仅限于建筑物本身\n2. 优先受偿权不及于建筑物占用范围内的建设用地使用权\n3. 整体拍卖后应区分建筑物价值与土地使用权价值，分别由各优先权人受偿\n\n**与知识点的关联**：本案明确了[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第807条|民法典第807条]]优先受偿权的效力范围边界。建设工程价款优先受偿权旨在保护承包人（含建筑工人）的劳动及材料投入，该等投入并未转化为土地使用权的价值，因此优先权不应无限扩张至土地部分。\n\n## 参考来源\n\n- 《民法典》第三编第十八章（[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第788条|第788-808条]]）\n- 最高人民法院《关于审理建设工程施工合同纠纷案件适用法律问题的解释（一）》\n\n## 相关主题\n\n- [[合同成立与生效]]\n- "},{"id":"物业服务合同","title":"物业服务合同","excerpt":"物业服务合同是民法典新增的典型合同类型，涉及千家万户的日常生活。核心争议集中在：物业费缴纳义务、物业服务瑕疵抗辩、业主委员会的法律地位等。 条文 内容要点 民法典第937-950条 物业服务合同专章（共14条） 第939条 前期物业服务合同 ：对业主具有法律约束力 第944条 物业费缴纳义务 ：业主不得以未接受物业服务为由拒绝支付物业费 第946条 业主依法共同决定解聘物业服务人的，可以解除物业服","slug":"物业服务合同","module":"01-合同法","moduleName":"合同法","tags":["民法","合同法","典型合同","物业服务合同","业主委员会","物业费"],"wordCount":1429,"created":"2026-05-28","updated":"2026-05-28","content":"# 物业服务合同\n\n## 概述\n\n物业服务合同是民法典新增的典型合同类型，涉及千家万户的日常生活。核心争议集中在：物业费缴纳义务、物业服务瑕疵抗辩、业主委员会的法律地位等。\n\n## 核心内容\n\n### 法律依据\n\n| 条文 | 内容要点 |\n|------|----------|\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第937条|民法典第937-950条]] | 物业服务合同专章（共14条） |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第939条|第939条]] | **前期物业服务合同**：对业主具有法律约束力 |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第944条|第944条]] | **物业费缴纳义务**：业主不得以未接受物业服务为由拒绝支付物业费 |\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第946条|第946条]] | 业主依法共同决定解聘物业服务人的，可以解除物业服务合同 |\n\n### 业主的物业费缴纳义务\n\n- 业主不得以未接受或无需接受物业服务为由拒绝支付物业费\n- 物业服务存在瑕疵的，业主可以请求减免物业费，但不能拒缴全部物业费\n\n### 业主共同决定解聘\n\n- 需经法定表决程序（双2/3参与，双过半同意）\n- 提前60日书面通知物业服务人\n\n### 裁判规则\n\n| 序号 | 裁判规则 | 实务要点 |\n|------|----------|----------|\n| 1 | 业主不得以未接受物业服务为由拒缴物业费 | 共有部分的服务视为对全体业主的服务 |\n| 2 | 物业服务存在瑕疵，业主可主张减免物业费 | 法院一般根据瑕疵程度酌定减免比例（10%-30%） |\n| 3 | 前期物业服务合同对业主具有约束力 | 业主不得以未参与签订为由拒绝履行 |\n| 4 | 物业服务人不得以停止供水、供电等方式催缴物业费 | 该行为构成侵权 |\n\n### 实务要点\n\n1. **服务内容明确化**：明确物业服务的具体事项、标准、频次\n2. **费用条款**：明确物业费标准、缴纳方式、调整机制\n3. **物业费纠纷**：业主主张物业服务瑕疵的，应提供证据\n4. **合同解除**：需经法定表决程序，提前60日书面通知\n\n## 典型案例\n\n### 案例：未签书面合同但构成事实物业服务关系应缴纳物业费\n\n**案号/入库编号**：入库编号 2023-16-2-121-002\n\n**审理法院**：广东省中山市人民法院（一审）\n\n**基本案情**：中山市某物业公司为某小区提供物业服务。涉案商业楼虽不在物业服务合同约定的管理范围内，商业楼所有权人方某某也并非物业服务合同的相对方，但物业公司已向该商业楼履行了基本的养护、管理、清洁、安全保障等义务，方某某长期未提出异议。后物业公司起诉要求方某某缴纳物业费。\n\n**裁判要旨**：涉案商业楼虽不在物业服务合同约定的物业服务管理范围内，涉案商业楼所有权人也并非物业服务合同的相对方，但在物业公司已向涉案商业楼履行基本的养护、管理、清洁、安全保障等义务且涉案商业楼所有权人也长期未提出异议的情况下，双方形成事实上的物业服务合同关系，涉案商业楼所有权人应向物业公司缴纳物业费。\n\n**实务要点**：\n1. 物业服务合同关系不限于书面合同，事实上的服务与接受也可构成合同关系\n2. 业主长期接受物业服务且未提出异议的，视为默示接受服务\n3. 业主不得以未签订书面合同为由拒绝支付已实际享受服务对应的物业费\n\n**与知识点的关联**：本案体现了[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第944条|民法典第944条]]物业费缴纳义务的实质认定标准。即使不存在书面合同，只要物业服务人实际提供了服务、业主实际接受了服务，即可认定事实上的物业服务合同关系成立，业主应当支付物业费。\n\n## 参考来源\n\n- 《民法典》第三编第二十四章（[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第937条|第937-950条]]）\n- 最高人民法院《关于审理物业服务纠纷案件具体应用法律若干问题的解释》\n\n## 相关主题\n\n- [[法定解除权]]\n- [[违约责任构成]]\n- [[建筑物区分所有权]]"},{"id":"租赁合同","title":"租赁合同","excerpt":"租赁合同是日常生活中最常见的合同类型之一，核心争议集中在：租金支付、合同解除、优先购买权、转租效力、装修损失分担等。 条文 内容要点 民法典第703-734条 租赁合同专章（共32条） 第705条 租赁期限不得超过20年 第722条 承租人无正当理由未支付或迟延支付租金的，出租人可解除合同 第725条 买卖不破租赁 ：租赁物在承租人占有期限内发生所有权变动的，不影响租赁合同的效力 第726条 优先","slug":"租赁合同","module":"01-合同法","moduleName":"合同法","tags":["民法","合同法","典型合同","租赁合同","优先购买权","买卖不破租赁"],"wordCount":1721,"created":"2026-05-28","updated":"2026-05-28","content":"# 租赁合同\r\n\r\n## 概述\r\n\r\n租赁合同是日常生活中最常见的合同类型之一，核心争议集中在：租金支付、合同解除、优先购买权、转租效力、装修损失分担等。\r\n\r\n## 核心内容\r\n\r\n### 法律依据\r\n\r\n| 条文 | 内容要点 |\r\n|------|----------|\r\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第703条|民法典第703-734条]] | 租赁合同专章（共32条） |\r\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第705条|第705条]] | 租赁期限不得超过20年 |\r\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第722条|第722条]] | 承租人无正当理由未支付或迟延支付租金的，出租人可解除合同 |\r\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第725条|第725条]] | **买卖不破租赁**：租赁物在承租人占有期限内发生所有权变动的，不影响租赁合同的效力 |\r\n| [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第726条|第726条]] | **优先购买权**：出租人出卖租赁房屋的，承租人享有以同等条件优先购买的权利 |\r\n\r\n### 买卖不破租赁（[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第725条|第725条]]）\r\n\r\n- 租赁物在承租人占有期限内发生所有权变动的，不影响租赁合同的效力\r\n- **适用条件**：租赁合同有效成立 + 承租人已实际占有租赁物 + 租赁物所有权发生变动\r\n- **例外**：房屋在出租前已设立抵押权并登记的，不适用\r\n\r\n### 承租人优先购买权（[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第726条|第726条]]）\r\n\r\n- 出租人出卖租赁房屋的，应在出卖前的合理期限内通知承租人\r\n- 承租人享有以同等条件优先购买的权利\r\n- **合理期限**：一般为15日\r\n- **侵害后果**：承租人可请求损害赔偿，但买卖合同效力不受影响\r\n\r\n### 转租规则\r\n\r\n- **同意转租**：承租人经出租人同意，可以将租赁物转租给第三人\r\n- **擅自转租**：出租人可以解除合同\r\n- **次承租人的代偿请求权**：承租人拖欠租金的，次承租人可以代承租人支付\r\n\r\n### 裁判规则\r\n\r\n| 序号 | 裁判规则 | 实务要点 |\r\n|------|----------|----------|\r\n| 1 | 买卖不破租赁以承租人实际占有租赁物为前提 | 仅有租赁合同但未实际交付的，不适用 |\r\n| 2 | 承租人优先购买权被侵害的，只能主张损害赔偿 | 不能主张买卖合同无效 |\r\n| 3 | 擅自转租的，出租人应在知道之日起6个月内提出异议 | 6个月为除斥期间 |\r\n| 4 | 不定期租赁中，双方均可随时解除合同 | 合理期限一般1-3个月 |\r\n\r\n### 实务要点\r\n\r\n1. **租赁物信息明确化**：地址、面积、用途、权属等应具体\r\n2. **租金条款**：明确金额、支付方式、支付时间、递增比例\r\n3. **优先购买权条款**：约定通知方式和行使期限\r\n4. **装修条款**：明确装修方案审批、费用承担、合同到期后装修物归属\r\n\r\n## 典型案例\r\n\r\n### 案例：租赁权与抵押权竞合中的实质审查\r\n\r\n**案号/入库编号**：入库编号 2023-16-2-470-001\r\n\r\n**审理法院**：广东省珠海市金湾区人民法院（一审）\r\n\r\n**基本案情**：案外人主张在抵押权设立之前已合法占有使用租赁物，要求以租赁权对抗抵押权。法院审查发现，案外人提交的租赁合同、移交确认书等书面材料所载内容与租金支付、水电费缴纳等实际情况不符。\r\n\r\n**裁判要旨**：判定租赁权是否具有对抗抵押权效力时应注意：一是案外人是否在抵押权设立之前合法实际占有使用租赁物；二是案外人对占有使用租赁物起始时间负举证责任，有关事实真伪不明时，案外人承担不利后果；三是不能仅以案外人提交租赁合同、租赁物移交确认书等书面所载内容认定占有起始时间，而应结合租金支付、水电费缴纳等费用转账记录、物业管理人员证言、第三方评估机构评估报告等公信力较高材料加以认定。\r\n\r\n**实务要点**：\r\n1. 买卖不破租赁以承租人实际占有租赁物为前提，仅有租赁合同但未实际交付的不适用\r\n2. 法院对租赁权的审查采取实质审查标准，不以书面材料为唯一依据\r\n3. 虚假租赁合同可能构成虚假诉讼，当事人将承担相应法律责任\r\n\r\n**与知识点的关联**：本案涉及[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第405条|民法典第405条]]（抵押不破租赁）"},{"id":"善意取得","title":"善意取得","excerpt":"善意取得是指无权处分人将其占有的动产或登记在其名下的不动产转让给受让人，受让人在取得该财产时出于善意，即可依法取得该财产的所有权或其他物权。善意取得制度旨在保护交易安全和善意第三人的利益，是物权法的重要制度。 法律依据 ：《民法典》第311条 要件 具体内容 证明责任 无权处分 处分人没有处分权 主张善意取得者证明 善意 受让人不知道且不应当知道处分人无权处分 推定善意，由真实权利人举证反驳 合理","slug":"善意取得","module":"02-物权法","moduleName":"物权法","tags":["民法","物权法","善意取得","无权处分","不动产"],"wordCount":2720,"created":"2026-05-28","updated":"2026-06-04","content":"# 善意取得\n\n## 概述\n\n善意取得是指无权处分人将其占有的动产或登记在其名下的不动产转让给受让人，受让人在取得该财产时出于善意，即可依法取得该财产的所有权或其他物权。善意取得制度旨在保护交易安全和善意第三人的利益，是物权法的重要制度。\n\n## 核心内容\n\n### 一、善意取得的构成要件\n\n**法律依据**：[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第311条|《民法典》第311条]]\n\n| 要件 | 具体内容 | 证明责任 |\n|------|----------|----------|\n| 无权处分 | 处分人没有处分权 | 主张善意取得者证明 |\n| 善意 | 受让人不知道且不应当知道处分人无权处分 | 推定善意，由真实权利人举证反驳 |\n| 合理价格 | 以合理的价格转让 | 主张善意取得者证明 |\n| 已完成公示 | 不动产已登记，动产已交付 | 主张善意取得者证明 |\n\n### 二、不动产善意取得\n\n**特殊规则**：\n\n1. **登记簿的公信力**：不动产登记簿具有公信力，受让人基于对登记簿的信赖而取得的物权受法律保护\n2. **善意的判断标准**：受让人不知道登记簿上存在异议登记或预告登记\n3. **合理价格的认定**：应参照市场价格，明显低于市场价格的不构成合理价格\n\n**排除情形**：\n\n| 排除情形 | 法律依据 | 典型案例 |\n|----------|----------|----------|\n| 转让合同无效或被撤销 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第311条|《民法典》第311条]]第1款 | 合同违反强制性规定 |\n| 受让人知道登记簿错误 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第311条|《民法典》第311条]]第1款 | 受让人与处分人恶意串通 |\n| 存在异议登记 | 《物权法解释一》第16条 | 真实权利人已申请异议登记 |\n| 存在预告登记 | 《物权法解释一》第16条 | 预告登记权利人未同意 |\n\n### 三、动产善意取得\n\n**特殊规则**：\n\n1. **交付的公信力**：动产以占有为公示方式，受让人基于对占有的信赖而取得的物权受法律保护\n2. **善意的判断标准**：受让人不知道且不应当知道处分人无权处分\n3. **排除情形**：占有脱离物（盗赃、遗失物等）原则上不适用善意取得\n\n**占有脱离物的特殊规则**：\n\n| 物品类型 | 善意取得适用 | 法律依据 |\n|----------|--------------|----------|\n| 盗赃 | 原则上不适用 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第312条|《民法典》第312条]] |\n| 遗失物 | 原则上不适用 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第312条|《民法典》第312条]] |\n| 漂流物 | 原则上不适用 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第312条|《民法典》第312条]] |\n| 埋藏物 | 原则上不适用 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第312条|《民法典》第312条]] |\n\n**例外**：如果受让人是通过拍卖或者向具有经营资格的经营者购得该遗失物的，权利人请求返还原物时应当支付受让人所付的费用。\n\n### 四、善意取得的法律效果\n\n**1. 物权变动**：\n\n- 受让人取得物权\n- 原权利人丧失物权\n- 物权变动自交付或登记时生效\n\n**2. 原权利人的救济**：\n\n- 向无权处分人请求损害赔偿\n- 请求返还不当得利\n- 构成犯罪的，依法追究刑事责任\n\n**3. 善意取得与合同效力**：\n\n- 善意取得是原始取得，不以合同有效为前提\n- 但转让合同无效或被撤销的，不适用善意取得\n\n## 裁判规则\n\n| 序号 | 裁判规则 | 典型案例 |\n|------|----------|----------|\n| 1 | 不动产善意取得以登记簿的公信力为基础 | — |\n| 2 | 善意的判断时点为物权变动时 | — |\n| 3 | 合理价格应参照市场价格判断 | — |\n| 4 | 占有脱离物原则上不适用善意取得 | — |\n| 5 | 善意取得是原始取得，不以合同有效为前提 | — |\n\n## 实务要点\n\n1. **不动产交易的尽职调查**：购买不动产时，应核实登记簿记载与实际状况是否一致，是否存在异议登记或预告登记\n2. **动产交易的尽职调查**：购买贵重动产时，应核实出让人是否为真实权利人，交易价格是否合理\n3. **证据保留**：保留交易合同、付款凭证、交付凭证等证据，以"},{"id":"物权保护","title":"物权保护","excerpt":"物权保护是指物权人在其物权受到侵害时，依法请求保护的权利。物权保护制度是物权法的重要组成部分，为物权人提供了多种救济途径。在实务中，物权保护之诉是物权纠纷案件的主要类型之一。 法律依据 ：《民法典》第233条至第239条 保护方式 法律依据 适用情形 请求权基础 返还原物 《民法典》第235条 无权占有 所有权、用益物权 排除妨害 《民法典》第236条 妨害物权 所有权、用益物权 消除危险 《民法","slug":"物权保护","module":"02-物权法","moduleName":"物权法","tags":["民法","物权法","物权保护","返还原物","排除妨害"],"wordCount":2960,"created":"2026-05-28","updated":"2026-06-04","content":"# 物权保护\n\n## 概述\n\n物权保护是指物权人在其物权受到侵害时，依法请求保护的权利。物权保护制度是物权法的重要组成部分，为物权人提供了多种救济途径。在实务中，物权保护之诉是物权纠纷案件的主要类型之一。\n\n## 核心内容\n\n### 一、物权保护的方式\n\n**法律依据**：[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第233条|《民法典》第233条]]至[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第239条|第239条]]\n\n| 保护方式 | 法律依据 | 适用情形 | 请求权基础 |\n|----------|----------|----------|------------|\n| 返还原物 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第235条|《民法典》第235条]] | 无权占有 | 所有权、用益物权 |\n| 排除妨害 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第236条|《民法典》第236条]] | 妨害物权 | 所有权、用益物权 |\n| 消除危险 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第236条|《民法典》第236条]] | 可能妨害 | 所有权、用益物权 |\n| 恢复原状 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第237条|《民法典》第237条]] | 物权受侵害 | 所有权 |\n| 损害赔偿 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第238条|《民法典》第238条]] | 造成损失 | 所有权 |\n| 确认权利 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第234条|《民法典》第234条]] | 归属争议 | 所有权 |\n\n### 二、返还原物请求权\n\n**法律依据**：[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第235条|《民法典》第235条]]\n\n**条文内容**：无权占有不动产或者动产的，权利人可以请求返还原物。\n\n**构成要件**：\n\n| 要件 | 具体内容 | 证明责任 |\n|------|----------|----------|\n| 请求权人 | 物权人（所有权人、用益物权人） | 原告证明 |\n| 相对人 | 现时的无权占有人 | 原告证明 |\n| 无权占有 | 没有法律根据或合同约定 | 推定无权，被告证明有权 |\n\n**排除情形**：\n\n| 排除情形 | 法律依据 | 典型案例 |\n|----------|----------|----------|\n| 有权占有 | 合同约定、法律规定 | 租赁、借用 |\n| 善意取得 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第311条|《民法典》第311条]] | 第三人善意取得 |\n| 诉讼时效 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第188条|《民法典》第188条]] | 超过诉讼时效 |\n\n**实务要点**：\n\n- 返还原物请求权不适用诉讼时效\n- 请求返还原物的同时，可以请求返还孳息\n- 原物灭失的，不能请求返还原物，但可以请求损害赔偿\n\n### 三、排除妨害请求权\n\n**法律依据**：[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第236条|《民法典》第236条]]\n\n**条文内容**：妨害物权或者可能妨害物权的，权利人可以请求排除妨害或者消除危险。\n\n**构成要件**：\n\n| 要件 | 具体内容 | 证明责任 |\n|------|----------|----------|\n| 请求权人 | 物权人 | 原告证明 |\n| 妨害行为 | 对物权的妨害 | 原告证明 |\n| 妨害状态 | 妨害持续存在 | 原告证明 |\n\n**妨害类型**：\n\n| 妨害类型 | 具体情形 | 典型案例 |\n|----------|----------|----------|\n| 事实妨害 | 堆放杂物、排放噪音 | 相邻关系纠纷 |\n| 法律妨害 | 无权设置权利负担 | 抵押权纠纷 |\n| 妨害危险 | 可能发生的妨害 | 消除危险之诉 |\n\n### 四、消除危险请求权\n\n**法律依据**：[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第236条|《民法典》第236条]]\n\n**构成要件**：\n\n| 要件 | 具体内容 | 证明责任 |\n|------|----------|----------|\n| 请求权人 | 物权人 | 原告证明 |\n| 危险状态 | 可能发生妨害 | 原告证明 |\n| 危险紧迫性 | 危险即将发生 | 原告证明 |\n\n**实"},{"id":"物权变动规则","title":"物权变动规则","excerpt":"物权变动是指物权的设立、变更、转让和消灭。物权变动规则是物权法的核心内容，直接决定了物权归属和对抗效力。在实务中，物权变动规则的正确适用是处理不动产纠纷、动产纠纷的基础。 法律依据 ：《民法典》第209条、第214条 核心规则 ：不动产物权的设立、变更、转让和消灭，经依法登记，发生效力；未经登记，不发生效力，但法律另有规定的除外。 登记类型 ： 登记类型 法律效力 适用情形 法律依据 首次登记 确","slug":"物权变动规则","module":"02-物权法","moduleName":"物权法","tags":["民法","物权法","物权变动","登记","交付"],"wordCount":2890,"created":"2026-05-28","updated":"2026-06-04","content":"# 物权变动规则\n\n## 概述\n\n物权变动是指物权的设立、变更、转让和消灭。物权变动规则是物权法的核心内容，直接决定了物权归属和对抗效力。在实务中，物权变动规则的正确适用是处理不动产纠纷、动产纠纷的基础。\n\n## 核心内容\n\n### 一、不动产物权变动\n\n**法律依据**：[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第209条|《民法典》第209条]]、[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第214条|第214条]]\n\n**核心规则**：不动产物权的设立、变更、转让和消灭，经依法登记，发生效力；未经登记，不发生效力，但法律另有规定的除外。\n\n**登记类型**：\n\n| 登记类型 | 法律效力 | 适用情形 | 法律依据 |\n|----------|----------|----------|----------|\n| 首次登记 | 确认物权 | 新建房屋、初始确权 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第209条|《民法典》第209条]] |\n| 变更登记 | 物权变更 | 权利人姓名/名称变更 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第211条|《民法典》第211条]] |\n| 转移登记 | 物权转让 | 买卖、赠与、继承 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第209条|《民法典》第209条]] |\n| 注销登记 | 物权消灭 | 房屋灭失、征收 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第214条|《民法典》第214条]] |\n| 预告登记 | 保全请求权 | 预售商品房 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第221条|《民法典》第221条]] |\n| 异议登记 | 临时保护 | 登记错误争议 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第220条|《民法典》第220条]] |\n| 更正登记 | 纠正错误 | 登记簿记载错误 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第220条|《民法典》第220条]] |\n\n**裁判规则**：\n\n1. **登记生效主义**：不动产物权变动以登记为生效要件，未登记不发生物权变动效力\n2. **登记对抗主义**：土地承包经营权、地役权等采登记对抗主义，未登记不得对抗善意第三人\n3. **预告登记效力**：预告登记后，未经预告登记的权利人同意，处分该不动产的，不发生物权效力\n\n**实务要点**：\n\n- 不动产登记簿是物权归属和内容的根据，具有推定效力\n- 不动产权属证书是权利人享有该不动产物权的证明，但不具有绝对效力\n- 登记错误造成损害的，登记机构应当承担赔偿责任\n\n### 二、动产物权变动\n\n**法律依据**：[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第224条|《民法典》第224条]]、[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第226条|第226条]]、[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第227条|第227条]]、[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第228条|第228条]]\n\n**核心规则**：动产物权的设立和转让，自交付时发生效力，但法律另有规定的除外。\n\n**交付类型**：\n\n| 交付类型 | 法律效力 | 适用情形 | 法律依据 |\n|----------|----------|----------|----------|\n| 现实交付 | 物权转移 | 直接转移占有 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第224条|《民法典》第224条]] |\n| 简易交付 | 物权转移 | 受让人已占有动产 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第226条|《民法典》第226条]] |\n| 指示交付 | 物权转移 | 第三人占有动产 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第227条|《民法典》第227条]] |\n| 占有改定 | 物权转移 | 出让人继续占有 | [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第228条|《民法典》第228条]] |\n\n**裁判规则**：\n\n1. **现实交付**：动产物权的设立和转让，自交付时发生效力\n2. **简易交付**：动产物权设立和转让前，权利人已经占有该动产的，物权自民事法律行为生效时发生效力\n3. **指示交付**：动产物权设立和转让前，第三人占有该动产的，负有交付义务的人可以通过转让请求第三人返还原"},{"id":"物权确认请求权","title":"物权确认请求权","excerpt":"物权确认请求权是指物权人对物权归属或内容有争议时，请求人民法院确认其物权的权利。物权确认请求
