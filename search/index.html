务。如公司无法举证证明存在不正当目的，股东有权查阅包括原始凭证和记账凭证在内的会计账簿。股东知情权是股东的固有权利，公司章程对股东知情权作出扩大化规定的，可以作为股东行使知情权的依据。\r\n\r\n**案情简介**：美国阿某斯公司系河北阿某斯公司的股东，要求查阅公司自成立以来的全部会计账簿及原始凭证、记账凭证等。河北阿某斯公司以股东查阅具有不正当目的为由拒绝提供查阅。股东遂诉至法院。\r\n\r\n**裁判理由**：\r\n> [!tip] 本院认为（基于公开裁判文书整理）\r\n> 股东知情权是公司法赋予股东了解公司经营状态、财务状况等重要信息的一项法定权利，是股东行使其他权利的基础和前提。公司法关于股东查阅公司会计账簿的规定，旨在保障股东对公司经营状况的知情权，使股东能够有效参与公司治理和监督。\r\n>\r\n> 关于\"不正当目的\"的举证责任。根据《公司法》的规定，公司有合理根据认为股东查阅会计账簿有不正当目的，可能损害公司合法利益的，可以拒绝提供查阅，但公司应当自股东提出书面请求之日起十五日内书面答复股东并说明理由。\"不正当目的\"的证明责任由公司承担，公司仅以股东可能损害公司利益为由拒绝查阅，但未能提供充分证据证明股东查阅会计账簿存在不正当目的的，人民法院不予支持。\r\n>\r\n> 本案中，河北阿某斯公司未能举证证明美国阿某斯公司查阅会计账簿具有不正当目的，其拒绝查阅缺乏事实和法律依据。股东有权查阅公司会计账簿及相关的原始凭证和记账凭证。\r\n\r\n**实务要点**：\r\n1. 股东知情权是固有权利，不得通过公司章程限制或剥夺\r\n2. \"不正当目的\"的举证责任由公司承担，公司不能仅凭推测或怀疑拒绝查阅\r\n3. 会计账簿的查阅范围包括原始凭证和记账凭证（新《公司法》第57条已将会计凭证明确纳入）\r\n4. 律师代理知情权案件应指导当事人以书面形式提出查阅请求并明确说明目的\r\n\r\n**案例分析**：本案是最高人民法院再审案例，确立了股东知情权保护的基本规则。公司拒绝股东查阅会计账簿的，必须举证证明股东存在\"不正当目的\"，且该证明标准较高。新《公司法》第57条进一步扩大了查阅范围，增加了会计凭证和子公司材料的查阅权，对股东知情权的保护力度显著增强。\r\n\r\n---\r\n\r\n### 案例2：实质性竞争关系的认定标准\r\n\r\n**案号**：（2020）京02民终816号（入库编号：2023-08-2-267-002）\r\n**来源**：[北京市第二中级人民法院·人民法院案例库](https://rmfyalk.court.gov.cn/view/content.html?id=QcDKFUb5C%252BwLJ17OxwKCuRQGNsmwNu%252FNU1kMCRfaLxY%253D&lib=ck&qw=2020%EF%BC%89%E4%BA%AC02%E6%B0%91%E7%BB%88816%E5%8F%B7)\r\n**裁判要旨**：股东知情权"},{"id":"案例-合同效力系列","title":"案例-合同效力系列","excerpt":"合同效力认定是民商事审判的核心问题，直接关系到当事人的权利义务能否得到法律保护。本系列收录最高人民法院关于合同效力认定的指导案例及公报案例，涵盖以下关键法律问题：合同成立与生效的区分、效力性强制性规定的识别标准、流质契约与以物抵债的界限、非典型担保（让与担保）的效力认定、以及公司对外担保的效力判断。这些案例体现了最高院在合同效力认定上的裁判思路演变，对律师处理合同纠纷具有重要的参考价值。 案号 ：","slug":"案例-合同效力系列","module":"06-案例库","moduleName":"案例库","tags":["民法","案例","合同效力","最高院指导案例"],"wordCount":5882,"created":"2026-05-28","updated":"2026-06-03","content":"# 合同效力系列案例\n\n## 概述\n合同效力认定是民商事审判的核心问题，直接关系到当事人的权利义务能否得到法律保护。本系列收录最高人民法院关于合同效力认定的指导案例及公报案例，涵盖以下关键法律问题：合同成立与生效的区分、效力性强制性规定的识别标准、流质契约与以物抵债的界限、非典型担保（让与担保）的效力认定、以及公司对外担保的效力判断。这些案例体现了最高院在合同效力认定上的裁判思路演变，对律师处理合同纠纷具有重要的参考价值。\n\n## 案例列表\n\n### 案例一：汤龙、刘新龙、马忠太、王洪刚诉新疆鄂尔多斯彦海房地产开发有限公司商品房买卖合同纠纷案\n\n**案号**：（2015）民一终字第180号（指导案例72号）\n\n**来源**：[最高人民法院指导案例第72号](https://www.court.gov.cn/shenpan/xiangqing/34292.html)（2016年12月28日发布）\n\n**裁判要旨**：借款合同双方当事人经协商一致，终止借款合同关系，建立商品房买卖合同关系，将双方经结算确认的借款本息转为已付购房款的，不属于《物权法》第一百八十六条规定禁止的情形，该商品房买卖合同有效。\n\n**案情简介**：汤龙等四人与彦海公司之间存在多笔借款关系，通过实际出借并接受他人债权转让，取得对彦海公司合计2.6亿元借款的债权。\n\n借款到期后，因彦海公司未偿还借款本息，双方经对账确认尚欠借款本息361,398,017.78元，随后重新签订商品房买卖合同，将欠款本息转为已付购房款。后彦海公司主张该合同系流质契约应属无效。\n\n**裁判理由**：\n> [!tip] 本院认为（最高人民法院（2015）民一终字第180号民事判决）\n> 本案争议的商品房买卖合同签订前，彦海公司与汤龙等四人之间确实存在借款合同关系，且为履行借款合同，双方签订了相应的商品房预售合同，并办理了预购商品房预告登记。\n>\n> 但双方系争商品房买卖合同是在彦海公司未偿还借款本息的情况下，经重新协商并对账，将借款合同关系转变为商品房买卖合同关系，将借款本息转为已付购房款，并对房屋交付、尾款支付、违约责任等权利义务作出了约定。民事法律关系的产生、变更、消灭，除基于法律特别规定，需要通过法律关系参与主体的意思表示一致形成。民事交易活动中，当事人意思表示发生变化并不鲜见，该意思表示的变化，除为法律特别规定所禁止外，均应予以准许。\n>\n> 本案双方经协商一致终止借款合同关系，建立商品房买卖合同关系，并非为双方之间的借款合同履行提供担保，而是借款合同到期彦海公司难以清偿债务时，通过将彦海公司所有的商品房出售给汤龙等四位债权人的方式，实现双方权利义务平衡的一种交易安排。该交易安排并未违反法律、行政法规的强制性规定，不属于《中华人民共和国物权法》第一百八十六条规定禁止的情形，亦不适用《最高人民法院关于审理民间借贷案件适用法律若干问题的规定》第二十四条规定。尊重当事人嗣后形成的变更法律关系性质的一致意思表示，是贯彻合同自由原则的题中应有之意。\n>\n> 但在确认商品房买卖合同合法有效的情况下，由于双方当事人均认可该合同项下已付购房款系由原借款本息转来，且彦海公司提出该欠款数额包含高额利息。在当事人请求司法确认和保护购房者合同权利时，人民法院对基于借款合同的实际履行而形成的借款本金及利息数额应当予以审查，以避免当事人通过签订商品房买卖合同等方式，将违法高息合法化。\n>\n> 经审查，双方之间借款利息的计算方法，已经超出法律规定的民间借贷利率保护上限。对双方当事人包含高额利息的欠款数额，依法不能予以确认。\n\n**实务要点**：\n\n1. 区分流质契约与以物抵债的关键在于是否为当事人真实意思表示\n2. 借款合同终止后另行签订的商品房买卖合同，应审查是否损害其他债权人利益\n3. 律师代理此类案件应注意审查结算过程的公平性\n\n**案例分析**：本案与朱俊芳案（案例三）共同构成了最高院对\"以物抵债\"及非典型担保效力认定的裁判逻辑。汤龙案强调的是借款关系终止后的\"协商转化\"，而朱俊芳案则肯定了\"让与担保\"的效力——两者均体现了最高院在不违反效力性强制规定的前提下尊重意思自治的裁判倾向。\n\n本案作为指导案例72号发布，具有正式的参照适用效力，律师在处理债务转化类案件时应首先援引本案规则。实务中，律师应注意保留双方协商结算的书面证据，以证明转化行为的自愿性和公平性。\n\n---\n\n### 案例二：四川金核矿业有限公司与新疆临钢资源投资股份有限公司特殊区域合作勘查合同纠纷案\n\n**案号**：（2015）民二终字第167号（二审改判一审合同有效判决，认定合同无效）\n\n**来源**：[最高人民法院公报](http://gongbao.court.gov.cn/Details/191e1a4eb1fec4f7c381"},{"id":"案例-合同编通则司法解释","title":"案例-合同编通则司法解释","excerpt":"《最高人民法院关于适用〈中华人民共和国民法典〉合同编通则若干问题的解释》（法释〔2023〕13号）于2023年12月5日起施行，是最高人民法院为统一合同编通则相关法律适用而制定的重要司法解释。该解释共69条，涵盖合同的订立、效力、履行、保全、变更和转让、权利义务终止及违约责任等方面，针对司法实践中的疑难问题提供了具有操作性的裁判规则。 本专题案例围绕该司法解释的核心制度，选取十个真实案例，分别涉及","slug":"案例-合同编通则司法解释","module":"06-案例库","moduleName":"案例库","tags":["民法","案例","合同编通则","合同编通则司法解释","专题案例"],"wordCount":10634,"created":"2026-05-28","updated":"2026-06-04","content":"# [[⚖️ 民法实务知识库/08-法规全文/合同编通则司法解释|合同编通则司法解释]]专题案例\n\n## 概述\n\n[[⚖️ 民法实务知识库/08-法规全文/合同编通则司法解释|《最高人民法院关于适用〈中华人民共和国民法典〉合同编通则若干问题的解释》]]（法释〔2023〕13号）于2023年12月5日起施行，是最高人民法院为统一合同编通则相关法律适用而制定的重要司法解释。该解释共69条，涵盖合同的订立、效力、履行、保全、变更和转让、权利义务终止及违约责任等方面，针对司法实践中的疑难问题提供了具有操作性的裁判规则。\n\n本专题案例围绕该司法解释的核心制度，选取十个真实案例，分别涉及招投标合同成立时点、格式条款效力认定、情势变更制度、预约合同与本约合同的区分、债权人代位权中的仲裁条款效力、债权人撤销权的行使、合同解除权的审查、抵销顺序、可得利益损失计算以及减损义务等重要问题，以期为法律实务工作者提供参考。\n\n> 📖 本专题案例来源于[最高人民法院发布民法典合同编通则司法解释相关典型案例](https://www.court.gov.cn/zixun/xiangqing/419392.html)（2023年12月5日发布），部分案例另选自最高人民法院指导案例及公报案例。\n\n## 案例列表\n\n### 案例一：招投标合同成立时点——某物业管理有限公司与某研究所房屋租赁合同纠纷案\n\n**案号**：最高人民法院发布合同编通则司法解释相关典型案例（案例一）\n\n**来源**：[最高人民法院发布民法典合同编通则司法解释相关典型案例](https://www.court.gov.cn/zixun/xiangqing/419392.html)（案例一）\n\n**裁判要旨**：招投标程序中，中标通知书送达后，一方当事人不履行订立书面合同的义务，相对方请求确认合同自中标通知书到达中标人时成立的，人民法院应予支持。\n\n**案情简介**：\n2021年7月8日，某研究所委托招标公司就案涉宿舍项目公开发出投标邀请。2021年7月28日，某物业管理有限公司向招标公司发出《投标文件》，表示对招标文件无任何异议。2021年8月1日，招标公司向物业管理公司送达中标通知书，确定其为中标人。2021年8月11日，研究所向物业管理公司致函，要求解除中标关系，后续合同不再签订。物业管理公司主张中标通知书送达后双方租赁合同法律关系已成立，研究所应承担违约损失。研究所辩称双方未签订正式书面租赁合同，仅成立预约合同关系。\n\n**裁判理由**：\n\n> [!tip] 本院认为（基于最高人民法院发布典型案例整理）\n> 从合同法律关系成立角度，招投标程序中的招标行为应为要约邀请，投标行为应为要约，经评标后招标人向特定投标人发送中标通知书的行为应为承诺，中标通知书送达投标人后承诺生效，合同成立。《招标投标法》第46条第1款规定中标通知书发出后签订的书面合同必须按照招投标文件订立，故中标通知书到达投标人时双方已就租赁合同内容达成合意。该合意与预约合意存在区别，应认为租赁合同在中标通知书送达时成立。中标通知书送达后签订的书面合同为法律要求的书面确认形式，而非新的合同。\n\n**实务要点**：\n1. 招投标合同自中标通知书到达中标人时成立，中标通知书的法律性质为承诺\n2. 中标后签订的书面合同系对已成立合同的确认形式，而非新的要约和承诺\n3. 招标人拒绝签订书面合同的，不影响合同已成立的事实，应承担违约责任\n\n**案例分析**：\n本案明确了招投标合同的成立时点，对应[[⚖️ 民法实务知识库/08-法规全文/合同编通则司法解释#第4条|合同编通则司法解释第4条]]。实务中，中标通知书送达后招标人反悔的情况时有发生，本案确立的裁判规则为中标人提供了明确的权利保护路径。建议中标人在收到中标通知书后，及时固定送达证据，以便后续维权。\n\n---\n\n### 案例二：格式条款效力认定——指导案例64号\n\n**案号**：（2011）徐商初字第0156号（指导案例第64号）\n\n**来源**：[最高人民法院指导案例第64号](http://www.hubeiqianshun.com/view/115.html)\n\n**裁判要旨**：经营者在格式合同中未明确规定对某项商品或服务的限制使用条件，且未尽告知义务的，该格式条款对消费者不发生效力。\n\n**案情简介**：\n刘超捷在中国移动通信集团江苏有限公司徐州分公司（以下简称\"徐州移动\"）处办理了手机卡业务。徐州移动在格式合同中设置了话费有效期限制，即预付话费到期后将单方面停机。刘超捷在使用过程中，因话费有效期届满，徐州移动对其手机号码进行了停机处理。刘超捷认为，徐州移动在签订合同时未就话费有效期限制条款向其作出明确提示和说明，该格式条款不应对其发生效力，遂诉至法院，请求确认该格式条"},{"id":"案例-担保制度司法解释","title":"案例-担保制度司法解释","excerpt":"本专题收录与《最高人民法院关于适用〈中华人民共和国民法典〉有关担保制度的解释》（法释〔2020〕28号）相关的典型案例。该司法解释于2020年12月31日公布，2021年1月1日施行，是民法典担保制度的重要配套规则，涵盖独立保函效力、让与担保、担保人追偿权、抵押权行使期间等核心问题，对于统一裁判尺度、规范担保实务具有重要指导意义。 案号 ：（2017）最高法民再134号 来源 ： 最高人民法院指导","slug":"案例-担保制度司法解释","module":"06-案例库","moduleName":"案例库","tags":["民法","案例","担保制度","担保制度司法解释","最高院指导案例","执行异议之诉"],"wordCount":8033,"created":"2026-05-28","updated":"2026-05-28","content":"# [[⚖️ 民法实务知识库/08-法规全文/担保制度司法解释|担保制度司法解释]]专题案例\n\n## 概述\n\n本专题收录与《最高人民法院关于适用〈中华人民共和国民法典〉有关担保制度的解释》（法释〔2020〕28号）相关的典型案例。该司法解释于2020年12月31日公布，2021年1月1日施行，是民法典担保制度的重要配套规则，涵盖独立保函效力、让与担保、担保人追偿权、抵押权行使期间等核心问题，对于统一裁判尺度、规范担保实务具有重要指导意义。\n\n## 案例列表\n\n### 案例一：保函欺诈纠纷——指导案例109号\n\n**案号**：（2017）最高法民再134号\n**来源**：[最高人民法院指导案例第109号](https://www.court.gov.cn/shenpan/xiangqing/143392.html)\n**发布日期**：2019年2月25日（最高人民法院审判委员会讨论通过）\n**关键词**：民事 / 保函欺诈 / 基础交易审查 / 有限及必要原则 / 独立反担保函\n**相关法条**：《中华人民共和国涉外民事关系法律适用法》第8条、第44条\n\n**裁判要旨**：\n\n1. 认定构成独立保函欺诈需对基础交易进行审查时，应坚持有限及必要原则，审查范围应限于受益人是否明知基础合同的相对人并不存在基础合同项下的违约事实，以及是否存在受益人明知自己没有付款请求权的事实。\n2. 受益人在基础合同项下的违约情形，并不影响其按照独立保函的规定提交单据并进行索款的权利。\n3. 认定独立反担保函项下是否存在欺诈时，即使独立保函存在欺诈情形，独立保函项下已经善意付款的，人民法院亦不得裁定止付独立反担保函项下款项。\n\n**案情简介**：\n\n安徽省外经建设（集团）有限公司（以下简称外经公司）在哥斯达黎加承建项目，通过建行安徽省分行向哥斯达黎加银行开立见索即付独立反担保函，由哥斯达黎加银行向受益人东方置业房地产有限公司转开履约保函。工程竣工后，东方置业公司以工程质量问题为由要求兑付保函，哥斯达黎加银行依约付款后向建行安徽省分行主张反担保函项下款项。外经公司以保函欺诈为由提起诉讼，请求止付独立反担保函项下款项。\n\n**裁判理由**：\n\n> [!tip] 最高人民法院再审认为（基于指导案例109号原文整理）\n>\n> **一、保函欺诈的审查原则**\n>\n> 独立保函独立于委托人和受益人之间的基础交易，出具独立保函的银行只负责审查受益人提交的单据是否符合保函条款的规定并有权自行决定是否付款，担保行的付款义务不受委托人与受益人之间基础交易项下抗辩权的影响。认定构成独立保函欺诈需对基础交易进行审查时，应坚持有限及必要原则。\n>\n> **二、受益人违约与欺诈的关系**\n>\n> 受益人东方置业公司作为受益人，在提交证明存在工程质量问题的初步证据时，即使未启动任何诸如诉讼或者仲裁等争议解决程序并经上述程序确认相对方违约，都不影响其保函权利的实现。即使生效判决或者仲裁裁决认定受益人构成基础合同项下的违约，该违约事实的存在亦不必然成为构成保函\"欺诈\"的充分必要条件。\n>\n> **三、独立反担保函的善意付款保护**\n>\n> 即使存在受益人在独立保函项下的欺诈性索款情形，亦不能推定担保行在独立反担保函项下构成欺诈性索款。只有担保行明知受益人系欺诈性索款且违反诚实信用原则付款，并向反担保行主张独立反担保函项下款项时，才能认定担保行构成独立反担保函项下的欺诈性索款。外经公司未能举证证明哥斯达黎加银行存在上述欺诈情形，其主张止付独立反担保函项下款项没有事实依据。\n\n**实务要点**：\n\n1. 独立保函欺诈的认定标准：基础交易审查坚持有限及必要原则，审查范围限于受益人是否明知无违约事实或明知无付款请求权\n2. 受益人在基础合同项下的违约不等于保函欺诈——二者属于不同法律关系\n3. 独立反担保函的善意付款保护：独立保函项下已善意付款的，不得止付独立反担保函\n4. 担保的从属性规则在独立保函领域存在例外，独立保函\"见索即付\"的制度价值应予保护\n\n**案例分析**：\n\n本案确立了独立保函欺诈认定的核心规则。最高人民法院通过对保函欺诈的有限审查原则、受益人违约与欺诈的区分、以及独立反担保函善意付款保护三重论证，保护了独立保函\"见索即付\"的制度价值。本案对于国际贸易和\"一带一路\"建设中的保函业务具有重要指导意义。\n\n---\n\n### 案例二：让与担保效力认定——朱俊芳案\n\n**案号**：（2011）民提字第344号\n**来源**：[《最高人民法院公报》2014年第12期](http://gongbao.court.gov.cn/Details/7b27f199298eeea61c6bd5dd8a9617.html)\n**裁判要旨**：当事人以签订商品房买卖合同的方式为民间借贷提供担保，属于"},{"id":"案例-民间借贷系列","title":"案例-民间借贷系列","excerpt":"民间借贷纠纷是基层法院受理数量最多的民商事案件类型之一。本系列收录最高人民法院审理或发布的民间借贷典型案例和公报案例，涵盖职业放贷人认定、虚假诉讼识别、夫妻共同债务认定、企业间借贷效力等热点问题，为律师处理民间借贷纠纷提供实务参考。 本系列案例均来源于最高人民法院裁判文书或官方典型案例发布，裁判规则和法律分析基于现行法律规定和司法实践。 来源 ： 最高人民法院发布打击通过虚假诉讼逃废债典型民事案例","slug":"案例-民间借贷系列","module":"06-案例库","moduleName":"案例库","tags":["民法","案例","民间借贷","省高院典型案例"],"wordCount":6030,"created":"2026-05-28","updated":"2026-06-03","content":"# 民间借贷系列案例\n\n## 概述\n民间借贷纠纷是基层法院受理数量最多的民商事案件类型之一。本系列收录最高人民法院审理或发布的民间借贷典型案例和公报案例，涵盖职业放贷人认定、虚假诉讼识别、夫妻共同债务认定、企业间借贷效力等热点问题，为律师处理民间借贷纠纷提供实务参考。\n\n本系列案例均来源于最高人民法院裁判文书或官方典型案例发布，裁判规则和法律分析基于现行法律规定和司法实践。\n\n---\n\n## 案例列表\n\n### 案例一：大连高金投资有限公司诉中国工商银行股份有限公司大连星海支行等企业借贷纠纷案——职业放贷行为效力认定\n\n**来源**：最高人民法院（2017）最高法民终647号民事判决（参见[最高人民检察院：对\"职业放贷人\"审查认定的三个关键点](https://www.spp.gov.cn/spp/llyj/202308/t20230830_626682.shtml)引用）\n\n**裁判要旨**：出借人通过向社会不特定对象提供资金以赚取高额利息，出借行为具有反复性、经常性，借款目的具有营业性，未经批准擅自从事经常性的贷款业务，属于从事非法金融业务活动，其签订的民间借贷合同因违反法律强制性规定而无效。\n\n**案情简介**：大连高金投资有限公司（以下简称高金公司）与多家企业及个人之间存在大量资金往来，通过向社会不特定对象提供资金以赚取高额利息。高金公司的出借行为具有反复性、经常性，借款目的具有营业性。相关借款人抗辩称高金公司构成职业放贷人，其签订的借贷合同应认定为无效。\n\n**裁判理由**：\n> [!tip] 本院认为\n> 根据《最高人民法院关于审理民间借贷案件适用法律若干问题的规定》第十三条之规定，未依法取得放贷资格的出借人，以营利为目的向社会不特定对象提供借款的，人民法院应当认定民间借贷合同无效。高金公司通过向社会不特定对象提供资金以赚取高额利息，出借行为具有反复性、经常性，借款目的也具有营业性，未经批准，擅自从事经常性的贷款业务，属于从事非法金融业务活动。\n>\n> 高金公司未经金融监管部门批准，擅自从事经常性放贷业务，违反了《中华人民共和国银行业监督管理法》第十九条关于\"未经国务院银行业监督管理机构批准，任何单位或者个人不得设立银行业金融机构或者从事银行业金融机构的业务活动\"之规定，其与借款人签订的民间借贷合同应认定为无效。合同无效后，借款人应返还借款本金，但高金公司主张的利息不予保护。\n\n**实务要点**：\n（1）职业放贷人的认定需同时满足四个要件：未经批准、以营利为目的、向社会不特定对象出借、出借行为具有反复性和经常性；\n（2）各省高院普遍以\"一定期限内（如2年或3年）向不特定多人出借资金5次以上\"作为职业放贷人的参考认定标准；\n（3）法院可依职权检索出借人的关联案件记录，查明其是否构成职业放贷人；\n（4）合同无效后，借款人仅需返还本金，约定利息不予保护，法院可酌情按LPR标准支持资金占用费。\n\n**案例分析**：\n本案是最高人民法院认定职业放贷行为效力的标志性裁判。法院通过审查出借人的出借频率、对象特征和营利目的，准确认定了职业放贷人的身份。该案明确了职业放贷行为违反银行业监督管理法的效力性强制规定，借贷合同应认定无效。律师在实务中应注意：一是代理借款人时可申请法院依职权检索出借人的关联案件；二是职业放贷人合同无效后仅保护本金，约定利息不受保护；三是各省高院出台的\"职业放贷人名录\"制度可作为重要参考。\n\n---\n\n### 案例二：王某科诉冯某军民间借贷纠纷案——恶意串通虚构债务的虚假诉讼\n\n**来源**：[最高人民法院发布打击通过虚假诉讼逃废债典型民事案例](https://www.court.gov.cn/zixun/xiangqing/447141.html)（案例3）\n\n**裁判要旨**：当事人恶意串通，伪造银行流水和借条，虚构民间借贷债权债务关系，通过诉讼和调解方式帮助一方逃避债务的，属于虚假民间借贷诉讼。人民法院应撤销原调解书，驳回虚假诉讼请求，并依法予以罚款、拘留。\n\n**案情简介**：冯某军因房屋装修等原因欠多笔外债即将到期，除工资之外没有其他收入。2022年7月，冯某军因欠他人的债务即将到期，担心债权人起诉后法院冻结、扣划其工资，便与亲戚王某科通谋，虚构冯某军向王某科借款30万元的事实。冯某军持王某科名下的银行卡，自行通过银行转账、取现、存款的方式，制造王某科向冯某军出借30万元的银行流水。同时，冯某军向王某科出具借款金额为30万元的虚假借条，由王某科持相关证据提起诉讼，请求判令冯某军偿还王某科借款本金30万元。诉前调解中，王某科、冯某军达成虚假的还款协议，致使人民法院根据调解协议作出民事调解书。检察机关在办案过程中，将涉嫌虚假诉讼的线索移送审理法院。审理法院依法启动审判监督程序，对本案进行再审。\n\n**"},{"id":"案例-让与担保效力","title":"案例-让与担保效力","excerpt":"让与担保是指债务人或第三人为担保债务履行，将标的物所有权转移于债权人，债务清偿后标的物返还，债务不履行时债权人就标的物优先受偿的非典型担保。《民法典》虽未明文规定让与担保，但最高人民法院通过司法解释和裁判实践已确立其效力规则。本文梳理让与担保的核心法律问题及典型裁判规则。 《最高人民法院关于适用〈中华人民共和国民法典〉有关担保制度的解释》（法释〔2020〕28号）第68条：当事人已经完成财产权利变","slug":"案例-让与担保效力","module":"06-案例库","moduleName":"案例库","tags":["民法","担保法","让与担保","股权担保","流押条款"],"wordCount":3854,"created":"2026-05-28","updated":"2026-05-28","content":"# 案例-让与担保效力\n\n## 概述\n\n让与担保是指债务人或第三人为担保债务履行，将标的物所有权转移于债权人，债务清偿后标的物返还，债务不履行时债权人就标的物优先受偿的非典型担保。《民法典》虽未明文规定让与担保，但最高人民法院通过司法解释和裁判实践已确立其效力规则。本文梳理让与担保的核心法律问题及典型裁判规则。\n\n## 核心内容\n\n### 1. 让与担保的效力认定\n\n#### 1. 法律依据\n- 《最高人民法院关于适用〈中华人民共和国民法典〉有关担保制度的解释》（法释〔2020〕28号）[[⚖️ 民法实务知识库/08-法规全文/担保制度司法解释#第68条|第68条]]：当事人已经完成财产权利变动的公示，债务人不履行到期债务时，债权人请求就该财产优先受偿的，人民法院应予支持\n- 该条确认了让与担保的担保物权效力，但要求完成权利变动公示\n\n#### 2. 效力层次\n| 类型 | 效力 | 条件 |\n|------|------|------|\n| 已公示的让与担保 | 享有优先受偿权 | 完成过户登记/交付 |\n| 未公示的让与担保 | 不具有物权效力 | 仅签订合同未过户 |\n| 虚伪意思表示 | 合同无效 | 双方无真实转让意思 |\n\n### 2. 最高院裁判规则\n\n#### 案例1：让与担保合同效力\n\n**案号**：（2019）最高法民终133号\n**来源**：[最高人民法院公报](http://gongbao.court.gov.cn/Details/d3d313e4c1f8ec4efd14ed48bbe055.html)\n**裁判要旨**：让与担保合同本身并不因违反流押条款而无效。当事人约定将标的物转让给债权人以担保债务履行，该约定属于让与担保，不适用流押条款无效的规定。债权人不能直接取得标的物所有权，但可就标的物折价或拍卖、变卖所得价款优先受偿。\n\n**案情简介**：债务人与债权人签订协议，约定将名下不动产转让给债权人作为债务担保，债务清偿后返还。后债务人未按期还款，债权人诉请确认对标的物的优先受偿权。\n\n**裁判理由**：\n> [!tip] 本院认为（基于公开裁判文书整理）\n> \"本院认为，让与担保作为一种非典型担保方式，其核心特征在于通过转让标的物所有权的方式来担保债务的履行。当事人之间关于转让标的物所有权的约定，系双方真实意思表示，不违反法律、行政法规的强制性规定，应当认定为有效。虽然《物权法》第一百八十六条（现《民法典》第四百零一条）禁止流押条款，但让与担保与流押条款存在本质区别。流押条款是约定债务人不履行到期债务时抵押财产直接归债权人所有，而让与担保中债权人实现权利时仍需进行清算，就标的物价值超出债权部分返还债务人，不足部分债务人仍需清偿。因此，不能以违反流押条款为由否定让与担保合同的效力。本案中，债权人请求就标的物优先受偿，应予支持，但应依法进行清算。\"\n\n**实务要点**：让与担保合同效力独立于流押条款的禁止性规定，法院应审查当事人之间是否存在真实的担保合意。\n\n**案例分析**：本案确立了让与担保合同效力的基本规则，即让与担保不等于流押。关键在于区分\"所有权转移担保\"与\"到期直接取得所有权\"两种不同法律构造。该裁判为让与担保在实务中的广泛运用奠定了效力基础，此后大量案件均遵循此裁判逻辑。\n\n---\n\n#### 案例2：让与担保与流押条款的区分\n\n**案号**：（2020）最高法民申2192号\n**裁判要旨**：流押条款是指当事人在债务履行期届满前约定，债务人不履行到期债务时抵押财产归债权人所有。让与担保虽转移所有权，但债权人实现权利时仍需进行清算，多退少补，故不构成流押。\n\n**案情简介**：再审申请人主张涉案协议中的股权转让条款构成流押，应属无效。法院审查后认定该协议性质为让与担保，债权人实现权利时负有清算义务。\n\n**裁判理由**：\n> [!tip] 本院认为（基于公开裁判文书整理）\n> \"本院认为，判断当事人之间的约定是否构成流押条款，关键在于审查该约定是否排除了清算义务。流押条款的本质特征是债务人不履行到期债务时，债权人无需经过清算程序即可直接取得标的物所有权，从而可能损害债务人的利益。而让与担保的法律构造中，虽然标的物所有权在形式上已经转移至债权人名下，但当债务人不履行到期债务时，债权人并非直接取得所有权，而是应当对标的物进行清算，以标的物折价或者以拍卖、变卖所得价款清偿债务，超过债权数额的部分返还债务人，不足部分债务人继续清偿。本案中，涉案协议的约定并不排除清算义务，故不构成流押条款，申请人关于协议无效的主张不能成立。\"\n\n**实务要点**：区分让与担保与流押条款的核心标准是清算义务的存在与否。只要债权人实现权利时需经过清算程序，即不构成流押。\n\n**案例分析**：本案进一步明确了让与担保与"},{"id":"案例-违约金调整规则","title":"案例-违约金调整规则","excerpt":"违约金条款是合同中最常见的违约救济方式之一。当约定的违约金过高或过低时，当事人可以请求法院予以调整。《民法典》第585条和合同编通则司法解释第65条对违约金调整的条件、标准和程序作出了明确规定。本专题通过三个典型案例，梳理违约金调整的裁判规则。 《民法典》第585条：当事人可以约定一方违约时应当根据违约情况向对方支付一定数额的违约金。约定的违约金过分高于造成的损失的，人民法院或者仲裁机构可以根据当","slug":"案例-违约金调整规则","module":"06-案例库","moduleName":"案例库","tags":["民法","合同法","违约金","违约金调整","专题案例"],"wordCount":4491,"created":"2026-06-02","updated":"2026-06-04","content":"# 专题案例：违约金调整规则\n\n## 概述\n\n违约金条款是合同中最常见的违约救济方式之一。当约定的违约金过高或过低时，当事人可以请求法院予以调整。[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第585条|《民法典》第585条]]和[[⚖️ 民法实务知识库/08-法规全文/合同编通则司法解释#第65条|合同编通则司法解释第65条]]对违约金调整的条件、标准和程序作出了明确规定。本专题通过三个典型案例，梳理违约金调整的裁判规则。\n\n## 核心内容\n\n### 1. 法律依据\n\n- [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第585条|《民法典》第585条]]：当事人可以约定一方违约时应当根据违约情况向对方支付一定数额的违约金。约定的违约金过分高于造成的损失的，人民法院或者仲裁机构可以根据当事人的请求予以适当减少\n- [[⚖️ 民法实务知识库/08-法规全文/合同编通则司法解释#第65条|合同编通则司法解释第65条]]：当事人主张约定的违约金过分高于违约造成的损失，请求予以适当减少的，人民法院应当以实际损失为基础，兼顾合同履行情况、当事人过错程度以及预期利益等综合因素，根据公平原则和诚信原则予以衡量，并作出裁判。约定的违约金超过造成损失的百分之三十的，人民法院一般可以认定为过分高于造成的损失\n\n### 2. 调整规则\n\n| 调整方向 | 启动方式 | 举证责任 | 判断标准 |\n|----------|----------|----------|----------|\n| 调减过高违约金 | 违约方请求（反诉或抗辩） | 违约方举证证明过高 | 超过实际损失30%为\"过分高于\" |\n| 调增过低违约金 | 守约方请求 | 守约方举证证明过低 | 低于实际损失 |\n\n### 3. 典型案例\n\n### 案例1：违约方未举证证明违约金过高\n\n**案号**：（2007）民二终字第139号\n**来源**：最高人民法院\n**裁判要旨**：违约方主张违约金过高请求调减的，应承担举证责任，证明违约金过分高于造成的实际损失。违约方未提供证据证明违约金属于过高情形的，法院不予调减。\n\n**案情简介**：史文培与甘肃皇台酿造（集团）有限责任公司、北京皇台商贸有限责任公司签订互易合同。甘肃皇台公司未履行合同义务构成违约，合同约定违约金为日万分之四。甘肃皇台公司认为该违约金比例过高，请求法院予以调整。\n\n**裁判理由**：\n> [!tip] 本院认为（基于公开裁判文书整理）\n> 违约方甘肃皇台公司未履行涉案合同义务构成违约，应当支付违约金。根据法律规定，只有在\"过分高于造成损失\"的情形下方能适当调整违约金，一般高于的情形并无必要调整。\n>\n> 甘肃皇台公司主张违约金过高，但未提供任何证据证明日万分之四的违约金属于过分高于造成损失的情形。违约方对违约金过高的主张承担举证责任，不能仅以主观判断主张违约金过高。在违约方未完成举证责任的情况下，其调减请求不能成立，应予驳回。\n\n**实务要点**：\n1. 违约方主张违约金过高请求调减的，应承担举证责任\n2. 举证内容包括：守约方的实际损失数额、违约金与实际损失的比例关系\n3. \"过分高于\"的判断标准：超过实际损失的30%一般可认定为过分高于\n4. 违约方未完成举证的，法院不予调减——体现了对意思自治的尊重\n\n**案例分析**：本案确立了违约金调减的基本举证规则——\"谁主张谁举证\"。违约方不能仅凭主观判断主张违约金过高，而必须提供证据证明违约金与实际损失之间存在显著差距。日万分之四（年化约14.6%）的违约金比例在当时并不算过高，法院驳回调减请求具有合理性。\n\n---\n\n### 案例2：实际损失难以确定时的违约金调整\n\n**案号**：（2013）民提字第145号\n**来源**：最高人民法院\n**裁判要旨**：确认约定的违约金数额是否过高，应以实际损失数额作为确认的基础。双方当事人均未提供证据证明实际损失的，法院应综合衡量全案情况确定逾期付款损失，并以弥补损失为基准点、适度体现惩罚性的原则确定违约金数额。\n\n**案情简介**：新疆六道湾实业有限责任公司与乌鲁木齐市博元汽车修理有限公司签订合同，六道湾公司逾期支付150万元款项。合同约定了违约金，但双方对违约金的合理性产生争议。双方当事人均未提供证据证明实际损失的具体数额。\n\n**裁判理由**：\n> [!tip] 本院认为（基于公开裁判文书整理）\n> 确认约定的违约金数额是否过高，应以实际损失数额作为确认的基础。但本案中，双方当事人均未提供证据证明六道湾公司逾期支付150万元给博元公司造成的实际损失是多少。\n>\n> 本院综合衡量全案情况认为，逾期付款损失为款项接收方即博元公司的利息损失。同时考虑到，当约定违约金过分高于或低于违约造成的损失"},{"id":"案例-物权新增制度","title":"案例-物权新增制度","excerpt":"《中华人民共和国民法典》物权编在承继原《物权法》的基础上，增设了多项新制度，回应了社会经济发展和人民群众的实际需求。主要新增制度包括：居住权制度（第366-371条）、土地经营权制度（第339-342条，落实 三权分置 改革）、添附制度（第322条）、建筑物区分所有权制度的完善（第271-287条，降低业主表决门槛等）以及不动产登记错误赔偿制度（第222条）等。 本专题案例围绕上述新增制度，选取真","slug":"案例-物权新增制度","module":"06-案例库","moduleName":"案例库","tags":["民法","案例","物权编","物权新增制度","专题案例"],"wordCount":6950,"created":"2026-05-28","updated":"2026-06-04","content":"# 物权新增制度专题案例\n\n## 概述\n\n《中华人民共和国民法典》物权编在承继原《物权法》的基础上，增设了多项新制度，回应了社会经济发展和人民群众的实际需求。主要新增制度包括：居住权制度（[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第366条|第366-371条]]）、土地经营权制度（[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第339条|第339-342条]]，落实\"三权分置\"改革）、添附制度（[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第322条|第322条]]）、建筑物区分所有权制度的完善（[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第271条|第271-287条]]，降低业主表决门槛等）以及不动产登记错误赔偿制度（[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第222条|第222条]]）等。\n\n本专题案例围绕上述新增制度，选取真实案例进行分析。案例来源包括人民法院案例库入库案例、最高人民法院发布的典型案例等。其中，居住权和建筑物区分所有权两个专题收录了人民法院案例库入库案例；土地经营权和添附两个专题收录了最高人民法院发布的权威典型案例；不动产登记错误赔偿专题因案例库暂无对应入库案例，仅作制度分析说明。\n\n## 案例列表\n\n### 案例一：居住权——杨某甲诉杨某乙、刘某言等继承纠纷案\n\n**案号**：一审（2020）京0108民初46457号；二审（2021）京01民终10858号\n\n**入库编号**：2025-07-2-476-002\n\n**来源**：人民法院案例库（[北京一中院案例精粹](https://bj1zy.bjcourt.gov.cn/article/detail/2026/04/id/9298291.shtml)）\n\n**裁判要旨**：1. 民法典施行前以遗嘱方式设立居住权，民法典施行后请求确认居住权的，适用民法典的规定。2. 遗嘱继承中，被继承人在遗嘱中为第三人在其所有的住宅上设立居住权益，且该第三人在被继承人死亡前已实际占有使用该住宅的，应认定居住权设立有效。3. \"他人的住宅\"应作扩大解释，不限于第三人所有的住宅。\n\n**案情简介**：\n被继承人杨某与前妻育有一子杨某甲。杨某与刘某言再婚后，杨某名下有一套房屋。杨某生前立下遗嘱，载明在其去世后，刘某言有权在其房屋中居住至终老，任何人不得干涉。杨某去世后，杨某甲作为唯一法定继承人，主张继承该房屋的全部产权，并要求刘某言搬离。刘某言主张其依据杨某的遗嘱享有居住权，有权继续在该房屋中居住。\n\n**裁判理由**：\n\n> [!tip] 本院认为（基于人民法院案例库公开信息整理）\n> \"杨某在遗嘱中明确表达了在其去世后由刘某言在其房屋中居住至终老的真实意思，刘某言在杨某去世前已实际在该房屋中居住生活。居住权是民法典新设的用益物权类型，虽然杨某设立遗嘱的行为发生在民法典施行之前，但刘某言请求确认居住权发生在民法典施行之后，根据《最高人民法院关于适用〈中华人民共和国民法典〉时间效力的若干规定》第三条的规定，民法典施行前的法律事实引起的民事纠纷案件，当时的法律、司法解释没有规定而民法典有规定的，可以适用民法典的规定。居住权制度属于民法典新增制度，原《物权法》等法律没有规定，故本案可以适用民法典关于居住权的规定。杨某以遗嘱方式为刘某言设立居住权的意思表示明确，刘某言亦已实际占有使用该住宅，居住权设立有效。\"\n\n**实务要点**：\n1. 民法典新增制度的时间效力适用规则：民法典施行前的法律事实，当时的法律没有规定而民法典有规定的，可以适用民法典（空白溯及）\n2. 遗嘱设立居住权属于[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第371条|民法典第371条]]规定的\"以遗嘱方式设立居住权\"，是居住权设立的法定方式之一\n3. 居住权的\"他人住宅\"应作扩大解释，不仅限于第三人所有的住宅，被继承人在自己所有的住宅上为他人设立居住权亦属有效\n4. 居住权人已实际占有使用住宅的事实，是认定居住权设立有效的重要考量因素\n\n**案例分析**：\n本案是人民法院案例库入库案例，具有重要的类案参考价值。该案明确了三个关键问题：一是民法典居住权制度的空白溯及适用问题，为处理民法典施行前遗留的居住权益纠纷提供了裁判路径；二是遗嘱设立居住权的效力认定问题，确认了被继承人在自己所有的住宅上为他人设立居住权的合法性；三是\"他人住宅\"的扩大解释问题。实务中，在处理类似继承纠纷时，应注意审查遗嘱中居住权设立的意思表示是否明确、居住权人是否已实际占有使用住宅、以及居住权是否损害了其他继承人的基本生活保障等因素。\n\n---\n\n### 案例二：建筑物区分所有权——梅州市梅江区某业主委员会诉梅州市梅江"},{"id":"案例-侵权责任新规则","title":"案例-侵权责任新规则","excerpt":"本专题收录侵权责任领域的 8 个典型案例与最高人民法院指导案例，按主题分为五大板块： 自甘风险规则 （第1176条） 安全保障义务 （第1198条） 网络侵权责任 （第1194-1197条） 交通事故侵权 环境污染与生态损害赔偿 （第1229-1235条） 涵盖来源类型包括：最高人民法院指导案例、人民法院案例库入库案例、最高人民法院典型案例等。 [!note] 关于自助行为（第1177条） 自助行","slug":"案例-侵权责任新规则","module":"06-案例库","moduleName":"案例库","tags":["民法","案例","侵权责任","民法典新规","最高院指导案例","交通事故","环境侵权"],"wordCount":7809,"created":"2026-05-28","updated":"2026-06-04","content":"# 侵权责任典型案例与指导案例\n\n## 概述\n\n本专题收录侵权责任领域的 **8** 个典型案例与最高人民法院指导案例，按主题分为五大板块：\n\n1. **自甘风险规则**（[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第1176条|第1176条]]）\n2. **安全保障义务**（[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第1198条|第1198条]]）\n3. **网络侵权责任**（[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第1194条|第1194-1197条]]）\n4. **交通事故侵权**\n5. **环境污染与生态损害赔偿**（[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第1229条|第1229-1235条]]）\n\n涵盖来源类型包括：最高人民法院指导案例、人民法院案例库入库案例、最高人民法院典型案例等。\n\n> [!note] 关于自助行为（[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第1177条|第1177条]]）\n> 自助行为是民法典新增的免责事由。截至目前，尚无最高人民法院发布的具有明确案号的自助行为典型案例。本专题暂未收录自助行为独立案例，待最高院发布相关指导性案例后将及时补充。\n\n> [!note] 关于医疗损害知情同意权\n> 最高人民法院目前尚未发布专门针对医疗损害知情同意权的指导案例，相关规则主要体现在公报案例及[《关于审理医疗损害责任纠纷案件适用法律若干问题的解释》](https://www.court.gov.cn/zixun/xiangqing/73512.html)中。\n\n## 一、自甘风险规则\n\n### 案例1：宋某祯诉周某身体权纠纷案（最高法典型案例）\n\n**来源**：[最高人民法院·学法典读案例·自甘冒险规则](https://www.court.gov.cn/zixun/xiangqing/369161.html)（[人民法院贯彻实施民法典典型案例（第一批）](https://www.court.gov.cn/zixun/xiangqing/347181.html)；北京市朝阳区人民法院）\n\n**裁判要旨**：羽毛球运动属于具有一定风险的文体活动，自愿参加者在运动中因对方正常竞技行为受伤，应适用自甘风险规则，对方不承担侵权责任。\n\n**案情简介**：\n\n宋某祯与周某系业余羽毛球爱好者。2020年某日，二人自愿参加羽毛球活动，在对打过程中，周某击出的羽毛球击中宋某眼睛，导致宋某眼部受伤。宋某诉至法院，要求周某赔偿医疗费、误工费等损失。该案发生在《民法典》实施前夕，法院在《民法典》正式施行后适用新法进行裁判。\n\n**裁判理由**：\n\n> [!tip] 本院认为（基于公开裁判文书整理）\n> \"羽毛球运动属于对抗性、竞技性运动，存在一定的运动风险。宋某作为完全民事行为能力人，自愿参加羽毛球运动，应当预见运动中可能发生的风险。周某在运动中的击球行为属于正常的竞技行为，不存在故意或重大过失的情形。根据《民法典》第一千一百七十六条第一款的规定，自愿参加具有一定风险的文体活动，因其他参加者的行为受到损害的，受害人不得请求其他参加者承担侵权责任。\"\n\n**实务要点**：\n1. 自甘风险规则适用于\"具有一定风险的文体活动\"，包括但不限于足球、篮球、羽毛球、滑雪等对抗性或竞技性运动。\n2. 适用自甘风险规则的前提是受害人\"自愿参加\"，即受害人对活动的风险有认知能力并自愿承受。\n3. 如果其他参加者存在\"故意或者重大过失\"，则不适用自甘风险规则，受害人仍有权请求赔偿。\n4. 活动组织者的安全保障义务不因自甘风险规则而免除（[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第1176条|第1176条]]第2款）。\n\n**案例分析**：\n\n本案是《民法典》施行后全国首例适用自甘风险规则的案例，具有里程碑意义。法院明确了自甘风险规则的适用要件：（1）活动具有一定风险；（2）受害人自愿参加；（3）加害人无故意或重大过失。该判决体现了《民法典》鼓励文体活动、合理分配风险的立法精神，避免因过度追责而抑制全民健身活动的开展。\n\n---\n\n## 二、安全保障义务\n\n### 案例2：指导案例140号——李秋月等诉广州市花都区梯面镇红山村村民委员会违反安全保障义务责任纠纷案\n\n**案号**：\n- 一审：（2017）粤0114民初6921号\n- 二审：（2018）粤01民终4942号\n- 再审：（2019）粤01民再273号\n\n**来源**：[最高人民法院指导案例第140号](https://www.court.gov.cn/shenpan/xiangqing/263571.html)\n\n**裁判要旨**：公共场所管理人的安全保"},{"id":"案例-高空抛物责任","title":"案例-高空抛物责任","excerpt":"高空抛物致人损害是城市治理中的突出难题，被称为 悬在城市上空的痛 。《民法典》第1254条在原《侵权责任法》第87条基础上，增设了公安机关调查义务、物业服务企业安保义务、追偿权等制度，构建了较为完整的高空抛物民事责任体系。 原《侵权责任法》第87条（2010年施行）首次确立了高空抛物的可能加害人补偿规则，但该条仅规定了补偿责任，未涉及物业安保义务和公安调查义务，实践中暴露出 一人抛物、全楼买单 的","slug":"案例-高空抛物责任","module":"06-案例库","moduleName":"案例库","tags":["民法","侵权责任","高空抛物","物业安保义务","民法典1254条"],"wordCount":7974,"created":"2026-05-28","updated":"2026-06-03","content":"# 案例-高空抛物责任\n\n## 概述\n\n高空抛物致人损害是城市治理中的突出难题，被称为\"悬在城市上空的痛\"。[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第1254条|《民法典》第1254条]]在原《侵权责任法》第87条基础上，增设了公安机关调查义务、物业服务企业安保义务、追偿权等制度，构建了较为完整的高空抛物民事责任体系。\n\n原《侵权责任法》第87条（2010年施行）首次确立了高空抛物的可能加害人补偿规则，但该条仅规定了补偿责任，未涉及物业安保义务和公安调查义务，实践中暴露出\"一人抛物、全楼买单\"的困境。[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第1254条|《民法典》第1254条]]对此进行了系统性完善，形成了\"侵权人担责—可能加害人补偿—物业安保—公安调查—追偿\"的五层制度架构。\n\n本文通过人民法院官方发布的典型案例梳理相关民事裁判规则。\n\n## 法律依据\n\n### [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第1254条|《民法典》第1254条]]\n\n1. **禁止性规定**：禁止从建筑物中抛掷物品。从建筑物中抛掷物品或者从建筑物上坠落的物品造成他人损害的，由侵权人依法承担侵权责任。\n2. **可能加害人补偿**：经调查难以确定具体侵权人的，除能够证明自己不是侵权人的外，由可能加害的建筑物使用人给予补偿。可能加害的建筑物使用人补偿后，有权向侵权人追偿。\n3. **物业安保义务**：物业服务企业等建筑物管理人应当采取必要的安全保障措施防止前款规定情形的发生；未采取必要的安全保障措施的，应当依法承担未履行安全保障义务的侵权责任。\n4. **公安调查义务**：发生本条第一款规定的情形的，公安等机关应当依法及时调查，查清责任人。\n\n### 关联规定\n\n- [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第1253条|《民法典》第1253条]]（建筑物及物件脱落、坠落致害责任）\n- [[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第1191条|《民法典》第1191条]]（用人单位责任）\n- 原《侵权责任法》第34条、[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第85条|第85条]]、[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第87条|第87条]]（已被《民法典》取代）\n- 《最高人民法院关于依法妥善审理高空抛物、坠物案件的意见》（法发〔2019〕25号）\n- 《最高人民法院关于适用〈中华人民共和国民法典〉侵权责任编的解释（一）》第24条、第25条\n\n## 案例列表\n\n### 案例一：谢某文诉珠海市某物业管理有限公司等生命权纠纷案——物业未尽管理义务应对外墙脱落致损承担赔偿责任\n\n**来源**：[广东省高级人民法院：广东法院涉高空抛物、坠物十大典型案例（案例3）](https://www.gdcourts.gov.cn/gsxx/quanweifabu/anlihuicui/content/mpost_1046348.html)（珠海市香洲区人民法院审理，珠海市中级人民法院二审维持）\n\n**案情简介**：2018年9月4日，谢某连与吴某英途径珠海市粤海中路君兰居小区内2栋1单元楼下时，被该建筑物外墙脱落的瓷砖砸中，导致谢某连头部重伤，送医院抢救无效死亡。君兰居小区于2008年建成并通过竣工验收，自交付使用至案发时，一直由珠海市某物业管理有限公司提供物业管理服务。谢某连家属谢某文诉至法院，要求物业公司和房地产公司共同赔偿各项费用97万元。\n\n**裁判理由**：\n> [!tip] 本院认为\n> 物业公司依据前期物业服务协议对包括外墙在内的共用部位负有维修、养护和管理义务。虽然并无业主委员会授权物业公司对涉案外墙面进行维修，但物业公司应当尽到相应的管理工作，做好相应警示及安全防范工作。物业公司并未就此提供相应的材料加以证明，应承担举证不能的不利后果，应对谢某连死亡的损害后果承担侵权责任。\n>\n> 判决物业公司赔偿死亡赔偿金、丧葬费、精神损害抚慰金等共计89万余元。珠海市中级人民法院二审维持原判。\n\n**实务要点**：\n1. **坠落物与抛掷物的区分**：建筑物外墙脱落属于\"建筑物上的坠落物\"，应适用[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第1253条|《民法典》第1253条]]（原《侵权责任法》第85条），而非[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第1254条|第1254条]]。两者的根本区别在于是否有人的行为介入——坠落物系物件自身脱落或因自然原因所致，抛掷物系人为行为所致\n2. **过错推定原则的适用**：第1253条采用过错推定原则，由物件的所有人、"},{"id":"案例-劳动争议系列","title":"案例-劳动争议系列","excerpt":"劳动争议案件涉及劳动者权益保护与用人单位用工自主权的平衡。本系列收录最高人民法院发布的劳动争议典型案例，涵盖劳动合同解除、竞业限制、社会保险缴纳、建设工程工伤等热点问题，为律师处理劳动争议案件提供实务参考。 来源 ： 最高人民法院指导案例第18号（2013年11月8日发布） 裁判要旨 ：劳动者在用人单位等级考核中居于末位等次，不等同于 不能胜任工作 ，不符合单方解除劳动合同的法定条件，用人单位不能","slug":"案例-劳动争议系列","module":"06-案例库","moduleName":"案例库","tags":["民法","案例","劳动争议","省高院典型案例"],"wordCount":5878,"created":"2026-05-28","updated":"2026-06-03","content":"# 劳动争议系列案例\n\n## 概述\n劳动争议案件涉及劳动者权益保护与用人单位用工自主权的平衡。本系列收录最高人民法院发布的劳动争议典型案例，涵盖劳动合同解除、竞业限制、社会保险缴纳、建设工程工伤等热点问题，为律师处理劳动争议案件提供实务参考。\n\n## 案例列表\n\n### 案例一：中兴通讯（杭州）有限责任公司诉王鹏劳动合同纠纷案\n**来源**：[最高人民法院指导案例第18号（2013年11月8日发布）](https://www.court.gov.cn/shenpan/xiangqing/6002.html)\n**裁判要旨**：劳动者在用人单位等级考核中居于末位等次，不等同于\"不能胜任工作\"，不符合单方解除劳动合同的法定条件，用人单位不能据此单方解除劳动合同。\n**案情简介**：2005年7月，王鹏进入中兴通讯（杭州）有限责任公司工作，劳动合同约定从事销售工作，基本工资每月3840元。该公司《员工绩效管理办法》规定员工半年、年度绩效考核分别为S、A、C1、C2四个等级，分别代表优秀、良好、价值观不符、业绩待改进，S、A、C（C1、C2）等级比例分别为20%、70%、10%，不胜任工作原则上考核为C2。王鹏原在分销科从事销售工作，2009年1月后因分销科解散等原因转岗至华东区从事销售工作。2008年下半年、2009年上半年及2010年下半年，王鹏的考核结果均为C2。中兴通讯认为王鹏不能胜任工作，经转岗后仍不能胜任工作，故在支付部分经济补偿金的情况下解除了劳动合同。2011年7月27日，王鹏提起劳动仲裁。\n**裁判结果**：浙江省杭州市滨江区人民法院于2011年12月6日作出（2011）杭滨民初字第885号民事判决：原告中兴通讯（杭州）有限责任公司于本判决生效之日起十五日内一次性支付被告王鹏违法解除劳动合同的赔偿金余额36596.28元。宣判后，双方均未上诉，判决已发生法律效力。\n**裁判理由**：\n> [!tip] 裁判要点\n> \"劳动者在用人单位等级考核中居于末位等次，不等同于'不能胜任工作'，不符合单方解除劳动合同的法定条件，用人单位不能据此单方解除劳动合同。\"\n>\n> 末位排名系用人单位内部考核的结果，反映的是劳动者在全体劳动者中的相对位次，而非劳动者是否胜任工作的绝对评价。绩效考核排名末位，仅表明该劳动者在同一考核周期内相较于其他同事表现欠佳，但不能据此直接认定其\"不能胜任工作\"。\"不能胜任工作\"应当以劳动合同约定的工作任务、岗位职责为标准进行判断，即劳动者是否达到了工作岗位的基本要求，而非与其他劳动者进行横向比较。\n>\n> 即便劳动者确实存在不能胜任工作的情形，根据劳动合同法第四十条第二项之规定，用人单位亦应先行对劳动者进行培训或者调整工作岗位，经培训或调岗后仍不能胜任工作的，用人单位方可提前三十日书面通知或额外支付一个月工资后解除劳动合同。中兴通讯未经培训或调岗程序，径行以末位淘汰为由解除劳动合同，违反法定程序。\n\n**实务要点**：（1）末位排名不等于不能胜任工作，不能作为解除劳动合同的法定理由；（2）即便劳动者不能胜任工作，用人单位也须先行培训或调岗，仍不胜任方可解除；（3）用人单位不得以内部规章制度替代劳动合同法规定的解除条件和程序；（4）律师代理劳动者一方应注意审查解除理由的合法性及程序的合规性。\n**案例分析**：本案是最高人民法院发布的第18号指导案例（2013年11月8日审判委员会讨论通过），确立了\"末位淘汰\"不构成合法解除理由的重要裁判规则。本案的核心法理在于：劳动合同法对用人单位单方解除权采取严格法定主义，用人单位不得以内部管理手段架空法定解除条件。\"末位淘汰\"制度的实质是将劳动者的相对排名作为解除依据，混淆了\"相对不优秀\"与\"不能胜任\"的概念。本案对规范用人单位绩效考核制度、保护劳动者合法权益具有重要指导意义，提醒用人单位在制定和执行绩效管理制度时必须符合法律规定，不得以\"竞争上岗\"\"末位淘汰\"等方式规避劳动合同法对解除权的限制。\n\n---\n\n### 案例二：某公司与李某竞业限制纠纷案\n**来源**：[最高人民法院2024年4月30日发布劳动争议典型案例——案例三](https://www.court.gov.cn/zixun/xiangqing/431252.html)\n**裁判要旨**：竞业限制协议不能限制非负有保密义务的劳动者的自主择业权。在正常履职期间仅接触用人单位一般经营信息的劳动者，不属于劳动合同法第二十四条第一款规定的\"其他负有保密义务的人员\"，无需承担竞业限制义务。\n**案情简介**：2017年1月10日，李某入职某公司从事推拿师工作，双方签订员工保密协议，约定李某离职后两年内不得从事同类产品或同类企业的相关服务，否则应当一次性向某公司支付不低于50000元的违约金。2017年11月"},{"id":"案例-消费者权益系列","title":"案例-消费者权益系列","excerpt":"消费者权益保护是市场经济健康运行的重要保障。本系列收录最高人民法院发布的消费者权益保护典型案例和涉预付式消费典型案例，涵盖食品安全十倍赔偿、预付式消费退款、医疗美容欺诈惩罚性赔偿、格式条款效力认定等热点问题，为律师处理消费者权益纠纷提供实务参考。 本系列案例均来源于最高人民法院官方发布的典型案例，裁判规则和法律分析基于现行法律规定和司法实践。 来源 ： 最高人民法院发布涉预付式消费典型案例 （案例","slug":"案例-消费者权益系列","module":"06-案例库","moduleName":"案例库","tags":["民法","案例","消费者权益","省高院典型案例"],"wordCount":6289,"created":"2026-05-28","updated":"2026-06-03","content":"# 消费者权益系列案例\n\n## 概述\n消费者权益保护是市场经济健康运行的重要保障。本系列收录最高人民法院发布的消费者权益保护典型案例和涉预付式消费典型案例，涵盖食品安全十倍赔偿、预付式消费退款、医疗美容欺诈惩罚性赔偿、格式条款效力认定等热点问题，为律师处理消费者权益纠纷提供实务参考。\n\n本系列案例均来源于最高人民法院官方发布的典型案例，裁判规则和法律分析基于现行法律规定和司法实践。\n\n---\n\n## 案例列表\n\n### 案例一：郭某诉某经营部产品责任纠纷案——假冒注册商标食品的十倍赔偿\n\n**来源**：[最高人民法院发布食品安全惩罚性赔偿典型案例](https://www.court.gov.cn/zixun/xiangqing/418922.html)（案例1）\n\n**裁判要旨**：消费者有权请求销售假冒注册商标食品的经营者支付价款十倍惩罚性赔偿金。经营者销售假冒注册商标的食品，不能证明食品来源合法，也未尽到进货审查义务的，应当退还货款并承担惩罚性赔偿责任。经营者以未造成消费者人身损害为由的抗辩不能成立。\n\n**案情简介**：2021年11月17日，郭某向某经营部购买某品牌白酒2件12瓶，并支付货款11160元。2021年11月23日，郭某再次向某经营部购买某品牌白酒2件12瓶，并支付货款10937元。后郭某怀疑其购买的白酒为假酒，遂向当地市场监督管理部门举报。某白酒公司出具《鉴定证明书》，表明上述某品牌白酒并非该公司生产，属于假冒注册商标的产品。郭某起诉某经营部，要求退还购酒款并支付购酒款十倍的赔偿金。\n\n**裁判理由**：\n> [!tip] 本院认为\n> 根据《中华人民共和国食品安全法》第一百四十八条第二款规定：\"生产不符合食品安全标准的食品或者经营明知是不符合食品安全标准的食品，消费者除要求赔偿损失外，还可以向生产者或者经营者要求支付价款十倍或者损失三倍的赔偿金；增加赔偿的金额不足一千元的，为一千元。但是，食品的标签、说明书存在不影响食品安全且不会对消费者造成误导的瑕疵的除外。\"《最高人民法院关于审理食品安全民事纠纷案件适用法律若干问题的解释（一）》第十一条规定：\"生产经营未标明生产者名称、地址、成分或者配料表，或者未清晰标明生产日期、保质期的预包装食品，消费者主张生产者或者经营者依据食品安全法第一百四十八条第二款规定承担惩罚性赔偿责任的，人民法院应予支持，但法律、行政法规、食品安全国家标准对标签标注事项另有规定的除外。\"\n>\n> 某经营部销售的某品牌白酒为假冒注册商标的预包装食品，标注虚假的生产者名称、地址等信息，不符合食品安全标准。某经营部作为食品经营者，对其销售的假冒注册商标食品，不能证明食品来源合法，也未尽到进货审查义务，应当退还货款并承担惩罚性赔偿责任。某经营部关于其所出售假冒注册商标的白酒未对原告造成人身损害，只侵犯了某白酒公司的商标权，不应支付价款十倍赔偿金的抗辩不成立。郭某购买白酒属于生活消费行为，其请求支付价款十倍的惩罚性赔偿金，于法有据，应予支持。\n>\n> 故判决某经营部退还郭某货款22097元并支付郭某赔偿金220970元。\n\n**实务要点**：\n（1）食品安全法第148条第2款规定了十倍赔偿制度，适用于生产或经营不符合食品安全标准食品的行为；\n（2）假冒注册商标的食品标注虚假的生产者名称、地址等信息，属于不符合食品安全标准的食品；\n（3）经营者不能证明食品来源合法且未尽进货审查义务的，应承担惩罚性赔偿责任；\n（4）经营者以未造成消费者人身损害为由进行抗辩的，人民法院不予支持。\n\n**案例分析**：\n本案是最高人民法院发布的食品安全惩罚性赔偿典型案例。法院的裁判明确了以下重要规则：一是假冒注册商标的食品因标注虚假生产者信息，直接被认定为不符合食品安全标准；二是经营者不得以\"未造成人身损害\"为由免除十倍赔偿责任；三是消费者基于生活消费需要购买食品的，其十倍赔偿请求应予支持。律师在实务中应注意：一是食品安全惩罚性赔偿不以实际损害为前提，降低了消费者的举证难度；二是消费者应保留购买凭证和鉴定证据，必要时向市场监管部门举报以获取行政认定；三是十倍赔偿的计算基数为消费者实际支付的\"价款\"，而非损失金额。\n\n---\n\n### 案例二：张某诉某健身公司服务合同纠纷案——预付式消费退款中赠送服务的计算\n\n**来源**：[最高人民法院发布涉预付式消费典型案例](https://www.court.gov.cn/zixun/xiangqing/459331.html)（案例3）\n\n**裁判要旨**：经营者违约导致预付式消费合同解除的，应按合同约定的优惠方案计算已提供服务的价款。在计算退款金额时，应将经营者赠送的服务纳入总服务量，以充分保护消费者的履行利益。\n\n**案情简介**：2023年7月2日，张某因个人健身需要与"},{"id":"案例-建设工程系列","title":"案例-建设工程系列","excerpt":"建设工程纠纷涉及标的额大、法律关系复杂、专业性强。本系列收录最高人民法院发布的建设工程典型案例和公报案例，涵盖质量缺陷处理、保修义务承担、工程价款优先受偿权、黑白合同效力等核心问题，为律师处理建设工程纠纷提供实务指导。 来源 ： 最高人民法院发布建设工程质量保护典型案例 （案例1） 裁判要旨 ：建设工程存在质量缺陷的，应先行修复工程并办理竣工验收，再进行工程款结算。人民法院通过组织调解实现争议分层","slug":"案例-建设工程系列","module":"06-案例库","moduleName":"案例库","tags":["民法","案例","建设工程","省高院典型案例"],"wordCount":5514,"created":"2026-05-28","updated":"2026-06-03","content":"# 建设工程系列案例\n\n## 概述\n建设工程纠纷涉及标的额大、法律关系复杂、专业性强。本系列收录最高人民法院发布的建设工程典型案例和公报案例，涵盖质量缺陷处理、保修义务承担、工程价款优先受偿权、黑白合同效力等核心问题，为律师处理建设工程纠纷提供实务指导。\n\n## 案例列表\n\n### 案例一：李某诉某资源公司建设工程施工合同纠纷案——先行调解修复质量缺陷工程\n\n**来源**：[最高人民法院发布建设工程质量保护典型案例](https://www.court.gov.cn/zixun/xiangqing/480471.html)（案例1）\n\n**裁判要旨**：建设工程存在质量缺陷的，应先行修复工程并办理竣工验收，再进行工程款结算。人民法院通过组织调解实现争议分层化解，在维护施工人权益的同时督促其严格履行质量责任，彰显优先保护工程质量安全的司法理念。\n\n**案情简介**：某资源公司与李某签订《建设工程施工合同》，由李某承建某工程。因某资源公司未按约定支付工程款，李某在未完工的情况下退场。双方就案涉工程款结算产生争议。某资源公司以工程存在质量缺陷、李某一方未履行修复义务为由拒付工程款。李某起诉请求某资源公司支付工程欠款46万元及利息。\n\n**裁判理由**：\n> [!tip] 本院认为\n> 因李某不具备相应资质，案涉《建设工程施工合同》无效。李某在交付质量合格的建设工程情况下，才有权请求某资源公司折价补偿。李某、某资源公司双方就工程中有质量缺陷的部分应当进行修复无争议。\n>\n> 工程修复后再进行工程款结算，有利于提高纠纷解决效率，最大限度实现物尽其用。经审理法院组织调解，各方当事人最终达成调解协议，双方先修复工程并办理竣工验收，再进行工程款结算。调解协议签订后，案涉工程经修复，最终竣工验收合格。审理法院对李某其他诉讼请求作出处理，判决：某资源公司支付39万元工程款及利息。\n\n**实务要点**：\n（1）无资质的实际施工人签订的施工合同无效，但完成合格工程后有权请求折价补偿；\n（2）工程存在质量缺陷时，应先修复后结算，实现争议分层化解；\n（3）法院可通过先行调解的方式，在保障工程质量的同时兼顾施工人权益，避免工程陷入验收僵局。\n\n**案例分析**：\n本案体现了优先保护工程质量安全的司法理念。当实际施工人因无资质导致合同无效时，法律仍保护其获得合理补偿的权利，但前提是交付质量合格的建设工程。法院通过调解促成\"先修复、后结算\"的方案，既解决了质量问题，又保障了工程款的支付，实现了工程质量安全与施工人权益的双重保护。律师在实务中应注意：一是合同无效不影响折价补偿请求权；二是质量缺陷的修复义务优先于工程款结算；三是主动配合法院调解有利于高效解决纠纷。\n\n---\n\n### 案例二：某汽车公司诉某建设公司建设工程施工合同纠纷案——主体结构保修义务\n\n**来源**：[最高人民法院发布建设工程质量保护典型案例](https://www.court.gov.cn/zixun/xiangqing/480471.html)（案例2）\n\n**裁判要旨**：工程主体结构在合理使用期限内出现质量缺陷的，施工单位应依法承担保修义务。承包人不得以工程已竣工验收合格为由拒绝履行法定保修责任。\n\n**案情简介**：某建设公司与某汽车公司签订《建筑工程施工合同》，约定为某汽车公司建设汽车车间土建及钢结构工程，工程质量应符合国家或行业的质量检验评定标准。工程设计使用年限为50年，质量保修期自工程验收合格之日起算。工程竣工交付使用10年后，主体结构吊车梁出现裂缝，影响作业安全。某建设公司以工程已竣工验收合格等理由拖延履行保修义务。某汽车公司遂自行维修加固，后起诉请求某建设公司履行保修义务，并赔偿其自行修复所产生的费用共计175万元。\n\n**裁判理由**：\n> [!tip] 本院认为\n> 施工单位对建设工程的施工质量负责。工程主体结构质量关系建筑安全和使用寿命，属于法律规定的重点保修范围。案涉工程设计使用年限为50年，主体结构吊车梁在工程交付使用仅10年后即出现裂缝，尚在合理使用期限和保修期内。某建设公司作为施工单位，应当依法承担保修义务。\n>\n> 某建设公司以工程已竣工验收合格为由拒绝履行保修义务，缺乏法律依据。竣工验收合格不能免除施工单位在保修期内对工程质量缺陷的法定保修责任。某汽车公司在某建设公司拖延履行保修义务的情况下自行维修加固，产生的合理费用应由某建设公司承担。\n>\n> 法院判决某建设公司履行保修义务，赔偿某汽车公司自行维修加固所产生的费用。\n\n**实务要点**：\n（1）主体结构保修期限与工程设计使用年限相挂钩，施工单位在设计使用年限内对主体结构缺陷负有保修义务；\n（2）竣工验收合格不等于免除施工单位保修期内的法定保修责任；\n（3）承包人怠于履行保修义务时，发包人有权自行修"},{"id":"index","title":"INDEX","excerpt":"本案例库按法律领域分类，收录民法实务中的典型案例、最高人民法院指导案例和省高院典型案例，共计 18 篇案例文件，涵盖公司法、合同法、物权法、侵权责任法等主要民商法领域。 ---|--------|---------| | 案例-公司治理系列 | 3 | 公司人格否认、股东代表诉讼、股权转让优先购买权 | | 案例-公司资本制度 | 3 | 出资瑕疵、抽逃出资、资本充实原则 | | 案例-对赌协议效","slug":"index","module":"06-案例库","moduleName":"案例库","tags":["案例库","索引"],"wordCount":1142,"created":"2026-06-02","updated":"2026-06-03","content":"# 案例库索引\n\n本案例库按法律领域分类，收录民法实务中的典型案例、最高人民法院指导案例和省高院典型案例，共计 **18** 篇案例文件，涵盖公司法、合同法、物权法、侵权责任法等主要民商法领域。\n\n---\n\n## 01-公司法（6篇）\n\n| 文件 | 案例数 | 主要内容 |\n|------|--------|---------|\n| [[案例-公司治理系列]] | 3 | 公司人格否认、股东代表诉讼、股权转让优先购买权 |\n| [[案例-公司资本制度]] | 3 | 出资瑕疵、抽逃出资、资本充实原则 |\n| [[案例-对赌协议效力]] | 4 | 海富案、强静延案、通联案、华工案——对赌协议效力认定演变 |\n| [[案例-公司人格否认]] | 3 | 徐工集团案——人格混同、过度控制、横向穿透 |\n| [[案例-股东知情权纠纷]] | 3 | 会计账簿查阅权、不正当目的抗辩、瑕疵出资与知情权 |\n| [[案例-公司决议效力纠纷]] | 3 | 决议无效、可撤销、不成立——效力三分法 |\n\n## 02-合同法（6篇）\n\n| 文件 | 案例数 | 主要内容 |\n|------|--------|---------|\n| [[案例-合同效力系列]] | 3 | 合同效力认定、预约合同、合同解除 |\n| [[案例-民间借贷系列]] | 3 | 借贷合意认定、利息上限、刑民交叉 |\n| [[案例-合同编通则司法解释]] | 3 | 预约合同效力、格式条款解释、合同保全代位权 |\n| [[案例-担保制度司法解释]] | 6 | 独立保函欺诈、让与担保、追偿权、抵押权消灭、保证金金钱质押、质权排除执行 |\n| [[案例-违约金调整规则]] | 3 | 举证责任、损失认定、合理预见范围 |\n| [[案例-让与担保效力]] | 3 | 让与担保与流质条款、股权转让担保、优先受偿 |\n\n## 03-物权法（1篇）\n\n| 文件 | 案例数 | 主要内容 |\n|------|--------|---------|\n| [[案例-物权新增制度]] | 3 | 居住权、动产担保统一登记、土地经营权 |\n\n## 04-侵权责任法（2篇）\n\n| 文件 | 案例数 | 主要内容 |\n|------|--------|---------|\n| [[案例-侵权责任新规则]] | 8 | 自甘风险、安全保障义务、网络侵权、生态环境损害赔偿、交通事故套牌车责任、受害人特殊体质、光污染、海洋污染 |\n| [[案例-高空抛物责任]] | 3 | 高空抛物侵权责任、物业安全保障义务、因果关系认定 |\n\n## 05-劳动与消费者权益（2篇）\n\n| 文件 | 案例数 | 主要内容 |\n|------|--------|---------|\n| [[案例-劳动争议系列]] | 3 | 劳动关系认定、竞业限制、违法解除赔偿 |\n| [[案例-消费者权益系列]] | 3 | 惩罚性赔偿、食品安全、虚假宣传 |\n\n## 06-建设工程（1篇）\n\n| 文件 | 案例数 | 主要内容 |\n|------|--------|---------|\n| [[案例-建设工程系列]] | 3 | 建设工程价款优先权、实际施工人权利、工期争议 |\n\n---\n\n## 案例统计\n\n| 领域 | 文件数 | 案例数（约） |\n|------|--------|------------|\n| 公司法 | 6 | 19 |\n| 合同法 | 6 | 21 |\n| 物权法 | 1 | 3 |\n| 侵权责任法 | 2 | 11 |\n| 劳动与消费者权益 | 2 | 6 |\n| 建设工程 | 1 | 3 |\n| **合计** | **18** | **约63** |\n\n> [!note] 说明\n> - 指导案例来源于最高人民法院发布的指导性案例及公报案例\n> - 省高院典型案例来源于各省高级人民法院发布的典型案例\n> - 专题案例来源于最高人民法院及各地法院公开裁判文书，裁判要旨和裁判理由系基于公开文书整理提炼，部分内容经概括归纳"},{"id":"常用法律数据库","title":"常用法律数据库","excerpt":"法律数据库是民法实务工作者不可或缺的工具。高效利用数据库进行法条检索、案例研读、学术文献查阅，直接影响案件研判质量和诉讼策略制定。本文梳理国内主流法律数据库的功能特点、适用场景及检索技巧。 性质 ：最高人民法院主办，全球最大的裁判文书公开平台 收录范围 ：2014年起各级法院生效裁判文书，覆盖刑事、民事、行政、执行等全部案件类型 优势 ：权威性最高、数据最全；支持全文检索、按法院层级/地域/案由/","slug":"常用法律数据库","module":"07-工具与资源","moduleName":"工具与资源","tags":["民法","法律数据库","检索工具","实务资源"],"wordCount":1312,"created":"2026-05-28","updated":"2026-05-28","content":"# 常用法律数据库\n\n## 概述\n\n法律数据库是民法实务工作者不可或缺的工具。高效利用数据库进行法条检索、案例研读、学术文献查阅，直接影响案件研判质量和诉讼策略制定。本文梳理国内主流法律数据库的功能特点、适用场景及检索技巧。\n\n## 核心内容\n\n### 一、官方数据库\n\n#### 1. 中国裁判文书网（wenshu.court.gov.cn）\n- **性质**：最高人民法院主办，全球最大的裁判文书公开平台\n- **收录范围**：2014年起各级法院生效裁判文书，覆盖刑事、民事、行政、执行等全部案件类型\n- **优势**：权威性最高、数据最全；支持全文检索、按法院层级/地域/案由/审判程序筛选\n- **局限**：检索功能相对基础，高级筛选不够灵活；近年部分文书因隐私保护下架比例上升\n- **适用场景**：类案初步检索、了解法院裁判倾向、核实特定案号文书\n\n#### 2. 最高人民法院指导案例检索\n- **来源**：最高人民法院公报、指导性案例、典型案例\n- **查询渠道**：最高人民法院官网\"权威发布\"栏目、《最高人民法院公报》\n- **指导案例效力**：根据《最高人民法院关于案例指导工作的规定》第7条，各级法院审判类似案件时应当参照\n- **适用场景**：寻找具有约束力的裁判规则，论证法律适用观点\n\n#### 3. 各省高院案例检索渠道\n- 北京高院：《审判前沿》、北京法院审判信息网\n- 上海高院：上海法院网\"裁判文书公开\"、《上海审判实践》\n- 广东高院：广东法院网、《广东审判实践》\n- 江苏高院：江苏法院网、《审判研究》\n- 浙江高院：浙江法院网、《案例指导》专刊\n- **实务提示**：省高院发布的参考性案例虽无强制参照效力，但对本辖区法院具有重要指引作用\n\n### 二、商业法律数据库\n\n#### 1. 北大法宝（pkulaw.com）\n- **核心功能**：法律法规检索、司法案例检索、法学期刊全文、英文译本\n- **特色**：法条关联检索（将法条与案例、期刊文章关联）；\"法宝联想\"功能可一键查找引用某法条的所有案例\n- **适用场景**：学术研究、法律条文沿革追踪、全面的法规汇编\n\n#### 2. 威科先行（law.wkinfo.com.cn）\n- **核心功能**：法律法规、案例、税务、劳动等多模块\n- **特色**：实务指南（Practice Tools）模块提供操作指引；文书模板丰富；税务模块专业性强\n- **适用场景**：综合性实务检索、税务法律问题、劳动争议\n\n#### 3. 法信（faxin.cn）\n- **核心功能**：最高人民法院出品，整合裁判规则、法律依据、案例\n- **特色**：裁判规则整理系统化，按专题分类；\"类案检索\"功能较强\n- **适用场景**：类案检索、裁判规则梳理、专题研究\n\n### 三、其他辅助平台\n\n| 平台 | 特点 | 适用场景 |\n|------|------|----------|\n| 无讼案例 | 检索体验好，案例关联分析 | 快速案例检索 |\n| Alpha法律智能 | 大数据分析、可视化 | 行业报告、批量检索 |\n| 国家法律法规数据库 | 官方权威，2021年上线 | 法规原文核实 |\n| 中国庭审公开网 | 庭审直播回放 | 学习庭审技巧 |\n\n## 实务要点\n\n1. **交叉验证**：重要案例至少在两个数据库核实，避免单一来源错误\n2. **时效性**：注意法规更新，使用数据库时勾选\"现行有效\"筛选\n3. **检索技巧**：善用布尔运算符（AND、OR、NOT）、精确匹配（引号\"\"）、同句/同段检索\n4. **案例核实**：引用案例务必核实案号，注意是否被再审改判或撤回\n5. **成本控制**：多数商业数据库收费较高，可利用律所/高校图书馆的机构账号\n\n## 参考来源\n\n- 最高人民法院《关于人民法院在互联网公布裁判文书的规定》（2016年修订）\n- 最高人民法院《关于案例指导工作的规定》（法发〔2010〕51号）\n- 北大法宝、威科先行、法信官方网站功能说明\n\n## 相关主题\n\n- [[法律检索技巧]]\n- [[诉讼文书模板]]\n- [[推荐书单]]"},{"id":"推荐书单","title":"推荐书单","excerpt":"系统化的专业阅读是提升民法实务能力的基础。本文按学科体系和实务需求，精选各领域权威著作，兼顾理论深度与实务操作，为法律从业者提供阅读指引。 推荐理由 ：台湾地区民法学权威，体系清晰、案例丰富，请求权基础方法论贯穿始终 核心价值 ：法律解释方法、请求权基础思维、案例分析方法 阅读建议 ：重点阅读法律行为、代理、时效章节；结合大陆《民法典》总则编对照阅读 推荐理由 ：大陆学者中体系最严谨的民法总则教科","slug":"推荐书单","module":"07-工具与资源","moduleName":"工具与资源","tags":["民法","法学书单","学术著作","实务参考"],"wordCount":1516,"created":"2026-05-28","updated":"2026-05-28","content":"# 推荐书单\n\n## 概述\n\n系统化的专业阅读是提升民法实务能力的基础。本文按学科体系和实务需求，精选各领域权威著作，兼顾理论深度与实务操作，为法律从业者提供阅读指引。\n\n## 核心内容\n\n### 一、民法总则\n\n#### 王泽鉴《民法总则》\n- **推荐理由**：台湾地区民法学权威，体系清晰、案例丰富，请求权基础方法论贯穿始终\n- **核心价值**：法律解释方法、请求权基础思维、案例分析方法\n- **阅读建议**：重点阅读法律行为、代理、时效章节；结合大陆《民法典》总则编对照阅读\n\n#### 朱庆育《民法总论》（第二版）\n- **推荐理由**：大陆学者中体系最严谨的民法总则教科书之一\n- **核心价值**：概念分析精准，法理论证深入，适合进阶阅读\n\n### 二、合同法\n\n#### 韩世远《合同法总论》（第四版）\n- **推荐理由**：大陆合同法领域标杆性著作，体系完整、论述深入\n- **核心价值**：合同成立与生效、违约责任体系、合同解释规则\n- **阅读建议**：重点关注合同效力、违约形态、损害赔偿章节\n\n#### 崔建远《合同法》（第六版）\n- **推荐理由**：体系教科书，适合全面了解合同法框架\n- **核心价值**：各论部分对典型合同的分析尤为详尽\n\n### 三、物权法\n\n#### 崔建远《物权法》（第五版）\n- **推荐理由**：物权法领域权威教科书，体系完整\n- **核心价值**：物权变动模式、担保物权体系、占有制度\n- **阅读建议**：重点关注担保物权章节，实务应用频率最高\n\n#### 王泽鉴《民法物权》\n- **推荐理由**：比较法视野开阔，案例分析方法精湛\n- **核心价值**：物权行为理论、善意取得、担保物权的比较法分析\n\n### 四、侵权责任法\n\n#### 程啸《侵权责任法》（第三版）\n- **推荐理由**：大陆侵权法领域最具影响力的教科书之一\n- **核心价值**：归责原则体系、损害赔偿计算、各类特殊侵权的构成要件\n- **阅读建议**：重点关注过错推定、因果关系认定、精神损害赔偿章节\n\n#### 王泽鉴《侵权行为》\n- **推荐理由**：比较法研究深入，案例教学典范\n- **核心价值**：侵权行为类型化、过失判断标准、纯粹经济损失\n\n### 五、公司法\n\n#### 赵旭东《公司法学》（第五版）\n- **推荐理由**：公司法领域权威教科书，紧跟立法修订\n- **核心价值**：公司治理结构、股东权利保护、公司人格否认制度\n- **阅读建议**：重点关注2023年《公司法》修订部分\n\n#### 施天涛《公司法论》（第四版）\n- **推荐理由**：理论深度与比较法视野兼备\n- **核心价值**：公司资本制度、董事义务、关联交易\n\n### 六、实务类书籍\n\n#### 《最高人民法院司法观点集成》（民事卷）\n- **推荐理由**：系统整理最高院司法观点，按专题分类\n- **核心价值**：快速定位最高院对争议问题的倾向性意见\n\n#### 邹碧华《要件审判九步法》\n- **推荐理由**：法官视角的案件分析方法论，对律师代理思路构建极具启发\n- **核心价值**：请求权基础分析法的实务应用\n\n#### 王利明《法学方法论》\n- **推荐理由**：法律解释与适用方法的系统论述\n- **核心价值**：文义解释、体系解释、目的解释等方法的实际运用\n\n### 七、司法解释理解与适用丛书\n\n#### 最高人民法院各庭室编著\n- **特点**：对每条司法解释的起草背景、条文含义、适用要点进行权威解读\n- **推荐系列**：\n  - 《民法典合同编理解与适用》\n  - 《民法典物权编理解与适用》\n  - 《民法典侵权责任编理解与适用》\n  - 《民法典婚姻家庭编理解与适用》\n  - 《公司法司法解释理解与适用》\n- **阅读建议**：实务工作中作为工具书查阅，遇到争议问题时优先参考\n\n## 实务要点\n\n1. **循序渐进**：先读体系教科书建立框架，再读专题著作深化理解\n2. **比较阅读**：同一问题参照不同学者观点，培养独立判断能力\n3. **学以致用**：阅读时结合手头案件，理论联系实际\n4. **关注修订**：《民法典》颁布后，注意区分新旧著作中与现行法不一致之处\n5. **期刊补充**：配合阅读《法学研究》《中国法学》《中外法学》等核心期刊的最新论文\n\n## 参考来源\n\n- 各著作最新版本出版信息\n- 中国法学创新网年度书单推荐\n- 法学核心期刊书评\n\n## 相关主题\n\n- [[常用法律数据库]]\n- [[法律检索技巧]]\n- [[诉讼文书模板]]"},{"id":"法律检索技巧","title":"法律检索技巧","excerpt":"法律检索是律师和法务的核心技能之一。精准高效的检索能够快速锁定法律依据、发现有利案例、预判裁判走向，直接影响案件策略制定和诉讼结果。本文系统介绍法律检索的方法论与实操技巧。 将案件事实拆解为法律构成要件 每个要件对应一组关键词 例：建设工程价款优先受偿权 → 拆解为 建设工程 优先受偿权 实际施工人 竣工验收 层次 说明 示例 法律概念 法条或学理术语 不当得利、善意取得 事实要素 案件关键事实 ","slug":"法律检索技巧","module":"07-工具与资源","moduleName":"工具与资源","tags":["民法","法律检索","检索技巧","类案检索","实务方法"],"wordCount":1472,"created":"2026-05-28","updated":"2026-05-28","content":"# 法律检索技巧\n\n## 概述\n\n法律检索是律师和法务的核心技能之一。精准高效的检索能够快速锁定法律依据、发现有利案例、预判裁判走向，直接影响案件策略制定和诉讼结果。本文系统介绍法律检索的方法论与实操技巧。\n\n## 核心内容\n\n### 一、检索关键词选择\n\n#### 1. 拆解法律问题\n- 将案件事实拆解为法律构成要件\n- 每个要件对应一组关键词\n- 例：建设工程价款优先受偿权 → 拆解为\"建设工程\"\"优先受偿权\"\"实际施工人\"\"竣工验收\"\n\n#### 2. 关键词层次\n| 层次 | 说明 | 示例 |\n|------|------|------|\n| 法律概念 | 法条或学理术语 | 不当得利、善意取得 |\n| 事实要素 | 案件关键事实 | 股权代持、阴阳合同 |\n| 争议焦点 | 双方分歧所在 | 合同效力、因果关系 |\n\n#### 3. 同义词与近义词扩展\n- 法律用语与日常用语的转换（如\"借钱\"→\"民间借贷\"）\n- 不同法律渊源中的表述差异（如\"解除合同\"vs\"终止合同\"）\n- 使用逻辑或运算符（OR）连接同义词\n\n### 二、法条关联检索\n\n#### 1. 正向检索：从法条到案例\n- 输入目标法条编号（如\"[[⚖️ 民法实务知识库/08-法规全文/中华人民共和国民法典#第577条|民法典第577条]]\"）\n- 筛选引用该法条的裁判文书\n- 分析法院适用该法条的具体情形\n\n#### 2. 逆向检索：从案例到法条\n- 输入案件事实关键词\n- 查看检索结果中法院援引的法条\n- 反向确认法律适用是否准确\n\n#### 3. 体系检索：法条关联网络\n- 查找某法条的上位法、下位法、相关法条\n- 追踪司法解释对该法条的细化规定\n- 关注法条历次修改的沿革\n\n### 三、案例检索策略\n\n#### 1. 检索维度组合\n```\n案由 + 关键事实 + 争议焦点 + 法院层级 + 时间范围\n```\n\n#### 2. 筛选优先级\n1. **指导性案例**：具有\"应当参照\"的效力\n2. **公报案例**：最高院公报发布的典型案例\n3. **最高院案例**：最高院本部及巡回法庭裁判\n4. **省高院案例**：本辖区高院参考性案例\n5. **同级法院案例**：受案法院及同级法院裁判\n\n#### 3. 检索结果分析\n- 统计裁判倾向：支持率、驳回率\n- 提炼裁判规则：法院的论证逻辑和关键考量因素\n- 区分有利与不利案例：客观评估己方案件的裁判预期\n\n### 四、类案检索\n\n#### 1. 类案判断标准\n根据《最高人民法院关于统一法律适用加强类案检索的指导意见（试行）》，类案需同时满足：\n- 基本事实相似\n- 争议焦点相似\n- 法律适用相似\n\n#### 2. 类案检索范围\n- 指导性案例\n- 最高院发布的典型案例及裁判生效的案件\n- 上一级法院及本院裁判生效的案件\n- 与待审案件法律适用争议类似的其他案例\n\n#### 3. 类案检索报告撰写\n- 检索平台：注明使用的数据库\n- 检索关键词：列出完整检索式\n- 检索时间：明确检索日期\n- 案例列表：按相关性排序，注明案号、法院、裁判日期、裁判要旨\n- 结论分析：归纳裁判倾向，论证己方观点\n\n### 五、高级检索技巧\n\n#### 1. 布尔运算符\n- **AND**：同时包含多个关键词（缩小范围）\n- **OR**：包含任一关键词（扩大范围）\n- **NOT**：排除特定关键词（过滤噪音）\n\n#### 2. 精确匹配\n- 使用引号\"\"进行精确短语检索\n- 例：\"建设工程价款优先受偿权\" vs 建设工程 优先受偿权\n\n#### 3. 同句/同段检索\n- 部分数据库支持\"w/n\"（同句）\"s/n\"（同段）运算符\n- 例：股权 w/3 代持（股权和代持出现在同一句子中）\n\n#### 4. 截词检索\n- 使用通配符匹配词根相同的词\n- 例：合同* 可匹配\"合同法\"\"合同效力\"\"合同纠纷\"\n\n## 实务要点\n\n1. **检索记录**：每次检索保留完整的检索式和结果截图，便于复核和引用\n2. **迭代优化**：首次检索结果不理想时，调整关键词和筛选条件反复尝试\n3. **交叉验证**：同一问题在不同数据库检索，对比结果差异\n4. **时效检查**：注意法规和案例的时效性，确认是否为现行有效\n5. **团队共享**：建立团队检索模板库，统一常用检索式和筛选条件\n\n## 参考来源\n\n- 最高人民法院《关于统一法律适用加强类案检索的指导意见（试行）》（法发〔2020〕24号）\n- 《法律检索：方法与实践》\n- 北大法宝、威科先行检索功能使用指南\n\n## 相关主题\n\n- [[常用法律数据库]]\n- [[诉讼文书模板]]\n- [[推荐书单]]"},{"id":"诉讼文书模板","title":"诉讼文书模板","excerpt":"诉讼文书是民事诉讼中表达当事人诉求、阐述事实与法律依据的核心载体。文书质量直接影响法官对案件的初步判断和庭审效率。本文系统梳理民事诉讼各阶段常用文书的结构要点与注意事项。 当事人信息 ：原告、被告基本信息（自然人写明姓名、性别、出生日期、住所地、身份证号；法人写明名称、住所地、法定代表人） 诉讼请求 ：明确、具体、可执行；分项列明，金额需精确到元 事实与理由 ：时间线清晰，因果关系明确，法律依据具","slug":"诉讼文书模板","module":"07-工具与资源","moduleName":"工具与资源","tags":["民法","诉讼文书","起诉状","答辩状","实务模板"],"wordCount":1432,"created":"2026-05-28","updated":"2026-05-28","content":"# 诉讼文书模板\n\n## 概述\n\n诉讼文书是民事诉讼中表达当事人诉求、阐述事实与法律依据的核心载体。文书质量直接影响法官对案件的初步判断和庭审效率。本文系统梳理民事诉讼各阶段常用文书的结构要点与注意事项。\n\n## 核心内容\n\n### 一、起诉状\n\n#### 结构要点\n1. **当事人信息**：原告、被告基本信息（自然人写明姓名、性别、出生日期、住所地、身份证号；法人写明名称、住所地、法定代表人）\n2. **诉讼请求**：明确、具体、可执行；分项列明，金额需精确到元\n3. **事实与理由**：时间线清晰，因果关系明确，法律依据具体到条款项\n4. **证据清单**：随起诉状一并提交\n\n#### 注意事项\n- 诉讼请求应穷尽所有可主张的权益（遗漏增加请求可能面临一事不再理限制）\n- 事实部分避免主观评价，以客观叙述为主\n- 管辖法院选择需提前论证，注意级别管辖和地域管辖规则\n\n### 二、答辩状\n\n#### 结构要点\n1. **对原告诉讼请求的回应**：逐项认可或反驳\n2. **事实抗辩**：对原告陈述的事实逐条回应，指出不实之处\n3. **法律抗辩**：援引有利法条，论证原告请求不成立\n4. **反诉请求**（如有）\n\n#### 注意事项\n- 答辩期限：收到起诉状副本之日起15日内（普通程序）\n- 未答辩不影响案件审理，但会丧失先手阐述机会\n- 重点针对诉讼请求的构成要件进行反驳\n\n### 三、上诉状\n\n#### 结构要点\n1. **上诉人与被上诉人信息**\n2. **上诉请求**：明确要求改判或发回重审\n3. **上诉理由**：聚焦一审判决的事实认定错误或法律适用错误\n4. **证据补充**（如有新证据）\n\n#### 注意事项\n- 上诉期限：判决书送达之日起15日内，裁定书10日内\n- 上诉理由应精准，避免面面俱到反而失去重点\n- 二审以一审为基础，重点指出一审裁判的瑕疵\n\n### 四、代理词\n\n#### 结构要点\n1. **案件基本情况概述**\n2. **争议焦点归纳**（与法官庭审总结呼应）\n3. **逐项论证**：事实认定+法律适用+逻辑推理\n4. **结论与代理意见**\n\n#### 注意事项\n- 庭后及时提交，趁法官尚未形成内心确定时影响判断\n- 论证层次分明，采用\"大前提-小前提-结论\"三段论结构\n- 引用案例应注明案号，增强说服力\n\n### 五、财产保全申请书\n\n#### 结构要点\n1. **申请人与被申请人信息**\n2. **保全请求**：明确保全财产的种类、数量、金额\n3. **事实与理由**：说明情况紧急、不保全将导致判决难以执行\n4. **担保说明**\n\n#### 注意事项\n- 诉前保全需在30日内起诉，否则法院解除保全\n- 保全金额不应明显超过诉讼请求金额\n- 需提供等额担保（部分法院接受保全保险）\n\n### 六、证据目录\n\n#### 结构要点\n| 序号 | 证据名称 | 证据来源 | 证明对象 | 页码 |\n|------|----------|----------|----------|------|\n| 1 | 合同原件 | 原告持有 | 合同关系成立 | P1-5 |\n\n#### 注意事项\n- 按证明对象分类编排，而非简单罗列\n- 每份证据的\"证明对象\"应与诉讼请求的构成要件对应\n- 原件与复印件需区分标注\n\n### 七、强制执行申请书\n\n#### 结构要点\n1. **申请执行人与被执行人信息**\n2. **执行依据**：生效裁判文书案号\n3. **执行请求**：明确执行标的金额或行为\n4. **被执行人财产线索**\n\n#### 注意事项\n- 申请执行期限：判决生效后2年内\n- 提供被执行人的财产线索可大幅提高执行效率\n- 可同时申请限制被执行人高消费、纳入失信被执行人名单\n\n## 实务要点\n\n1. **格式统一**：各地法院可能有地方格式要求，起诉前查阅受案法院官网\n2. **语言规范**：使用法言法语，避免口语化表达；措辞严谨但不晦涩\n3. **版本管理**：文书修改需留痕，保留各版本底稿\n4. **保密义务**：代理词、答辩状等策略性文书不宜提前向对方披露\n5. **电子化**：部分法院要求电子提交，注意文件格式（PDF）和大小限制\n\n## 参考来源\n\n- 《中华人民共和国民事诉讼法》（2023年修正）\n- 最高人民法院《民事诉讼文书样式》\n- 各地法院诉讼服务中心发布的文书格式指引\n\n## 相关主题\n\n- [[常用法律数据库]]\n- [[法律检索技巧]]\n- [[推荐书单]]"},{"id":"中华人民共和国民法典","title":"中华人民共和国民法典","excerpt":"（2020年5月28日第十三届全国人民代表大会第三次会议通过） 为了保护民事主体的合法权益，调整民事关系，维护社会和经济秩序，适应中国特色社会主义发展要求，弘扬社会主义核心价值观，根据宪法，制定本法。 民法调整平等主体的自然人、法人和非法人组织之间的人身关系和财产关系。 民事主体的人身权利、财产权利以及其他合法权益受法律保护，任何组织或者个人不得侵犯。 民事主体在民事活动中的法律地位一律平等。 民","slug":"中华人民共和国民法典","module":"08-法规全文","moduleName":"法规全文","tags":[],"wordCount":102175,"created":"2026-06-03","updated":"2026-06-03","content":"# 中华人民共和国民法典\n> （2020年5月28日第十三届全国人民代表大会第三次会议通过）\n\n## 第1编　总则\n\n### 第1章　基本规定\n\n### 第1条\n为了保护民事主体的合法权益，调整民事关系，维护社会和经济秩序，适应中国特色社会主义发展要求，弘扬社会主义核心价值观，根据宪法，制定本法。\n### 第2条\n民法调整平等主体的自然人、法人和非法人组织之间的人身关系和财产关系。\n### 第3条\n民事主体的人身权利、财产权利以及其他合法权益受法律保护，任何组织或者个人不得侵犯。\n### 第4条\n民事主体在民事活动中的法律地位一律平等。\n### 第5条\n民事主体从事民事活动，应当遵循自愿原则，按照自己的意思设立、变更、终止民事法律关系。\n### 第6条\n民事主体从事民事活动，应当遵循公平原则，合理确定各方的权利和义务。\n### 第7条\n民事主体从事民事活动，应当遵循诚信原则，秉持诚实，恪守承诺。\n### 第8条\n民事主体从事民事活动，不得违反法律，不得违背公序良俗。\n### 第9条\n民事主体从事民事活动，应当有利于节约资源、保护生态环境。\n### 第10条\n处理民事纠纷，应当依照法律；法律没有规定的，可以适用习惯，但是不得违背公序良俗。\n### 第11条\n其他法律对民事关系有特别规定的，依照其规定。\n### 第12条\n中华人民共和国领域内的民事活动，适用中华人民共和国法律。法律另有规定的，依照其规定。\n### 第2章　自然人\n\n#### 第1节　民事权利能力和民事行为能力\n\n### 第13条\n自然人从出生时起到死亡时止，具有民事权利能力，依法享有民事权利，承担民事义务。\n### 第14条\n自然人的民事权利能力一律平等。\n### 第15条\n自然人的出生时间和死亡时间，以出生证明、死亡证明记载的时间为准；没有出生证明、死亡证明的，以户籍登记或者其他有效身份登记记载的时间为准。有其他证据足以推翻以上记载时间的，以该证据证明的时间为准。\n### 第16条\n涉及遗产继承、接受赠与等胎儿利益保护的，胎儿视为具有民事权利能力。但是，胎儿娩出时为死体的，其民事权利能力自始不存在。\n### 第17条\n十八周岁以上的自然人为成年人。不满十八周岁的自然人为未成年人。\n### 第18条\n成年人为完全民事行为能力人，可以独立实施民事法律行为。\n十六周岁以上的未成年人，以自己的劳动收入为主要生活来源的，视为完全民事行为能力人。\n### 第19条\n八周岁以上的未成年人为限制民事行为能力人，实施民事法律行为由其法定代理人代理或者经其法定代理人同意、追认；但是，可以独立实施纯获利益的民事法律行为或者与其年龄、智力相适应的民事法律行为。\n### 第20条\n不满八周岁的未成年人为无民事行为能力人，由其法定代理人代理实施民事法律行为。\n### 第21条\n不能辨认自己行为的成年人为无民事行为能力人，由其法定代理人代理实施民事法律行为。\n八周岁以上的未成年人不能辨认自己行为的，适用前款规定。\n### 第22条\n不能完全辨认自己行为的成年人为限制民事行为能力人，实施民事法律行为由其法定代理人代理或者经其法定代理人同意、追认；但是，可以独立实施纯获利益的民事法律行为或者与其智力、精神健康状况相适应的民事法律行为。\n### 第23条\n无民事行为能力人、限制民事行为能力人的监护人是其法定代理人。\n### 第24条\n不能辨认或者不能完全辨认自己行为的成年人，其利害关系人或者有关组织，可以向人民法院申请认定该成年人为无民事行为能力人或者限制民事行为能力人。\n被人民法院认定为无民事行为能力人或者限制民事行为能力人的，经本人、利害关系人或者有关组织申请，人民法院可以根据其智力、精神健康恢复的状况，认定该成年人恢复为限制民事行为能力人或者完全民事行为能力人。\n本条规定的有关组织包括：居民委员会、村民委员会、学校、医疗机构、妇女联合会、残疾人联合会、依法设立的老年人组织、民政部门等。\n### 第25条\n自然人以户籍登记或者其他有效身份登记记载的居所为住所；经常居所与住所不一致的，经常居所视为住所。\n#### 第2节　监护\n\n### 第26条\n父母对未成年子女负有抚养、教育和保护的义务。\n成年子女对父母负有赡养、扶助和保护的义务。\n### 第27条\n父母是未成年子女的监护人。\n未成年人的父母已经死亡或者没有监护能力的，由下列有监护能力的人按顺序担任监护人：\n（一）祖父母、外祖父母；\n（二）兄、姐；\n（三）其他愿意担任监护人的个人或者组织，但是须经未成年人住所地的居民委员会、村民委员会或者民政部门同意。\n### 第28条\n无民事行为能力或者限制民事行为能力的成年人，由下列有监护能力的人按顺序担任监护人：\n（一）配偶；\n（二）父母、子女；\n（三）其他近亲属；\n（四）其他愿意担任监护人的个人或者组"},{"id":"九民纪要","title":"九民纪要","excerpt":"法〔2019〕254号 最高人民法院 发布时间：2019年11月14日 2019年9月11日经最高人民法院审判委员会民事行政专业委员会第319次会议原则通过 各省、自治区、直辖市高级人民法院，解放军军事法院，新疆维吾尔自治区高级人民法院生产建设兵团分院： 《全国法院民商事审判工作会议纪要》（以下简称《会议纪要》）已于2019年9月11日经最高人民法院审判委员会民事行政专业委员会第319次会议原则通","slug":"九民纪要","module":"08-法规全文","moduleName":"法规全文","tags":[],"wordCount":35724,"created":"2026-06-04","updated":"2026-06-04","content":"# 全国法院民商事审判工作会议纪要（九民纪要）\n\n> 法〔2019〕254号\n> 最高人民法院\n> 发布时间：2019年11月14日\n> 2019年9月11日经最高人民法院审判委员会民事行政专业委员会第319次会议原则通过\n\n## 最高人民法院关于印发《全国法院民商事审判工作会议纪要》的通知\n\n各省、自治区、直辖市高级人民法院，解放军军事法院，新疆维吾尔自治区高级人民法院生产建设兵团分院：\n\n《全国法院民商事审判工作会议纪要》（以下简称《会议纪要》）已于2019年9月11日经最高人民法院审判委员会民事行政专业委员会第319次会议原则通过。为便于进一步学习领会和正确适用《会议纪要》，特作如下通知：\n\n一、充分认识《会议纪要》出台的意义\n\n《会议纪要》针对民商事审判中的前沿疑难争议问题，在广泛征求各方面意见的基础上，经最高人民法院审判委员会民事行政专业委员会讨论决定。《会议纪要》的出台，对统一裁判思路，规范法官自由裁量权，增强民商事审判的公开性、透明度以及可预期性，提高司法公信力具有重要意义。各级人民法院要正确把握和理解适用《会议纪要》的精神实质和基本内容。\n\n二、及时组织学习培训\n\n为使各级人民法院尽快准确理解掌握《会议纪要》的内涵，在案件审理中正确理解适用，各级人民法院要在妥善处理好工学关系的前提下，通过多种形式组织学习培训，做好宣传工作。\n\n三、准确把握《会议纪要》的应用范围\n\n纪要不是司法解释，不能作为裁判依据进行援引。《会议纪要》发布后，人民法院尚未审结的一审、二审案件，在裁判文书\"本院认为\"部分具体分析法律适用的理由时，可以根据《会议纪要》的相关规定进行说理。\n\n对于适用中存在的问题,请层报最高人民法院。\n\n最高人民法院\n2019年11月8日\n\n---\n\n## 目录\n\n- 引言\n- 一、关于民法总则适用的法律衔接\n- 二、关于公司纠纷案件的审理\n- 三、关于合同纠纷案件的审理\n- 四、关于担保纠纷案件的审理\n- 五、关于金融消费者权益保护纠纷案件的审理\n- 六、关于证券纠纷案件的审理\n- 七、关于营业信托纠纷案件的审理\n- 八、关于财产保险合同纠纷案件的审理\n- 九、关于票据纠纷案件的审理\n- 十、关于破产纠纷案件的审理\n- 十一、关于案外人救济案件的审理\n- 十二、关于民刑交叉案件的程序处理\n\n---\n\n## 引言\n\n为全面贯彻党的十九大和十九届二中、三中全会以及中央经济工作会议、中央政法工作会议、全国金融工作会议精神，研究当前形势下如何进一步加强人民法院民商事审判工作，着力提升民商事审判工作能力和水平，为我国经济高质量发展提供更加有力的司法服务和保障，最高人民法院于2019年7月3日至4日在黑龙江省哈尔滨市召开了全国法院民商事审判工作会议。最高人民法院党组书记、院长周强同志出席会议并讲话。各省、自治区、直辖市高级人民法院分管民商事审判工作的副院长、承担民商事案件审判任务的审判庭庭长、解放军军事法院的代表、最高人民法院有关部门负责人在主会场出席会议，地方各级人民法院的其他负责同志和民商事审判法官在各地分会场通过视频参加会议。中央政法委、全国人大常委会法工委的代表、部分全国人大代表、全国政协委员、最高人民法院特约监督员、专家学者应邀参加会议。\n\n会议认为，民商事审判工作必须坚持正确的政治方向，必须以习近平新时代中国特色社会主义思想武装头脑、指导实践、推动工作。一要坚持党的绝对领导。这是中国特色社会主义司法制度的本质特征和根本要求，是人民法院永远不变的根和魂。在民商事审判工作中，要切实增强\"四个意识\"、坚定\"四个自信\"、做到\"两个维护\"，坚定不移走中国特色社会主义法治道路。二要坚持服务党和国家大局。认清形势，高度关注中国特色社会主义进入新时代背景下经济社会的重大变化、社会主要矛盾的历史性变化、各类风险隐患的多元多变，提高服务大局的自觉性、针对性，主动作为，勇于担当，处理好依法办案和服务大局的辩证关系，着眼于贯彻落实党中央的重大决策部署、维护人民群众的根本利益、维护法治的统一。三要坚持司法为民。牢固树立以人民为中心的发展思想，始终坚守人民立场，胸怀人民群众，满足人民需求，带着对人民群众的深厚感情和强烈责任感去做好民商事审判工作。在民商事审判工作中要弘扬社会主义核心价值观，注意情理法的交融平衡，做到以法为据、以理服人、以情感人，既要义正辞严讲清法理，又要循循善诱讲明事理，还要感同身受讲透情理，争取广大人民群众和社会的理解与支持。要建立健全方便人民群众诉讼的民商事审判工作机制。四要坚持公正司法。公平正义是中国特色社会主义制度的内在要求，也是我党治国理政的一贯主张。司法是维护社会公平正义的最后一道防线，必须把公平正义作为生命线，必须把公平正义作为镌刻在心中的价值坐标，必须把\"努力让人民群众在每一个司法案件中感受到公平正义\"作为矢"},{"id":"合同编通则司法解释","title":"合同编通则司法解释","excerpt":"法释〔2023〕13号 （2023年5月23日最高人民法院审判委员会第1889次会议通过，自2023年12月5日起施行） 为正确审理合同纠纷案件以及非因合同产生的债权债务关系纠纷案件，依法保护当事人的合法权益，根据《中华人民共和国民法典》、《中华人民共和国民事诉讼法》等相关法律规定，结合审判实践，制定本解释。 人民法院依据民法典第一百四十二条第一款、第四百六十六条第一款的规定解释合同条款时，应当以","slug":"合同编通则司法解释","module":"08-法规全文","moduleName":"法规全文","tags":[],"wordCount":9811,"created":"2026-06-03","updated":"2026-06-03","content":"# 最高人民法院关于适用《中华人民共和国民法典》合同编通则若干问题的解释\n\n> 法释〔2023〕13号\n> （2023年5月23日最高人民法院审判委员会第1889次会议通过，自2023年12月5日起施行）\n\n为正确审理合同纠纷案件以及非因合同产生的债权债务关系纠纷案件，依法保护当事人的合法权益，根据《中华人民共和国民法典》、《中华人民共和国民事诉讼法》等相关法律规定，结合审判实践，制定本解释。\n\n## 一、一般规定\n\n### 第1条\n人民法院依据民法典第一百四十二条第一款、第四百六十六条第一款的规定解释合同条款时，应当以词句的通常含义为基础，结合相关条款、合同的性质和目的、习惯以及诚信原则，参考缔约背景、磋商过程、履行行为等因素确定争议条款的含义。\n\n有证据证明当事人之间对合同条款有不同于词句的通常含义的其他共同理解，一方主张按照词句的通常含义理解合同条款的，人民法院不予支持。\n\n对合同条款有两种以上解释，可能影响该条款效力的，人民法院应当选择有利于该条款有效的解释；属于无偿合同的，应当选择对债务人负担较轻的解释。\n\n### 第2条\n下列情形，不违反法律、行政法规的强制性规定且不违背公序良俗的，人民法院可以认定为民法典所称的\"交易习惯\"：\n\n（一）当事人之间在交易活动中的惯常做法；\n\n（二）在交易行为当地或者某一领域、某一行业通常采用并为交易对方订立合同时所知道或者应当知道的做法。\n\n对于交易习惯，由提出主张的当事人一方承担举证责任。\n\n## 二、合同的订立\n\n### 第3条\n当事人对合同是否成立存在争议，人民法院能够确定当事人姓名或者名称、标的和数量的，一般应当认定合同成立。但是，法律另有规定或者当事人另有约定的除外。\n\n根据前款规定能够认定合同已经成立的，对合同欠缺的内容，人民法院应当依据民法典第五百一十条、第五百一十一条等规定予以确定。\n\n当事人主张合同无效或者请求撤销、解除合同等，人民法院认为合同不成立的，应当依据《最高人民法院关于民事诉讼证据的若干规定》第五十三条的规定将合同是否成立作为焦点问题进行审理，并可以根据案件的具体情况重新指定举证期限。\n\n### 第4条\n采取招标方式订立合同，当事人请求确认合同自中标通知书到达中标人时成立的，人民法院应予支持。合同成立后，当事人拒绝签订书面合同的，人民法院应当依据招标文件、投标文件和中标通知书等确定合同内容。\n\n采取现场拍卖、网络拍卖等公开竞价方式订立合同，当事人请求确认合同自拍卖师落槌、电子交易系统确认成交时成立的，人民法院应予支持。合同成立后，当事人拒绝签订成交确认书的，人民法院应当依据拍卖公告、竞买人的报价等确定合同内容。\n\n产权交易所等机构主持拍卖、挂牌交易，其公布的拍卖公告、交易规则等文件公开确定了合同成立需要具备的条件，当事人请求确认合同自该条件具备时成立的，人民法院应予支持。\n\n### 第5条\n第三人实施欺诈、胁迫行为，使当事人在违背真实意思的情况下订立合同，受到损失的当事人请求第三人承担赔偿责任的，人民法院依法予以支持；当事人亦有违背诚信原则的行为的，人民法院应当根据各自的过错确定相应的责任。但是，法律、司法解释对当事人与第三人的民事责任另有规定的，依照其规定。\n\n### 第6条\n当事人以认购书、订购书、预订书等形式约定在将来一定期限内订立合同，或者为担保在将来一定期限内订立合同交付了定金，能够确定将来所要订立合同的主体、标的等内容的，人民法院应当认定预约合同成立。\n\n当事人通过签订意向书或者备忘录等方式，仅表达交易的意向，未约定在将来一定期限内订立合同，或者虽然有约定但是难以确定将来所要订立合同的主体、标的等内容，一方主张预约合同成立的，人民法院不予支持。\n\n当事人订立的认购书、订购书、预订书等已就合同标的、数量、价款或者报酬等主要内容达成合意，符合本解释第三条第一款规定的合同成立条件，未明确约定在将来一定期限内另行订立合同，或者虽然有约定但是当事人一方已实施履行行为且对方接受的，人民法院应当认定本约合同成立。\n\n### 第7条\n预约合同生效后，当事人一方拒绝订立本约合同或者在磋商订立本约合同时违背诚信原则导致未能订立本约合同的，人民法院应当认定该当事人不履行预约合同约定的义务。\n\n人民法院认定当事人一方在磋商订立本约合同时是否违背诚信原则，应当综合考虑该当事人在磋商时提出的条件是否明显背离预约合同约定的内容以及是否已尽合理努力进行协商等因素。\n\n### 第8条\n预约合同生效后，当事人一方不履行订立本约合同的义务，对方请求其赔偿因此造成的损失的，人民法院依法予以支持。\n\n前款规定的损失赔偿，当事人有约定的，按照约定；没有约定的，人民法院应当综合考虑预约合同在内容上的完备程度以及订立本约合同的条件的成就程度等因素酌定。\n\n### 第9条\n合同条款符合民法典第"},{"id":"担保制度司法解释","title":"担保制度司法解释","excerpt":"法释〔2020〕28号 （2020年12月25日最高人民法院审判委员会第1824次会议通过，自2021年1月1日起施行） 为正确适用《中华人民共和国民法典》有关担保制度的规定，结合民事审判实践，制定本解释。 因抵押、质押、留置、保证等担保发生的纠纷，适用本解释。所有权保留买卖、融资租赁、保理等涉及担保功能发生的纠纷，适用本解释的有关规定。 当事人在担保合同中约定担保合同的效力独立于主合同，或者约定","slug":"担保制度司法解释","module":"08-法规全文","moduleName":"法规全文","tags":[],"wordCount":14186,"created":"2026-06-03","updated":"2026-06-03","content":"# 最高人民法院关于适用《中华人民共和国民法典》有关担保制度的解释\n\n> 法释〔2020〕28号\n> （2020年12月25日最高人民法院审判委员会第1824次会议通过，自2021年1月1日起施行）\n\n为正确适用《中华人民共和国民法典》有关担保制度的规定，结合民事审判实践，制定本解释。\n\n## 一、关于一般规定\n\n### 第1条\n因抵押、质押、留置、保证等担保发生的纠纷，适用本解释。所有权保留买卖、融资租赁、保理等涉及担保功能发生的纠纷，适用本解释的有关规定。\n\n### 第2条\n当事人在担保合同中约定担保合同的效力独立于主合同，或者约定担保人对主合同无效的法律后果承担担保责任，该有关担保独立性的约定无效。主合同有效的，有关担保独立性的约定无效不影响担保合同的效力；主合同无效的，人民法院应当认定担保合同无效，但是法律另有规定的除外。\n\n因金融机构开立的独立保函发生的纠纷，适用《最高人民法院关于审理独立保函纠纷案件若干问题的规定》。\n\n### 第3条\n当事人对担保责任的承担约定专门的违约责任，或者约定的担保责任范围超出债务人应当承担的责任范围，担保人主张仅在债务人应当承担的责任范围内承担责任的，人民法院应予支持。\n\n担保人承担的责任超出债务人应当承担的责任范围，担保人向债务人追偿，债务人主张仅在其应当承担的责任范围内承担责任的，人民法院应予支持；担保人请求债权人返还超出部分的，人民法院依法予以支持。\n\n### 第4条\n有下列情形之一，当事人将担保物权登记在他人名下，债务人不履行到期债务或者发生当事人约定的实现担保物权的情形，债权人或者其受托人主张就该财产优先受偿的，人民法院依法予以支持：\n\n（一）为债券持有人提供的担保物权登记在债券受托管理人名下；\n\n（二）为委托贷款人提供的担保物权登记在受托人名下；\n\n（三）担保人知道债权人与他人之间存在委托关系的其他情形。\n\n### 第5条\n机关法人提供担保的，人民法院应当认定担保合同无效，但是经国务院批准为使用外国政府或者国际经济组织贷款进行转贷的除外。\n\n居民委员会、村民委员会提供担保的，人民法院应当认定担保合同无效，但是依法代行村集体经济组织职能的村民委员会，依照村民委员会组织法规定的讨论决定程序对外提供担保的除外。\n\n### 第6条\n以公益为目的的非营利性学校、幼儿园、医疗机构、养老机构等提供担保的，人民法院应当认定担保合同无效，但是有下列情形之一的除外：\n\n（一）在购入或者以融资租赁方式承租教育设施、医疗卫生设施、养老服务设施和其他公益设施时，出卖人、出租人为担保价款或者租金实现而在该公益设施上保留所有权；\n\n（二）以教育设施、医疗卫生设施、养老服务设施和其他公益设施以外的不动产、动产或者财产权利设立担保物权。\n\n登记为营利法人的学校、幼儿园、医疗机构、养老机构等提供担保，当事人以其不具有担保资格为由主张担保合同无效的，人民法院不予支持。\n\n### 第7条\n公司的法定代表人违反公司法关于公司对外担保决议程序的规定，超越权限代表公司与相对人订立担保合同，人民法院应当依照民法典第六十一条和第五百零四条等规定处理：\n\n（一）相对人善意的，担保合同对公司发生效力；相对人请求公司承担担保责任的，人民法院应予支持。\n\n（二）相对人非善意的，担保合同对公司不发生效力；相对人请求公司承担赔偿责任的，参照适用本解释第十七条的有关规定。\n\n法定代表人超越权限提供担保造成公司损失，公司请求法定代表人承担赔偿责任的，人民法院应予支持。\n\n第一款所称善意，是指相对人在订立担保合同时不知道且不应当知道法定代表人超越权限。相对人有证据证明已对公司决议进行了合理审查，人民法院应当认定其构成善意，但是公司有证据证明相对人知道或者应当知道决议系伪造、变造的除外。\n\n### 第8条\n有下列情形之一，公司以其未依照公司法关于公司对外担保的规定作出决议为由主张不承担担保责任的，人民法院不予支持：\n\n（一）金融机构开立保函或者担保公司提供担保；\n\n（二）公司为其全资子公司开展经营活动提供担保；\n\n（三）担保合同系由单独或者共同持有公司三分之二以上对担保事项有表决权的股东签字同意。\n\n上市公司对外提供担保，不适用前款第二项、第三项的规定。\n\n### 第9条\n相对人根据上市公司公开披露的关于担保事项已经董事会或者股东大会决议通过的信息，与上市公司订立担保合同，相对人主张担保合同对上市公司发生效力，并由上市公司承担担保责任的，人民法院应予支持。\n\n相对人未根据上市公司公开披露的关于担保事项已经董事会或者股东大会决议通过的信息，与上市公司订立担保合同，上市公司主张担保合同对其不发生效力，且不承担担保责任或者赔偿责任的，人民法院应予支持。\n\n相对人与上市公司已公开披露的控股子公司订立的担保合同，或者相对人与股票在国务院批准的其他全国性证"}]</script> <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script> <script>(function(){const base = "/minfa-kb/";

    (function() {
      var dataEl = document.getElementById('search-data');
      if (!dataEl) return;
      var articlesData = JSON.parse(dataEl.textContent);
      var fuse = new Fuse(articlesData, {
        keys: [
          { name: 'title', weight: 0.4 },
          { name: 'tags', weight: 0.2 },
          { name: 'excerpt', weight: 0.2 },
          { name: 'content', weight: 0.2 },
        ],
        threshold: 0.4,
        includeScore: true,
        ignoreLocation: true,
        minMatchCharLength: 2,
      });

      var searchInput = document.getElementById('search-input');
      var resultsContainer = document.getElementById('search-results');
      var resultsCount = document.getElementById('results-count');
      var countNum = document.getElementById('count-num');
      var initialState = document.getElementById('initial-state');
      var tagButtons = document.querySelectorAll('.tag-btn');
      var activeTag = '';

      function formatWC(count) {
        return count >= 10000 ? (count / 10000).toFixed(1) + '万字' : count + '字';
      }

      function formatDateStr(d) {
        if (!d) return '';
        try { return new Date(d).toLocaleDateString('zh-CN'); } catch(e) { return d; }
      }

      function renderResults(results) {
        if (results.length === 0) {
          resultsContainer.innerHTML = '<div class="text-center py-12"><p class="text-gray-400 dark:text-gray-500">未找到匹配的文章</p></div>';
          return;
        }
        var base = window.__BASE_URL || '/';
        resultsContainer.innerHTML = results.map(function(r) {
          return '<a href="' + base + 'articles/' + r.slug + '/ " class="group flex items-start gap-5 py-4 border-b border-primary-200/60 dark:border-primary-800/30 transition-colors">' +
          '<div class="flex-1 min-w-0">' +
          '<div class="flex items-center gap-2 mb-1.5">' +
          '<span class="text-[11px] px-1.5 py-0.5 rounded bg-primary-100 dark:bg-primary-800/40 text-gray-500 dark:text-gray-400">' + r.moduleName + '</span>' +
          r.tags.slice(0, 3).map(function(t) { return '<span class="text-[11px] text-gray-400 dark:text-gray-600">#' + t + '</span>'; }).join('') +
          '</div>' +
          '<h3 class="text-[15px] font-medium text-gray-800 dark:text-gray-200 group-hover:text-accent-700 dark:group-hover:text-accent-400 transition-colors leading-snug">' + r.title + '</h3>' +
          (r.excerpt ? '<p class="text-xs text-gray-400 dark:text-gray-500 mt-1.5 line-clamp-2 leading-relaxed">' + r.excerpt + '</p>' : '') +
          '<div class="flex items-center gap-3 mt-2 text-[11px] text-gray-400 dark:text-gray-600">' +
          '<span>' + formatDateStr(r.updated || r.created) + '</span>' +
          '<span>·</span>' +
          '<span>' + formatWC(r.wordCount) + '</span>' +
          '</div></div>' +
          '<svg class="w-4 h-4 text-gray-300 dark:text-gray-700 group-hover:text-accent-500 transition-colors flex-shrink-0 mt-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5l7 7-7 7"></path></svg>' +
          '</a>';
        }).join('');
      }

      function performSearch(query) {
        var results;
        if (query.length > 0) {
          results = fuse.search(query).map(function(r) { return r.item; });
        } else {
          results = articlesData;
        }
        if (activeTag) {
          results = results.filter(function(r) { return r.tags.indexOf(activeTag) !== -1; });
        }
        initialState.classList.add('hidden');
        resultsCount.classList.remove('hidden');
        countNum.textContent = results.length;
        renderResults(results);
      }

      var urlParams = new URLSearchParams(window.location.search);
      var queryParam = urlParams.get('q');
      var tagParam = urlParams.get('tag');
      if (queryParam) {
        searchInput.value = queryParam;
        performSearch(queryParam);
      }
      if (tagParam) {
        activeTag = tagParam;
        var tagBtn = document.querySelector('[data-tag="' + tagParam + '"]');
        if (tagBtn) tagBtn.classList.add('bg-accent-100', 'dark:bg-accent-900/30', 'border-accent-300', 'dark:border-accent-600', 'text-accent-700', 'dark:text-accent-300');
        performSearch(searchInput.value);
      }

      searchInput.addEventListener('input', function(e) {

        if (q.length === 0 && !activeTag) {
          resultsContainer.innerHTML = '';
          resultsCount.classList.add('hidden');
          initialState.classList.remove('hidden');
          return;
        }
        performSearch(q);
      });

      tagButtons.forEach(function(btn) {
        btn.addEventListener('click', function() {
          var tag = btn.dataset.tag;
          if (activeTag === tag) {
            activeTag = '';
            btn.classList.remove('bg-accent-100', 'dark:bg-accent-900/30', 'border-accent-300', 'dark:border-accent-600', 'text-accent-700', 'dark:text-accent-300');
          } else {
            tagButtons.forEach(function(b) { b.classList.remove('bg-accent-100', 'dark:bg-accent-900/30', 'border-accent-300', 'dark:border-accent-600', 'text-accent-700', 'dark:text-accent-300'); });
            activeTag = tag;
            btn.classList.add('bg-accent-100', 'dark:bg-accent-900/30', 'border-accent-300', 'dark:border-accent-600', 'text-accent-700', 'dark:text-accent-300');
          }
          performSearch(searchInput.value.trim());
        });
