| 裁判规则 | 典型案例 |\n|------|----------"},{"id":"建筑物区分所有权","title":"建筑物区分所有权","excerpt":"--- tags: [民法, 物权法, 所有权, 建筑物区分所有权, 业主共有, 车位归属] created: 2026-05-28 updated: 2026-05-28 status: reviewed type: knowledge --- 建筑物区分所有权是城市住宅小区业主权利的核心制度，涉及专有部分所有权、共有部分共有权和共同管理权三重权利。实务中，业主共有部分的认定、车位归属、业主大会","slug":"建筑物区分所有权","module":"02-物权法","moduleName":"02-物权法","tags":["民法","物权法","所有权","建筑物区分所有权","业主共有","车位归属"],"wordCount":2237,"created":"2026-05-28","updated":"2026-05-28","content":"# 建筑物区分所有权\n\n## 概述\n\n建筑物区分所有权是城市住宅小区业主权利的核心制度，涉及专有部分所有权、共有部分共有权和共同管理权三重权利。实务中，业主共有部分的认定、车位归属、业主大会决议效力等是最常见的争议焦点。\n\n## 核心内容\n\n### 一、法律依据\n\n| 条文 | 内容要点 |\n|------|----------|\n| 《民法典》第271条 | 业主对建筑物内的住宅、经营性用房等专有部分享有所有权，对专有部分以外的共有部分享有共有和共同管理的权利 |\n| 《民法典》第272条 | 业主对其建筑物专有部分享有占有、使用、收益和处分的权利 |\n| 《民法典》第273条 | 业主对建筑物专有部分以外的共有部分，享有权利，承担义务；不得以放弃权利为由不履行义务 |\n| 《民法典》第274条 | 建筑区划内的道路、绿地、其他公共场所、公用设施和物业服务用房，属于业主共有 |\n| 《民法典》第275条 | **车位归属**：建筑区划内，规划用于停放汽车的车位、车库的归属，由当事人通过出售、附赠或者出租等方式约定。占用业主共有的道路或者其他场地用于停放汽车的车位，属于业主共有 |\n| 《民法典》第278条 | 业主共同决定事项的表决规则 |\n| 《民法典》第280条 | 业主大会或者业主委员会的决定，对业主具有法律约束力 |\n\n### 二、专有部分与共有部分的界定\n\n**专有部分**：\n\n| 判断标准 | 具体内容 |\n|----------|----------|\n| 构造上的独立性 | 具有独立的建筑结构，能够与其他部分隔离 |\n| 使用上的独立性 | 可以单独使用，有独立的出入口 |\n| 登记上的特定性 | 能够在不动产登记簿上进行单独登记 |\n\n**共有部分**：\n\n| 类型 | 具体内容 | 法律依据 |\n|------|----------|----------|\n| 法定共有 | 道路、绿地、物业服务用房 | 《民法典》第274条 |\n| 约定共有 | 车位、车库（通过合同约定） | 《民法典》第275条 |\n| 推定共有 | 专有部分以外的其他部分 | 《民法典》第273条 |\n\n**常见的业主共有部分**：\n\n| 共有部分 | 争议类型 | 裁判规则 |\n|----------|----------|----------|\n| 屋顶平台 | 开发商出售屋顶 | 属于业主共有，开发商无权出售 |\n| 外墙面 | 开发商或物业出租外墙面 | 属于业主共有，收益归业主 |\n| 电梯间 | 开发商出售或出租 | 属于业主共有 |\n| 楼梯间 | 开发商出售或出租 | 属于业主共有 |\n| 绿地 | 开发商将绿地改为车位 | 属于业主共有，不得擅自改变用途 |\n\n### 三、车位归属（实务重点）\n\n**法律规则**：\n\n| 车位类型 | 归属规则 | 法律依据 |\n|----------|----------|----------|\n| 规划内车位 | 由当事人通过出售、附赠或出租约定 | 《民法典》第275条第1款 |\n| 占用共有道路的车位 | 属于业主共有 | 《民法典》第275条第2款 |\n| 人防车位 | 国家所有，开发商有使用管理权 | 《人民防空法》 |\n\n**裁判规则**：\n\n1. **规划内车位**：开发商有权出售、出租，但应优先满足业主需要\n2. **共有道路车位**：属于业主共有，开发商无权出售\n3. **人防车位**：不能办理产权证，只能租赁，租赁期限最长20年\n\n### 四、业主大会决议\n\n**表决规则**（《民法典》第278条）：\n\n| 事项 | 表决要求 |\n|------|----------|\n| 一般事项 | 双2/3参与表决，参与表决的双过半同意 |\n| 特别事项 | 双2/3参与表决，参与表决的双2/3同意 |\n\n**特别事项包括**：\n- 筹集建筑物及其附属设施的维修资金\n- 改建、重建建筑物及其附属设施\n- 改变共有部分的用途或者利用共有部分从事经营活动\n\n**决议效力**：\n\n| 效力类型 | 情形 | 法律后果 |\n|----------|------|----------|\n| 有效 | 符合法定程序和表决比例 | 对全体业主有约束力 |\n| 无效 | 违反法律强制性规定 | 自始无效 |\n| 可撤销 | 违反法定程序，侵害业主合法权益 | 可在知道或应当知道之日起1年内请求撤销 |\n\n### 五、裁判规则\n\n| 序号 | 裁判规则 | 典型案例 |\n|------|----------|----------|\n| 1 | 屋顶平台属于业主共有，开发商无权出售 | — |\n| 2 | 外墙面属于业主共有，收益归业主 | — |\n| 3 | 规划内车位开发商有权出售，但"},{"id":"相邻关系","title":"相邻关系","excerpt":"--- tags: [民法, 物权法, 所有权, 相邻关系, 通风采光, 排水通行] created: 2026-05-28 updated: 2026-05-28 status: reviewed type: knowledge --- 相邻关系是指两个以上相互毗邻的不动产所有人或使用人，在行使不动产权利时，因相邻各方应当给予便利和接受限制而发生的权利义务关系。相邻关系纠纷在基层法院民事案件中占","slug":"相邻关系","module":"02-物权法","moduleName":"02-物权法","tags":["民法","物权法","所有权","相邻关系","通风采光","排水通行"],"wordCount":2182,"created":"2026-05-28","updated":"2026-05-28","content":"# 相邻关系\n\n## 概述\n\n相邻关系是指两个以上相互毗邻的不动产所有人或使用人，在行使不动产权利时，因相邻各方应当给予便利和接受限制而发生的权利义务关系。相邻关系纠纷在基层法院民事案件中占有相当比例，主要涉及通风、采光、排水、通行、噪音等问题。\n\n## 核心内容\n\n### 一、法律依据\n\n| 条文 | 内容要点 |\n|------|----------|\n| 《民法典》第288条 | 相邻关系的基本原则：有利生产、方便生活、团结互助、公平合理 |\n| 《民法典》第289条 | 法律、法规对处理相邻关系有规定的，依照规定；没有规定的，可以按照当地习惯 |\n| 《民法典》第290条 | **用水、排水**：不动产权利人应当为相邻权利人用水、排水提供必要的便利 |\n| 《民法典》第291条 | **通行**：不动产权利人对相邻权利人因通行等必须利用其土地的，应当提供必要的便利 |\n| 《民法典》第292条 | **管线铺设**：不动产权利人因铺设电线、电缆、水管等必须利用相邻土地的，该土地的权利人应当提供必要的便利 |\n| 《民法典》第293条 | **通风、采光**：建造建筑物，不得违反国家有关工程建设标准，不得妨碍相邻建筑物的通风、采光和日照 |\n| 《民法典》第294条 | **排放有害物质**：不动产权利人不得违反国家规定弃置固体废物，排放大气污染物、水污染物、土壤污染物、噪声、光辐射、电磁辐射等有害物质 |\n| 《民法典》第295条 | **挖掘、建造**：不动产权利人挖掘土地、建造建筑物等不得危及相邻不动产的安全 |\n\n### 二、相邻关系的类型\n\n| 类型 | 具体内容 | 法律依据 |\n|------|----------|----------|\n| 用水、排水相邻关系 | 上游不得截断水源，排水应合理 | 《民法典》第290条 |\n| 通行相邻关系 | 被包围土地的权利人有权通行 | 《民法典》第291条 |\n| 管线铺设相邻关系 | 铺设管线应提供必要便利 | 《民法典》第292条 |\n| 通风、采光相邻关系 | 建筑物不得妨碍相邻建筑的通风采光 | 《民法典》第293条 |\n| 环境保护相邻关系 | 不得排放有害物质 | 《民法典》第294条 |\n| 安全相邻关系 | 挖掘建造不得危及相邻不动产安全 | 《民法典》第295条 |\n\n### 三、通风、采光纠纷（高发类型）\n\n**认定标准**：\n\n| 标准 | 具体内容 | 依据 |\n|------|----------|------|\n| 国家标准 | 《城市居住区规划设计标准》GB50180 | 大寒日日照不低于2小时 |\n| 地方标准 | 各地规划管理技术规定 | 可能高于国家标准 |\n| 合同约定 | 购房合同中的承诺 | 开发商承诺的日照标准 |\n\n**裁判规则**：\n\n1. **违反国家标准**：新建建筑物违反国家工程建设标准，妨碍相邻建筑物通风、采光的，应当承担侵权责任\n2. **赔偿方式**：可以判决停止侵害、排除妨碍、消除危险，也可以判决赔偿损失\n3. **损失计算**：采光权损害赔偿数额，可参照房屋价值贬损、电费增加等因素确定\n\n### 四、通行相邻关系\n\n**构成要件**：\n\n| 要件 | 具体内容 |\n|------|----------|\n| 土地被包围 | 土地四周均与公路无适宜联络 |\n| 通行必要 | 不通行将无法正常使用土地 |\n| 损害最小 | 选择对相邻方损害最小的路线通行 |\n| 支付费用 | 应当支付适当的费用 |\n\n### 五、噪音、油烟等环境相邻纠纷\n\n**裁判规则**：\n\n1. **国家标准**：超过国家规定的环境噪声排放标准、油烟排放标准的，构成侵权\n2. **合理性标准**：未超过国家标准，但严重影响相邻方正常生活的，也可能构成侵权\n3. **举证责任**：主张受到侵害的一方应举证证明侵害事实和损害后果\n\n### 六、裁判规则\n\n| 序号 | 裁判规则 | 典型案例 |\n|------|----------|----------|\n| 1 | 建筑物妨碍相邻建筑通风采光的，应承担侵权责任 | — |\n| 2 | 被包围土地的权利人有权通行，但应选择损害最小的路线 | — |\n| 3 | 超过国家标准排放噪音的，构成侵权 | — |\n| 4 | 相邻关系纠纷不适用诉讼时效 | — |\n| 5 | 相邻方应当容忍合理范围内的轻微妨害 | — |\n\n### 七、实务要点\n\n1. **证据收集**：相邻关系纠纷中，证据收集至关重要，包括照片、视频、鉴定报告、报警记录等\n2. **鉴定申请**：通风、采光、噪音等专业问题，可以申请司法鉴定\n3. **协商优先**：相邻关系纠纷应当优先协商解决，维护邻里和谐\n4. **诉讼"},{"id":"抵押权","title":"抵押权","excerpt":"抵押权是最重要、最常见的担保物权，广泛应用于借贷、买卖、建设工程等合同关系中。抵押权不转移标的物的占有，既保障了债权的实现，又不影响抵押人对抵押物的使用收益。实务中，抵押权的设立、登记、实现顺序等是最常见的争议焦点。 | 条文 | 内容要点 | |------|----------| | 《民法典》第394条 | 抵押权定义：债务人或第三人不转移财产占有，将该财产抵押给债权人，债务人不履行到期债务","slug":"抵押权","module":"02-物权法","moduleName":"02-物权法","tags":["民法","物权法","担保物权","抵押权","抵押登记","流押条款"],"wordCount":3319,"created":"2026-05-28","updated":"2026-05-28","content":"# 抵押权\n\n## 概述\n\n抵押权是最重要、最常见的担保物权，广泛应用于借贷、买卖、建设工程等合同关系中。抵押权不转移标的物的占有，既保障了债权的实现，又不影响抵押人对抵押物的使用收益。实务中，抵押权的设立、登记、实现顺序等是最常见的争议焦点。\n\n## 核心内容\n\n### 一、法律依据\n\n| 条文 | 内容要点 |\n|------|----------|\n| 《民法典》第394条 | 抵押权定义：债务人或第三人不转移财产占有，将该财产抵押给债权人，债务人不履行到期债务时，债权人有权优先受偿 |\n| 《民法典》第395条 | 可抵押财产范围 |\n| 《民法典》第399条 | 不得抵押的财产 |\n| 《民法典》第401条 | **流押条款禁止**：抵押权人在债务履行期限届满前，与抵押人约定债务人不履行到期债务时抵押财产归债权人所有的，只能依法就抵押财产优先受偿 |\n| 《民法典》第402条 | **不动产抵押登记**：以不动产抵押的，应当办理抵押登记，抵押权自登记时设立 |\n| 《民法典》第403条 | **动产抵押登记**：以动产抵押的，抵押权自抵押合同生效时设立；未经登记，不得对抗善意第三人 |\n| 《民法典》第406条 | **抵押财产转让**：抵押期间，抵押人可以转让抵押财产。抵押财产转让的，抵押权不受影响 |\n| 《民法典》第410条 | 抵押权实现：债务人不履行到期债务，抵押权人可以与抵押人协议以抵押财产折价或者以拍卖、变卖该抵押财产所得的价款优先受偿 |\n| 《民法典》第414条 | **抵押权竞存**：同一财产向两个以上债权人抵押的，拍卖、变卖抵押财产所得的价款按照登记的时间先后确定清偿顺序 |\n\n### 二、抵押权的设立\n\n**1. 可抵押财产**：\n\n| 类型 | 具体内容 |\n|------|----------|\n| 不动产 | 建筑物和其他土地附着物 |\n| 建设用地使用权 | 国有建设用地使用权 |\n| 海域使用权 | 依法取得的海域使用权 |\n| 生产设备、原材料、半成品、产品 | 动产抵押 |\n| 正在建造的建筑物、船舶、航空器 | 在建工程抵押 |\n| 交通运输工具 | 车辆、船舶、航空器 |\n\n**2. 不得抵押的财产**：\n\n| 类型 | 法律依据 |\n|------|----------|\n| 土地所有权 | 《民法典》第399条第1项 |\n| 宅基地、自留地、自留山等集体所有土地的使用权（法律规定可以抵押的除外） | 《民法典》第399条第2项 |\n| 学校、幼儿园、医疗机构等为公益目的成立的非营利法人的教育设施、医疗卫生设施和其他公益设施 | 《民法典》第399条第3项 |\n| 所有权、使用权不明或者有争议的财产 | 《民法典》第399条第4项 |\n| 依法被查封、扣押、监管的财产 | 《民法典》第399条第5项 |\n\n**3. 登记效力**：\n\n| 抵押物类型 | 登记效力 | 法律依据 |\n|------------|----------|----------|\n| 不动产 | 登记设立主义（登记时设立） | 《民法典》第402条 |\n| 动产 | 登记对抗主义（合同生效时设立，登记对抗善意第三人） | 《民法典》第403条 |\n\n### 三、流押条款（实务重点）\n\n**法律规则**：\n\n- **禁止流押**：抵押权人在债务履行期限届满前，与抵押人约定债务人不履行到期债务时抵押财产归债权人所有的，该约定无效\n- **法律后果**：流押条款无效，但不影响抵押合同其他条款的效力\n- **替代方式**：债务人不履行到期债务时，抵押权人只能依法就抵押财产优先受偿\n\n**实务要点**：\n\n1. 流押条款无效，但抵押合同其他条款仍然有效\n2. 债务履行期限届满后，当事人可以约定以抵押财产折价抵债\n3. 以物抵债协议与流押条款的区别：时间节点是关键\n\n### 四、抵押财产转让\n\n**法律规则**：\n\n| 规则 | 具体内容 | 法律依据 |\n|------|----------|----------|\n| 可以转让 | 抵押期间，抵押人可以转让抵押财产 | 《民法典》第406条第1款 |\n| 抵押权不受影响 | 抵押财产转让的，抵押权不受影响 | 《民法典》第406条第1款 |\n| 通知义务 | 抵押人转让抵押财产的，应当及时通知抵押权人 | 《民法典》第406条第2款 |\n| 抵押权人救济 | 抵押权人能够证明抵押财产转让可能损害抵押权的，可以请求抵押人将转让所得的价款向抵押权人提前清偿债务或者提存 | 《民法典》第406条第2款 |\n\n### 五、抵押权竞存\n\n**清偿顺序**：\n\n| 情形 | 清偿顺序 | 法律依据 |\n|------|----------|----------|\n| 已登"},{"id":"担保物权竞存","title":"担保物权竞存","excerpt":"担保物权竞存是指同一财产上存在两个以上担保物权的情形。实务中，同一财产上可能存在抵押权、质权、留置权等多种担保物权，如何确定各担保物权的清偿顺序，是担保纠纷中的核心问题。 | 条文 | 内容要点 | |------|----------| | 《民法典》第414条 | 同一财产向两个以上债权人抵押的，拍卖、变卖抵押财产所得的价款按照登记的时间先后确定清偿顺序 | | 《民法典》第415条 | 同一","slug":"担保物权竞存","module":"02-物权法","moduleName":"02-物权法","tags":["民法","物权法","担保物权","竞存","优先顺序"],"wordCount":1927,"created":"2026-05-28","updated":"2026-05-28","content":"# 担保物权竞存\n\n## 概述\n\n担保物权竞存是指同一财产上存在两个以上担保物权的情形。实务中，同一财产上可能存在抵押权、质权、留置权等多种担保物权，如何确定各担保物权的清偿顺序，是担保纠纷中的核心问题。\n\n## 核心内容\n\n### 一、法律依据\n\n| 条文 | 内容要点 |\n|------|----------|\n| 《民法典》第414条 | 同一财产向两个以上债权人抵押的，拍卖、变卖抵押财产所得的价款按照登记的时间先后确定清偿顺序 |\n| 《民法典》第415条 | 同一财产既设立抵押权又设立质权的，拍卖、变卖该财产所得的价款按照登记、交付的时间先后确定清偿顺序 |\n| 《民法典》第416条 | 动产抵押担保的主债权是抵押物的价款，标的物交付后10日内办理抵押登记的，该抵押权人优先于其他担保物权人受偿 |\n| 《民法典》第456条 | 同一动产上已设立抵押权或者质权，该动产又被留置的，留置权人优先受偿 |\n\n### 二、抵押权竞存的清偿顺序\n\n**法律规则**：\n\n| 情形 | 清偿顺序 | 法律依据 |\n|------|----------|----------|\n| 均已登记 | 按登记时间先后 | 《民法典》第414条第1款第1项 |\n| 已登记与未登记 | 已登记优先于未登记 | 《民法典》第414条第1款第2项 |\n| 均未登记 | 按债权比例清偿 | 《民法典》第414条第1款第3项 |\n\n### 三、抵押权与质权竞存\n\n**法律规则**：\n\n| 情形 | 清偿顺序 | 法律依据 |\n|------|----------|----------|\n| 先登记抵押权，后设立质权 | 抵押权优先 | 《民法典》第415条 |\n| 先设立质权，后登记抵押权 | 质权优先 | 《民法典》第415条 |\n| 购买价款抵押权 | 购买价款抵押权优先（10日内登记） | 《民法典》第416条 |\n\n### 四、留置权与其他担保物权竞存\n\n**法律规则**：\n\n| 情形 | 清偿顺序 | 法律依据 |\n|------|----------|----------|\n| 留置权与抵押权竞存 | 留置权优先 | 《民法典》第456条 |\n| 留置权与质权竞存 | 留置权优先 | 《民法典》第456条 |\n\n**立法理由**：\n\n1. 留置权是法定担保物权，具有优先效力\n2. 留置权人的劳动增加了留置物的价值\n3. 留置权人通常是弱势群体，需要特别保护\n\n### 五、购买价款抵押权（超级优先权）\n\n**法律依据**：《民法典》第416条\n\n**构成要件**：\n\n| 要件 | 具体内容 |\n|------|----------|\n| 主债权 | 主债权是抵押物的购买价款 |\n| 标的物 | 动产 |\n| 登记期限 | 标的物交付后10日内办理抵押登记 |\n| 善意 | 抵押权人不知道或者不应当知道抵押物上存在其他担保物权 |\n\n**法律效力**：\n\n- 购买价款抵押权优先于其他担保物权\n- 包括优先于在先登记的抵押权\n- 包括优先于在先设立的质权\n\n### 六、裁判规则\n\n| 序号 | 裁判规则 | 典型案例 |\n|------|----------|----------|\n| 1 | 同一财产多个抵押权，按登记时间先后确定清偿顺序 | （2022）最高法执监69号 |\n| 2 | 留置权优先于抵押权和质权 | — |\n| 3 | 购买价款抵押权优先于其他担保物权 | — |\n| 4 | 抵押权与质权竞存，按登记、交付时间先后确定清偿顺序 | — |\n| 5 | 未登记的动产抵押权不能对抗善意第三人 | — |\n\n### 七、实务要点\n\n1. **及时登记**：抵押权人应及时办理抵押登记，登记时间先后决定清偿顺序\n2. **购买价款抵押权**：出卖人应在标的物交付后10日内办理抵押登记，以取得超级优先权\n3. **留置权优先**：留置权优先于抵押权和质权，抵押权人应关注抵押物是否可能被留置\n4. **善意取得**：未登记的动产抵押权不能对抗善意第三人\n5. **多重担保**：债权人可以要求债务人提供多重担保，以增加债权实现的保障\n\n## 典型案例\n\n### 案例：抵押权竞存时的清偿顺位与责任财产范围\n\n**案号/入库编号**：最高人民法院（2022）最高法执监69号\n\n**来源**：最高人民法院 · 人民法院案例库\n\n**基本案情**：同一抵押财产上存在多个抵押权，顺位在先的抵押权优先受偿后，抵押财产价值不足以清偿顺位在后的抵押权人债权。顺位在后的抵押权人主张以抵押人名下其他财产承担担保责任。\n\n**裁判要旨**：抵押财产因清偿另案顺位在先的优先债权而导致抵押权不能实现的，不能主张以抵押人名下其他财产承担担保责任。担保责任的范围以担保合同约"},{"id":"留置权","title":"留置权","excerpt":"--- tags: [民法, 物权法, 担保物权, 留置权, 法定担保] created: 2026-05-28 updated: 2026-05-28 status: reviewed type: knowledge --- 留置权是指债务人不履行到期债务，债权人可以留置已经合法占有的债务人的动产，并有权就该动产优先受偿。留置权是法定担保物权，不需要当事人约定，只要符合法定条件即可成立。实务中，","slug":"留置权","module":"02-物权法","moduleName":"02-物权法","tags":["民法","物权法","担保物权","留置权","法定担保"],"wordCount":2177,"created":"2026-05-28","updated":"2026-05-28","content":"# 留置权\n\n## 概述\n\n留置权是指债务人不履行到期债务，债权人可以留置已经合法占有的债务人的动产，并有权就该动产优先受偿。留置权是法定担保物权，不需要当事人约定，只要符合法定条件即可成立。实务中，留置权广泛存在于加工承揽、运输、保管、行纪等合同关系中。\n\n## 核心内容\n\n### 一、法律依据\n\n| 条文 | 内容要点 |\n|------|----------|\n| 《民法典》第447条 | 留置权定义：债务人不履行到期债务，债权人可以留置已经合法占有的债务人的动产，并有权优先受偿 |\n| 《民法典》第448条 | **牵连关系**：债权人留置的动产，应当与债权属于同一法律关系，但企业之间留置的除外 |\n| 《民法典》第449条 | 法律规定或者当事人约定不得留置的动产，不得留置 |\n| 《民法典》第450条 | 留置财产为可分物的，留置财产的价值应当相当于债务的金额 |\n| 《民法典》第451条 | **保管义务**：留置权人负有妥善保管留置财产的义务 |\n| 《民法典》第452条 | 留置权人有权收取留置财产的孳息 |\n| 《民法典》第453条 | **留置权实现**：留置权人与债务人应当约定留置财产后的债务履行期限；没有约定的，留置权人应当给债务人60日以上履行债务的期限 |\n| 《民法典》第454条 | 债务人可以请求留置权人在债务履行期限届满后行使留置权；留置权人不行使的，债务人可以请求人民法院拍卖、变卖留置财产 |\n| 《民法典》第455条 | 留置财产折价或者拍卖、变卖后，其价款超过债权数额的部分归债务人所有，不足部分由债务人清偿 |\n| 《民法典》第456条 | 同一动产上已设立抵押权或者质权，该动产又被留置的，留置权人优先受偿 |\n| 《民法典》第457条 | 留置权人对留置财产丧失占有或者留置权人接受债务人另行提供担保的，留置权消灭 |\n\n### 二、留置权的成立要件\n\n| 要件 | 具体内容 | 备注 |\n|------|----------|------|\n| 合法占有动产 | 债权人已经合法占有债务人的动产 | 基于合同关系占有 |\n| 债务人不履行到期债务 | 债务已届清偿期，债务人未履行 | 必须是到期债务 |\n| 牵连关系 | 留置的动产与债权属于同一法律关系 | 企业之间留置除外 |\n| 不得留置的情形 | 法律规定或当事人约定不得留置 | 约定优先 |\n\n### 三、企业留置的特殊规则\n\n**法律规则**：\n\n- **一般留置**：债权人留置的动产，应当与债权属于同一法律关系\n- **企业留置**：企业之间留置的，可以不要求牵连关系（《民法典》第448条但书）\n\n**实务要点**：\n\n1. 企业之间留置不受牵连关系限制\n2. 企业留置的动产可以是债务人所有，也可以是债务人合法占有的\n3. 企业留置仍需满足其他成立要件\n\n### 四、留置权的实现\n\n**实现程序**：\n\n| 阶段 | 具体要求 | 法律依据 |\n|------|----------|----------|\n| 宽限期 | 给债务人60日以上履行期限 | 《民法典》第453条 |\n| 协商实现 | 与债务人协议以留置财产折价 | 《民法典》第453条 |\n| 拍卖变卖 | 拍卖、变卖留置财产 | 《民法典》第453条 |\n| 催告行使 | 债务人可请求留置权人行使留置权 | 《民法典》第454条 |\n\n### 五、留置权的消灭\n\n| 消灭事由 | 法律依据 |\n|----------|----------|\n| 主债权消灭 | 担保物权从属性 |\n| 留置权人丧失占有 | 《民法典》第457条 |\n| 留置权人接受另行担保 | 《民法典》第457条 |\n| 债务人另行提供担保并被接受 | 《民法典》第457条 |\n\n### 六、裁判规则\n\n| 序号 | 裁判规则 | 典型案例 |\n|------|----------|----------|\n| 1 | 留置权自符合法定条件时成立，不需要当事人约定 | — |\n| 2 | 企业之间留置不受牵连关系限制 | — |\n| 3 | 留置财产为可分物的，留置价值应相当于债务金额 | — |\n| 4 | 留置权人未给债务人宽限期的，不得实现留置权 | — |\n| 5 | 留置权优先于抵押权和质权 | — |\n\n### 七、实务要点\n\n1. **合法占有是前提**：留置权以合法占有动产为前提，非法占有不能成立留置权\n2. **牵连关系**：一般留置要求留置的动产与债权属于同一法律关系\n3. **宽限期**：留置权人应当给债务人60日以上履行期限\n4. **可分物限制**：留置财产为可分物的，留置价值应相当于债务金额\n5. **优先效力**：同一动产上既有抵押权或质权，又被留置的，留置权人"},{"id":"质权","title":"质权","excerpt":"--- tags: [民法, 物权法, 担保物权, 质权, 动产质押, 权利质押] created: 2026-05-28 updated: 2026-05-28 status: reviewed type: knowledge --- 质权是指债务人或第三人将其动产或权利移交债权人占有，将该动产或权利作为债权的担保。债务人不履行到期债务时，债权人有权就该动产或权利优先受偿。质权与抵押权的最大区别","slug":"质权","module":"02-物权法","moduleName":"02-物权法","tags":["民法","物权法","担保物权","质权","动产质押","权利质押"],"wordCount":1998,"created":"2026-05-28","updated":"2026-05-28","content":"# 质权\n\n## 概述\n\n质权是指债务人或第三人将其动产或权利移交债权人占有，将该动产或权利作为债权的担保。债务人不履行到期债务时，债权人有权就该动产或权利优先受偿。质权与抵押权的最大区别在于：质权需要转移占有，而抵押权不需要。\n\n## 核心内容\n\n### 一、法律依据\n\n| 条文 | 内容要点 |\n|------|----------|\n| 《民法典》第425条 | 质权定义：债务人或第三人将其动产移交债权人占有，将该动产作为债权的担保 |\n| 《民法典》第427条 | 质押合同应当采用书面形式 |\n| 《民法典》第429条 | **质权设立**：质权自出质人交付质押财产时设立 |\n| 《民法典》第430条 | **孳息收取**：质权人有权收取质押财产的孳息，但合同另有约定的除外 |\n| 《民法典》第431条 | 质权人不得擅自使用、处分质押财产 |\n| 《民法典》第432条 | **保管义务**：质权人负有妥善保管质押财产的义务 |\n| 《民法典》第436条 | **质权实现**：债务人履行债务或者出质人提前清偿所担保的债权的，质权人应当返还质押财产 |\n| 《民法典》第440条 | **权利质权**：可以出质的权利类型 |\n| 《民法典》第441条 | 以汇票、本票、支票等出质的，质权自权利凭证交付质权人时设立 |\n\n### 二、动产质权\n\n**设立要件**：\n\n| 要件 | 具体内容 |\n|------|----------|\n| 书面质押合同 | 质押合同应当采用书面形式 |\n| 交付质押财产 | 质权自出质人交付质押财产时设立 |\n| 出质人有处分权 | 出质人对质押财产有处分权 |\n\n**交付方式**：\n\n| 交付类型 | 是否设立质权 | 备注 |\n|----------|--------------|------|\n| 现实交付 | 设立 | 最常见的交付方式 |\n| 简易交付 | 设立 | 质权人已占有动产 |\n| 指示交付 | 设立 | 第三人占有动产 |\n| 占有改定 | 不设立 | 出质人继续占有，质权未设立 |\n\n**质权人的权利义务**：\n\n| 权利 | 义务 |\n|------|------|\n| 收取孳息 | 妥善保管质押财产 |\n| 优先受偿 | 不得擅自使用、处分质押财产 |\n| 转质权（经出质人同意） | 返还质押财产（债务履行后） |\n\n### 三、权利质权\n\n**可出质的权利**（《民法典》第440条）：\n\n| 权利类型 | 具体内容 |\n|----------|----------|\n| 汇票、本票、支票 | 票据权利 |\n| 债券、存款单 | 债权凭证 |\n| 仓单、提单 | 物权凭证 |\n| 可以转让的基金份额、股权 | 投资权利 |\n| 可以转让的知识产权中的财产权 | 知识产权 |\n| 现有的以及将有的应收账款 | 应收账款 |\n| 法律、行政法规规定可以出质的其他财产权利 | 兜底条款 |\n\n**权利质权的设立**：\n\n| 权利类型 | 设立要件 | 法律依据 |\n|----------|----------|----------|\n| 票据、债券、存款单、仓单、提单 | 交付权利凭证或登记 | 《民法典》第441条 |\n| 基金份额、股权 | 登记 | 《民法典》第443条 |\n| 知识产权 | 登记 | 《民法典》第444条 |\n| 应收账款 | 登记 | 《民法典》第445条 |\n\n### 四、裁判规则\n\n| 序号 | 裁判规则 | 典型案例 |\n|------|----------|----------|\n| 1 | 质权自出质人交付质押财产时设立 | — |\n| 2 | 占有改定不能设立质权 | — |\n| 3 | 质权人擅自使用质押财产造成损害的，应承担赔偿责任 | — |\n| 4 | 应收账款质权自登记时设立 | — |\n| 5 | 质权人怠于行使质权造成损害的，应承担赔偿责任 | — |\n\n### 五、实务要点\n\n1. **交付是关键**：动产质权以交付为设立要件，占有改定不能设立质权\n2. **妥善保管**：质权人应妥善保管质押财产，因保管不善造成损害的，应承担赔偿责任\n3. **权利质权登记**：以权利出质的，应当办理出质登记\n4. **转质**：经出质人同意，质权人可以转质，但转质权的效力优于原质权\n5. **质权实现**：债务人不履行到期债务时，质权人可以与出质人协议以质押财产折价，也可以拍卖、变卖质押财产\n\n## 典型案例\n\n### 案例：某银行诉某物流公司等动产质权纠纷案\n\n**案号/入库编号**：（2019）最高法民终331号\n\n**审理法院**：最高人民法院\n\n**基本案情**：某银行与出质人锦州某公司签订《动产质押合同》，并通过三方签订《"},{"id":"非典型担保","title":"非典型担保","excerpt":"非典型担保是指法律没有明确规定，但当事人通过合同约定创设的担保方式。实务中，非典型担保主要包括让与担保、所有权保留、融资租赁、保理等。非典型担保的效力认定是担保纠纷中的难点问题。 | 条文 | 内容要点 | |------|----------| | 《民法典》第388条 | 担保合同包括抵押合同、质押合同和其他具有担保功能的合同 | | 《民法典》第641条 | 所有权保留：当事人可以在买卖合同","slug":"非典型担保","module":"02-物权法","moduleName":"02-物权法","tags":["民法","物权法","担保物权","非典型担保","让与担保","所有权保留"],"wordCount":2241,"created":"2026-05-28","updated":"2026-05-28","content":"# 非典型担保\n\n## 概述\n\n非典型担保是指法律没有明确规定，但当事人通过合同约定创设的担保方式。实务中，非典型担保主要包括让与担保、所有权保留、融资租赁、保理等。非典型担保的效力认定是担保纠纷中的难点问题。\n\n## 核心内容\n\n### 一、法律依据\n\n| 条文 | 内容要点 |\n|------|----------|\n| 《民法典》第388条 | 担保合同包括抵押合同、质押合同和其他具有担保功能的合同 |\n| 《民法典》第641条 | **所有权保留**：当事人可以在买卖合同中约定买受人未履行支付价款或者其他义务的，标的物的所有权属于出卖人 |\n| 《民法典》第642条 | 所有权保留中出卖人的取回权 |\n| 《民法典》第735条 | **融资租赁**：融资租赁合同是出租人根据承租人对出卖人、租赁物的选择，向出卖人购买租赁物，提供给承租人使用，承租人支付租金的合同 |\n| 《民法典》第745条 | 出租人对租赁物享有的所有权，未经登记，不得对抗善意第三人 |\n| 最高法院《担保制度解释》第68条 | **让与担保**：债务人或者第三人与债权人约定将财产形式上转移至债权人名下，债务人不履行到期债务，债权人有权对财产折价或者以拍卖、变卖该财产所得价款偿还债务的，人民法院应当认定该约定有效 |\n\n### 二、让与担保\n\n**构成要件**：\n\n| 要件 | 具体内容 |\n|------|----------|\n| 担保约定 | 债务人或第三人与债权人约定将财产形式上转移至债权人名下 |\n| 担保目的 | 以财产担保债务的履行 |\n| 形式转移 | 财产形式上转移至债权人名下 |\n| 清算义务 | 债务人不履行到期债务时，债权人应当对财产进行清算 |\n\n**法律效力**：\n\n| 效力类型 | 具体内容 |\n|----------|----------|\n| 合同效力 | 让与担保合同有效 |\n| 物权效力 | 未办理登记的，不发生物权变动效力 |\n| 清算义务 | 债权人应当对财产进行清算，超出债权部分返还债务人 |\n\n**与流押条款的区别**：\n\n| 区分项 | 让与担保 | 流押条款 |\n|--------|----------|----------|\n| 时间 | 债务履行期限届满前 | 债务履行期限届满前 |\n| 内容 | 形式上转移所有权 | 约定直接取得所有权 |\n| 清算 | 需要清算 | 无需清算 |\n| 效力 | 有效 | 无效 |\n\n### 三、所有权保留\n\n**构成要件**：\n\n| 要件 | 具体内容 |\n|------|----------|\n| 买卖合同 | 当事人签订买卖合同 |\n| 保留约定 | 约定买受人未履行支付价款或者其他义务的，标的物的所有权属于出卖人 |\n| 登记对抗 | 出卖人对标的物保留的所有权，未经登记，不得对抗善意第三人 |\n\n**出卖人的权利**：\n\n| 权利 | 具体内容 | 法律依据 |\n|------|----------|----------|\n| 取回权 | 买受人未按约定支付价款或者有其他违约行为，出卖人可以取回标的物 | 《民法典》第642条 |\n| 回赎权 | 买受人在双方约定或者出卖人指定的合理回赎期间内，消除出卖人取回标的物的事由的，可以请求回赎标的物 | 《民法典》第643条 |\n| 再次出卖权 | 买受人在回赎期间内没有回赎标的物的，出卖人可以以合理价格出卖标的物 | 《民法典》第643条 |\n\n### 四、融资租赁\n\n**特殊规则**：\n\n| 规则 | 具体内容 | 法律依据 |\n|------|----------|----------|\n| 租赁物归属 | 租赁期间租赁物归出租人所有 | 《民法典》第735条 |\n| 登记对抗 | 出租人对租赁物享有的所有权，未经登记，不得对抗善意第三人 | 《民法典》第745条 |\n| 租赁物取回 | 承租人破产的，租赁物不属于破产财产 | 《民法典》第745条 |\n\n### 五、裁判规则\n\n| 序号 | 裁判规则 | 典型案例 |\n|------|----------|----------|\n| 1 | 让与担保合同有效，但需进行清算 | 入库编号2024-08-2-091-001 |\n| 2 | 所有权保留未经登记不得对抗善意第三人 | — |\n| 3 | 融资租赁中出租人对租赁物享有所有权 | — |\n| 4 | 让与担保与流押条款的区别在于是否需要清算 | 入库编号2024-08-2-091-001 |\n| 5 | 所有权保留中出卖人行使取回权需符合法定条件 | — |\n\n### 六、实务要点\n\n1. **让与担保的有效性**：让与担保合同有效，但债权人需对财产进行清算\n2. **所有权保留登记**：出卖人应办"},{"id":"土地承包经营权","title":"土地承包经营权","excerpt":"--- tags: [民法, 物权法, 用益物权, 土地承包经营权, 三权分置] created: 2026-05-28 updated: 2026-05-28 status: reviewed type: knowledge --- 土地承包经营权是我国农村土地制度的核心，是指承包方依法对其承包经营的耕地、林地、草地等享有占有、使用和收益的权利。《民法典》确认了农村土地\"三权分置\"改革成果，将土","slug":"土地承包经营权","module":"02-物权法","moduleName":"02-物权法","tags":["民法","物权法","用益物权","土地承包经营权","三权分置"],"wordCount":2452,"created":"2026-05-28","updated":"2026-05-28","content":"# 土地承包经营权\n\n## 概述\n\n土地承包经营权是我国农村土地制度的核心，是指承包方依法对其承包经营的耕地、林地、草地等享有占有、使用和收益的权利。《民法典》确认了农村土地\"三权分置\"改革成果，将土地承包经营权与土地经营权分离，为农村土地流转提供了法律保障。\n\n## 核心内容\n\n### 一、法律依据\n\n| 条文 | 内容要点 |\n|------|----------|\n| 《民法典》第330条 | 农村集体经济组织实行家庭承包经营为基础、统分结合的双层经营体制 |\n| 《民法典》第331条 | **土地承包经营权定义**：土地承包经营权人依法对其承包经营的耕地、林地、草地等享有占有、使用和收益的权利 |\n| 《民法典》第332条 | **承包期限**：耕地30年、草地30-50年、林地30-70年 |\n| 《民法典》第333条 | **承包合同**：土地承包经营权自土地承包经营权合同生效时设立 |\n| 《民法典》第334条 | **流转权利**：土地承包经营权人有权将土地承包经营权互换、转让 |\n| 《民法典》第335条 | **流转登记**：土地承包经营权互换、转让的，当事人可以向登记机构申请登记；未经登记，不得对抗善意第三人 |\n| 《民法典》第339条 | **三权分置**：土地承包经营权人可以自主决定依法采取出租、入股或者其他方式向他人流转土地经营权 |\n| 《民法典》第340条 | **土地经营权**：土地经营权人有权在合同约定的期限内占有农村土地，自主开展农业生产经营并取得收益 |\n| 《民法典》第341条 | **经营权登记**：流转期限为五年以上的土地经营权，自流转合同生效时设立。当事人可以向登记机构申请土地经营权登记；未经登记，不得对抗善意第三人 |\n\n### 二、三权分置制度\n\n**三权分置的权利结构**：\n\n| 权利 | 主体 | 内容 | 流转性 |\n|------|------|------|--------|\n| 所有权 | 农村集体 | 土地归集体所有 | 不得流转 |\n| 承包权 | 农户 | 承包土地的权利 | 可以流转（互换、转让） |\n| 经营权 | 经营者 | 经营土地的权利 | 可以流转（出租、入股等） |\n\n**三权分置的法律意义**：\n\n1. **稳定承包权**：保障农户的承包权益\n2. **放活经营权**：允许经营权流转，促进土地规模经营\n3. **落实所有权**：坚持农村土地集体所有\n\n### 三、土地承包经营权的设立\n\n**设立方式**：\n\n| 方式 | 法律依据 | 说明 |\n|------|----------|------|\n| 家庭承包 | 《民法典》第333条 | 以农户家庭为单位承包 |\n| 其他方式承包 | 《农村土地承包法》 | 招标、拍卖、公开协商等 |\n\n**承包期限**：\n\n| 土地类型 | 承包期限 | 法律依据 |\n|----------|----------|----------|\n| 耕地 | 30年 | 《民法典》第332条 |\n| 草地 | 30-50年 | 《民法典》第332条 |\n| 林地 | 30-70年 | 《民法典》第332条 |\n\n### 四、土地承包经营权的流转\n\n**流转方式**：\n\n| 流转方式 | 法律依据 | 说明 |\n|----------|----------|------|\n| 互换 | 《民法典》第334条 | 同一集体经济组织内互换 |\n| 转让 | 《民法典》第334条 | 经发包方同意 |\n| 出租 | 《民法典》第339条 | 流转土地经营权 |\n| 入股 | 《民法典》第339条 | 流转土地经营权 |\n| 其他方式 | 《民法典》第339条 | 转包、代耕等 |\n\n**流转限制**：\n\n| 限制 | 法律依据 | 说明 |\n|------|----------|------|\n| 不得改变用途 | 《民法典》第334条 | 不得将农用地转为建设用地 |\n| 不得超过承包期 | 《民法典》第337条 | 流转期限不得超过承包剩余期限 |\n| 本集体优先 | 《农村土地承包法》 | 同等条件下本集体成员优先 |\n\n### 五、土地经营权\n\n**设立条件**：\n\n| 条件 | 具体内容 |\n|------|----------|\n| 流转方式 | 出租、入股或其他方式 |\n| 合同形式 | 书面合同 |\n| 登记对抗 | 流转期限5年以上的，登记对抗善意第三人 |\n\n**经营权人的权利**：\n\n| 权利 | 具体内容 |\n|------|----------|\n| 占有权 | 占有承包地 |\n| 使用权 | 自主开展农业生产经营 |\n| 收益权 | 取得农业生产经营收益 |\n| 再流转权 | 经承包方同意"},{"id":"地役权","title":"地役权","excerpt":"--- tags: [民法, 物权法, 用益物权, 地役权, 登记对抗] created: 2026-05-28 updated: 2026-05-28 status: reviewed type: knowledge --- 地役权是指按照合同约定，利用他人的不动产以提高自己不动产效益的权利。地役权是用益物权的一种，具有从属性，不得单独转让或抵押。地役权与相邻关系不同：相邻关系是法定的，地役权是","slug":"地役权","module":"02-物权法","moduleName":"02-物权法","tags":["民法","物权法","用益物权","地役权","登记对抗"],"wordCount":2253,"created":"2026-05-28","updated":"2026-05-28","content":"# 地役权\n\n## 概述\n\n地役权是指按照合同约定，利用他人的不动产以提高自己不动产效益的权利。地役权是用益物权的一种，具有从属性，不得单独转让或抵押。地役权与相邻关系不同：相邻关系是法定的，地役权是约定的；相邻关系是最低限度的便利，地役权可以约定更高程度的便利。\n\n## 核心内容\n\n### 一、法律依据\n\n| 条文 | 内容要点 |\n|------|----------|\n| 《民法典》第372条 | 地役权定义：地役权人有权按照合同约定，利用他人的不动产，以提高自己的不动产的效益 |\n| 《民法典》第373条 | **设立合同**：设立地役权，当事人应当采用书面形式订立地役权合同 |\n| 《民法典》第374条 | **登记对抗**：地役权自地役权合同生效时设立。当事人要求登记的，可以向登记机构申请地役权登记；未经登记，不得对抗善意第三人 |\n| 《民法典》第375条 | 供役地权利人应当按照合同约定，允许地役权人利用其不动产，不得妨害地役权人行使权利 |\n| 《民法典》第376条 | 地役权人应当按照合同约定的利用目的和方法利用供役地，尽量减少对供役地权利人物权的限制 |\n| 《民法典》第377条 | **期限**：地役权期限由当事人约定；但是，不得超过土地承包经营权、建设用地使用权等用益物权的剩余期限 |\n| 《民法典》第378条 | **从属性**：土地所有权人享有地役权或者负担地役权的，设立土地承包经营权、宅基地使用权等用益物权时，该用益物权人继续享有或者负担已设立的地役权 |\n| 《民法典》第380条 | **不得单独转让**：地役权不得单独转让。土地承包经营权、建设用地使用权等转让的，地役权一并转让，但是合同另有约定的除外 |\n| 《民法典》第381条 | **不得单独抵押**：地役权不得单独抵押。土地承包经营权、建设用地使用权等抵押的，在实现抵押权时，地役权一并转让 |\n\n### 二、地役权与相邻关系的区别\n\n| 区分项 | 地役权 | 相邻关系 |\n|--------|--------|----------|\n| **性质** | 约定权利（意定） | 法定权利 |\n| **设立方式** | 合同约定 | 法律规定 |\n| **有偿性** | 可以约定有偿或无偿 | 一般无偿 |\n| **程度** | 可以约定更高程度的便利 | 最低限度的便利 |\n| **登记** | 登记对抗 | 无需登记 |\n| **范围** | 不限于相邻土地 | 必须是相邻土地 |\n\n### 三、地役权的设立\n\n**合同内容**：\n\n| 条款 | 具体内容 |\n|------|----------|\n| 当事人 | 需役地权利人和供役地权利人 |\n| 需役地 | 需要利用他人土地的土地 |\n| 供役地 | 被利用的土地 |\n| 利用目的 | 通行、排水、采光、眺望等 |\n| 利用方法 | 具体的利用方式 |\n| 期限 | 地役权的存续期间 |\n| 费用 | 有偿或无偿 |\n\n### 四、地役权的效力\n\n**地役权人的权利**：\n\n| 权利 | 具体内容 |\n|------|----------|\n| 利用权 | 按照合同约定利用供役地 |\n| 设施权 | 在供役地上建设必要设施 |\n| 排除妨害 | 请求排除对地役权的妨害 |\n\n**地役权人的义务**：\n\n| 义务 | 具体内容 |\n|------|----------|\n| 按约定利用 | 按照合同约定的利用目的和方法利用 |\n| 减少损害 | 尽量减少对供役地权利人的损害 |\n| 支付费用 | 按照合同约定支付费用 |\n| 维护设施 | 维护在供役地上建设的设施 |\n\n### 五、地役权的从属性\n\n**法律规则**：\n\n| 规则 | 具体内容 | 法律依据 |\n|------|----------|----------|\n| 不得单独转让 | 地役权不得单独转让 | 《民法典》第380条 |\n| 不得单独抵押 | 地役权不得单独抵押 | 《民法典》第381条 |\n| 随主权利转移 | 主权利转让的，地役权一并转移 | 《民法典》第380条 |\n\n### 六、地役权的消灭\n\n| 消灭事由 | 法律依据 |\n|----------|----------|\n| 期限届满 | 《民法典》第377条 |\n| 供役地灭失 | 物权客体消灭 |\n| 需役地灭失 | 物权客体消灭 |\n| 混同 | 需役地和供役地归于同一人 |\n| 放弃 | 地役权人放弃地役权 |\n\n### 七、裁判规则\n\n| 序号 | 裁判规则 | 典型案例 |\n|------|----------|----------|\n| 1 | 地役权自地役权合同生效时设立 | — |\n| 2 | 未经登记的地役权不得对抗善意第三人 "},{"id":"居住权","title":"居住权","excerpt":"居住权是《民法典》新设的用益物权制度，是指居住权人对他人住宅享有占有、使用的权利。居住权制度的设立，旨在满足特定人群的居住需求，特别是在\"以房养老\"、离婚后居住保障、家庭成员扶养等场景中具有重要实务价值。居住权以登记为设立要件，未经登记不设立。 | 条文 | 内容要点 | |------|----------| | 《民法典》第366条 | 居住权定义：居住权人有权按照合同约定，对他人的住宅享有占","slug":"居住权","module":"02-物权法","moduleName":"02-物权法","tags":["民法","物权法","用益物权","居住权","民法典新设制度"],"wordCount":2256,"created":"2026-05-28","updated":"2026-05-28","content":"# 居住权\n\n## 概述\n\n居住权是《民法典》新设的用益物权制度，是指居住权人对他人住宅享有占有、使用的权利。居住权制度的设立，旨在满足特定人群的居住需求，特别是在\"以房养老\"、离婚后居住保障、家庭成员扶养等场景中具有重要实务价值。居住权以登记为设立要件，未经登记不设立。\n\n## 核心内容\n\n### 一、法律依据\n\n| 条文 | 内容要点 |\n|------|----------|\n| 《民法典》第366条 | 居住权定义：居住权人有权按照合同约定，对他人的住宅享有占有、使用的用益物权 |\n| 《民法典》第367条 | **设立方式**：设立居住权，当事人应当采用书面形式订立居住权合同 |\n| 《民法典》第368条 | **登记生效**：居住权无偿设立，但是当事人另有约定的除外。设立居住权的，应当向登记机构申请居住权登记。居住权自登记时设立 |\n| 《民法典》第369条 | **不得转让、继承**：居住权不得转让、继承。设立居住权的住宅不得出租，但是当事人另有约定的除外 |\n| 《民法典》第370条 | **消灭事由**：居住权期限届满或者居住权人死亡的，居住权消灭。居住权消灭的，应当及时办理注销登记 |\n| 《民法典》第371条 | **遗嘱设立**：以遗嘱方式设立居住权的，参照适用本章的有关规定 |\n\n### 二、居住权的设立\n\n**1. 合同设立**：\n\n| 要件 | 具体内容 |\n|------|----------|\n| 书面合同 | 当事人应当采用书面形式订立居住权合同 |\n| 合同内容 | 当事人的姓名或者名称和住所、住宅的位置、居住的条件和要求、居住权期限、解决争议的方法 |\n| 登记 | 居住权自登记时设立 |\n\n**2. 遗嘱设立**：\n\n| 要件 | 具体内容 |\n|------|----------|\n| 遗嘱形式 | 书面遗嘱、口头遗嘱、录音录像遗嘱等 |\n| 登记 | 以遗嘱方式设立居住权的，参照适用合同设立的规定，需办理登记 |\n\n### 三、居住权的效力\n\n**居住权人的权利**：\n\n| 权利 | 具体内容 |\n|------|----------|\n| 占有权 | 对住宅享有占有权 |\n| 使用权 | 对住宅享有使用权 |\n| 排除妨害 | 有权请求排除对住宅的妨害 |\n\n**居住权人的义务**：\n\n| 义务 | 具体内容 |\n|------|----------|\n| 不得转让 | 居住权不得转让 |\n| 不得继承 | 居住权不得继承 |\n| 不得出租 | 设立居住权的住宅不得出租（当事人另有约定的除外） |\n\n### 四、居住权与其他权利的冲突\n\n**1. 居住权与抵押权**：\n\n| 冲突情形 | 处理规则 |\n|----------|----------|\n| 先设居住权，后设抵押权 | 居住权优先，抵押权实现时居住权不受影响 |\n| 先设抵押权，后设居住权 | 抵押权优先，抵押权实现时居住权消灭 |\n\n**2. 居住权与所有权**：\n\n| 冲突情形 | 处理规则 |\n|----------|----------|\n| 所有权转让 | 居住权不受影响，新所有权人应尊重居住权 |\n| 所有权消灭 | 居住权随之消灭 |\n\n**3. 居住权与租赁权**：\n\n| 冲突情形 | 处理规则 |\n|----------|----------|\n| 先设居住权，后出租 | 不得出租（当事人另有约定的除外） |\n| 先出租，后设居住权 | 租赁权不受影响，\"买卖不破租赁\" |\n\n### 五、居住权的消灭\n\n| 消灭事由 | 法律依据 |\n|----------|----------|\n| 期限届满 | 《民法典》第370条 |\n| 居住权人死亡 | 《民法典》第370条 |\n| 居住权人放弃 | 民法一般原理 |\n| 住宅灭失 | 物权客体消灭 |\n| 混同 | 居住权人取得所有权 |\n\n### 六、裁判规则\n\n| 序号 | 裁判规则 | 典型案例 |\n|------|----------|----------|\n| 1 | 居住权自登记时设立，未登记不设立 | — |\n| 2 | 居住权不得转让、继承 | — |\n| 3 | 先设抵押权后设居住权的，抵押权实现时居住权消灭 | — |\n| 4 | 以遗嘱方式设立居住权需办理登记 | — |\n| 5 | 居住权人死亡的，居住权消灭 | — |\n\n### 七、实务要点\n\n1. **登记是关键**：居住权以登记为设立要件，务必办理居住权登记\n2. **书面合同**：设立居住权应当采用书面形式\n3. **以房养老**：居住权制度为\"以房养老\"提供了法律保障\n4. **离婚居住**：离婚后一方无房居住的，可以设立居住权\n5. **抵押权冲突**：设立居住权前应核"},{"id":"建设用地使用权","title":"建设用地使用权","excerpt":"--- tags: [民法, 物权法, 用益物权, 建设用地使用权, 出让, 划拨] created: 2026-05-28 updated: 2026-05-28 status: reviewed type: knowledge --- 建设用地使用权是指建设用地使用权人依法对国家所有的土地享有占有、使用和收益的权利，有权利用该土地建造建筑物、构筑物及其附属设施。建设用地使用权是城市土地利用的核","slug":"建设用地使用权","module":"02-物权法","moduleName":"02-物权法","tags":["民法","物权法","用益物权","建设用地使用权","出让","划拨"],"wordCount":2420,"created":"2026-05-28","updated":"2026-05-28","content":"# 建设用地使用权\n\n## 概述\n\n建设用地使用权是指建设用地使用权人依法对国家所有的土地享有占有、使用和收益的权利，有权利用该土地建造建筑物、构筑物及其附属设施。建设用地使用权是城市土地利用的核心制度，涉及房地产开发、城市建设等重要领域。\n\n## 核心内容\n\n### 一、法律依据\n\n| 条文 | 内容要点 |\n|------|----------|\n| 《民法典》第344条 | **定义**：建设用地使用权人依法对国家所有的土地享有占有、使用和收益的权利，有权利用该土地建造建筑物、构筑物及其附属设施 |\n| 《民法典》第345条 | **设立范围**：建设用地使用权可以在土地的地表、地上或者地下分别设立 |\n| 《民法典》第346条 | **设立原则**：设立建设用地使用权，应当符合节约资源、保护生态环境的要求 |\n| 《民法典》第347条 | **设立方式**：设立建设用地使用权，可以采取出让或者划拨等方式 |\n| 《民法典》第348条 | **出让合同**：设立建设用地使用权的，应当向登记机构申请建设用地使用权登记 |\n| 《民法典》第349条 | **登记生效**：建设用地使用权自登记时设立 |\n| 《民法典》第350条 | **用途限制**：建设用地使用权人应当合理利用土地，不得改变土地用途 |\n| 《民法典》第351条 | **出让金缴纳**：建设用地使用权人应当依照法律规定以及合同约定支付出让金等费用 |\n| 《民法典》第352条 | **房地一体**：建设用地使用权转让、互换、出资或者赠与的，附着于该土地上的建筑物、构筑物及其附属设施一并处分 |\n| 《民法典》第353条 | **流转权利**：建设用地使用权人有权将建设用地使用权转让、互换、出资、赠与或者抵押 |\n| 《民法典》第354条 | **流转限制**：建设用地使用权转让、互换、出资、赠与或者抵押的，当事人应当采用书面形式订立合同，使用期限由当事人约定，但不得超过建设用地使用权的剩余期限 |\n| 《民法典》第359条 | **续期规则**：住宅建设用地使用权期限届满的，自动续期 |\n\n### 二、建设用地使用权的设立\n\n**设立方式**：\n\n| 方式 | 法律依据 | 特点 | 适用情形 |\n|------|----------|------|----------|\n| 出让 | 《民法典》第347条 | 有偿、有期限 | 经营性用地 |\n| 划拨 | 《民法典》第347条 | 无偿、无期限 | 公益性用地 |\n\n**出让方式**：\n\n| 方式 | 法律依据 | 说明 |\n|------|----------|------|\n| 招标 | 《土地管理法》 | 综合评价 |\n| 拍卖 | 《土地管理法》 | 价高者得 |\n| 协议 | 《土地管理法》 | 特定情形 |\n\n**出让期限**：\n\n| 用途 | 最高年限 | 法律依据 |\n|------|----------|----------|\n| 居住用地 | 70年 | 《城镇国有土地使用权出让和转让暂行条例》 |\n| 工业用地 | 50年 | 《城镇国有土地使用权出让和转让暂行条例》 |\n| 教育、科技、文化、卫生、体育用地 | 50年 | 《城镇国有土地使用权出让和转让暂行条例》 |\n| 商业、旅游、娱乐用地 | 40年 | 《城镇国有土地使用权出让和转让暂行条例》 |\n| 综合或其他用地 | 50年 | 《城镇国有土地使用权出让和转让暂行条例》 |\n\n### 三、房地一体原则\n\n**法律规则**：\n\n| 规则 | 具体内容 | 法律依据 |\n|------|----------|----------|\n| 房随地走 | 建设用地使用权转让、互换、出资或者赠与的，附着于该土地上的建筑物一并处分 | 《民法典》第352条 |\n| 地随房走 | 建筑物、构筑物及其附属设施转让、互换、出资或者赠与的，该建筑物占用范围内的建设用地使用权一并处分 | 《民法典》第356条 |\n\n**实务意义**：\n\n1. 房地不可分离处分\n2. 房地权利主体应当一致\n3. 房地抵押权同时实现\n\n### 四、住宅用地续期\n\n**法律规则**：\n\n| 规则 | 具体内容 | 法律依据 |\n|------|----------|----------|\n| 自动续期 | 住宅建设用地使用权期限届满的，自动续期 | 《民法典》第359条 |\n| 费用缴纳 | 续期费用的缴纳或者减免，依照法律、行政法规的规定办理 | 《民法典》第359条 |\n| 非住宅用地 | 非住宅建设用地使用权届满后的续期，依照法律规定办理 | 《民法典》第359条 |\n\n**实务要点**：\n\n1. 住宅用地70年到期后自动续期\n2. 续期费用标准尚未明确\n3."},{"id":"侵权责任归责原则","title":"侵权责任归责原则","excerpt":"--- tags: [民法, 侵权责任, 归责原则, 过错责任, 无过错责任] created: 2026-05-28 updated: 2026-05-28 status: reviewed type: knowledge --- 侵权责任归责原则是侵权责任法的核心制度，决定了侵权责任的构成要件和举证责任分配。我国侵权责任法采用过错责任原则为一般原则，无过错责任原则为特殊原则的二元归责体系。 |","slug":"侵权责任归责原则","module":"03-侵权责任","moduleName":"03-侵权责任","tags":["民法","侵权责任","归责原则","过错责任","无过错责任"],"wordCount":1657,"created":"2026-05-28","updated":"2026-05-28","content":"# 侵权责任归责原则\n\n## 概述\n\n侵权责任归责原则是侵权责任法的核心制度，决定了侵权责任的构成要件和举证责任分配。我国侵权责任法采用过错责任原则为一般原则，无过错责任原则为特殊原则的二元归责体系。\n\n## 核心内容\n\n### 一、法律依据\n\n| 条文 | 内容要点 |\n|------|----------|\n| 《民法典》第1165条 | **过错责任原则**：行为人因过错侵害他人民事权益造成损害的，应当承担侵权责任 |\n| 《民法典》第1166条 | **无过错责任原则**：行为人造成他人民事权益损害，不论行为人有无过错，法律规定应当承担侵权责任的，依照其规定 |\n| 《民法典》第1167条 | **停止侵害、排除妨碍、消除危险**：危及他人人身、财产安全的，被侵权人有权请求侵权人承担停止侵害、排除妨碍、消除危险等侵权责任 |\n\n### 二、过错责任原则\n\n**适用范围**：一般侵权行为\n\n**构成要件**：\n\n| 要件 | 具体内容 | 证明责任 |\n|------|----------|----------|\n| 违法行为 | 侵害他人民事权益的行为 | 被侵权人证明 |\n| 损害事实 | 造成他人人身或财产损害 | 被侵权人证明 |\n| 因果关系 | 违法行为与损害事实之间有因果关系 | 被侵权人证明 |\n| 主观过错 | 行为人有故意或过失 | 被侵权人证明 |\n\n**过错推定**：\n\n| 情形 | 法律依据 |\n|------|----------|\n| 无民事行为能力人在教育机构受到损害 | 《民法典》第1199条 |\n| 医疗损害中推定医疗机构有过错 | 《民法典》第1222条 |\n| 动物园的动物造成他人损害 | 《民法典》第1248条 |\n| 建筑物及其搁置物、悬挂物脱落、坠落造成他人损害 | 《民法典》第1253条 |\n\n### 三、无过错责任原则\n\n**适用范围**：法律特别规定的侵权行为\n\n**法定情形**：\n\n| 情形 | 法律依据 |\n|------|----------|\n| 产品责任 | 《民法典》第1202条 |\n| 机动车交通事故责任 | 《民法典》第1208条 |\n| 环境污染、生态破坏责任 | 《民法典》第1229条 |\n| 高度危险责任 | 《民法典》第1236条 |\n| 饲养动物损害责任 | 《民法典》第1245条 |\n| 用人单位责任 | 《民法典》第1191条 |\n\n### 四、公平责任\n\n**法律依据**：《民法典》第1186条\n\n**适用条件**：\n- 双方均无过错\n- 法律没有规定适用无过错责任\n- 根据实际情况分担损失\n\n### 五、裁判规则\n\n| 规则 | 要旨 | 实务指引 |\n|------|------|----------|\n| 过错责任为原则 | 一般侵权适用过错责任 | 被侵权人需证明过错 |\n| 无过错责任为例外 | 仅限法律明确规定的情形 | 行为人无法以无过错免责 |\n| 过错推定 | 法定情形下推定行为人有过错 | 行为人需证明自己无过错 |\n| 举证责任分配 | 过错责任下被侵权人举证 | 无过错责任下行为人举证免责事由 |\n\n### 六、实务要点\n\n1. **归责原则的选择**：确定适用过错责任还是无过错责任\n2. **举证责任分配**：过错责任下被侵权人需证明过错\n3. **免责事由**：无过错责任下行为人需证明法定免责事由\n4. **过错推定**：法定情形下推定行为人有过错\n\n## 典型案例\n\n### 案例：交通事故中非机动车一方过错对归责原则的影响\n\n**案情概要**：王某驾驶机动车与李某驾驶的电动自行车发生碰撞，事故中李某存在闯红灯等较大过错。王某诉请李某赔偿车辆损失，李某则主张机动车一方应承担无过错责任。\n\n**裁判要旨**：机动车与非机动车之间发生交通事故，虽然机动车一方适用无过错责任原则，但非机动车一方存在较大过错的，应当适当减轻机动车一方的赔偿责任。过失相抵规则的适用不因归责原则不同而被排除。\n\n**与知识点的关联分析**：本案涉及无过错责任原则与过失相抵规则的交叉适用。《民法典》第1208条结合《道路交通安全法》第76条，规定机动车与非机动车之间的交通事故适用无过错责任（机动车一方承担）。但根据《民法典》第1173条，被侵权人对同一损害的发生或者扩大有过错的，可以减轻侵权人的责任。本案说明，无过错责任并非\"绝对责任\"，受害人过错仍可作为减轻责任的事由。\n\n> 📖 详见 [[⚖️ 民法实务知识库/06-案例库/01-最高院指导案例/指导案例-侵权责任系列]] 中关于指导案例第24号（荣宝英案）的详细分析，该案明确了交通事故受害人特殊体质不属于可以减轻侵权人责任的法定情形。\n\n## 参考来源\n\n- 《中华人民共和国民法典》第"},{"id":"侵权责任构成要件","title":"侵权责任构成要件","excerpt":"--- tags: [民法, 侵权责任, 构成要件, 违法行为, 损害事实, 因果关系, 过错] created: 2026-05-28 updated: 2026-05-28 status: reviewed type: knowledge --- 侵权责任构成要件是判断行为人是否承担侵权责任的标准。我国侵权责任法采用四要件说，即违法行为、损害事实、因果关系和主观过错。掌握侵权责任构成要件是处理","slug":"侵权责任构成要件","module":"03-侵权责任","moduleName":"03-侵权责任","tags":["民法","侵权责任","构成要件","违法行为","损害事实","因果关系","过错"],"wordCount":1528,"created":"2026-05-28","updated":"2026-05-28","content":"# 侵权责任构成要件\n\n## 概述\n\n侵权责任构成要件是判断行为人是否承担侵权责任的标准。我国侵权责任法采用四要件说，即违法行为、损害事实、因果关系和主观过错。掌握侵权责任构成要件是处理侵权纠纷的基础。\n\n## 核心内容\n\n### 一、法律依据\n\n| 条文 | 内容要点 |\n|------|----------|\n| 《民法典》第1165条 | 过错责任的构成要件 |\n| 《民法典》第1166条 | 无过错责任的构成要件 |\n\n### 二、四要件体系\n\n**1. 违法行为**\n\n| 类型 | 具体内容 | 典型情形 |\n|------|----------|----------|\n| 作为 | 积极实施侵害行为 | 殴打、诽谤、盗窃 |\n| 不作为 | 未履行法定义务 | 未尽安全保障义务、未尽监护职责 |\n\n**2. 损害事实**\n\n| 类型 | 具体内容 | 典型情形 |\n|------|----------|----------|\n| 人身损害 | 生命权、身体权、健康权受侵害 | 受伤、残疾、死亡 |\n| 财产损害 | 财产权受侵害 | 财物毁损、财产减少 |\n| 精神损害 | 精神痛苦 | 侵害人格权造成的精神痛苦 |\n\n**3. 因果关系**\n\n| 类型 | 具体内容 | 认定标准 |\n|------|----------|----------|\n| 直接因果关系 | 违法行为直接导致损害 | 条件说+相当因果关系说 |\n| 间接因果关系 | 违法行为通过中介因素导致损害 | 相当因果关系说 |\n\n**4. 主观过错**\n\n| 类型 | 具体内容 | 认定标准 |\n|------|----------|----------|\n| 故意 | 明知会发生损害而希望或放任 | 主观状态 |\n| 过失 | 应当预见而未预见，或已预见而轻信能够避免 | 客观标准（合理人标准） |\n\n### 三、举证责任分配\n\n| 要件 | 证明责任 | 证明标准 |\n|------|----------|----------|\n| 违法行为 | 被侵权人 | 高度盖然性 |\n| 损害事实 | 被侵权人 | 高度盖然性 |\n| 因果关系 | 被侵权人 | 高度盖然性 |\n| 主观过错 | 被侵权人（过错责任）/推定（过错推定） | 高度盖然性 |\n\n### 四、裁判规则\n\n| 规则 | 要旨 | 实务指引 |\n|------|------|----------|\n| 四要件缺一不可 | 四个要件必须同时具备 | 全面收集证据 |\n| 举证责任分配 | 被侵权人承担举证责任 | 保留证据 |\n| 因果关系认定 | 采用相当因果关系说 | 证明行为与损害的关联性 |\n| 过错认定 | 采用客观标准（合理人标准） | 证明行为人未尽合理注意义务 |\n\n### 五、实务要点\n\n1. **证据收集**：全面收集违法行为、损害事实、因果关系、过错的证据\n2. **举证策略**：根据归责原则确定举证重点\n3. **因果关系证明**：采用相当因果关系说\n4. **过错证明**：采用客观标准（合理人标准）\n\n## 典型案例\n\n### 案例：交通事故受害人特殊体质不属于可以减轻侵权人责任的法定情形\n\n**案号**：指导案例第24号 / （2013）锡民终字第497号\n**审理法院**：江苏省无锡市中级人民法院\n**裁判日期**：2013年6月21日\n**来源**：[指导案例24号——维基文库](https://zh.wikisource.org/wiki/指导案例24号) · [中国法学网分析](https://iolaw.cssn.cn/fxyjdt/201708/t20170815_4652154.shtml)\n\n**案情概要**：王阳驾驶机动车在人行横道线处碰擦行人荣宝英致其受伤。荣宝英年事已高、骨质疏松，经鉴定伤残等级为九级和十级，但鉴定意见将\"损伤参与度评定为75%，其个人体质的因素占25%\"。一审法院据此扣减25%残疾赔偿金。\n\n**裁判要旨**：交通事故的受害人没有过错，其体质状况对损害后果的影响不属于可以减轻侵权人责任的法定情形。受害人年老骨质疏松仅是事故造成后果的客观因素，并无法律上的因果关系。不应因受害人个人体质状况对交通事故导致的伤残存在一定影响而自负相应责任。\n\n**与知识点的关联分析**：本案是侵权责任构成要件中\"因果关系\"认定的经典案例。法院区分了病理上的因果关系与侵权法领域的责任因果关系，明确受害人特殊体质不构成法律上的\"过错\"，不适用过失相抵。本案涉及四要件中\"因果关系\"和\"主观过错\"的认定标准，体现了相当因果关系说在司法实践中的适用。\n\n## 参考来源\n\n- 《中华人民共和国民法典》第七编侵权责任\n- 王利明：《侵权责任法研究》"},{"id":"共同侵权","title":"共同侵权","excerpt":"--- tags: [民法, 侵权责任, 共同侵权, 教唆帮助, 共同危险行为] created: 2026-05-28 updated: 2026-05-28 status: reviewed type: knowledge --- 共同侵权是指二人以上共同实施侵权行为，造成他人损害的情形。共同侵权包括共同加害行为、教唆帮助行为和共同危险行为。共同侵权的法律后果是侵权人承担连带责任。 | 条文 ","slug":"共同侵权","module":"03-侵权责任","moduleName":"03-侵权责任","tags":["民法","侵权责任","共同侵权","教唆帮助","共同危险行为"],"wordCount":1717,"created":"2026-05-28","updated":"2026-05-28","content":"# 共同侵权\n\n## 概述\n\n共同侵权是指二人以上共同实施侵权行为，造成他人损害的情形。共同侵权包括共同加害行为、教唆帮助行为和共同危险行为。共同侵权的法律后果是侵权人承担连带责任。\n\n## 核心内容\n\n### 一、法律依据\n\n| 条文 | 内容要点 |\n|------|----------|\n| 《民法典》第1168条 | **共同加害行为**：二人以上共同实施侵权行为，造成他人损害的，应当承担连带责任 |\n| 《民法典》第1169条 | **教唆帮助行为**：教唆、帮助他人实施侵权行为的，应当与行为人承担连带责任 |\n| 《民法典》第1170条 | **共同危险行为**：二人以上实施危及他人人身、财产安全的行为，其中一人或者数人的行为造成他人损害，不能确定具体侵权人的，行为人承担连带责任 |\n| 《民法典》第1171条 | **分别侵权（连带）**：二人以上分别实施侵权行为造成同一损害，每个人的侵权行为都足以造成全部损害的，行为人承担连带责任 |\n| 《民法典》第1172条 | **分别侵权（按份）**：二人以上分别实施侵权行为造成同一损害，能够确定责任大小的，各自承担相应的责任；难以确定责任大小的，平均承担责任 |\n\n### 二、共同加害行为\n\n**构成要件**：\n\n| 要件 | 具体内容 |\n|------|----------|\n| 主体 | 二人以上 |\n| 行为 | 共同实施侵权行为 |\n| 损害 | 造成他人损害 |\n| 因果关系 | 行为与损害之间有因果关系 |\n\n**\"共同\"的认定**：\n\n| 类型 | 认定标准 | 典型情形 |\n|------|----------|----------|\n| 意思联络 | 共同故意 | 合谋伤害他人 |\n| 共同过失 | 共同疏忽 | 二人共同操作失误 |\n\n### 三、教唆帮助行为\n\n**构成要件**：\n\n| 要件 | 具体内容 |\n|------|----------|\n| 教唆行为 | 教唆他人实施侵权行为 |\n| 帮助行为 | 帮助他人实施侵权行为 |\n| 因果关系 | 教唆、帮助行为与损害之间有因果关系 |\n\n**特殊规定**：\n\n| 情形 | 法律后果 |\n|------|----------|\n| 教唆、帮助无民事行为能力人、限制民事行为能力人 | 教唆人、帮助人承担侵权责任 |\n| 监护人未尽监护职责 | 监护人承担相应的责任 |\n\n### 四、共同危险行为\n\n**构成要件**：\n\n| 要件 | 具体内容 |\n|------|----------|\n| 主体 | 二人以上 |\n| 行为 | 实施危及他人人身、财产安全的行为 |\n| 损害 | 其中一人或者数人的行为造成他人损害 |\n| 不能确定 | 不能确定具体侵权人 |\n\n**免责事由**：\n\n| 事由 | 法律后果 |\n|------|----------|\n| 确定具体侵权人 | 其他行为人不承担责任 |\n| 证明损害与自己无关 | 可以免除责任 |\n\n### 五、裁判规则\n\n| 规则 | 要旨 | 实务指引 |\n|------|------|----------|\n| 共同侵权承担连带责任 | 二人以上共同实施侵权行为 | 被侵权人可向任一侵权人主张全部赔偿 |\n| 教唆帮助承担连带责任 | 教唆、帮助他人实施侵权行为 | 教唆人、帮助人与行为人连带 |\n| 共同危险行为承担连带责任 | 不能确定具体侵权人 | 行为人需证明自己非侵权人方可免责 |\n| 分别侵权按份责任 | 能够确定责任大小 | 各自承担相应责任 |\n\n### 六、实务要点\n\n1. **共同侵权的认定**：需证明二人以上共同实施侵权行为\n2. **教唆帮助的认定**：需证明教唆、帮助行为的存在\n3. **共同危险的认定**：需证明不能确定具体侵权人\n4. **连带责任**：被侵权人可向任一侵权人主张全部赔偿\n\n## 典型案例\n\n### 案例：套牌机动车交通事故中号牌出借人与套牌车所有人承担连带责任\n\n**案号**：指导案例第19号 / （2010）沪二中民一（民）终字第1353号\n**审理法院**：上海市第二中级人民法院\n**裁判日期**：2010年8月5日\n**来源**：[指导案例19号——维基文库](https://zh.wikisource.org/wiki/指导案例19号) · [指导案例19号理解与参照](https://www.jtsg.org/2022-05-09/8308.html)\n\n**案情概要**：林则东驾驶套牌货车与周亚平驾驶的客车相撞，致客车乘客冯永菊死亡。套牌货车实际所有人为卫广辉，林则东系其雇佣司机。被套牌货车登记所有人为福山公司，实际所有人为卫德平。经查，卫德平对套牌事宜知情并收取套牌费，福山公司曾"},{"id":"连带责任与按份责任","title":"连带责任与按份责任","excerpt":"--- tags: [民法, 侵权责任, 连带责任, 按份责任, 责任形态] created: 2026-05-28 updated: 2026-05-28 status: reviewed type: knowledge --- 连带责任与按份责任是侵权责任的两种基本责任形态。连带责任中，每个侵权人都有义务承担全部赔偿责任；按份责任中，每个侵权人只承担自己份额内的责任。正确区分连带责任与按份责任","slug":"连带责任与按份责任","module":"03-侵权责任","moduleName":"03-侵权责任","tags":["民法","侵权责任","连带责任","按份责任","责任形态"],"wordCount":1863,"created":"2026-05-28","updated":"2026-05-28","content":"# 连带责任与按份责任\n\n## 概述\n\n连带责任与按份责任是侵权责任的两种基本责任形态。连带责任中，每个侵权人都有义务承担全部赔偿责任；按份责任中，每个侵权人只承担自己份额内的责任。正确区分连带责任与按份责任，对诉讼策略和执行效果有重要影响。\n\n## 核心内容\n\n### 一、法律依据\n\n| 条文 | 内容要点 |\n|------|----------|\n| 《民法典》第178条 | **连带责任**：连带责任人的责任份额根据各自责任大小确定；难以确定的，平均承担责任 |\n| 《民法典》第1168条 | 共同侵权承担连带责任 |\n| 《民法典》第1169条 | 教唆帮助承担连带责任 |\n| 《民法典》第1170条 | 共同危险行为承担连带责任 |\n| 《民法典》第1171条 | 分别侵权（连带）：每个人的侵权行为都足以造成全部损害 |\n| 《民法典》第1172条 | 分别侵权（按份）：能够确定责任大小 |\n\n### 二、连带责任\n\n**特征**：\n\n| 特征 | 具体内容 |\n|------|----------|\n| 对外效力 | 每个侵权人都有义务承担全部赔偿责任 |\n| 对内效力 | 各侵权人按照责任份额分担 |\n| 追偿权 | 承担超过自己份额的侵权人有权向其他侵权人追偿 |\n\n**法定连带责任情形**：\n\n| 情形 | 法律依据 |\n|------|----------|\n| 共同侵权 | 《民法典》第1168条 |\n| 教唆帮助 | 《民法典》第1169条 |\n| 共同危险行为 | 《民法典》第1170条 |\n| 分别侵权（每个都足以造成全部损害） | 《民法典》第1171条 |\n| 网络服务提供者与网络用户 | 《民法典》第1197条 |\n| 拼装车、报废车转让 | 《民法典》第1214条 |\n\n### 三、按份责任\n\n**特征**：\n\n| 特征 | 具体内容 |\n|------|----------|\n| 对外效力 | 每个侵权人只承担自己份额内的责任 |\n| 对内效力 | 各侵权人按照责任份额分担 |\n| 无追偿权 | 不存在追偿问题 |\n\n**法定按份责任情形**：\n\n| 情形 | 法律依据 |\n|------|----------|\n| 分别侵权（能够确定责任大小） | 《民法典》第1172条 |\n| 过失相抵 | 《民法典》第1173条 |\n| 第三人过错 | 《民法典》第1175条 |\n\n### 四、责任份额的确定\n\n**确定规则**：\n\n| 规则 | 具体内容 |\n|------|----------|\n| 按过错程度 | 故意 > 重大过失 > 一般过失 |\n| 按原因力大小 | 主要原因 > 次要原因 |\n| 平均分担 | 难以确定的，平均承担责任 |\n\n### 五、裁判规则\n\n| 规则 | 要旨 | 实务指引 |\n|------|------|----------|\n| 连带责任对外连带 | 被侵权人可向任一侵权人主张全部赔偿 | 选择有赔偿能力的侵权人起诉 |\n| 连带责任对内按份 | 各侵权人按照责任份额分担 | 承担超过份额的可追偿 |\n| 按份责任各自承担 | 每个侵权人只承担自己份额内的责任 | 分别起诉各侵权人 |\n| 责任份额确定 | 按过错程度和原因力大小 | 收集过错和原因力证据 |\n\n### 六、实务要点\n\n1. **诉讼策略**：连带责任下，选择有赔偿能力的侵权人起诉\n2. **追偿权**：连带责任人承担超过自己份额的，有权向其他侵权人追偿\n3. **举证重点**：按过错程度和原因力大小确定责任份额\n4. **执行效果**：连带责任更有利于被侵权人获得赔偿\n\n## 典型案例\n\n### 案例一：拼装车、报废车转让的连带责任\n\n**法律依据**：《民法典》第1214条；侵权责任编司法解释（一）（法释〔2024〕12号）第20条\n\n**规则要旨**：以买卖或者其他方式转让拼装或者已经达到报废标准的机动车，发生交通事故造成损害的，由转让人和受让人承担连带责任。转让人不能以车辆已交付、已转让为由免除责任。\n\n**与知识点的关联分析**：本案体现了连带责任的法定适用情形。拼装车、报废车的转让行为本身即具有违法性，转让人与受让人均有过错，法律直接规定其承担连带责任。被侵权人可向转让人或受让人任一方主张全部赔偿，体现了连带责任\"对外连带\"的特征。司法解释进一步明确，转让人与受让人之间的责任份额，根据各自过错程度和原因力大小确定。\n\n---\n\n### 案例二：未投保交强险的投保义务人与侵权人共同承担赔偿责任\n\n**法律依据**：侵权责任编司法解释（一）（法释〔2024〕12号）第21条\n\n**规则要旨**：未依法投保交强险的机动车发生交通事故造成损害，当事人请求投保义务人在交强险责任限额范围"},{"id":"人身损害赔偿","title":"人身损害赔偿","excerpt":"--- tags: [民法, 侵权责任, 损害赔偿, 人身损害, 医疗费, 残疾赔偿金, 死亡赔偿金] created: 2026-05-28 updated: 2026-05-28 status: reviewed type: knowledge --- 人身损害赔偿是侵权责任法中最基础、最常见的赔偿类型，旨在对受害人因身体、健康、生命遭受侵害而产生的财产损失进行填补。实务中，人身损害赔偿案件数","slug":"人身损害赔偿","module":"03-侵权责任","moduleName":"03-侵权责任","tags":["民法","侵权责任","损害赔偿","人身损害","医疗费","残疾赔偿金","死亡赔偿金"],"wordCount":1372,"created":"2026-05-28","updated":"2026-05-28","content":"# 人身损害赔偿\n\n## 概述\n\n人身损害赔偿是侵权责任法中最基础、最常见的赔偿类型，旨在对受害人因身体、健康、生命遭受侵害而产生的财产损失进行填补。实务中，人身损害赔偿案件数量庞大，涉及交通事故、医疗损害、工伤事故等多个领域。\n\n## 核心内容\n\n### 一、法律依据\n\n**《民法典》第1179条（核心条款）：**\n> 侵害他人造成人身损害的，应当赔偿医疗费、护理费、交通费、营养费、住院伙食补助费等为治疗和康复支出的合理费用，以及因误工减少的收入。造成残疾的，还应当赔偿辅助器具费和残疾赔偿金；造成死亡的，还应当赔偿丧葬费和死亡赔偿金。\n\n### 二、赔偿项目及计算标准\n\n#### （一）医疗费\n\n**计算公式：**\n```\n医疗费 = 诊疗费 + 医药费 + 住院费 + 后续治疗费\n```\n\n**举证要点：** 保留所有医疗费票据原件，确保病历记载与治疗费用相对应。\n\n#### （二）误工费\n\n**计算公式：**\n```\n误工费 = 误工收入 × 误工时间\n```\n\n| 收入类型 | 计算方式 | 举证要求 |\n|---------|---------|---------|\n| 有固定收入 | 按实际减少的收入计算 | 工资条、银行流水 |\n| 无固定收入 | 参照相同或相近行业平均工资 | 职业资质证明 |\n\n#### （三）护理费\n\n**计算公式：**\n```\n护理费 = 护理收入 × 护理人数 × 护理期限\n```\n\n#### （四）残疾赔偿金\n\n**计算公式：**\n```\n残疾赔偿金 = 受诉法院所在地上一年度城镇居民人均可支配收入 × 赔偿年限 × 伤残赔偿指数\n```\n\n| 年龄段 | 赔偿年限 |\n|-------|---------|\n| 60周岁以下 | 20年 |\n| 60-75周岁 | 每增加一岁减少一年 |\n| 75周岁以上 | 5年 |\n\n| 伤残等级 | 赔偿指数 |\n|---------|---------|\n| 一级伤残 | 100% |\n| 十级伤残 | 10% |\n\n#### （五）死亡赔偿金\n\n**计算公式：**\n```\n死亡赔偿金 = 受诉法院所在地上一年度城镇居民人均可支配收入 × 赔偿年限\n```\n\n#### （六）丧葬费\n\n**计算公式：**\n```\n丧葬费 = 受诉法院所在地上一年度职工月平均工资 × 6个月\n```\n\n### 三、裁判规则\n\n| 序号 | 裁判规则 | 实务要点 |\n|------|----------|----------|\n| 1 | 城乡标准统一 | 以\"经常居住地+主要收入来源地\"双重判断 |\n| 2 | 被扶养人生活费计入残疾/死亡赔偿金 | 不再单列 |\n| 3 | 过失相抵规则 | 被侵权人有过错的，减轻侵权人责任 |\n| 4 | 交强险优先赔偿 | 交强险在责任限额内优先赔偿 |\n\n### 四、实务要点\n\n1. **举证责任分配**：受害人需证明侵权行为、损害后果、因果关系、具体损失数额\n2. **鉴定注意事项**：一般在治疗终结后进行伤残鉴定\n3. **诉讼时效**：普通诉讼时效3年\n4. **赔偿协议效力**：签订前建议进行伤残鉴定\n\n## 典型案例\n\n### 案例：超法定退休年龄受害人的误工费请求应予支持\n\n**案情概要**：金某已超过法定退休年龄，在道路上行走时被谭某驾驶的机动车撞伤。金某诉请谭某及保险公司赔偿医疗费、误工费等损失。保险公司以金某已超过退休年龄为由，抗辩不应支持误工费。\n\n**裁判要旨**：超过法定退休年龄的受害人，如有证据证明其仍从事劳动并有实际收入，因侵权行为导致收入减少的，误工费请求应予支持。法定退休年龄不是判断是否具有劳动能力的唯一标准，应以受害人实际劳动能力和收入状况为依据。\n\n**与知识点的关联分析**：本案涉及误工费的计算标准问题。根据《民法典》第1179条，误工费属于人身损害赔偿的法定项目。误工费的认定应以\"实际减少的收入\"为标准，而非以年龄为标准。对于超过退休年龄但仍从事劳动的受害人，只要有证据证明其有劳动收入且因损害而减少，就应当支持误工费请求。这体现了人身损害赔偿的\"填补损失\"原则。\n\n## 参考来源\n\n- 《中华人民共和国民法典》第1179条\n- 《最高人民法院关于审理人身损害赔偿案件适用法律若干问题的解释》\n\n## 相关主题\n\n- [[财产损害赔偿]]\n- [[精神损害赔偿]]\n- [[惩罚性赔偿]]"},{"id":"惩罚性赔偿","title":"惩罚性赔偿","excerpt":"--- tags: [民法, 侵权责任, 损害赔偿, 惩罚性赔偿, 恶意侵权] created: 2026-05-28 updated: 2026-05-28 status: reviewed type: knowledge --- 惩罚性赔偿是指超出实际损失数额的赔偿，其功能不仅在于填补损失，更在于惩罚恶意侵权人并遏制类似行为。我国《民法典》在多个领域确立了惩罚性赔偿制度，体现了对恶意侵权行为的","slug":"惩罚性赔偿","module":"03-侵权责任","moduleName":"03-侵权责任","tags":["民法","侵权责任","损害赔偿","惩罚性赔偿","恶意侵权"],"wordCount":1550,"created":"2026-05-28","updated":"2026-05-28","content":"# 惩罚性赔偿\n\n## 概述\n\n惩罚性赔偿是指超出实际损失数额的赔偿，其功能不仅在于填补损失，更在于惩罚恶意侵权人并遏制类似行为。我国《民法典》在多个领域确立了惩罚性赔偿制度，体现了对恶意侵权行为的严厉态度。\n\n## 核心内容\n\n### 一、法律依据\n\n| 条文 | 适用领域 | 要件 |\n|------|---------|------|\n| 《民法典》第1185条 | 知识产权 | 故意侵害，情节严重 |\n| 《民法典》第1207条 | 产品责任 | 明知缺陷仍生产销售，造成死亡或健康严重损害 |\n| 《民法典》第1232条 | 环境侵权 | 故意污染环境、破坏生态，造成严重后果 |\n| 《消费者权益保护法》第55条 | 消费欺诈 | 经营者欺诈，三倍赔偿 |\n| 《食品安全法》第148条 | 食品安全 | 生产不符合安全标准食品，十倍赔偿 |\n\n### 二、适用条件\n\n**（一）一般构成要件**\n\n| 要件 | 具体内容 |\n|------|----------|\n| 主观要件 | 故意或明知（排除过失） |\n| 行为要件 | 实施侵权行为 |\n| 损害要件 | 造成严重后果（部分领域要求） |\n| 因果关系 | 侵权行为与损害之间有因果关系 |\n\n**（二）各领域特殊要件**\n\n| 领域 | 主观要件 | 损害要件 | 赔偿倍数 |\n|------|---------|---------|---------|\n| 知识产权 | 故意 | 情节严重 | 1-5倍 |\n| 产品责任 | 明知缺陷 | 死亡或健康严重损害 | 相应赔偿 |\n| 环境侵权 | 故意 | 严重后果 | 相应赔偿 |\n| 消费欺诈 | 欺诈 | — | 3倍 |\n| 食品安全 | — | — | 10倍（或损失3倍） |\n\n### 三、赔偿数额计算\n\n**计算基准**：\n\n| 领域 | 计算基准 | 赔偿倍数 |\n|------|---------|---------|\n| 知识产权 | 实际损失/侵权获利/许可使用费 | 1-5倍 |\n| 产品责任 | 实际损失 | 法院酌定 |\n| 环境侵权 | 实际损失/修复费用 | 法院酌定 |\n| 消费欺诈 | 商品价款/服务费用 | 3倍（最低500元） |\n| 食品安全 | 食品价款 | 10倍（最低1000元） |\n\n### 四、裁判规则\n\n| 规则 | 要旨 | 实务指引 |\n|------|------|----------|\n| 惩罚性赔偿以法律规定为限 | 法无明文不适用 | 确认法律依据 |\n| \"故意\"或\"明知\"的认定 | 需证明主观恶意 | 收集故意侵权证据 |\n| 赔偿基数确定 | 以实际损失或侵权获利为基准 | 申请审计或评估 |\n| 与补偿性赔偿并行 | 惩罚性赔偿不替代补偿性赔偿 | 同时主张 |\n| 消费者身份认定 | 职业打假人是否受保护 | 各地裁判不一 |\n\n### 五、实务要点\n\n1. **举证策略**：重点证明侵权人的\"故意\"或\"明知\"主观状态\n2. **赔偿基数**：选择最有利的计算基准（实际损失/侵权获利/许可费）\n3. **诉讼策略**：惩罚性赔偿与补偿性赔偿同时主张\n4. **证据收集**：保存侵权人明知侵权的证据（警告函、行政处罚记录等）\n5. **领域选择**：同一行为可能同时适用多个惩罚性赔偿条款\n\n## 典型案例\n\n### 案例：食品安全惩罚性赔偿中\"合理生活消费需要\"的认定\n\n**入库编号**：2025-07-2-373-001\n\n**案号**：（2024）渝05民终5663号\n\n**审理法院**：重庆市第五中级人民法院\n\n**裁判日期**：2024年7月2日\n\n**来源**：人民法院案例库\n\n**案情概要**：曾某在短时间内就同类食品重复购买、多次检测，购买数量远超日常生活所需，以食品不符合食品安全标准为由诉请生产者和销售者承担十倍价款的惩罚性赔偿。\n\n**裁判要旨**：购买者明知食品不符合食品安全标准仍然超出生活消费需要大量购买并请求经营者支付惩罚性赔偿金的行为与《消费者权益保护法》的立法本意不符。人民法院应在合理生活消费需要范围内支持其关于支付惩罚性赔偿金的诉讼请求，在认定购买者合理生活消费需要的食品数量时，应当综合考量食品保质期、普通消费者通常消费习惯等因素。\n\n**与知识点的关联分析**：本案涉及《食品安全法》第148条十倍惩罚性赔偿的适用。\"合理生活消费需要\"是判断惩罚性赔偿范围的重要标准，防止惩罚性赔偿制度被滥用。本案体现了惩罚性赔偿制度在食品安全领域的适用规则，同时也涉及《民法典》第1207条产品责任惩罚性赔偿与《食品安全法》特别规定的衔接。\n\n## 参考来源\n\n- 《中华人民共和国民法典》第1185条、第1207条、第1232条\n"},{"id":"精神损害赔偿","title":"精神损害赔偿","excerpt":"--- tags: [民法, 侵权责任, 损害赔偿, 精神损害赔偿, 人格权] created: 2026-05-28 updated: 2026-05-28 status: reviewed type: knowledge --- 精神损害赔偿是指自然人因人身权益或具有人身意义的特定物受到侵害，遭受精神痛苦或严重精神损害时，有权请求侵权人以金钱方式进行赔偿的制度。 《民法典》第1183条（精神损","slug":"精神损害赔偿","module":"03-侵权责任","moduleName":"03-侵权责任","tags":["民法","侵权责任","损害赔偿","精神损害赔偿","人格权"],"wordCount":1358,"created":"2026-05-28","updated":"2026-05-28","content":"# 精神损害赔偿\n\n## 概述\n\n精神损害赔偿是指自然人因人身权益或具有人身意义的特定物受到侵害，遭受精神痛苦或严重精神损害时，有权请求侵权人以金钱方式进行赔偿的制度。\n\n## 核心内容\n\n### 一、法律依据\n\n**《民法典》第1183条（精神损害赔偿核心条款）：**\n> 侵害自然人人身权益造成严重精神损害的，被侵权人有权请求精神损害赔偿。\n> 因故意或者重大过失侵害自然人具有人身意义的特定物造成严重精神损害的，被侵权人有权请求精神损害赔偿。\n\n**《民法典》第996条（违约精神损害赔偿）：**\n> 因当事人一方的违约行为，损害对方人格权并造成严重精神损害，受损害方选择请求其承担违约责任的，不影响受损害方请求精神损害赔偿。\n\n### 二、适用条件\n\n**请求权主体**：自然人（法人不享有精神损害赔偿请求权）\n\n**适用范围**：\n\n| 权益类型 | 典型情形 |\n|---------|---------|\n| 生命权、身体权、健康权 | 致人死亡、致残 |\n| 姓名权、肖像权、名誉权 | 盗用姓名、侵犯肖像 |\n| 隐私权、个人信息权益 | 窃听、偷拍、泄露隐私 |\n| 具有人身意义的特定物 | 遗物、结婚录像等 |\n\n**\"严重精神损害\"的认定**：\n\n| 严重程度 | 认定标准 |\n|---------|---------|\n| 严重 | 造成严重后果（致残、致死、严重精神障碍） |\n| 一般严重 | 造成明显精神痛苦 |\n\n### 三、赔偿数额的考量因素\n\n| 因素 | 说明 |\n|------|------|\n| 侵权人的过错程度 | 故意 > 重大过失 > 一般过失 |\n| 侵权行为的目的、方式、场合 | 手段恶劣、公开场合加重 |\n| 侵权行为所造成的后果 | 后果严重程度 |\n| 侵权人的获利情况 | 是否从侵权行为中获利 |\n| 侵权人承担责任的经济能力 | 经济能力与赔偿数额 |\n| 受诉法院所在地平均生活水平 | 地域差异 |\n\n### 四、裁判规则\n\n| 规则 | 要旨 | 实务指引 |\n|------|------|----------|\n| 精神损害赔偿以\"严重\"为要件 | 轻微精神痛苦一般不支持 | 提供医学证据 |\n| 致残可推定严重精神损害 | 构成伤残等级的，一般支持 | 伤残鉴定 |\n| 法人不享有精神损害赔偿请求权 | 法人名誉受损可主张财产损失 | 区分主体 |\n| 违约可请求精神损害赔偿 | 以人格权受侵害为前提 | 《民法典》第996条 |\n\n### 五、实务要点\n\n1. **举证策略**：保存侵权证据，证明精神损害严重\n2. **精神损害鉴定**：精神状态鉴定、因果关系鉴定\n3. **赔偿数额**：各地标准不一，一般数千至数万元\n\n## 典型案例\n\n### 案例：AI处理声音侵权中精神损害赔偿的认定\n\n**入库编号**：2025-07-2-474-001\n\n**案号**：（2023）京0491民初12142号\n\n**审理法院**：北京互联网法院\n\n**裁判日期**：2024年4月23日\n\n**来源**：人民法院案例库\n\n**案情概要**：殷某桢系知名配音演员，北京某智能科技公司等未经许可利用AI技术处理其声音并用于商业用途。殷某桢除主张经济损失赔偿外，还请求赔偿精神损失10万元。\n\n**裁判要旨**：殷某桢并未举证证明被诉侵权行为给其精神利益造成严重损害，因此对其精神损害赔偿请求不予支持。法院判决侵权人赔偿经济损失25万元并书面赔礼道歉，但驳回了精神损害赔偿请求。\n\n**与知识点的关联分析**：本案体现了精神损害赔偿以\"严重\"为要件的裁判规则。根据《民法典》第1183条，侵害自然人人身权益造成**严重精神损害**的，被侵权人有权请求精神损害赔偿。本案中，虽然声音权益受到侵害，但受害人未能证明精神损害达到\"严重\"程度，故精神损害赔偿请求未获支持。这说明精神损害赔偿的举证标准较高，受害人需提供充分证据证明精神损害的严重性。\n\n## 参考来源\n\n- 《中华人民共和国民法典》第1183条、第996条\n- 《最高人民法院关于确定民事侵权精神损害赔偿责任若干问题的解释》\n\n## 相关主题\n\n- [[人身损害赔偿]]\n- [[财产损害赔偿]]\n- [[惩罚性赔偿]]"},{"id":"财产损害赔偿","title":"财产损害赔偿","excerpt":"--- tags: [民法, 侵权责任, 损害赔偿, 财产损害, 直接损失, 间接损失] created: 2026-05-28 updated: 2026-05-28 status: reviewed type: knowledge --- 财产损害赔偿是指侵权人因侵害他人民事权益造成财产损失时，应当承担的赔偿责任。财产损害赔偿以填补损失为原则，旨在使受害人的财产状况恢复到侵权行为发生前的状态。","slug":"财产损害赔偿","module":"03-侵权责任","moduleName":"03-侵权责任","tags":["民法","侵权责任","损害赔偿","财产损害","直接损失","间接损失"],"wordCount":1303,"created":"2026-05-28","updated":"2026-05-28","content":"# 财产损害赔偿\n\n## 概述\n\n财产损害赔偿是指侵权人因侵害他人民事权益造成财产损失时，应当承担的赔偿责任。财产损害赔偿以填补损失为原则，旨在使受害人的财产状况恢复到侵权行为发生前的状态。\n\n## 核心内容\n\n### 一、法律依据\n\n**《民法典》第1184条（核心条款）：**\n> 侵害他人财产的，财产损失按照损失发生时的市场价格或者其他合理方式计算。\n\n**《民法典》第1182条（获利赔偿）：**\n> 侵害他人人身权益造成财产损失的，按照被侵权人因此受到的损失或者侵权人因此获得的利益赔偿；被侵权人因此受到的损失以及侵权人因此获得的利益难以确定，被侵权人和侵权人就赔偿数额协商不一致，向人民法院提起诉讼的，由人民法院根据实际情况确定赔偿数额。\n\n### 二、财产损失类型\n\n| 损失类型 | 定义 | 典型情形 | 计算方式 |\n|---------|------|----------|---------|\n| 直接损失 | 现有财产的减少 | 财物毁损、灭失 | 修复费用或市场价值 |\n| 间接损失 | 可得利益的丧失 | 营业利润损失、孳息损失 | 合理可预见的收益 |\n| 纯经济损失 | 非因绝对权受侵害 | 挖断电缆致营业损失 | 因果关系判断 |\n\n### 三、计算规则\n\n**（一）市场价格标准**\n\n| 情形 | 计算方式 |\n|------|---------|\n| 财物毁损 | 损失发生时的市场价格 |\n| 财物灭失 | 灭失时的市场价值 |\n| 特定物 | 参照评估价值 |\n| 无市场价值 | 其他合理方式 |\n\n**（二）修复费用标准**\n\n| 情形 | 计算方式 |\n|------|---------|\n| 可修复 | 修复费用 + 贬值损失 |\n| 修复不经济 | 按全损赔偿 |\n| 修复后仍有损失 | 修复费 + 残余损失 |\n\n**（三）获利赔偿规则**\n\n适用条件：\n1. 侵害人身权益造成财产损失\n2. 损失与获利均难以确定\n3. 双方就赔偿数额协商不一致\n\n### 四、裁判规则\n\n| 规则 | 要旨 | 实务指引 |\n|------|------|----------|\n| 填充原则 | 赔偿以实际损失为限 | 提供损失评估报告 |\n| 可预见性 | 间接损失需在合理预见范围内 | 证明因果关系和可预见性 |\n| 减损义务 | 被侵权人应采取合理措施减少损失 | 保存减损行为证据 |\n| 获利赔偿 | 可以侵权人获利作为赔偿依据 | 调查侵权人获利情况 |\n| 评估鉴定 | 财产价值争议可申请评估鉴定 | 及时申请司法评估 |\n\n### 五、实务要点\n\n1. **证据固定**：及时对财产损害进行拍照、录像、公证\n2. **价值评估**：对有争议的财产价值申请司法评估\n3. **因果关系**：证明财产损失与侵权行为之间的因果关系\n4. **减损义务**：及时采取合理措施防止损失扩大\n5. **诉讼时效**：财产损害赔偿诉讼时效为3年\n\n## 典型案例\n\n### 案例：产品缺陷导致产品自身损失属于产品责任赔偿范围\n\n**法律依据**：侵权责任编司法解释（一）（法释〔2024〕12号）第19条\n\n**规则要旨**：因产品存在缺陷造成他人损害，被侵权人请求赔偿产品自身损失的，人民法院应予支持。产品自损（产品本身的毁损灭失）属于产品责任的赔偿范围，被侵权人可在产品责任诉讼中一并主张。\n\n**与知识点的关联分析**：本条司法解释解决了长期以来产品自损是否属于产品责任赔偿范围的争议。根据《民法典》第1184条，财产损失按照损失发生时的市场价格或者其他合理方式计算。产品缺陷导致产品本身毁损的损失，与产品缺陷导致的其他财产损害一样，均属于财产损害赔偿的范围。这扩大了被侵权人的救济途径，使其无需另行提起违约之诉即可获得产品自损赔偿。\n\n## 参考来源\n\n- 《中华人民共和国民法典》第1182条、第1184条\n- 《最高人民法院关于审理民事案件适用诉讼时效制度若干问题的规定》\n\n## 相关主题\n\n- [[人身损害赔偿]]\n- [[精神损害赔偿]]\n- [[惩罚性赔偿]]"},{"id":"产品责任","title":"产品责任","excerpt":"--- tags: [民法, 侵权责任, 特殊侵权, 产品责任, 惩罚性赔偿] created: 2026-05-28 updated: 2026-05-28 status: reviewed type: knowledge --- 产品责任是指因产品存在缺陷造成他人损害时，生产者、销售者等应当承担的侵权责任。产品责任是典型的无过错责任（生产者），旨在保护消费者权益，促进产品质量提升。我国产品责任","slug":"产品责任","module":"03-侵权责任","moduleName":"03-侵权责任","tags":["民法","侵权责任","特殊侵权","产品责任","惩罚性赔偿"],"wordCount":2144,"created":"2026-05-28","updated":"2026-05-28","content":"# 产品责任\n\n## 一、概述\n\n产品责任是指因产品存在缺陷造成他人损害时，生产者、销售者等应当承担的侵权责任。产品责任是典型的无过错责任（生产者），旨在保护消费者权益，促进产品质量提升。我国产品责任制度以《民法典》侵权责任编第四章（第1202-1207条）为核心，与《产品质量法》《消费者权益保护法》形成体系化规范。\n\n## 二、核心内容\n\n### 1. 法律依据\n\n| 条文 | 内容 | 要点 |\n|------|------|------|\n| 第1202条 | 生产者责任 | 因产品存在缺陷造成他人损害的，生产者应当承担侵权责任 |\n| 第1203条 | 被侵权人选择权 | 可向生产者或销售者请求赔偿；生产者赔偿后有权向销售者追偿 |\n| 第1204条 | 第三人过错追偿 | 因运输者、仓储者等第三人过错致产品缺陷，生产者/销售者赔偿后有权追偿 |\n| 第1205条 | 排除妨碍/消除危险 | 产品缺陷危及人身、财产安全的，可请求排除妨碍、消除危险 |\n| 第1206条 | 召回制度 | 产品投入流通后发现存在缺陷的，应采取召回等补救措施 |\n| 第1207条 | 惩罚性赔偿 | 明知产品存在缺陷仍然生产、销售，造成严重后果的，被侵权人有权请求惩罚性赔偿 |\n\n### 2. 归责原则与构成要件\n\n| 项目 | 生产者 | 销售者 |\n|------|--------|--------|\n| 归责原则 | **无过错责任** | **过错责任**（对消费者）/ 无过错追偿（对生产者） |\n| 构成要件 | 产品缺陷 + 损害 + 因果关系 | 产品缺陷 + 损害 + 因果关系 + 过错（对内追偿不要求过错） |\n| 免责事由 | ①未投入流通 ②投入流通时缺陷尚不存在 ③投入流通时科技水平尚不能发现缺陷 | 能证明无过错（对消费者）；产品缺陷系生产者原因（对内追偿） |\n| 举证责任 | 被侵权人证明缺陷、损害、因果关系 | 被侵权人证明销售者过错（一般）；推定过错（特殊） |\n\n### 3. 产品缺陷的认定标准\n\n**缺陷类型**：\n- **设计缺陷**：产品设计方案本身存在不合理危险\n- **制造缺陷**：产品制造过程偏离设计要求\n- **警示缺陷**：未充分告知产品使用风险或方法\n- **售后警示缺陷**：投入流通后未对已知风险进行警示\n\n**认定标准**：\n- 不合理危险标准（核心标准）：产品存在危及人身、他人财产安全的不合理危险\n- 国家标准/行业标准：不符合强制性标准可直接认定为缺陷\n- 消费者合理期待标准：产品安全性低于一般消费者的合理期待\n\n### 4. 惩罚性赔偿（第1207条）\n\n**适用条件**：\n1. 主观要件：生产者/销售者**明知**产品存在缺陷\n2. 行为要件：仍然生产或销售\n3. 结果要件：造成**死亡或健康严重损害**的后果\n4. 因果关系：缺陷与损害之间存在因果关系\n\n**裁判要点**：\n- \"明知\"包括实际知道和应当知道（推定明知）\n- 惩罚性赔偿金额不受实际损失限制，由法院酌定\n- 需考虑侵权人主观恶性、获利情况、损害严重程度等因素\n\n### 5. 实务要点\n\n**律师办案提示**：\n- 产品责任诉讼中，建议同时起诉生产者和销售者，避免被相互推诿\n- 缺陷鉴定是关键证据，应及时申请司法鉴定，防止产品灭失\n- 注意保存购买凭证、使用说明、事故现场照片等证据\n- 消费者可选择侵权之诉或违约之诉，二者在举证责任、赔偿范围上存在差异\n\n**法官审判提示**：\n- 注意区分产品缺陷与产品瑕疵，瑕疵不影响安全使用，不构成侵权\n- 生产者的免责事由需严格审查，第（三）项\"科技水平限制\"需结合行业实际判断\n- 惩罚性赔偿应审慎适用，需充分论证\"明知\"要件\n\n## 三、典型案例\n\n### 案例一：惩罚性赔偿中\"合理生活消费需要\"范围的认定\n\n**入库编号**：2025-07-2-373-001\n**案号**：（2024）渝05民终5663号\n**审理法院**：重庆市第五中级人民法院\n**裁判日期**：2024年7月2日\n**来源**：人民法院案例库\n\n**案情概要**：曾某在陈某友经营的店铺购买了南川区丰某农副产品加工厂生产的食品，后以该食品不符合食品安全标准为由，诉请生产者和销售者承担十倍价款的惩罚性赔偿。曾某在短时间内就同类产品重复购买、多次检测，购买数量远超日常生活所需。\n\n**裁判要旨**：消费者主张食品安全惩罚性赔偿时，法院应审查其购买数量是否超出\"合理生活消费需要\"范围。对于超出合理消费需要部分，不支持惩罚性赔偿请求。合理消费需要的认定应综合考虑食品保质期、家庭人口数量、消费习惯等因素。\n\n**与知识点的关联分析**：本案涉及《食品安全法》第148条惩罚性赔偿的适用。\"合理生活消费需要\"是"},{"id":"医疗损害责任","title":"医疗损害责任","excerpt":"--- tags: [民法, 侵权责任, 特殊侵权, 医疗损害, 知情同意] created: 2026-05-28 updated: 2026-05-28 status: reviewed type: knowledge --- 医疗损害责任是指医疗机构及其医务人员在诊疗活动中因过错造成患者损害时应承担的侵权责任。《民法典》侵权责任编第六章（第1218-1228条）系统规定了医疗损害责任制度，确","slug":"医疗损害责任","module":"03-侵权责任","moduleName":"03-侵权责任","tags":["民法","侵权责任","特殊侵权","医疗损害","知情同意"],"wordCount":2058,"created":"2026-05-28","updated":"2026-05-28","content":"# 医疗损害责任\n\n## 一、概述\n\n医疗损害责任是指医疗机构及其医务人员在诊疗活动中因过错造成患者损害时应承担的侵权责任。《民法典》侵权责任编第六章（第1218-1228条）系统规定了医疗损害责任制度，确立了过错责任原则为基本归责原则，并规定了推定过错的特殊情形。医疗损害案件具有高度专业性，涉及医学与法律的交叉，举证难度大，鉴定意见往往是案件关键。\n\n## 二、核心内容\n\n### 1. 法律依据\n\n| 条文 | 内容 | 要点 |\n|------|------|------|\n| 第1218条 | 基本规则 | 患者在诊疗活动中受到损害，医疗机构或其医务人员有过错的，承担赔偿责任 |\n| 第1219条 | 知情同意 | 医务人员应向患者说明病情和医疗措施；实施手术等应取得明确同意 |\n| 第1220条 | 紧急救治 | 不能取得患者或近亲属意见时，经负责人批准可立即实施救治 |\n| 第1221条 | 诊疗义务 | 医务人员未尽到与当时医疗水平相应的诊疗义务，造成损害的担责 |\n| 第1222条 | 推定过错 | ①违反法律法规规章及诊疗规范 ②隐匿/拒绝提供/伪造/篡改/违法销毁病历 |\n| 第1223条 | 医疗产品责任 | 药品、消毒产品、医疗器械缺陷或输入不合格血液，患者可向生产者/血液提供机构请求赔偿 |\n| 第1224条 | 免责事由 | ①患者或近亲属不配合 ②紧急情况已尽合理义务 ③限于当时医疗水平难以诊疗 |\n| 第1225条 | 病历资料 | 医疗机构应提供并复制病历资料；不得隐匿、拒绝提供、伪造、篡改或销毁 |\n| 第1226条 | 隐私和个人信息 | 医疗机构及其医务人员应保护患者隐私和个人信息 |\n| 第1227条 | 过度检查 | 不得违反诊疗规范实施不必要的检查 |\n| 第1228条 | 维护秩序 | 医疗机构及其医务人员合法权益受法律保护 |\n\n### 2. 归责原则与构成要件\n\n| 项目 | 一般医疗损害 | 医疗产品损害 | 推定过错情形 |\n|------|-------------|-------------|-------------|\n| 归责原则 | **过错责任** | **无过错责任**（生产者）/ 过错推定（医疗机构） | **过错推定** |\n| 构成要件 | 诊疗行为 + 过错 + 损害 + 因果关系 | 产品缺陷 + 损害 + 因果关系 | 诊疗行为 + 损害 + 因果关系（过错推定） |\n| 举证责任 | 患者证明过错（一般需鉴定） | 患者证明缺陷和损害；生产者证明免责事由 | 医疗机构证明无过错 |\n| 免责事由 | 第1224条三种情形 | 产品质量法规定 | 医疗机构反证无过错 |\n\n### 3. 推定过错的三种情形（第1222条）\n\n| 情形 | 具体表现 | 实务认定 |\n|------|----------|----------|\n| 违反规范 | 违反法律、行政法规、规章以及其他有关诊疗规范的规定 | 以卫生行政法规和诊疗指南为依据 |\n| 病历问题 | 隐匿或拒绝提供与纠纷有关的病历资料 | 包括拒绝患者复印请求、诉讼中拒绝提供 |\n| 篡改销毁 | 伪造、篡改或者销毁病历资料 | 病历前后矛盾、电子病历修改痕迹异常等 |\n\n### 4. 知情同意规则（第1219条）\n\n**告知义务内容**：\n- 病情和诊断\n- 医疗措施及替代方案\n- 医疗风险及并发症\n- 预期效果和费用\n\n**需要明确同意的情形**：\n- 手术\n- 特殊检查\n- 特殊治疗\n\n**侵害知情同意权的法律后果**：\n- 未尽告知义务造成损害的，承担赔偿责任\n- 损害范围：患者因不知情而丧失的选择机会（机会利益损失）\n- 与医疗技术过错竞合时，可同时主张\n\n### 5. 病历资料的证据规则\n\n**病历类型**：\n- 住院病历：入院记录、病程记录、手术记录、出院记录等\n- 门诊病历：门诊记录、检查报告等\n- 护理记录：体温单、护理记录等\n\n**举证要点**：\n- 患方有权复制客观性病历资料\n- 主观性病历（如疑难病例讨论记录）在诉讼中可申请法院调取\n- 电子病历需关注修改痕迹和时间戳\n- 病历封存：医患双方均可申请封存，应在医患双方在场时进行\n\n### 6. 实务要点\n\n**律师办案提示**：\n- 医疗损害案件的核心是**医疗过错鉴定**，应在诉讼中及时申请司法鉴定\n- 注意鉴定机构的选择：优先选择有医学背景的鉴定机构\n- 病历审查是基础工作，应详细比对病历前后一致性，发现矛盾点\n- 医疗产品损害可选择侵权之诉（举证责任较轻）或违约之诉\n- 注意诉讼时效：知道或应当知道损害之日起3年，但最长不超过20年\n\n**法官审判提示**：\n- 医疗过错鉴定意见是认定医疗过错和因果关系的关键证据\n- "},{"id":"机动车交通事故","title":"机动车交通事故","excerpt":"--- tags: [民法, 侵权责任, 特殊侵权, 交通事故, 交强险] created: 2026-05-28 updated: 2026-05-28 status: reviewed type: knowledge --- 机动车交通事故责任是指机动车在道路上因过错或意外造成他人人身伤亡或财产损失时，相关责任主体依法应承担的侵权责任。该领域涉及侵权法与保险法的交叉，以《民法典》第1208-1","slug":"机动车交通事故","module":"03-侵权责任","moduleName":"03-侵权责任","tags":["民法","侵权责任","特殊侵权","交通事故","交强险"],"wordCount":2996,"created":"2026-05-28","updated":"2026-05-28","content":"# 机动车交通事故责任\n\n## 一、概述\n\n机动车交通事故责任是指机动车在道路上因过错或意外造成他人人身伤亡或财产损失时，相关责任主体依法应承担的侵权责任。该领域涉及侵权法与保险法的交叉，以《民法典》第1208-1217条为核心，与《道路交通安全法》《机动车交通事故责任强制保险条例》形成完整规范体系。实务中，责任主体认定、保险赔偿顺序、挂靠经营等为常见争议焦点。\n\n## 二、核心内容\n\n### 1. 法律依据\n\n| 条文 | 内容 | 要点 |\n|------|------|------|\n| 第1208条 | 法律适用 | 适用道路交通安全法律和本法有关规定 |\n| 第1209条 | 租赁/借用 | 机动车所有人与使用人不一致，使用人担责；所有人有过错的承担相应责任 |\n| 第1210条 | 转让未过户 | 转让并交付但未办理登记，受让人担责 |\n| 第1211条 | 挂靠经营 | 以挂靠形式经营，挂靠人和被挂靠人承担连带责任 |\n| 第1212条 | 擅自驾驶 | 未经允许驾驶他人机动车，使用人担责；所有人/管理人有过错的承担相应责任 |\n| 第1213条 | 赔偿顺序 | 交强险 → 商业三者险 → 侵权人 |\n| 第1214条 | 报废车转让 | 转让拼装或报废车，转让人与受让人承担连带责任 |\n| 第1215条 | 盗抢机动车 | 盗窃人、抢劫人或抢夺人担责；保险公司在交强险限额内垫付抢救费 |\n| 第1216条 | 逃逸 | 机动车不明或未参加强制保险，由道路交通事故社会基金垫付 |\n| 第1217条 | 好意同乘 | 非营运机动车无偿搭乘，应减轻赔偿责任，故意或重大过失除外 |\n\n### 2. 赔偿责任体系\n\n| 赔偿层级 | 赔偿主体 | 归责原则 | 限额/范围 |\n|----------|----------|----------|-----------|\n| 第一层：交强险 | 保险公司 | 无过错责任（分项限额内） | 死亡伤残18万 + 医疗1.8万 + 财产0.2万 |\n| 第二层：商业三者险 | 保险公司 | 按保险合同约定 | 按责任比例，免赔率适用 |\n| 第三层：侵权人 | 侵权行为人 | 过错责任/无过错责任 | 超出保险限额部分 |\n\n### 3. 责任主体认定规则\n\n**所有人与使用人分离情形**：\n\n| 情形 | 责任主体 | 所有人责任 |\n|------|----------|------------|\n| 租赁/借用 | 使用人 | 有过错的承担相应责任（如明知车辆缺陷、借用人无驾照/醉酒等） |\n| 转让未过户 | 受让人 | 原所有人不担责（已交付为要件） |\n| 挂靠经营 | 挂靠人 + 被挂靠人 | **连带责任** |\n| 擅自驾驶 | 驾驶人 | 有过错的承担相应责任（如钥匙管理不当） |\n| 盗抢 | 盗抢人 | 所有人不担责（交强险垫付后可追偿） |\n| 报废/拼装车转让 | 转让人 + 受让人 | **连带责任** |\n\n### 4. 好意同乘（第1217条）\n\n**适用条件**：\n- 非营运机动车（排除出租车、网约车等营运车辆）\n- 无偿搭乘（不收取任何费用）\n- 属于好意施惠行为\n\n**责任承担**：\n- 一般规则：**减轻**赔偿责任（非免除）\n- 例外：驾驶人有**故意或重大过失**的，不减轻责任\n- \"重大过失\"包括：醉驾、严重超速、闯红灯、无证驾驶等\n\n### 5. 实务要点\n\n**律师办案提示**：\n- 交通事故案件应将保险公司列为共同被告，确保交强险和商业三者险一并处理\n- 挂靠经营案件中，务必同时起诉挂靠人和被挂靠人，主张连带责任\n- 注意交强险\"无责赔付\"规则：即使被保险人无责，交强险仍在无责限额内赔付\n- 伤残鉴定时机：一般在治疗终结后3-6个月申请，过早可能影响鉴定结果\n- 注意保存医疗费票据、误工证明、护理费凭证等损失证据\n\n**法官审判提示**：\n- 赔偿顺序严格遵循\"交强险→商业三者险→侵权人\"的法定顺序，不可颠倒\n- 挂靠经营的连带责任为法定连带，不可通过挂靠协议约定排除\n- 好意同乘的\"减轻\"幅度应综合考虑事故责任比例、搭乘人过错等因素\n\n## 三、典型案例\n\n### 案例一：\"开门杀\"事故中保险公司的赔偿责任\n\n**案情概要**：辛某某驾驶小型轿车在路边停车后，乘客陈某打开车门时未注意观察，与骑行电动自行车经过的周某某发生碰撞，造成周某某受伤、车辆受损。周某某诉请陈某、辛某某及保险公司承担赔偿责任。\n\n**裁判要旨**：机动车停车后乘客开门致第三人损害，属于机动车交通事故责任范围。保险公司在交强险和商业三者险范围内承担全部赔偿责任。\n\n**与知识点的关联分析**：本案体现了《民法典》第1213条赔偿顺序规则——交强险优先赔偿"},{"id":"环境污染侵权","title":"环境污染侵权","excerpt":"--- tags: [民法, 侵权责任, 特殊侵权, 环境污染, 无过错责任, 举证责任倒置] created: 2026-05-28 updated: 2026-05-28 status: reviewed type: knowledge --- 环境污染和生态破坏侵权责任是指因污染环境、破坏生态造成他人损害或生态环境损害时，侵权人应承担的侵权责任。《民法典》侵权责任编第七章（第1229-123","slug":"环境污染侵权","module":"03-侵权责任","moduleName":"03-侵权责任","tags":["民法","侵权责任","特殊侵权","环境污染","无过错责任","举证责任倒置"],"wordCount":2204,"created":"2026-05-28","updated":"2026-05-28","content":"# 环境污染和生态破坏侵权责任\n\n## 一、概述\n\n环境污染和生态破坏侵权责任是指因污染环境、破坏生态造成他人损害或生态环境损害时，侵权人应承担的侵权责任。《民法典》侵权责任编第七章（第1229-1235条）在原《侵权责任法》第八章基础上大幅扩展，新增了生态破坏责任、生态环境修复责任、惩罚性赔偿等制度。环境污染侵权适用无过错责任原则和举证责任倒置，体现了环境保护的优先价值。\n\n## 二、核心内容\n\n### 1. 法律依据\n\n| 条文 | 内容 | 要点 |\n|------|------|------|\n| 第1229条 | 基本规则 | 污染环境、破坏生态造成他人损害，侵权人担责 |\n| 第1230条 | 举证责任倒置 | 侵权人应就法律规定的不承担责任或减轻责任的情形及行为与损害之间不存在因果关系承担举证责任 |\n| 第1231条 | 多人侵权 | 两个以上侵权人，根据污染物种类、浓度、排放量等因素确定责任大小 |\n| 第1232条 | 惩罚性赔偿 | 侵权人违反法律规定故意污染环境、破坏生态造成严重后果的，被侵权人有权请求惩罚性赔偿 |\n| 第1233条 | 第三人过错 | 因第三人过错污染环境造成损害，被侵权人可向侵权人或第三人请求赔偿 |\n| 第1234条 | 生态环境修复 | 违反规定造成生态环境损害，国家规定的机关或法律规定的组织有权请求修复 |\n| 第1235条 | 赔偿损失范围 | 修复费用、服务功能损失、调查评估费、防止损害扩大费用等 |\n\n### 2. 归责原则与构成要件\n\n| 项目 | 环境污染侵权 | 生态破坏侵权 |\n|------|-------------|-------------|\n| 归责原则 | **无过错责任** | **无过错责任** |\n| 构成要件 | 污染行为 + 损害 + 因果关系 | 破坏行为 + 生态损害 + 因果关系 |\n| 举证责任 | **举证责任倒置**：侵权人证明不存在因果关系 | **举证责任倒置**：侵权人证明不存在因果关系 |\n| 免责事由 | ①不可抗力 ②受害人故意 ③第三人过错（可追偿） | ①不可抗力 ②受害人故意 ③第三人过错（可追偿） |\n\n### 3. 举证责任倒置（第1230条）\n\n**举证责任分配**：\n\n| 证明事项 | 举证主体 | 证明内容 |\n|----------|----------|----------|\n| 污染行为 | 被侵权人 | 侵权人实施了排污或破坏行为 |\n| 损害事实 | 被侵权人 | 人身、财产或生态环境受到实际损害 |\n| 因果关系 | **侵权人** | 行为与损害之间**不存在**因果关系 |\n| 免责事由 | **侵权人** | 存在法定免责或减轻责任的情形 |\n\n**实务要点**：\n- 被侵权人只需证明排污事实和损害结果，因果关系由侵权人反证\n- 侵权人不能仅以\"排放达标\"为由免除责任，达标排放不能排除因果关系\n- 科学上的不确定性不能成为免责理由，侵权人需证明\"确定不存在\"因果关系\n\n### 4. 惩罚性赔偿（第1232条）\n\n**适用条件**：\n1. **主观要件**：侵权人**故意**（非过失）\n2. **违法性要件**：违反法律规定\n3. **行为要件**：污染环境或破坏生态\n4. **结果要件**：造成**严重后果**\n\n**与第1207条产品责任惩罚性赔偿的对比**：\n- 产品责任：明知 + 严重后果\n- 环境侵权：故意 + 违法 + 严重后果\n- 环境侵权的主观要件更高（故意 > 明知），且增加了违法性要件\n\n### 5. 生态环境修复责任（第1234条）\n\n**请求权主体**：\n- 国家规定的机关（如生态环境部门）\n- 法律规定的组织（如符合资质的环保公益组织）\n\n**修复方式**：\n- 原地修复：在损害发生地进行生态修复\n- 替地修复：原地修复不可行时，在其他区域进行等量修复\n- 货币赔偿：无法修复时，赔偿生态环境功能损失\n\n**赔偿范围（第1235条）**：\n- 生态环境修复费用\n- 生态环境服务功能损失\n- 生态环境功能永久性损害造成的损失\n- 调查、鉴定评估费用\n- 防止损害发生和扩大所支出的合理费用\n\n### 6. 第三人过错（第1233条）\n\n**制度特点**：\n- 被侵权人有**选择权**：可向污染者或第三人请求赔偿\n- 污染者赔偿后有权向第三人追偿\n- 不同于一般第三人过错规则：污染者不能以第三人过错为由免责\n\n### 7. 实务要点\n\n**律师办案提示**：\n- 环境污染案件中，鉴定评估是核心证据，应委托有资质的环境损害鉴定机构\n- 注意因果关系的举证策略：被侵权人应证明污染行为与损害的关联性，而非严格的科学因果关系\n- 惩罚性赔偿的适用需重点收集侵权人\"故意\"和\"违"},{"id":"用人者责任","title":"用人者责任","excerpt":"--- tags: [民法, 侵权责任, 特殊侵权, 用人单位责任, 劳务派遣, 个人劳务] created: 2026-05-28 updated: 2026-05-28 status: reviewed type: knowledge --- 用人者责任是指用人单位的工作人员因执行工作任务或个人之间因劳务关系造成他人损害时，用人单位或接受劳务一方应承担的侵权责任。《民法典》第1191-1192","slug":"用人者责任","module":"03-侵权责任","moduleName":"03-侵权责任","tags":["民法","侵权责任","特殊侵权","用人单位责任","劳务派遣","个人劳务"],"wordCount":2693,"created":"2026-05-28","updated":"2026-05-28","content":"# 用人者责任\n\n## 一、概述\n\n用人者责任是指用人单位的工作人员因执行工作任务或个人之间因劳务关系造成他人损害时，用人单位或接受劳务一方应承担的侵权责任。《民法典》第1191-1192条对用人单位责任、劳务派遣责任、个人劳务关系责任作出系统规定。用人者责任的理论基础是\"报偿理论\"和\"风险控制理论\"：用人者从劳务活动中获得利益，应承担相应的风险；用人者对工作人员有选任、监督、管理的能力，应承担替代责任。\n\n## 二、核心内容\n\n### 1. 法律依据\n\n| 条文 | 内容 | 要点 |\n|------|------|------|\n| 第1191条第1款 | 用人单位责任 | 用人单位工作人员因执行工作任务造成他人损害，用人单位担责 |\n| 第1191条第2款 | 劳务派遣责任 | 被派遣人员因执行工作任务造成他人损害，接受派遣的用工单位担责；派遣单位有过错的承担相应责任 |\n| 第1192条第1款 | 个人劳务关系 | 个人之间形成劳务关系，提供劳务一方因劳务造成他人损害，接受劳务一方担责 |\n| 第1192条第2款 | 提供劳务方受害 | 提供劳务一方因劳务受到损害，根据双方过错承担相应责任 |\n| 第1192条第3款 | 第三人行为 | 提供劳务一方因第三人行为受到损害，有权请求第三人或接受劳务一方补偿 |\n\n### 2. 责任体系\n\n| 责任类型 | 责任主体 | 归责原则 | 追偿权 | 适用关系 |\n|----------|----------|----------|--------|----------|\n| 用人单位责任 | 用人单位 | **无过错责任**（替代责任） | 有故意或重大过失的工作人员可追偿 | 劳动关系、人事关系 |\n| 劳务派遣责任 | 用工单位（主要）+ 派遣单位（过错） | **无过错责任** + 过错责任 | 派遣单位有过错的承担相应责任 | 劳务派遣关系 |\n| 个人劳务侵权 | 接受劳务方 | **无过错责任**（替代责任） | 有故意或重大过失的提供劳务方可追偿 | 个人劳务关系 |\n| 承揽关系 | 承揽人 | **过错责任**（定作人仅在定作/指示/选任有过错时担责） | 无替代责任 | 承揽关系 |\n\n### 3. \"执行工作任务\"的认定标准\n\n**理论标准**：\n- **主观说**：以用人者的意思为标准（授权范围说）\n- **客观说**：以行为的外观为标准（行为外观理论）\n- **我国司法实践**：采**客观说**为主，综合判断\n\n**认定因素**：\n- 行为是否在工作时间和工作场所内实施\n- 行为是否以用人者名义实施\n- 行为的内容是否与职务有内在关联\n- 行为是否为用人者带来利益\n- 行为的外观是否足以使第三人相信是执行职务\n\n**典型情形**：\n| 属于执行工作任务 | 不属于执行工作任务 |\n|------------------|---------------------|\n| 司机送货途中发生事故 | 员工下班后因私人恩怨打人 |\n| 销售人员在拜访客户途中伤人 | 员工利用职务便利实施个人犯罪 |\n| 快递员送件过程中撞伤行人 | 员工擅自借用公司车辆办私事 |\n| 保安执勤时打伤他人 | 员工在工作场所因个人纠纷伤人 |\n\n### 4. 劳务派遣责任（第1191条第2款）\n\n**三方关系**：\n- 派遣单位（用人单位）：与劳动者签订劳动合同\n- 用工单位（实际用工方）：实际使用劳动者\n- 被派遣劳动者：在用工单位工作\n\n**责任分配**：\n- **用工单位**承担主要责任（无过错替代责任）\n- **派遣单位**承担过错责任（有过错时承担相应责任）\n- 派遣单位的过错情形：\n  - 未尽选任义务（派遣不符合岗位要求的人员）\n  - 未尽培训义务\n  - 未尽管理义务\n  - 明知被派遣人员有不良记录仍派遣\n\n### 5. 个人劳务关系（第1192条）\n\n**与用人单位责任的区别**：\n\n| 区别项 | 用人单位责任 | 个人劳务关系 |\n|--------|-------------|-------------|\n| 主体 | 用人单位（法人/非法人组织） | 自然人 |\n| 关系基础 | 劳动关系/人事关系 | 劳务关系（雇佣关系） |\n| 替代责任 | 用人单位承担全部责任 | 接受劳务方承担全部责任 |\n| 提供劳务方受害 | 工伤保险（不考虑过错） | 根据双方过错分担 |\n| 第三人致害 | 工伤保险 + 第三人侵权赔偿 | 请求第三人赔偿或接受劳务方补偿 |\n\n**提供劳务方因劳务受害（第1192条第2款）**：\n- 适用过错责任原则，根据双方各自的过错承担相应责任\n- 接受劳务方的过错：未提供安全条件、未尽提示义务等\n- 提供劳务方的过错：未"},{"id":"网络侵权","title":"网络侵权","excerpt":"--- tags: [民法, 侵权责任, 特殊侵权, 网络侵权, 避风港原则, 红旗原则] created: 2026-05-28 updated: 2026-05-28 status: reviewed type: knowledge --- 网络侵权责任是指网络用户或网络服务提供者利用网络侵害他人民事权益时应承担的侵权责任。《民法典》侵权责任编第一千一百九十四条至第一千一百九十七条对网络侵权责","slug":"网络侵权","module":"03-侵权责任","moduleName":"03-侵权责任","tags":["民法","侵权责任","特殊侵权","网络侵权","避风港原则","红旗原则"],"wordCount":2430,"created":"2026-05-28","updated":"2026-05-28","content":"# 网络侵权责任\n\n## 一、概述\n\n网络侵权责任是指网络用户或网络服务提供者利用网络侵害他人民事权益时应承担的侵权责任。《民法典》侵权责任编第一千一百九十四条至第一千一百九十七条对网络侵权责任作出系统规定，确立了网络用户直接责任、网络服务提供者连带责任、通知删除规则（\"避风港\"原则）和知道规则（\"红旗\"原则）等核心制度。随着互联网深入社会生活，网络侵权案件数量持续增长，类型不断多样化。\n\n## 二、核心内容\n\n### 1. 法律依据\n\n| 条文 | 内容 | 要点 |\n|------|------|------|\n| 第1194条 | 基本规则 | 网络用户、网络服务提供者利用网络侵害他人民事权益的，承担侵权责任 |\n| 第1195条 | 通知删除规则 | 被侵权人有权通知网络服务提供者采取删除、屏蔽、断开链接等措施 |\n| 第1196条 | 反通知规则 | 网络用户可提交不存在侵权的声明，网络服务提供者转送被侵权人并告知可投诉或起诉 |\n| 第1197条 | 知道规则 | 网络服务提供者知道或应当知道网络用户利用其服务侵害他人民事权益，未采取必要措施的，承担连带责任 |\n\n### 2. 责任体系\n\n| 责任主体 | 归责原则 | 责任类型 | 适用条件 |\n|----------|----------|----------|----------|\n| 网络用户（直接侵权人） | 过错责任 | 直接责任 | 利用网络实施侵权行为 |\n| 网络服务提供者（接到通知未及时采取措施） | 过错责任 | 连带责任 | 接到合格通知后未及时采取必要措施 |\n| 网络服务提供者（知道或应当知道） | 过错推定 | 连带责任 | 知道或应当知道网络用户侵权而未采取措施 |\n\n### 3. 通知删除规则（\"避风港\"原则，第1195条）\n\n**合格通知的构成要件**：\n- 通知人的身份信息和联系方式\n- 要求采取必要措施的网络地址或足以准确定位的信息\n- 构成侵权的初步证据及相关材料\n\n**网络服务提供者的义务**：\n- 收到合格通知后**应及时**采取必要措施（删除、屏蔽、断开链接等）\n- 将通知转送相关网络用户\n- 未及时采取措施的，对损害的扩大部分承担连带责任\n\n**\"及时\"的认定标准**：\n- 法律未规定明确时限，以\"合理期限\"为标准\n- 司法实践中一般参考：24-72小时内采取措施\n- 需综合考虑侵权类型、技术难度、通知内容的明确程度等因素\n\n### 4. 反通知规则（第1196条）\n\n**制度流程**：\n1. 被侵权人发送合格通知\n2. 网络服务提供者采取必要措施并转送通知\n3. 网络用户提交不侵权声明（反通知）\n4. 网络服务提供者转送声明并告知被侵权人可投诉或起诉\n5. 合理期限内未收到投诉或起诉的，应终止所采取的措施\n\n**反通知的效力**：\n- 反通知成立后，网络服务提供者应恢复被删除的内容\n- 被侵权人需在合理期限内提起诉讼或投诉\n- 未及时起诉的，视为放弃，措施终止\n\n### 5. 知道规则（\"红旗\"原则，第1197条）\n\n**\"知道或应当知道\"的认定因素**：\n- 网络服务提供者是否对侵权内容进行了编辑、推荐或置顶\n- 侵权内容是否明显到如同\"红旗飘扬\"，网络服务提供者不可能不知道\n- 网络服务提供者是否收到了相关投诉或举报\n- 网络服务提供者是否从侵权内容中直接获取经济利益\n- 网络服务提供者是否有能力和技术手段发现侵权内容\n\n**典型适用场景**：\n- 网站首页推荐明显侵权内容\n- 平台明知店铺售假仍不处理\n- 视频网站对热播影视剧未尽合理审查义务\n- 网络服务提供者从侵权内容中直接获利\n\n### 6. 网络服务提供者的类型与责任差异\n\n| 服务类型 | 定义 | 审查义务 | 典型平台 |\n|----------|------|----------|----------|\n| 接入服务提供者 | 提供网络接入、传输服务 | 极低，一般不承担内容审查义务 | 电信运营商 |\n| 缓存服务提供者 | 提供信息缓存服务 | 低，满足条件可免责 | CDN服务商 |\n| 存储服务提供者 | 提供信息存储服务 | 中等，适用通知删除规则 | 云盘、网盘 |\n| 信息平台提供者 | 提供信息发布平台 | 较高，需合理审查 | 微博、论坛、电商平台 |\n| 搜索/链接服务 | 提供搜索或链接服务 | 中等，适用通知删除规则 | 搜索引擎 |\n\n### 7. 实务要点\n\n**律师办案提示**：\n- 被侵权人发送通知时应确保内容完整、准确，避免因通知不合格而丧失\"及时\"保护\n- 通知应采用书面形式，保留发送记录和回执，作为诉讼证据\n- 网络侵权案件中，电子证据保全至关重要，建议通过公证或区块链存证\n- 注意区分网络用户直接侵权和"},{"id":"饲养动物损害","title":"饲养动物损害","excerpt":"--- tags: [民法, 侵权责任, 特殊侵权, 饲养动物, 无过错责任] created: 2026-05-28 updated: 2026-05-28 status: reviewed type: knowledge --- 饲养动物损害责任是指饲养的动物造成他人人身或财产损害时，动物饲养人或管理人依法应承担的侵权责任。《民法典》侵权责任编第十章（第1245-1251条）对饲养动物损害责任","slug":"饲养动物损害","module":"03-侵权责任","moduleName":"03-侵权责任","tags":["民法","侵权责任","特殊侵权","饲养动物","无过错责任"],"wordCount":1964,"created":"2026-05-28","updated":"2026-05-28","content":"# 饲养动物损害责任\n\n## 一、概述\n\n饲养动物损害责任是指饲养的动物造成他人人身或财产损害时，动物饲养人或管理人依法应承担的侵权责任。《民法典》侵权责任编第十章（第1245-1251条）对饲养动物损害责任作出系统规定，区分了一般饲养动物、禁止饲养的烈性犬、动物园动物等不同情形，分别适用无过错责任、绝对无过错责任、过错推定等不同归责原则。近年来，因宠物伤人引发的纠纷日益增多，特别是烈性犬伤人案件社会关注度较高。\n\n## 二、核心内容\n\n### 1. 法律依据\n\n| 条文 | 内容 | 要点 |\n|------|------|------|\n| 第1245条 | 一般规则 | 饲养动物造成他人损害，动物饲养人或管理人担责；被侵权人故意或重大过失可减免责任 |\n| 第1246条 | 违反管理规定 | 未对动物采取安全措施造成损害，担责；被侵权人故意的可减轻责任 |\n| 第1247条 | 禁止饲养烈性犬 | 禁止饲养的烈性犬等造成损害，饲养人或管理人担责，**不得减免** |\n| 第1248条 | 动物园动物 | 动物园动物造成损害，动物园担责；尽到管理职责的不担责 |\n| 第1249条 | 遗弃/逃逸动物 | 遗弃、逃逸的动物造成损害，原饲养人或管理人担责 |\n| 第1250条 | 第三人过错 | 因第三人过错造成损害，被侵权人可向饲养人或第三人请求赔偿 |\n| 第1251条 | 饲养义务 | 饲养动物应遵守法律法规，尊重社会公德，不得妨碍他人生活 |\n\n### 2. 归责原则体系\n\n| 动物类型 | 归责原则 | 受害人过错影响 | 典型场景 |\n|----------|----------|----------------|----------|\n| 一般饲养动物 | **无过错责任** | 故意→免除/减轻；重大过失→减轻 | 普通宠物狗咬伤他人 |\n| 违反管理规定 | **无过错责任（加重）** | 故意→减轻（非免除） | 未拴绳的狗伤人 |\n| 禁养烈性犬 | **绝对无过错责任** | **不得减免** | 藏獒、比特犬等伤人 |\n| 动物园动物 | **过错推定** | 动物园证明尽责可免责 | 游客被动物园动物伤害 |\n| 遗弃/逃逸动物 | **无过错责任** | 同一般规则 | 流浪狗咬人（原主人担责） |\n\n### 3. 饲养人/管理人的认定\n\n**饲养人**：动物的所有人，对动物享有所有权\n**管理人**：实际占有、控制动物的人（如代为照管人、租借人）\n\n**实务认定要点**：\n- 以实际控制和管理为判断标准，而非单纯的所有权登记\n- 长期喂养流浪动物的人可能被认定为管理人\n- 临时照管人可成为责任主体，但追偿时可向饲养人主张\n\n### 4. 禁止饲养烈性犬（第1247条）\n\n**立法目的**：对禁止饲养的危险动物实行最严格责任，保护公众安全\n\n**适用要点**：\n- \"禁止饲养\"以地方法规和规章为依据，各地名录可能不同\n- 烈性犬造成损害的，**无论受害人有无过错，饲养人均应担责**\n- 这是唯一不得以受害人过错减免责任的动物类型\n- 即使受害人故意挑逗烈性犬被咬伤，饲养人仍应承担全部责任\n\n### 5. 动物园责任（第1248条）\n\n**归责原则**：过错推定（举证责任倒置）\n\n**免责条件**：\n- 动物园需证明**已尽到管理职责**\n- 管理职责的认定标准：\n  - 围栏、隔离设施是否符合安全标准\n  - 警示标识是否齐全醒目\n  - 巡逻管理是否到位\n  - 应急处置是否及时\n- 仅证明一般性管理不足以免责，需证明安全管理**无任何瑕疵**\n\n### 6. 实务要点\n\n**律师办案提示**：\n- 饲养动物损害案件中，应重点收集动物致害的现场证据（监控视频、证人证言等）\n- 烈性犬案件：查明当地禁止饲养名录，确认涉案犬种是否在名录内\n- 注意区分\"被侵权人故意\"和\"被侵权人重大过失\"的法律效果差异\n- 动物园案件中，可申请法院调取园方安全管理记录和监控视频\n- 流浪动物伤人案件，可调查长期喂养人，追加为被告\n\n**法官审判提示**：\n- 烈性犬案件适用第1247条绝对无过错责任，不适用过失相抵\n- 动物园免责需严格审查管理职责的完整性，不能仅凭一般性安全管理即认定免责\n- 第三人过错案件中，被侵权人有选择权，可向饲养人或第三人请求赔偿\n\n## 三、典型案例\n\n### 案例：禁止饲养烈性犬致害的绝对无过错责任\n\n**法律依据**：《民法典》第1247条；侵权责任编司法解释（一）（法释〔2024〕12号）第23条\n\n**规则要旨**：禁止饲养的烈性犬等危险动物造成他人损害的，动物饲养人或者管理人应当承担侵权责任，不得以被侵权人故意或者重大过失为由主张减免责任。这是饲养动物损害责任中唯一适用\"绝对无"},{"id":"高空抛物坠物","title":"高空抛物坠物","excerpt":"--- tags: [民法, 侵权责任, 特殊侵权, 高空抛物, 建筑物管理] created: 2026-05-28 updated: 2026-05-28 status: reviewed type: knowledge --- 高空抛物、坠物责任是指从建筑物中抛掷物品或建筑物及其搁置物、悬挂物发生脱落、坠落造成他人损害时，相关责任主体应承担的侵权责任。《民法典》第1254条在原《侵权责任法》","slug":"高空抛物坠物","module":"03-侵权责任","moduleName":"03-侵权责任","tags":["民法","侵权责任","特殊侵权","高空抛物","建筑物管理"],"wordCount":2000,"created":"2026-05-28","updated":"2026-05-28","content":"# 高空抛物、坠物责任\n\n## 一、概述\n\n高空抛物、坠物责任是指从建筑物中抛掷物品或建筑物及其搁置物、悬挂物发生脱落、坠落造成他人损害时，相关责任主体应承担的侵权责任。《民法典》第1254条在原《侵权责任法》第87条基础上进行了重大完善，增设了公安机关调查义务、物业服务企业安保义务等规定，并明确了可能加害的建筑物使用人的补偿责任。高空抛物坠物案件因侵权人难以确定、因果关系复杂，是侵权法领域的难点问题。\n\n## 二、核心内容\n\n### 1. 法律依据\n\n| 条文 | 内容 | 要点 |\n|------|------|------|\n| 第1254条第1款 | 侵权人责任 | 从建筑物中抛掷物品或坠落物品造成他人损害，侵权人依法承担侵权责任 |\n| 第1254条第2款 | 公安机关调查 | 经调查难以确定具体侵权人的，由可能加害的建筑物使用人给予补偿 |\n| 第1254条第3款 | 追偿权 | 可能加害的建筑物使用人补偿后，有权向侵权人追偿 |\n| 第1254条第4款 | 物业安保义务 | 物业服务企业等应采取必要安全保障措施防止高空抛物坠物 |\n| 第1254条第5款 | 物业责任 | 物业未采取必要安全保障措施的，承担未履行安全保障义务的侵权责任 |\n\n### 2. 责任承担规则\n\n| 情形 | 责任主体 | 责任性质 | 归责原则 |\n|------|----------|----------|----------|\n| 确定具体侵权人 | 侵权人 | 直接侵权责任 | 过错责任 |\n| 难以确定侵权人 | 可能加害的建筑物使用人 | **补偿责任**（非赔偿） | 公平责任 |\n| 物业未尽安保义务 | 物业服务企业 | 补充责任/按份责任 | 过错责任 |\n| 建筑物质量问题 | 建设单位/施工单位 | 建筑物缺陷责任 | 无过错责任（5年内）/过错责任（5年后） |\n\n### 3. \"可能加害的建筑物使用人\"认定\n\n**排除规则**：\n- 能够证明自己不是侵权人的建筑物使用人可排除在外\n- 排除事由包括：\n  - 事发时不在建筑物内（出差、旅行等有充分证据）\n  - 建筑物位置不可能抛掷到受害人位置（物理上不可能）\n  - 窗户封闭无法开启\n  - 事发楼层以下的使用人（坠物方向向下）\n\n**补偿规则**：\n- 补偿而非赔偿：不适用全部赔偿原则，金额由法院酌定\n- 按份补偿：各可能加害的建筑物使用人按份补偿，非连带\n- 补偿后追偿：发现真正侵权人后可追偿\n\n### 4. 公安机关调查义务（第1254条第2款）\n\n**制度意义**：\n- 原《侵权责任法》未规定公安调查义务，导致实践中\"直接跳到补偿\"\n- 新规要求公安机关**先调查**，调查后仍无法确定的才适用补偿规则\n\n**调查内容**：\n- 现场勘查和证据收集\n- 调取监控视频\n- 询问证人和可能的侵权人\n- 技术鉴定（如物品来源分析）\n\n**实务影响**：\n- 公安机关的调查结论是法院认定\"难以确定具体侵权人\"的重要依据\n- 未经公安调查直接诉至法院的，法院可建议先向公安机关报案\n\n### 5. 物业服务企业安保义务\n\n**义务内容**：\n- 安装必要的监控设备\n- 设置警示标识\n- 定期巡查建筑物外墙和公共区域\n- 发现安全隐患及时排除\n- 对违规行为及时劝阻和报告\n\n**责任承担**：\n- 未尽安保义务的，承担侵权责任\n- 责任性质：补充责任或按份责任（个案中由法院裁量）\n- 与可能加害的建筑物使用人的补偿责任可并存\n\n### 6. 实务要点\n\n**律师办案提示**：\n- 受害人应第一时间报警并保存现场证据，公安调查是后续诉讼的重要基础\n- 起诉时可将可能加害的建筑物使用人和物业服务企业列为共同被告\n- 注意区分高空\"抛物\"（人为抛掷）和高空\"坠物\"（自然脱落），后者适用第1253条建筑物脱落坠落规则\n- 受害人应证明损害事实和因果关系，但无需证明具体侵权人\n\n**法官审判提示**：\n- 应先审查公安机关调查情况，确认是否\"难以确定具体侵权人\"\n- 补偿金额应综合考虑受害人的损害程度、可能加害人的经济能力等因素\n- 排除可能加害人时，应采用\"合理排除\"标准，不要求达到排除一切怀疑的程度\n\n## 三、典型案例\n\n### 案例：建筑物脱落坠落致害的过错推定责任\n\n**法律依据**：《民法典》第1253条；侵权责任编司法解释（一）（法释〔2024〕12号）第24条\n\n**规则要旨**：建筑物、构筑物或者其他设施及其搁置物、悬挂物发生脱落、坠落造成他人损害，所有人、管理人或者使用人不能证明自己没有过错的，应当承担侵权责任。所有人、管理人或者使用人赔偿后，有其他责任人的，有权向其他责任人追偿。\n\n**与知识点的关联分析**：本案涉及高空坠物与建筑物脱落坠落的责任区分。《"},{"id":"公司人格否认","title":"公司人格否认","excerpt":"--- tags: [民法, 公司法, 人格否认, 人格混同, 过度控制, 一人公司] created: 2026-05-28 updated: 2026-05-28 verified: true status: reviewed type: knowledge --- 公司人格否认（又称\"揭开公司面纱\"）是公司法人独立人格制度的例外和补充。当股东滥用公司法人独立地位和股东有限责任，严重损害公司债","slug":"公司人格否认","module":"04-公司与商事","moduleName":"04-公司与商事","tags":["民法","公司法","人格否认","人格混同","过度控制","一人公司"],"wordCount":2627,"created":"2026-05-28","updated":"2026-05-28","content":"# 公司人格否认\n\n## 一、概述\n\n公司人格否认（又称\"揭开公司面纱\"）是公司法人独立人格制度的例外和补充。当股东滥用公司法人独立地位和股东有限责任，严重损害公司债权人利益时，法律否认公司的独立人格，直接追究股东的连带责任。2023年《公司法》第23条在原有基础上增设了横向穿透条款，将人格否认的适用范围从股东—公司关系扩展至关联公司之间。实务中，公司人格否认之诉是债权人追索债务的重要救济途径，但因举证难度大、裁判标准不统一，长期存在\"同案不同判\"现象。\n\n## 二、核心内容\n\n### 2.1 法律依据\n\n| 法律条文 | 内容要点 |\n|---------|---------|\n| 《公司法》(2023修订) 第23条第一款 | 公司股东滥用公司法人独立地位和股东有限责任，逃避债务，严重损害公司债权人利益的，应当对公司债务承担连带责任 |\n| 《公司法》第23条第二款 | 股东利用其控制的两个以上公司实施前款规定行为的，各公司应当对任一公司的债务承担连带责任（横向穿透） |\n| 《公司法》第23条第三款 | 只有一个股东的有限责任公司的股东不能证明公司财产独立于股东自己的财产的，应当对公司债务承担连带责任（一人公司举证责任倒置） |\n| 《九民纪要》第10条 | 认定公司人格与股东人格是否存在混同，最根本的判断标准是公司是否具有独立意思和独立财产，最主要的表现是公司的财产与股东的财产是否混同且无法区分 |\n| 《九民纪要》第11条 | 控制股东或实际控制人对公司过度控制，使公司完全丧失独立性，沦为控制股东的工具或躯壳的，可以适用公司人格否认 |\n| 《九民纪要》第12条 | 资本显著不足指的是公司设立后在经营过程中，股东实际投入公司的资本数额与公司经营所隐含的风险相比明显不匹配 |\n\n### 2.2 人格否认的适用情形\n\n| 适用情形 | 构成要件 | 典型表现 | 法律后果 |\n|---------|---------|---------|---------|\n| 人格混同 | ①公司与股东人格混同；②严重损害债权人利益 | 财产混同、业务混同、人员混同、住所混同 | 股东对公司债务承担连带责任 |\n| 过度控制 | ①股东对公司实施过度控制；②公司丧失独立意思；③严重损害债权人利益 | 母子公司之间的利益输送、关联交易中的不公允定价 | 股东对公司债务承担连带责任 |\n| 资本显著不足 | ①股东投入资本与经营风险严重不匹配；②股东利用公司规避风险 | 以极小资本从事高风险业务，风险转嫁给债权人 | 股东对公司债务承担连带责任 |\n| 一人公司举证责任倒置 | ①公司只有一个股东；②股东不能证明财产独立 | 一人股东无法证明公司财产与个人财产分离 | 股东对公司债务承担连带责任 |\n| 横向穿透 | ①股东控制多个公司；②利用控制关系实施人格混同行为 | 关联公司之间财务、业务、人员混同 | 各公司对任一公司债务承担连带责任 |\n\n### 2.3 裁判规则\n\n| 争议焦点 | 裁判规则 |\n|---------|---------|\n| 人格混同的认定标准 | 最根本的判断标准是公司是否具有独立意思和独立财产；财产混同是人格混同的实质要素，其他因素（业务混同、人员混同等）可作为辅助判断标准 |\n| 资本显著不足的适用 | 应结合公司设立时和经营中的资本状况综合判断；单纯的认缴资本低不等于资本显著不足，需证明股东实际投入与经营风险严重不匹配 |\n| 一人公司的举证责任 | 一人股东应提供审计报告等证据证明公司财产独立于股东个人财产；年度审计报告是重要的证明手段，但非唯一证据 |\n| 横向穿透的适用条件 | 需证明股东控制多个公司并利用控制关系实施人格混同行为；单纯的关联公司关系不足以适用横向穿透 |\n| 债权人的举证责任 | 除一人公司外，债权人应举证证明股东存在滥用公司人格的行为；债权人需提供初步证据，法院可根据举证能力合理分配举证责任 |\n\n### 2.4 实务要点\n\n1. **人格否认之诉的管辖**：债权人可在主债务纠纷中一并提起人格否认之诉，也可单独起诉；单独起诉的，应以公司和股东为共同被告。\n2. **财产混同的举证策略**：债权人可通过申请法院调取公司银行流水、财务账簿等方式取证；关注股东个人账户与公司账户之间的频繁资金往来。\n3. **一人公司的特殊风险**：一人公司股东应定期进行审计，保持公司财产与个人财产的严格分离；未进行年度审计的，股东可能面临举证不能的风险。\n4. **横向穿透的诉讼策略**：债权人可申请法院调取关联公司之间的财务往来记录；关注关联公司之间的统一管理、统一调度、统一核算等特征。\n5. **人格否认的限制**：人格否认应严格限制适用，不能轻易否定公司的独立人格；法院应综合考虑股东行为的主"},{"id":"公司决议效力","title":"公司决议效力","excerpt":"--- tags: [民法, 公司法, 公司决议, 决议效力, 程序瑕疵, 表决比例] created: 2026-05-28 updated: 2026-05-28 status: reviewed type: knowledge --- 公司决议是公司意思形成的核心机制，其效力问题直接关系到公司行为的合法性与交易安全。2023年《公司法》将公司决议效力瑕疵体系由原来的\"二分法\"（无效与可撤销）","slug":"公司决议效力","module":"04-公司与商事","moduleName":"04-公司与商事","tags":["民法","公司法","公司决议","决议效力","程序瑕疵","表决比例"],"wordCount":2430,"created":"2026-05-28","updated":"2026-05-28","content":"# 公司决议效力\n\n## 一、概述\n\n公司决议是公司意思形成的核心机制，其效力问题直接关系到公司行为的合法性与交易安全。2023年《公司法》将公司决议效力瑕疵体系由原来的\"二分法\"（无效与可撤销）完善为\"三分法\"（不成立、可撤销与无效），并细化了程序瑕疵与实体瑕疵的区分标准。实务中，公司决议效力争议是公司治理纠纷中最常见的类型，涉及股东会决议、董事会决议的效力认定，以及利害关系股东回避、表决比例计算等具体问题。\n\n## 二、核心内容\n\n### 2.1 法律依据\n\n| 法律条文 | 内容要点 |\n|---------|---------|\n| 《公司法》(2023修订) 第25条 | 公司股东会、董事会的决议内容违反法律、行政法规的无效 |\n| 《公司法》第26条 | 股东会、董事会的会议召集程序、表决方式违反法律、行政法规或者公司章程，或者决议内容违反公司章程的，股东可以自决议作出之日起六十日内请求人民法院撤销 |\n| 《公司法》第27条 | 股东会、董事会决议存在下列情形之一的，股东等可以请求人民法院确认决议不成立：（一）未召开股东会、董事会会议作出决议；（二）股东会、董事会会议未对决议事项进行表决；（三）出席会议的人数或者所持表决权不符合公司法或者公司章程规定；（四）同意决议事项的人数或者所持表决权不符合公司法或者公司章程规定；（五）导致决议不成立的其他情形 |\n| 《公司法》第28条 | 股东会、董事会决议被人民法院宣告无效、撤销或者确认不成立的，公司应当向登记机关申请撤销根据该决议已办理的登记；根据该决议与善意相对人形成的民事法律关系不受影响 |\n| 《公司法》第185条 | 上市公司在一年内购买、出售重大资产或者向他人提供担保的金额超过公司资产总额百分之三十的，应当由股东会作出决议，并经出席会议的股东所持表决权的三分之二以上通过 |\n| 《公司法解释四》第5条 | 股东会或者股东大会、董事会决议存在下列情形之一的，当事人可以主张决议不成立：（一）公司未召开会议的，但依据公司法或者公司章程规定可以不召开股东会或者股东大会而直接作出决定的除外；（二）会议未对决议事项进行表决的；（三）出席会议的人数或者股东所持表决权不符合公司法或者公司章程规定的；（四）会议的表决结果未达到公司法或者公司章程规定的通过比例的；（五）导致决议不成立的其他情形 |\n| 《公司法解释四》第6条 | 股东会或者股东大会、董事会决议被人民法院判决确认无效或者撤销的，公司依据该决议与善意相对人形成的民事法律关系不受影响 |\n\n### 2.2 决议效力瑕疵类型\n\n| 瑕疵类型 | 适用情形 | 法律后果 | 原告资格 | 除斥期间 |\n|---------|---------|---------|---------|---------|\n| 决议不成立 | 未召开会议、未表决、出席人数或表决权不符合规定、表决比例未达标 | 自始不发生法律效力 | 股东、董事、监事等 | 无限制 |\n| 决议可撤销 | 召集程序、表决方式违反法律法规或章程；决议内容违反章程 | 撤销前有效，撤销后自始无效 | 股东 | 60日 |\n| 决议无效 | 决议内容违反法律、行政法规 | 自始无效 | 股东、董事、监事等 | 无限制 |\n\n### 2.3 裁判规则\n\n| 争议焦点 | 裁判规则 |\n|---------|---------|\n| 程序瑕疵与决议效力 | 轻微程序瑕疵且对决议未产生实质影响的，法院可不予撤销；但严重程序瑕疵（如未通知部分股东参会）的，应撤销决议 |\n| 利害关系股东回避 | 与决议事项有特别利害关系的股东不得就该事项行使表决权；违反回避规定的，决议可能被撤销 |\n| 表决比例的计算 | 表决权比例应以公司章程确定的表决权为基础计算；公司章程可约定表决权与出资比例不一致 |\n| 决议不成立与可撤销的区分 | 区分标准在于瑕疵的严重程度：不成立系根本性瑕疵，可撤销系一般性瑕疵 |\n| 善意相对人保护 | 决议被确认无效、撤销或不成立的，不影响公司依据该决议与善意相对人形成的民事法律关系 |\n\n### 2.4 实务要点\n\n1. **60日期限的把握**：股东提起撤销之诉的60日期限为除斥期间，不适用中止、中断的规定；股东应在知悉决议作出之日起及时主张权利。\n2. **决议不成立的举证**：主张决议不成立的当事人应举证证明存在法定不成立事由；公司应举证证明决议程序合法。\n3. **临时股东会的召集程序**：监事有权在董事会不履行召集职责时召集股东会；代表十分之一以上表决权的股东也可自行召集。\n4. **书面决议的效力**：全体股东以书面形式一致表示同意的，可以不召开股东会会议，直接作出决定，并由全体股东在决定文件上签名或盖章。\n5. **决议效力之诉的合并审"},{"id":"股东出资责任","title":"股东出资责任","excerpt":"--- tags: [民法, 公司法, 股东出资, 认缴制, 抽逃出资, 加速到期] created: 2026-05-28 updated: 2026-05-28 verified: true status: reviewed type: knowledge --- 股东出资责任是公司资本制度的核心，涉及股东对公司、公司债权人及其他股东的多重法律义务。2023年《公司法》修订将注册资本认缴制调整","slug":"股东出资责任","module":"04-公司与商事","moduleName":"04-公司与商事","tags":["民法","公司法","股东出资","认缴制","抽逃出资","加速到期"],"wordCount":3342,"created":"2026-05-28","updated":"2026-05-28","content":"# 股东出资责任\n\n## 一、概述\n\n股东出资责任是公司资本制度的核心，涉及股东对公司、公司债权人及其他股东的多重法律义务。2023年《公司法》修订将注册资本认缴制调整为限期实缴制（五年内缴足），对既有公司治理格局产生深远影响。实务中，出资责任纠纷涵盖出资不实、抽逃出资、加速到期、未届期股权转让等多种形态，是公司诉讼领域最高频的争议类型之一。\n\n## 二、核心内容\n\n### 2.1 法律依据\n\n| 法律条文 | 内容要点 |\n|---------|---------|\n| 《公司法》(2023修订) 第47条 | 有限责任公司全体股东认缴的出资额由股东自公司成立之日起五年内缴足 |\n| 《公司法》第49条 | 股东以货币出资的应将货币出资足额存入公司账户；以非货币财产出资的应依法办理财产权转移手续 |\n| 《公司法》第50条 | 股东未按期足额缴纳出资的，除应补缴外，还应对已按期足额缴纳出资的股东承担违约责任 |\n| 《公司法》第53条 | 公司成立后，股东不得抽逃出资 |\n| 《公司法》第54条 | 公司不能清偿到期债务时，公司或已到期债权人有权要求已认缴但未届出资期限的股东提前缴纳出资 |\n| 《公司法》第88条 | 股东转让已认缴出资但未届出资期限的股权的，由受让人承担缴纳该出资的义务；受让人未按期足额缴纳出资的，转让人对受让人未按期缴纳的出资承担补充责任 |\n| 《公司法解释三》第13条 | 股东未履行或未全面履行出资义务，公司或其他股东可请求其向公司依法全面履行出资义务；公司债权人可请求未履行出资义务的股东在未出资本息范围内对公司债务不能清偿的部分承担补充赔偿责任 |\n| 《公司法解释三》第14条 | 股东抽逃出资的，公司或其他股东可请求其向公司返还出资本息；债权人可请求抽逃出资的股东在抽逃出资本息范围内对公司债务不能清偿的部分承担补充赔偿责任 |\n| 《九民纪要》第6条 | 在注册资本认缴制下，股东依法享有期限利益；债权人以公司不能清偿到期债务为由请求未届出资期限的股东在未出资范围内对公司不能清偿的债务承担补充赔偿责任的，人民法院不予支持，但公司作为被执行人的案件穷尽执行措施无财产可供执行、已具备破产原因但不申请破产的除外 |\n\n### 2.2 出资责任类型与构成要件\n\n| 责任类型 | 构成要件 | 法律后果 |\n|---------|---------|---------|\n| 出资不实（未足额出资） | ①以非货币财产出资；②实际价额显著低于章程所定价额 | 补足差额，其他发起人承担连带责任（第50条） |\n| 出资不实（未按期出资） | ①认缴期限届满；②未缴纳或未足额缴纳 | 补缴+违约责任（第50条），可能被限制股东权利 |\n| 抽逃出资 | ①已完成出资；②通过虚构债权债务、关联交易等方式抽回 | 返还本息，协助抽逃的董事、高管承担连带责任 |\n| 加速到期 | ①公司不能清偿到期债务；②股东出资期限未届满 | 股东提前缴纳出资（第54条），公司或已到期债权人均可主张 |\n| 未届期股权转让后责任 | ①转让人转让未届期股权；②受让人未按期足额缴纳 | 受让人承担缴纳义务，转让人承担补充责任（第88条） |\n\n### 2.3 裁判规则\n\n| 争议焦点 | 裁判规则 |\n|---------|---------|\n| 加速到期的适用条件 | 2023年《公司法》第54条确立了加速到期制度，不再要求\"具备破产原因\"这一前提条件，仅需\"公司不能清偿到期债务\"即可 |\n| 未届期股权转让 | 转让人承担的是补充责任而非连带责任，债权人应先向受让人主张，不能清偿部分才可向转让人主张 |\n| 出资加速到期的请求权主体 | 公司自身和已到期债权人均有权主张；公司其他债权人是否可主张，需结合具体案情判断 |\n| 非货币出资的评估 | 未依法评估的，法院应委托评估机构评估；实际价额偏低的，出资人应补足差额 |\n| 举证责任分配 | 债权人主张股东出资不实的，需提供初步证据；股东应举证证明已实际出资 |\n\n### 2.4 实务要点\n\n1. **五年缴足的过渡安排**：2023年《公司法》施行前已设立的公司，出资期限超过五年的应在过渡期内调整至五年以内，实务中需关注国务院规定的具体过渡期。\n2. **加速到期的诉讼策略**：债权人可选择在执行程序中追加未届期股东为被执行人，也可另案起诉；建议优先在执行程序中追加以降低诉讼成本。\n3. **未届期股权转让的风险防范**：转让方在转让协议中应明确约定受让方的出资义务及违约责任，必要时要求受让方提供担保。\n4. **实物出资的程序要求**：需经评估机构评估、验资机构验资，并办理财产权转移手续；瑕疵出资的，发起人需承担连带责任。\n5. **抽逃出资的识别**：关注资金流水中的异常回"},{"id":"股东权利保护","title":"股东权利保护","excerpt":"--- tags: [民法, 公司法, 股东权利, 知情权, 分红权, 代表诉讼] created: 2026-05-28 updated: 2026-05-28 status: reviewed type: knowledge --- 股东权利保护是公司法的核心价值之一。股东作为公司的出资人，依法享有资产收益、参与重大决策和选择管理者等基本权利。2023年《公司法》修订进一步强化了股东权利保护机","slug":"股东权利保护","module":"04-公司与商事","moduleName":"04-公司与商事","tags":["民法","公司法","股东权利","知情权","分红权","代表诉讼"],"wordCount":2519,"created":"2026-05-28","updated":"2026-05-28","content":"# 股东权利保护\n\n## 一、概述\n\n股东权利保护是公司法的核心价值之一。股东作为公司的出资人，依法享有资产收益、参与重大决策和选择管理者等基本权利。2023年《公司法》修订进一步强化了股东权利保护机制，特别是在知情权范围扩大、双重代表诉讼制度确立、异议股东回购请求权完善等方面取得重要突破。实务中，股东权利保护纠纷主要集中在知情权行使受阻、利润分配请求被拒、代表诉讼程序瑕疵等场景。\n\n## 二、核心内容\n\n### 2.1 法律依据\n\n| 法律条文 | 内容要点 |\n|---------|---------|\n| 《公司法》(2023修订) 第57条 | 股东有权查阅、复制公司章程、股东会会议记录、董事会会议决议、监事会会议决议和财务会计报告；可以要求查阅公司会计账簿、会计凭证 |\n| 《公司法》第58条 | 股东要求查阅公司会计账簿、会计凭证的，应当向公司提出书面请求说明目的；公司有合理根据认为股东查阅有不正当目的可能损害公司合法利益的，可以拒绝提供查阅 |\n| 《公司法》第84条 | 股东之间可以相互转让其全部或者部分股权；股东向股东以外的人转让股权，应当将股权转让的有关事项书面通知其他股东 |\n| 《公司法》第89条 | 公司连续五年不向股东分配利润，而公司该五年连续盈利且符合分配利润条件的，异议股东可请求公司按照合理的价格收购其股权 |\n| 《公司法》第189条 | 董事、高级管理人员执行公司职务时违反法律、行政法规或者公司章程的规定，给公司造成损失的，连续一百八十日以上单独或者合计持有公司百分之一以上股份的股东，有权书面请求监事会向人民法院提起诉讼；监事有前述情形的，前述股东可以书面请求董事会向人民法院提起诉讼；情况紧急、不立即提起诉讼将会使公司利益受到难以弥补的损害的，前述股东有权为公司利益以自己的名义直接向人民法院提起诉讼 |\n| 《公司法》第190条 | 董事、高级管理人员执行职务给他人造成损害的，公司承担赔偿责任后，可以向有故意或者重大过失的董事、高级管理人员追偿 |\n| 《公司法解释四》第7条 | 股东依据公司法规定起诉请求查阅或者复制公司特定文件材料的，人民法院应当依法予以受理 |\n| 《公司法解释四》第15条 | 股东未提交载明具体分配方案的股东会或者股东大会决议，请求公司分配利润的，人民法院应当驳回其诉讼请求，但违反法律规定滥用股东权利导致公司不分配利润，给其他股东造成损失的除外 |\n\n### 2.2 股东主要权利类型\n\n| 权利类型 | 权利内容 | 行使条件 | 救济途径 |\n|---------|---------|---------|---------|\n| 知情权 | 查阅、复制公司章程、会议决议、财务报告；查阅会计账簿、会计凭证 | 查阅会计账簿需书面请求并说明目的 | 股东知情权诉讼 |\n| 分红权 | 按照出资比例或章程约定获取利润分配 | 公司有可分配利润且作出分配决议 | 利润分配请求权诉讼 |\n| 优先认购权 | 公司新增资本时，按实缴出资比例优先认缴 | 公司增资决议作出后 | 确认优先认购权诉讼 |\n| 表决权 | 参加股东会并对决议事项进行表决 | 股东身份确定 | 决议效力诉讼 |\n| 异议股东回购请求权 | 对特定决议投反对票后请求公司回购股权 | 连续五年盈利不分配、合并分立转让主要财产等 | 股权回购诉讼 |\n| 股东代表诉讼 | 以自己名义为公司利益起诉侵害人 | 前置程序（书面请求公司机关起诉）或情况紧急 | 股东代表诉讼 |\n\n### 2.3 裁判规则\n\n| 争议焦点 | 裁判规则 |\n|---------|---------|\n| 知情权的\"不正当目的\"认定 | 公司以股东有不正当目的为由拒绝查阅的，应承担举证责任；股东自营或为他人经营与公司主营业务有实质性竞争关系业务的，可认定为不正当目的 |\n| 会计凭证的查阅范围 | 2023年《公司法》明确股东可查阅会计凭证，扩大了知情权范围；原始凭证和记账凭证均属可查阅范围 |\n| 异议股东回购的\"连续五年\"认定 | 应连续计算，中间任一年度不盈利则不满足条件；公司以存在可分配利润但通过关联交易等方式转移利润的，不影响条件成就的认定 |\n| 代表诉讼的前置程序豁免 | 情况紧急、不立即提起诉讼将使公司利益受到难以弥补的损害的，可豁免前置程序；公司机关已不存在或丧失功能的，亦可豁免 |\n| 分红权诉讼中的举证 | 股东需证明公司存在可分配利润且存在滥用权利不分配的情形；公司需证明不分配的合理性 |\n\n### 2.4 实务要点\n\n1. **知情权行使的程序规范**：股东查阅会计账簿应书面请求并说明目的，公司自收到请求之日起十五日内书面答复；公司拒绝的，股东可在法定期限内提起诉讼。\n2. **知情权诉讼的时效**：知情权属"},{"id":"董事高管责任","title":"董事高管责任","excerpt":"--- tags: [民法, 公司法, 忠实义务, 勤勉义务, 竞业禁止, 归入权] created: 2026-05-28 updated: 2026-05-28 status: reviewed type: knowledge --- 董事、高级管理人员作为公司的受信人，对公司负有忠实义务和勤勉义务。2023年《公司法》修订进一步细化了忠实义务和勤勉义务的具体内涵，新增了董事对第三人的责任条款","slug":"董事高管责任","module":"04-公司与商事","moduleName":"04-公司与商事","tags":["民法","公司法","忠实义务","勤勉义务","竞业禁止","归入权"],"wordCount":2431,"created":"2026-05-28","updated":"2026-05-28","content":"# 董事高管责任\n\n## 一、概述\n\n董事、高级管理人员作为公司的受信人，对公司负有忠实义务和勤勉义务。2023年《公司法》修订进一步细化了忠实义务和勤勉义务的具体内涵，新增了董事对第三人的责任条款，强化了公司治理中的权责对等原则。实务中，董事高管责任纠纷主要集中在违反竞业禁止义务、进行不当自我交易、挪用公司资产、怠于履行职责等情形，归入权的行使和损害赔偿的认定是核心争议焦点。\n\n## 二、核心内容\n\n### 2.1 法律依据\n\n| 法律条文 | 内容要点 |\n|---------|---------|\n| 《公司法》(2023修订) 第180条 | 董事、监事、高级管理人员对公司负有忠实义务，应当采取措施避免自身利益与公司利益冲突，不得利用职权牟取不正当利益；对公司负有勤勉义务，执行职务应当为公司的最大利益尽到管理者通常应有的合理注意 |\n| 《公司法》第181条 | 董事、监事、高级管理人员不得有下列行为：（一）侵占公司财产、挪用公司资金；（二）将公司资金以其个人名义或者以其他个人名义开立账户存储；（三）利用职权贿赂或者收受其他非法收入；（四）接受他人与公司交易的佣金归为己有；（五）擅自披露公司秘密；（六）违反对公司忠实义务的其他行为 |\n| 《公司法》第182条 | 董事、监事、高级管理人员直接或者间接与本公司订立合同或者进行交易，应当就与订立合同或者进行交易有关的事项向董事会或者股东会报告，并经董事会或者股东会决议通过 |\n| 《公司法》第183条 | 董事、监事、高级管理人员不得利用职务便利为自己或者他人谋取属于公司的商业机会，但有下列情形之一的除外：（一）已向董事会或者股东会报告，并经董事会或者股东会决议通过；（二）根据法律、行政法规或者公司章程的规定，公司不能利用该商业机会 |\n| 《公司法》第184条 | 董事、监事、高级管理人员未向董事会或者股东会报告，并经董事会或者股东会决议通过，不得自营或者为他人经营与其任职公司同类的业务 |\n| 《公司法》第186条 | 董事、监事、高级管理人员违反本法第一百八十一条至第一百八十四条规定所得的收入应当归公司所有 |\n| 《公司法》第188条 | 董事、监事、高级管理人员执行职务违反法律、行政法规或者公司章程的规定，给公司造成损失的，应当承担赔偿责任 |\n| 《公司法》第190条 | 董事、高级管理人员执行职务，给他人造成损害的，公司承担赔偿责任；董事、高级管理人员存在故意或者重大过失的，也应当承担赔偿责任 |\n| 《公司法》第192条 | 公司的控股股东、实际控制人指示董事、高级管理人员从事损害公司或者股东利益的行为的，与该董事、高级管理人员承担连带责任 |\n\n### 2.2 董事高管义务体系\n\n| 义务类型 | 具体内容 | 违反后果 | 典型情形 |\n|---------|---------|---------|---------|\n| 忠实义务 | 避免利益冲突，不得利用职权牟取不正当利益 | 归入权+损害赔偿 | 自我交易、篡夺公司机会、竞业经营 |\n| 勤勉义务 | 为公司最大利益尽到合理注意 | 损害赔偿 | 决策失误、怠于履职、监督缺失 |\n| 竞业禁止 | 不得自营或为他人经营同类业务 | 归入权+损害赔偿 | 在职期间从事同业竞争 |\n| 自我交易限制 | 与公司交易需报告并经决议通过 | 损害赔偿，交易可撤销 | 以个人名义与公司交易 |\n\n### 2.3 裁判规则\n\n| 争议焦点 | 裁判规则 |\n|---------|---------|\n| 勤勉义务的判断标准 | 采用\"商业判断规则\"，即董事在决策时尽到了合理的注意义务，基于充分信息作出商业判断的，即使决策结果对公司不利，亦不承担赔偿责任 |\n| 归入权的行使 | 公司可请求将违反义务的董事高管的违法所得归入公司；归入权的行使不以公司遭受实际损失为前提 |\n| 竞业禁止的范围 | \"同类业务\"的认定不限于营业执照记载的经营范围，应实质判断是否与公司业务构成竞争关系 |\n| 董事对第三人的责任 | 2023年《公司法》新增第190条，董事、高管执行职务存在故意或重大过失致他人损害的，应直接承担赔偿责任 |\n| 控制股东的连带责任 | 控股股东、实际控制人指示董事高管从事损害行为的，承担连带责任；\"指示\"的认定需结合具体证据 |\n\n### 2.4 实务要点\n\n1. **忠实义务的穷尽列举**：2023年《公司法》将忠实义务类型化为具体禁止行为，法院在审理时应严格对照法条判断，不宜随意扩大解释。\n2. **自我交易的程序合规**：自我交易需同时满足\"报告\"和\"决议通过\"两个要件；未报告或未经决议的，交易可能被撤销，董事需承担赔偿责任。\n3. **归入权与损害赔偿的选择**：公司可选择行使归入权（以违"},{"id":"公司盈余分配","title":"公司盈余分配","excerpt":"--- tags: [民法, 公司法, 盈余分配, 利润分配, 股东权利] created: 2026-05-28 updated: 2026-05-28 status: reviewed type: knowledge --- 公司盈余分配，即利润分配，是指公司在依法缴纳税款、弥补亏损、提取公积金后，将剩余利润按照股东出资比例或章程约定分配给股东的制度。盈余分配请求权是股
