东的核心权利之一，但该权","slug":"公司盈余分配","module":"04-公司与商事","moduleName":"04-公司与商事","tags":["民法","公司法","盈余分配","利润分配","股东权利"],"wordCount":2304,"created":"2026-05-28","updated":"2026-05-28","content":"# 公司盈余分配\n\n## 概述\n\n公司盈余分配，即利润分配，是指公司在依法缴纳税款、弥补亏损、提取公积金后，将剩余利润按照股东出资比例或章程约定分配给股东的制度。盈余分配请求权是股东的核心权利之一，但该权利的行使受到公司自治原则的限制，需要经过股东会决议。实务中，大股东操控公司不分配利润、侵害中小股东权益的情形较为常见。\n\n## 核心内容\n\n### 一、法律依据\n\n| 法律法规 | 条文 | 内容要点 |\n|---------|------|---------|\n| 《公司法》(2023修订) | 第210条 | 税后利润的分配顺序 |\n| 《公司法》(2023修订) | 第211条 | 违法分配利润的法律责任 |\n| 《公司法》(2023修订) | 第212条 | 股东会决议分配利润的期限 |\n| 最高法院公司法解释(四) | 第15条 | 盈余分配诉讼的受理条件 |\n| 最高法院公司法解释(五) | 第4条 | 利润分配的时限要求 |\n| 《民法典》 | 第85条 | 营利法人决议瑕疵的救济 |\n\n### 二、利润分配的法定程序\n\n#### （一）分配前提\n\n根据《公司法》第210条，公司利润分配必须满足以下条件：\n\n1. **依法缴纳企业所得税**\n2. **弥补以前年度亏损**（如有）\n3. **提取法定公积金**（税后利润的10%，累计达注册资本50%后可不再提取）\n4. **提取任意公积金**（经股东会决议）\n5. **向股东分配利润**\n\n#### （二）分配比例\n\n- **有限责任公司**：按照股东实缴的出资比例分配，但全体股东约定不按出资比例分配的除外\n- **股份有限公司**：按照股东持有的股份比例分配，但公司章程另有规定的除外\n\n#### （三）分配决议\n\n根据《公司法》第212条：\n- 股东会作出分配利润的决议后，董事会应当在股东会决议作出之日起六个月内进行分配\n- 公司章程对利润分配的时限另有规定的，从其规定\n\n### 三、裁判规则\n\n| 序号 | 争议焦点 | 裁判规则 | 依据 |\n|-----|---------|---------|------|\n| 1 | 是否需要股东会决议 | 股东请求公司分配利润，应当提交载明具体分配方案的股东会决议。未提交的，人民法院应当驳回其诉讼请求 | 公司法解释(四)第15条 |\n| 2 | 股东会决议不分配的救济 | 股东会决议不分配利润，但大股东滥用股东权利导致公司不分配利润，给其他股东造成损失的，受损害股东可请求损害赔偿 | 公司法解释(四)第15条但书 |\n| 3 | 具体分配方案的认定 | 股东会决议应当载明利润分配的具体比例和金额，仅概括性决议\"分配利润\"而未载明具体方案的，不视为有效的分配决议 | 参照公司法解释(四)第15条精神 |\n| 4 | 强制分配的条件 | 公司连续五年盈利且连续五年符合分配利润条件，但公司以长期不分配为常态，大股东通过高薪等方式变相分配的，可支持强制分配 | 《公司法》第210条及相关判例 |\n| 5 | 分配决议作出后的履行 | 公司作出利润分配决议后，即对股东负有支付利润的债务，公司拒不支付的，股东可以直接起诉要求支付 | 公司法解释(五)第4条 |\n| 6 | 违法分配的返还 | 公司在未弥补亏损、未提取法定公积金的情况下向股东分配利润，股东应当将违法分配的利润退还公司 | 《公司法》第211条 |\n| 7 | 未届出资期限股东的分配权 | 未届出资期限的股东仍享有利润分配权，但公司章程另有规定的除外 | 参照出资与权利对等原则 |\n\n### 四、实务要点\n\n**1. 利润分配请求权的性质**\n- 抽象的利润分配请求权：股东基于股东资格享有的固有权，不可剥夺\n- 具体的利润分配请求权：经股东会决议后转化为债权，可以转让和继承\n\n**2. 诉讼策略**\n- 优先请求确认股东会分配决议有效并要求公司履行\n- 无分配决议时，可主张大股东滥用权利请求损害赔偿\n- 必要时申请司法审计确定公司盈利情况\n\n**3. 举证要点**\n- 证明公司存在可分配利润（财务报表、审计报告等）\n- 证明自身股东资格（工商登记、股东名册等）\n- 证明大股东滥用权利（关联交易、高薪、变相分配等）\n\n**4. 公司章程设计**\n- 明确利润分配的条件、比例和时间\n- 设定最低分配比例或强制分配条款\n- 约定利润分配争议的解决机制\n\n**5. 税务处理**\n- 自然人股东取得股息红利缴纳20%个人所得税\n- 居民企业之间的股息红利免征企业所得税\n- 上市公司股息红利实行差别化个人所得税政策\n\n## 典型案例\n\n### 案例：大股东滥用权利不分配利润的强制分配\n\n**案号/入库编号**：入库编号2023-08-2-274-003；案号一审（2021）京"},{"id":"股东代表诉讼","title":"股东代表诉讼","excerpt":"--- tags: [民法, 公司法, 股东代表诉讼, 派生诉讼, 公司利益保护] created: 2026-05-28 updated: 2026-05-28 status: reviewed type: knowledge --- 股东代表诉讼，又称股东派生诉讼，是指公司董事、监事、高级管理人员或他人侵害公司合法权益，给公司造成损失，而公司怠于追究其责任时，符合条件的股东为了公司的利益，以自","slug":"股东代表诉讼","module":"04-公司与商事","moduleName":"04-公司与商事","tags":["民法","公司法","股东代表诉讼","派生诉讼","公司利益保护"],"wordCount":2362,"created":"2026-05-28","updated":"2026-05-28","content":"# 股东代表诉讼\n\n## 概述\n\n股东代表诉讼，又称股东派生诉讼，是指公司董事、监事、高级管理人员或他人侵害公司合法权益，给公司造成损失，而公司怠于追究其责任时，符合条件的股东为了公司的利益，以自己的名义向人民法院提起诉讼的制度。该制度是保护中小股东权益的重要法律武器，也是公司治理的最后防线。\n\n## 核心内容\n\n### 一、法律依据\n\n| 法律法规 | 条文 | 内容要点 |\n|---------|------|---------|\n| 《公司法》(2023修订) | 第189条 | 股东代表诉讼的基本规则 |\n| 《公司法》(2023修订) | 第190条 | 对控股股东、实际控制人的代表诉讼 |\n| 《公司法》(2023修订) | 第191条 | 代表诉讼的费用承担 |\n| 最高法院公司法解释(四) | 第23-26条 | 股东代表诉讼的细化规定 |\n| 《民法典》 | 第84条 | 利用关联关系损害法人利益的责任 |\n| 《民法典》 | 第85条 | 营利法人决议瑕疵的救济 |\n\n### 二、股东代表诉讼的构成要件\n\n#### （一）主体要件\n\n**1. 原告资格**\n\n| 股东类型 | 有限责任公司 | 股份有限公司 |\n|---------|-------------|-------------|\n| 持股比例 | 无比例要求 | 连续180日以上单独或者合计持有公司1%以上股份 |\n| 持股时间 | 无时间要求 | 连续180日以上 |\n| 股东状态 | 起诉时及诉讼中均应具有股东资格 | 同左 |\n\n**2. 被告范围**\n\n根据《公司法》第189条和第190条：\n- 公司的董事、监事、高级管理人员\n- 他人（包括控股股东、实际控制人）\n- 利用关联关系损害公司利益的关联方\n\n**3. 公司的诉讼地位**\n\n根据公司法解释(四)第24条：\n- 股东提起代表诉讼，应当列公司为第三人\n- 一审法庭辩论终结前，符合条件的其他股东以相同的诉讼请求申请参加诉讼的，应当列为共同原告\n\n#### （二）前置程序\n\n**1. 一般规则**\n\n根据《公司法》第189条第1款、第2款：\n- **对董事、高管起诉**：股东应书面请求监事会（或监事）向人民法院提起诉讼\n- **对监事起诉**：股东应书面请求董事会（或执行董事）向人民法院提起诉讼\n\n**2. 前置程序的豁免**\n\n根据公司法解释(四)第23条第2款，有下列情形之一的，股东可以直接提起代表诉讼：\n- 情况紧急、不立即提起诉讼将会使公司利益受到难以弥补的损害的\n- 有关机关和部门明确表示不予处理的\n- 股东向公司机关提出书面请求之日起30日内未提起诉讼的（公司法解释(四)第23条第2款）\n- 公司机关不存在或已丧失诉讼行为能力的\n\n### 三、裁判规则\n\n| 序号 | 争议焦点 | 裁判规则 | 依据 |\n|-----|---------|---------|------|\n| 1 | 原告股东资格 | 股东提起代表诉讼时应当具有股东资格；起诉时不具有股东资格的，人民法院应当裁定驳回起诉 | 公司法解释(四)第24条 |\n| 2 | 前置程序的履行 | 股东未履行前置程序直接起诉的，人民法院应当裁定驳回起诉，但具有豁免情形的除外 | 《公司法》第189条 |\n| 3 | 诉讼请求的范围 | 股东代表诉讼的请求应当是被告向公司承担责任，而非向股东个人承担责任 | 公司法解释(四)第25条 |\n| 4 | 和解与撤诉 | 股东代表诉讼中，原告股东与被告达成和解协议或申请撤诉的，应经公司其他股东同意或人民法院审查确认 | 公司法解释(四)第26条 |\n| 5 | 诉讼结果归属 | 股东代表诉讼的胜诉利益归于公司，股东因诉讼支出的合理费用由公司承担 | 《公司法》第191条 |\n| 6 | 对实际控制人的代表诉讼 | 控股股东、实际控制人利用其关联关系损害公司利益，公司怠于起诉的，符合条件的股东可以直接对其提起代表诉讼 | 《公司法》第190条 |\n| 7 | 重复起诉的禁止 | 公司已经就同一事实提起诉讼或股东已经提起代表诉讼的，其他股东不得就同一事实再次起诉 | 参照诉讼法一般原则 |\n\n### 四、实务要点\n\n**1. 诉前准备**\n- 收集公司利益受损的证据材料\n- 确认自身股东资格（工商登记、股东名册、出资证明等）\n- 书面请求公司机关起诉并保留送达凭证\n- 等待30日或收集豁免前置程序的证据\n\n**2. 诉讼策略**\n- 明确诉讼请求为被告向公司赔偿损失\n- 申请诉讼保全防止被告转移财产\n- 申请法院调取公司财务账册等证据\n- 必要时申请司法审计\n\n**3. 典型适用场景**\n- 董事、高管违反忠实义务，进行关联交易\n- 控股股东利用优势地位转移公司资产\n- 董事、高管"},{"id":"股权代持","title":"股权代持","excerpt":"--- tags: [民法, 公司法, 股权代持, 隐名股东, 显名化] created: 2026-05-28 updated: 2026-05-28 status: reviewed type: knowledge --- 股权代持，又称委托持股、隐名投资，是指实际出资人（隐名股东）与名义出资人（显名股东）约定，由名义出资人以自己的名义代实际出资人持有股权的法律安排。股权代持在实务中普遍存在，","slug":"股权代持","module":"04-公司与商事","moduleName":"04-公司与商事","tags":["民法","公司法","股权代持","隐名股东","显名化"],"wordCount":2404,"created":"2026-05-28","updated":"2026-05-28","content":"# 股权代持\n\n## 概述\n\n股权代持，又称委托持股、隐名投资，是指实际出资人（隐名股东）与名义出资人（显名股东）约定，由名义出资人以自己的名义代实际出资人持有股权的法律安排。股权代持在实务中普遍存在，常见于规避投资限制、保护商业隐私、简化审批程序等情形。代持关系的效力认定、实际出资人的权利保护是该领域的核心问题。\n\n## 核心内容\n\n### 一、法律依据\n\n| 法律法规 | 条文 | 内容要点 |\n|---------|------|---------|\n| 《公司法》(2023修订) | 第84条 | 股权转让规则（显名化适用） |\n| 最高法院公司法解释(三) | 第24条 | 股权代持协议效力及实际出资人权利 |\n| 最高法院公司法解释(三) | 第25条 | 名义股东处分股权的效力 |\n| 最高法院公司法解释(三) | 第26条 | 名义股东的债权人申请执行代持股权 |\n| 《民法典》 | 第143条 | 民事法律行为效力的一般规定 |\n| 《民法典》 | 第153条 | 违反强制性规定的合同效力 |\n\n### 二、股权代持协议的效力\n\n#### （一）一般原则：有效\n\n根据公司法解释(三)第24条第1款，有限责任公司的实际出资人与名义出资人订立合同，约定由实际出资人出资并享有投资权益，以名义出资人为名义股东，实际出资人与名义股东对该合同效力发生争议的，如无法律规定的无效情形，人民法院应当认定该合同有效。\n\n#### （二）无效情形\n\n| 无效事由 | 具体情形 | 法律依据 |\n|---------|---------|---------|\n| 违反法律强制性规定 | 为规避外商投资负面清单而代持 | 《民法典》第153条 |\n| 违反公序良俗 | 为规避公务员不得经商规定而代持 | 《民法典》第153条第2款 |\n| 损害社会公共利益 | 为规避金融监管而代持金融机构股权 | 《民法典》第153条 |\n| 恶意串通 | 为逃避债务而代持 | 《民法典》第154条 |\n\n**特殊领域禁止代持的规定：**\n- 上市公司股权：证监会《首次公开发行股票并上市管理办法》禁止代持\n- 保险公司股权：《保险公司股权管理办法》明确禁止代持\n- 银行股权：《商业银行股权管理暂行办法》禁止代持\n- 外商投资：负面清单内的外商投资禁止代持\n\n### 三、裁判规则\n\n| 序号 | 争议焦点 | 裁判规则 | 依据 |\n|-----|---------|---------|------|\n| 1 | 代持协议效力 | 无法律规定的无效情形，代持协议有效 | 公司法解释(三)第24条第1款 |\n| 2 | 投资收益归属 | 实际出资人与名义股东因投资权益的归属发生争议，实际出资人以其实际履行了出资义务为由向名义股东主张权利的，人民法院应予支持 | 公司法解释(三)第24条第2款 |\n| 3 | 显名化程序 | 实际出资人未经公司其他股东半数以上同意，请求公司变更股东、签发出资证明书、记载于股东名册、记载于公司章程并办理公司登记机关登记的，人民法院不予支持 | 公司法解释(三)第24条第3款 |\n| 4 | 名义股东处分股权 | 名义股东将登记于其名下的股权转让、质押或者以其他方式处分，实际出资人以其对于股权享有实际权利为由，请求认定处分股权行为无效的，人民法院可以参照善意取得的规定处理 | 公司法解释(三)第25条 |\n| 5 | 债权人强制执行 | 公司债权人以登记于公司登记机关的股东未履行出资义务为由，请求其对公司债务不能清偿的部分在未出资本息范围内承担补充赔偿责任，股东以其仅为名义股东而非实际出资人为由进行抗辩的，人民法院不予支持 | 公司法解释(三)第26条 |\n| 6 | 代持股权的继承 | 实际出资人死亡，其继承人可基于代持协议主张投资权益，但显名化仍需其他股东同意 | 参照公司法解释(三)第24条 |\n\n### 四、实务要点\n\n**1. 代持协议的签订要点**\n- 明确约定实际出资人、名义股东身份\n- 约定出资款的来源、支付方式和时间\n- 明确投资收益的归属和分配方式\n- 约定显名化的条件和程序\n- 设置违约责任和解除条款\n- 约定争议解决方式\n\n**2. 实际出资人的风险防范**\n- 保留出资凭证和银行转账记录\n- 参与公司经营管理，保留相关文件\n- 定期获取公司财务报告和股东会决议\n- 要求名义股东提供担保或质押\n- 在公司其他股东中寻找知情见证人\n\n**3. 显名化的操作路径**\n- 取得公司其他股东半数以上同意\n- 召开股东会形成决议\n- 修改公司章程\n- 办理工商变更登记\n- 必要时通过诉讼确认股东资格\n\n**4. 税务风险**\n- 名义股东可能面临股权转让的个人所得税\n- 实际出资人显名化可能被认定为股权转让\n- "},{"id":"股权转让","title":"股权转让","excerpt":"--- tags: [民法, 公司法, 股权转让, 优先购买权, 股东权利] created: 2026-05-28 updated: 2026-05-28 verified: true status: reviewed type: knowledge --- 股权转让是公司法实务中最常见的股权变动方式，指股东将其持有的公司股权让与他人的法律行为。股权转让涉及对内转让与对外转让两种类型，对外转让需","slug":"股权转让","module":"04-公司与商事","moduleName":"04-公司与商事","tags":["民法","公司法","股权转让","优先购买权","股东权利"],"wordCount":2581,"created":"2026-05-28","updated":"2026-05-28","content":"# 股权转让\n\n## 概述\n\n股权转让是公司法实务中最常见的股权变动方式，指股东将其持有的公司股权让与他人的法律行为。股权转让涉及对内转让与对外转让两种类型，对外转让需经其他股东过半数同意并保障其他股东的优先购买权。该制度的核心在于平衡股权自由转让与有限公司人合性保护之间的关系。\n\n## 核心内容\n\n### 一、法律依据\n\n| 法律法规 | 条文 | 内容要点 |\n|---------|------|---------|\n| 《公司法》(2023修订) | 第84条 | 有限责任公司股权转让的基本规则 |\n| 《公司法》(2023修订) | 第85条 | 人民法院强制执行中的股权转让 |\n| 《公司法》(2023修订) | 第86条 | 股权转让的变更登记 |\n| 《公司法》(2023修订) | 第157条 | 股份有限公司股份转让的一般规定 |\n| 《公司法》(2023修订) | 第158-162条 | 股份转让的限制性规定 |\n| 《民法典》 | 第646条 | 法律对有偿合同有规定的，适用其规定 |\n| 最高法院公司法解释(四) | 第16-22条 | 股权转让及优先购买权的细化规定 |\n\n### 二、股权转让的类型与规则\n\n#### （一）对内转让\n\n- **规则**：股东之间可以相互转让其全部或者部分股权（第84条第1款）\n- **限制**：公司章程可以对股东之间转让股权作出限制性规定\n- **要点**：对内转让无需其他股东同意，体现了股东之间的自由处分权\n\n#### （二）对外转让\n\n**1. 同意规则（2023年修订后简化）**\n\n根据《公司法》第84条第2款：\n- 股东向股东以外的人转让股权的，应当将股权转让的数量、价格、支付方式和期限等事项书面通知其他股东\n- 其他股东自接到书面通知之日起三十日内未答复的，视为同意转让\n- 其他股东半数以上不同意转让的，不同意的股东应当购买该转让的股权；不购买的，视为同意转让\n\n**2. 优先购买权**\n\n根据《公司法》第84条第3款：\n- 经股东同意转让的股权，在同等条件下，其他股东有优先购买权\n- 两个以上股东主张行使优先购买权的，协商确定各自的购买比例；协商不成的，按照转让时各自的出资比例行使优先购买权\n- 公司章程对优先购买权另有规定的，从其规定\n\n**3. \"同等条件\"的认定**\n\n根据公司法解释(四)第18条，人民法院在判断是否符合\"同等条件\"时，应当考虑：\n- 转让股权的数量\n- 转让价格\n- 支付方式\n- 支付期限\n- 其他对转让方有实质影响的因素\n\n### 三、裁判规则\n\n| 序号 | 争议焦点 | 裁判规则 | 依据 |\n|-----|---------|---------|------|\n| 1 | 未通知其他股东的对外转让效力 | 侵害其他股东优先购买权的股权转让合同，其他股东主张撤销的，人民法院应予支持 | 公司法解释(四)第21条 |\n| 2 | 优先购买权的行使期间 | 股东应在知道或应当知道行使优先购买权的同等条件之日起三十日内主张；最长不超过股权变更登记之日起一年 | 公司法解释(四)第21条第1款 |\n| 3 | 一股二卖的处理 | 已办理变更登记的受让方取得股权；未取得股权的受让方可请求转让方承担违约责任 | 公司法解释(四)第21条第2款 |\n| 4 | 公司章程限制转让条款 | 公司章程可以对股权转让作出限制，但不得禁止转让或导致股权实质上不能转让 | 最高法院指导性案例精神 |\n| 5 | 股权代持下的股权转让 | 实际出资人转让股权需经显名程序，即需经公司其他股东半数以上同意 | 公司法解释(三)第24条 |\n| 6 | 瑕疵出资股权的转让 | 未届出资期限的股权转让，受让人承担出资义务，转让人承担补充责任 | 《公司法》第88条 |\n\n### 四、实务要点\n\n**1. 股权转让合同的签订**\n- 明确约定转让价格、支付方式和期限\n- 约定股权交割条件和时间节点\n- 设置违约责任条款和解除条件\n\n**2. 优先购买权的程序合规**\n- 书面通知应包含转让数量、价格、支付方式和期限等核心要素\n- 保留通知送达的证据（公证送达、EMS等）\n- 等待30日答复期届满后再进行转让\n\n**3. 股权变更登记**\n- 及时办理工商变更登记，保护受让方权益\n- 修改公司章程和股东名册\n- 通知公司签发出资证明书\n\n**4. 税务处理**\n- 自然人转让股权需缴纳个人所得税（税率20%）\n- 法人转让股权需缴纳企业所得税\n- 注意转让价格明显偏低时的税务核定风险\n\n**5. 国有股权转让**\n- 需在依法设立的产权交易场所公开进行\n- 需经国有资产监督管理机构批准\n- 转让价格不得低于评估价格的90%\n\n## 典型案例\n\n### 案例：指导案例6"},{"id":"公司减资","title":"公司减资","excerpt":"--- tags: [民法, 公司法, 公司减资, 注册资本, 债权人保护] created: 2026-05-28 updated: 2026-05-28 status: reviewed type: knowledge --- 公司减资是指公司依照法定程序减少注册资本的行为。减资的原因多样，包括弥补亏损、调整资本结构、股东退出、返还出资等。由于减资直接影响公司的偿债能力，可能损害债权人利益，因","slug":"公司减资","module":"04-公司与商事","moduleName":"04-公司与商事","tags":["民法","公司法","公司减资","注册资本","债权人保护"],"wordCount":2399,"created":"2026-05-28","updated":"2026-05-28","content":"# 公司减资\n\n## 概述\n\n公司减资是指公司依照法定程序减少注册资本的行为。减资的原因多样，包括弥补亏损、调整资本结构、股东退出、返还出资等。由于减资直接影响公司的偿债能力，可能损害债权人利益，因此法律对减资设置了严格的程序要求。2023年新《公司法》引入了简易减资制度，为公司通过减资弥补亏损提供了更灵活的路径。\n\n## 核心内容\n\n### 一、法律依据\n\n| 法律法规 | 条文 | 内容要点 |\n|---------|------|---------|\n| 《公司法》(2023修订) | 第224条 | 公司减资的一般程序 |\n| 《公司法》(2023修订) | 第225条 | 简易减资（弥补亏损） |\n| 《公司法》(2023修订) | 第226条 | 违法减资的法律责任 |\n| 《公司法》(2023修订) | 第47条 | 有限责任公司五年出资期限 |\n| 《民法典》 | 第67条 | 法人合并分立的权利义务承继（类推适用） |\n| 最高法院公司法解释(三) | 第13条 | 股东未出资的责任 |\n\n### 二、减资的类型\n\n#### （一）实质减资与形式减资\n\n| 类型 | 定义 | 特点 |\n|-----|------|------|\n| 实质减资 | 公司向股东返还部分出资或免除股东的出资义务 | 公司资产实际减少，偿债能力降低 |\n| 形式减资 | 公司仅减少注册资本数额，不向股东返还出资 | 通常用于弥补亏损，公司资产不变 |\n\n#### （二）等比减资与不等比减资\n\n| 类型 | 定义 | 特点 |\n|-----|------|------|\n| 等比减资 | 按照各股东的出资比例减少注册资本 | 不改变股权结构 |\n| 不等比减资 | 仅部分股东减资或不按比例减资 | 改变股权结构，需全体股东一致同意或章程另有规定 |\n\n### 三、减资程序\n\n#### （一）一般减资程序（第224条）\n\n1. **董事会拟定减资方案**\n2. **股东会作出减资决议**（有限责任公司经代表三分之二以上表决权的股东通过）\n3. **编制资产负债表及财产清单**\n4. **通知债权人并公告**（自作出减资决议之日起十日内通知债权人，并于三十日内在报纸上或者国家企业信用信息公示系统公告）\n5. **债权人异议处理**（债权人自接到通知之日起三十日内，未接到通知的自公告之日起四十五日内，有权要求公司清偿债务或者提供相应的担保）\n6. **办理变更登记**\n\n#### （二）简易减资程序（第225条）\n\n适用条件：\n- 公司依照《公司法》第214条第二款的规定弥补亏损后，仍有亏损的\n- 可以减少注册资本弥补亏损\n\n简易减资的特殊规则：\n- **不需要通知债权人**\n- 不得向股东分配\n- 不得免除股东缴纳出资或者股款的义务\n- 在法定公积金和任意公积金累计额达到公司注册资本50%前，不得分配利润\n\n### 四、裁判规则\n\n| 序号 | 争议焦点 | 裁判规则 | 依据 |\n|-----|---------|---------|------|\n| 1 | 未通知债权人的减资效力 | 公司减资未依法通知已知债权人的，减资不得对抗该债权人，股东应在减资范围内对公司债务承担补充赔偿责任 | 《公司法》第224、226条 |\n| 2 | 违法减资的股东责任 | 股东在公司违法减资中取得的财产，应当退还公司；造成公司损失的，股东及负有责任的董事、监事、高级管理人员应当承担赔偿责任 | 《公司法》第226条 |\n| 3 | 不等比减资的决议效力 | 不等比减资改变了公司的股权结构，实质上相当于部分股东向其他股东转让股权，需经全体股东一致同意或章程另有规定 | 参照股权对价原则 |\n| 4 | 债权人有权要求提前清偿 | 债权人在法定期限内要求公司清偿债务或者提供相应担保的，公司应当满足 | 《公司法》第224条 |\n| 5 | 减资程序瑕疵的补正 | 减资程序存在瑕疵但已完成变更登记的，利害关系人可请求确认减资无效或要求赔偿损失 | 参照公司决议瑕疵制度 |\n| 6 | 认缴制下减资的特殊问题 | 股东认缴但未实缴的出资，可通过减资免除股东的出资义务，但该减资仍需履行法定程序 | 参照第224条 |\n| 7 | 简易减资后利润分配限制 | 简易减资后，在法定公积金和任意公积金累计额达到公司注册资本50%前，不得分配利润 | 《公司法》第225条 |\n\n### 五、实务要点\n\n**1. 减资方案的设计**\n- 明确减资的目的和方式\n- 确定减资的金额和比例\n- 设计股东权益调整方案\n- 评估对债权人和公司经营的影响\n\n**2. 债权人保护程序的合规**\n- 逐一通知已知债权人，保留送达凭证\n- 在报纸或国家企业信用信息公示系统公告\n- 及时处理"},{"id":"公司合并分立","title":"公司合并分立","excerpt":"--- tags: [民法, 公司法, 公司合并, 公司分立, 组织变更] created: 2026-05-28 updated: 2026-05-28 status: reviewed type: knowledge --- 公司合并与分立是公司组织形式变更的重要方式，属于公司的重大结构性调整。公司合并是指两个或两个以上的公司依照法定程序归并为一个公司的法律行为，包括吸收合并和新设合并。公司分","slug":"公司合并分立","module":"04-公司与商事","moduleName":"04-公司与商事","tags":["民法","公司法","公司合并","公司分立","组织变更"],"wordCount":2671,"created":"2026-05-28","updated":"2026-05-28","content":"# 公司合并分立\n\n## 概述\n\n公司合并与分立是公司组织形式变更的重要方式，属于公司的重大结构性调整。公司合并是指两个或两个以上的公司依照法定程序归并为一个公司的法律行为，包括吸收合并和新设合并。公司分立是指一个公司依照法定程序分设为两个或两个以上公司的法律行为，包括派生分立和新设分立。合并分立涉及公司法人资格的变更、债权债务的承继、股东权益的保护等核心问题。\n\n## 核心内容\n\n### 一、法律依据\n\n| 法律法规 | 条文 | 内容要点 |\n|---------|------|---------|\n| 《公司法》(2023修订) | 第218条 | 公司合并的方式 |\n| 《公司法》(2023修订) | 第219条 | 公司合并的程序 |\n| 《公司法》(2023修订) | 第220条 | 合并各方债权债务的承继 |\n| 《公司法》(2023修订) | 第221条 | 公司分立的程序 |\n| 《公司法》(2023修订) | 第222条 | 分立后债务的承担 |\n| 《公司法》(2023修订) | 第223条 | 合并分立中异议股东的回购请求权 |\n| 《民法典》 | 第67条 | 法人合并分立后的权利义务承继 |\n| 《民法典》 | 第68条 | 法人终止的原因 |\n\n### 二、公司合并\n\n#### （一）合并方式\n\n| 合并类型 | 定义 | 法律效果 |\n|---------|------|---------|\n| 吸收合并 | 一个公司吸收其他公司，被吸收的公司解散（A+B=A） | 存续公司承继解散公司的全部权利义务 |\n| 新设合并 | 两个以上公司合并设立一个新的公司，合并各方解散（A+B=C） | 新设公司承继各方的全部权利义务 |\n\n#### （二）合并程序\n\n根据《公司法》第219条：\n1. **董事会拟定合并方案**\n2. **股东会作出合并决议**（有限责任公司经代表三分之二以上表决权的股东通过；股份有限公司经出席会议的股东所持表决权的三分之二以上通过）\n3. **编制资产负债表及财产清单**\n4. **通知债权人并公告**（自作出合并决议之日起十日内通知债权人，并于三十日内在报纸上或者国家企业信用信息公示系统公告）\n5. **债权人异议处理**（债权人自接到通知之日起三十日内，未接到通知的自公告之日起四十五日内，可以要求公司清偿债务或者提供相应的担保）\n6. **签订合并协议**\n7. **办理变更登记或注销登记**\n\n#### （三）债权债务承继\n\n根据《公司法》第220条：\n- 合并各方的债权、债务，由合并后存续的公司或者新设的公司承继\n- 该承继为法定承继，无需取得债权人同意\n- 但债权人有权要求清偿或提供担保\n\n### 三、公司分立\n\n#### （一）分立方式\n\n| 分立类型 | 定义 | 法律效果 |\n|---------|------|---------|\n| 派生分立 | 一个公司以其部分资产另设一个或数个新的公司，原公司继续存在（A=A+B） | 原公司与新设公司对分立前债务承担连带责任（除非另有约定） |\n| 新设分立 | 一个公司将其全部资产分别归入两个以上新设公司，原公司解散（A=B+C） | 新设公司对分立前债务承担连带责任（除非另有约定） |\n\n#### （二）分立程序\n\n根据《公司法》第221条：\n1. **董事会拟定分立方案**\n2. **股东会作出分立决议**（同合并决议的表决比例）\n3. **编制资产负债表及财产清单**\n4. **通知债权人并公告**（程序同合并）\n5. **签订分立协议**\n6. **办理变更登记或设立登记**\n\n#### （三）债务承担\n\n根据《公司法》第222条：\n- 公司分立前的债务由分立后的公司承担**连带责任**\n- 但是，公司在分立前与债权人就债务清偿达成的书面协议另有约定的除外\n- 注意：与合并不同，分立后的债务承担原则上为连带责任\n\n### 四、裁判规则\n\n| 序号 | 争议焦点 | 裁判规则 | 依据 |\n|-----|---------|---------|------|\n| 1 | 合并决议的效力 | 公司合并决议经代表三分之二以上表决权的股东通过即为有效，未达到法定比例的决议可撤销或无效 | 《公司法》第219条 |\n| 2 | 未通知债权人的合并效力 | 公司合并未依法通知已知债权人的，该合并不得对抗该债权人，债权人仍可要求合并后的公司承担清偿责任 | 《公司法》第220条 |\n| 3 | 分立后的连带责任 | 公司分立后，分立前的债务由分立后的公司承担连带责任；公司之间关于债务分担的约定不得对抗债权人 | 《公司法》第222条 |\n| 4 | 异议股东的回购请求权 | 对公司合并、分立决议投反对票的股东，可以请求公"},{"id":"公司清算","title":"公司清算","excerpt":"--- tags: [民法, 公司法, 公司清算, 清算义务人, 注销登记] created: 2026-05-28 updated: 2026-05-28 status: reviewed type: knowledge --- 公司清算是指公司解散后，依照法定程序清理公司债权债务，分配剩余财产，最终消灭公司法人资格的法律程序。清算是公司退出市场的必经程序，也是保护债权人利益的重要制度。2023","slug":"公司清算","module":"04-公司与商事","moduleName":"04-公司与商事","tags":["民法","公司法","公司清算","清算义务人","注销登记"],"wordCount":2795,"created":"2026-05-28","updated":"2026-05-28","content":"# 公司清算\n\n## 概述\n\n公司清算是指公司解散后，依照法定程序清理公司债权债务，分配剩余财产，最终消灭公司法人资格的法律程序。清算是公司退出市场的必经程序，也是保护债权人利益的重要制度。2023年新《公司法》明确了清算义务人的范围和责任，强化了董事的清算义务。\n\n## 核心内容\n\n### 一、法律依据\n\n| 法律法规 | 条文 | 内容要点 |\n|---------|------|---------|\n| 《公司法》(2023修订) | 第231条 | 清算义务人的确定 |\n| 《公司法》(2023修订) | 第232条 | 清算组的组成 |\n| 《公司法》(2023修订) | 第233条 | 清算组的职权 |\n| 《公司法》(2023修订) | 第234条 | 清算程序 |\n| 《公司法》(2023修订) | 第235条 | 清算中的债权人保护 |\n| 《公司法》(2023修订) | 第236条 | 清算方案的确认 |\n| 《公司法》(2023修订) | 第237条 | 清算结束后的注销 |\n| 《公司法》(2023修订) | 第238条 | 清算义务人的责任 |\n| 最高法院公司法解释(二) | 第7-23条 | 清算的细化规定 |\n| 《民法典》 | 第70条 | 法人清算义务人 |\n\n### 二、清算的类型\n\n| 类型 | 适用情形 | 主要特点 |\n|-----|---------|---------|\n| 自行清算 | 公司解散后自行组织清算 | 由清算义务人组成清算组 |\n| 强制清算 | 逾期不成立清算组或清算组故意拖延 | 由人民法院指定清算组 |\n| 破产清算 | 公司资不抵债 | 适用《企业破产法》 |\n\n### 三、清算义务人与清算组\n\n#### （一）清算义务人\n\n根据《公司法》第231条和《民法典》第70条：\n- **有限责任公司**：全体股东\n- **股份有限公司**：董事或者股东大会确定的人员\n\n清算义务人的法定义务：\n1. 在解散事由出现之日起十五日内成立清算组\n2. 开始清算\n3. 逾期不成立清算组的，债权人可以申请人民法院指定有关人员组成清算组\n\n#### （二）清算组的组成\n\n根据《公司法》第232条：\n- **有限责任公司**：由股东组成\n- **股份有限公司**：由董事或者股东大会确定的人员组成\n- **人民法院指定**：由人民法院指定的有关人员组成\n\n#### （三）清算组的职权\n\n根据《公司法》第233条：\n1. 清理公司财产，分别编制资产负债表和财产清单\n2. 通知、公告债权人\n3. 处理与清算有关的公司未了结的业务\n4. 清缴所欠税款以及清算过程中产生的税款\n5. 清理债权、债务\n6. 分配公司清偿债务后的剩余财产\n7. 代表公司参与民事诉讼活动\n\n### 四、清算程序\n\n#### （一）通知与公告\n\n根据《公司法》第235条：\n- 清算组应当自成立之日起十日内通知债权人\n- 并于六十日内在报纸上或者国家企业信用信息公示系统公告\n- 债权人应当自接到通知之日起三十日内，未接到通知的自公告之日起四十五日内，向清算组申报债权\n\n#### （二）债权申报与确认\n\n- 债权人申报债权时，应当说明债权的有关事项，并提供证明材料\n- 清算组应当对债权进行登记\n- 在申报债权期间，清算组不得对债权人进行清偿\n\n#### （三）财产分配顺序\n\n根据《公司法》第236条，公司财产在分别支付清算费用、职工的工资、社会保险费用和法定补偿金，缴纳所欠税款，清偿公司债务后的剩余财产：\n- **有限责任公司**：按照股东的出资比例分配\n- **股份有限公司**：按照股东持有的股份比例分配\n\n#### （四）清算方案的确认\n\n- 清算组制定清算方案\n- 报股东会或者人民法院确认\n- 清算方案未经确认不得执行\n\n### 五、裁判规则\n\n| 序号 | 争议焦点 | 裁判规则 | 依据 |\n|-----|---------|---------|------|\n| 1 | 清算义务人的责任 | 清算义务人未在法定期限内成立清算组开始清算，导致公司财产贬值、流失、毁损或者灭失的，应当在造成损失范围内对公司债务承担赔偿责任 | 《公司法》第238条 |\n| 2 | 怠于清算的连带责任 | 有限责任公司的股东、股份有限公司的董事和控股股东因怠于履行义务，导致公司主要财产、账册、重要文件等灭失，无法进行清算的，应当对公司债务承担连带责任 | 公司法解释(二)第18条第2款 |\n| 3 | 清算组成员的责任 | 清算组成员因故意或者重大过失给公司或者债权人造成损失的，应当承担赔偿责任 | 公司法解释(二)第11条 |\n| 4 | 未经清算注销的责任 | 公司未经清算即办理注销登记，导致公司无法进行清算的，股东应当对公司"},{"id":"公司解散","title":"公司解散","excerpt":"--- tags: [民法, 公司法, 公司解散, 司法解散, 公司僵局] created: 2026-05-28 updated: 2026-05-28 status: reviewed type: knowledge --- 公司解散是指已成立的公司基于一定的法律事由而停止经营活动，开始处理未了结事务，并最终导致公司法人资格消灭的法律程序。公司解散分为自愿解散、行政强制解散和司法解散三种类型。","slug":"公司解散","module":"04-公司与商事","moduleName":"04-公司与商事","tags":["民法","公司法","公司解散","司法解散","公司僵局"],"wordCount":2675,"created":"2026-05-28","updated":"2026-05-28","content":"# 公司解散\n\n## 概述\n\n公司解散是指已成立的公司基于一定的法律事由而停止经营活动，开始处理未了结事务，并最终导致公司法人资格消灭的法律程序。公司解散分为自愿解散、行政强制解散和司法解散三种类型。其中，司法解散（又称判决解散）是解决公司僵局的最终手段，也是实务中争议最大的领域。\n\n## 核心内容\n\n### 一、法律依据\n\n| 法律法规 | 条文 | 内容要点 |\n|---------|------|---------|\n| 《公司法》(2023修订) | 第228条 | 公司解散的原因 |\n| 《公司法》(2023修订) | 第229条 | 自愿解散的情形 |\n| 《公司法》(2023修订) | 第230条 | 司法解散的条件 |\n| 《公司法》(2023修订) | 第231条 | 解散后的清算义务 |\n| 最高法院公司法解释(二) | 第1-6条 | 司法解散的细化规定 |\n| 《民法典》 | 第68条 | 法人终止的原因 |\n| 《民法典》 | 第69条 | 法人解散的情形 |\n\n### 二、解散的类型\n\n#### （一）自愿解散\n\n根据《公司法》第229条：\n1. **公司章程规定的营业期限届满或者公司章程规定的其他解散事由出现**\n2. **股东会决议解散**（有限责任公司经代表三分之二以上表决权的股东通过）\n3. **因公司合并或者分立需要解散**\n\n#### （二）行政强制解散\n\n- **被吊销营业执照**：公司违反行政法规，被行政机关吊销营业执照\n- **被责令关闭**：公司违反法律法规，被行政机关责令关闭\n- **被撤销**：公司设立登记被撤销\n\n#### （三）司法解散\n\n根据《公司法》第230条，公司经营管理发生严重困难，继续存续会使股东利益受到重大损失，通过其他途径不能解决的，持有公司百分之十以上表决权的股东，可以请求人民法院解散公司。\n\n### 三、司法解散的构成要件\n\n#### （一）主体要件\n\n- **原告**：持有公司10%以上表决权的股东（单独或合计）\n- **被告**：公司\n- **第三人**：其他股东（公司法解释(二)第4条）\n\n#### （二）实质要件\n\n根据《公司法》第230条和公司法解释(二)第1条，\"公司经营管理发生严重困难\"包括：\n\n| 情形 | 具体表现 | 举证要点 |\n|-----|---------|---------|\n| 股东会僵局 | 公司持续两年以上无法召开股东会 | 证明最后一次股东会召开时间 |\n| 表决僵局 | 股东表决时无法达到法定或者公司章程规定的比例，持续两年以上不能做出有效的股东会或者股东大会决议 | 证明表决未达法定比例的情况 |\n| 董事会僵局 | 公司董事长期冲突，且无法通过股东会解决 | 证明董事之间的冲突及无法协调 |\n| 经营严重困难 | 公司的经营管理发生其他严重困难，公司继续存续会使股东利益受到重大损失 | 证明公司经营困难及股东利益受损 |\n\n#### （三）前置条件\n\n- **\"通过其他途径不能解决\"**：股东应先尝试协商、股权转让、公司回购等其他救济方式\n- 公司法解释(二)第5条：人民法院审理解散公司诉讼案件，应当注重调解\n\n### 四、裁判规则\n\n| 序号 | 争议焦点 | 裁判规则 | 依据 |\n|-----|---------|---------|------|\n| 1 | \"经营管理严重困难\"的理解 | 公司经营管理严重困难是指公司权力运行发生严重困难，即公司僵局，而非指公司资金缺乏、亏损严重等经营性困难 | 公司法解释(二)第1条 |\n| 2 | 股东会僵局的认定 | 公司持续两年以上无法召开股东会或无法形成有效决议的，可以认定为经营管理发生严重困难 | 公司法解释(二)第1条第1款 |\n| 3 | 10%表决权的计算 | 持有公司全部股东表决权百分之十以上的股东，可以请求解散公司。该比例可以是单独持有，也可以是合计持有 | 《公司法》第230条 |\n| 4 | \"其他途径\"的审查 | 人民法院应当审查原告股东是否已尝试其他救济途径，包括协商、调解、股权转让、公司回购等 | 公司法解释(二)第5条 |\n| 5 | 调解优先原则 | 人民法院审理解散公司诉讼，应当注重调解。当事人协商同意由公司或者股东收购股份，或者以减资等方式使公司存续的，人民法院应予支持 | 公司法解释(二)第5条 |\n| 6 | 解散与清算的衔接 | 判决解散公司后，公司应当在十五日内成立清算组进行清算。逾期不成立清算组的，利害关系人可以申请人民法院指定清算组 | 《公司法》第231条 |\n| 7 | 恶意诉讼的防范 | 股东以知情权、利润分配请求权等权益受到损害为由提起解散公司诉讼的，人民法院不予受理 | 公司法解释(二)第1条第2款 |\n\n#"},{"id":"破产债权","title":"破产债权","excerpt":"--- tags: [民法, 公司法, 破产法, 破产债权, 债权申报, 别除权, 抵销权] created: 2026-05-28 updated: 2026-05-28 status: reviewed type: knowledge --- 破产债权是破产程序的核心内容，涉及债权申报、审查确认、分类排序以及特殊权利（别除权、抵销权）的行使。破产债权的准确认定直接决定各债权人的受偿比例和破产财","slug":"破产债权","module":"04-公司与商事","moduleName":"04-公司与商事","tags":["民法","公司法","破产法","破产债权","债权申报","别除权","抵销权"],"wordCount":2745,"created":"2026-05-28","updated":"2026-05-28","content":"# 破产债权\n\n## 一、概述\n\n破产债权是破产程序的核心内容，涉及债权申报、审查确认、分类排序以及特殊权利（别除权、抵销权）的行使。破产债权的准确认定直接决定各债权人的受偿比例和破产财产的分配方案。《企业破产法》第44-59条对破产债权的申报、确认和清偿作了系统规定，结合破产费用与共益债务的优先支付规则，构成完整的破产债权清偿体系。\n\n## 二、法律依据\n\n| 条文 | 内容 | 要点 |\n|------|------|------|\n| 《企业破产法》第44条 | 法院受理破产申请时对债务人享有债权的债权人依照本法规定的程序行使权利 | 破产债权行使的基本规则 |\n| 《企业破产法》第45条 | 人民法院受理破产申请后，应当确定债权人申报债权的期限，自人民法院发布受理破产申请公告之日起计算，最短不得少于三十日，最长不得超过三个月 | 申报期限 |\n| 《企业破产法》第46条 | 未到期的债权在破产申请受理时视为到期；附利息的债权自破产申请受理时起停止计息 | 未到期债权与利息债权处理 |\n| 《企业破产法》第49条 | 债权人申报债权时，应当书面说明债权的数额和有无财产担保，并提交有关证据 | 申报要求 |\n| 《企业破产法》第56条 | 在人民法院确定的债权申报期限内，债权人未申报债权的，可以在破产财产最后分配前补充申报 | 补充申报规则 |\n| 《企业破产法》第58条 | 依照本法第57条规定编制的债权表，应当提交第一次债权人会议核查 | 债权审查确认 |\n| 《企业破产法》第59条 | 债权尚未确定的债权人可以行使表决权，但人民法院能够为其行使表决权而临时确定债权额 | 未决债权的表决权 |\n\n## 三、核心规则\n\n### （一）债权申报\n\n| 项目 | 规则 | 实务要点 |\n|------|------|----------|\n| 申报期限 | 法院确定，不少于30日、不超过3个月 | 关注公告中的具体期限 |\n| 申报方式 | 书面申报，说明债权数额和有无财产担保 | 附证据材料 |\n| 补充申报 | 可在最后分配前补充申报，但已进行的分配不再补充分配 | 补充申报人承担审查费用 |\n| 逾期后果 | 未申报不影响实体权利，但丧失破产程序中的受偿机会 | 最后分配前仍可补充 |\n\n### （二）债权确认\n\n**确认程序**：管理人编制债权表 → 提交第一次债权人会议核查 → 债务人和债权人对债权表无异议的由法院裁定确认；有异议的可提起债权确认之诉。\n\n**异议之诉**：对债权表记载的债权有异议的，可以向受理破产申请的法院提起诉讼。诉讼期间，被异议债权的表决权由法院临时确定。\n\n### （三）债权分类与清偿顺序\n\n| 顺序 | 债权类型 | 法律依据 |\n|------|----------|----------|\n| 第一顺序 | 对债务人特定财产享有担保权的债权（别除权） | 第109条 |\n| 第二顺序 | 破产费用和共益债务 | 第41、42条 |\n| 第三顺序 | 职工债权（工资、医疗、伤残补助、抚恤费用，应划入职工个人账户的社保费用，经济补偿金） | 第113条第1款第(一)项 |\n| 第四顺序 | 欠缴的除前项规定以外的社会保险费用和所欠税款 | 第113条第1款第(二)项 |\n| 第五顺序 | 普通破产债权 | 第113条第1款第(三)项 |\n\n### （四）别除权\n\n别除权是指对债务人的特定财产享有担保物权的债权人，可以不依破产程序就该特定财产优先受偿的权利。其特征：(1) 以担保物权为基础；(2) 针对债务人特定财产行使；(3) 优先于其他债权受偿。行使别除权后未获清偿的债权作为普通债权参加分配。\n\n### （五）抵销权\n\n债权人在破产申请受理前对债务人负有债务的，可以向管理人主张抵销。但有下列情形之一的不得抵销：(1) 债务人的债务人在破产申请受理后取得他人对债务人的债权的；(2) 债权人已知债务人有不能清偿到期债务或者破产申请的事实，对债务人负担债务的（但因法律规定或者有破产申请一年前所发生的原因而负担债务的除外）；(3) 债务人的债务人已知债务人有不能清偿到期债务或者破产申请的事实，对债务人取得债权的（但因法律规定或者有破产申请一年前所发生的原因而取得债权的除外）。\n\n### （六）破产费用与共益债务\n\n| 类型 | 范围 | 清偿规则 |\n|------|------|----------|\n| 破产费用 | 诉讼费用、管理人执行职务费用和报酬、债务人财产管理变价分配费用 | 随时清偿；不足时按比例清偿 |\n| 共益债务 | 因管理人或债务人请求对方当事人履行双方均未履行完毕的合同产生的债务；债务人财产受无因管理产生的债务；因债务人不当得利产生的债务；为债务人继续营业应支付的劳动报酬和"},{"id":"破产和解","title":"破产和解","excerpt":"--- tags: [民法, 公司法, 破产法, 破产和解, 和解协议, 和解失败] created: 2026-05-28 updated: 2026-05-28 status: reviewed type: knowledge --- 破产和解是债务人与债权人通过协商达成和解协议、以避免破产清算的法律制度。和解制度体现了当事人意思自治原则在破产程序中的适用，是介于重整与清算之间的中间程序。《企","slug":"破产和解","module":"04-公司与商事","moduleName":"04-公司与商事","tags":["民法","公司法","破产法","破产和解","和解协议","和解失败"],"wordCount":2491,"created":"2026-05-28","updated":"2026-05-28","content":"# 破产和解\n\n## 一、概述\n\n破产和解是债务人与债权人通过协商达成和解协议、以避免破产清算的法律制度。和解制度体现了当事人意思自治原则在破产程序中的适用，是介于重整与清算之间的中间程序。《企业破产法》第95-106条对和解制度作了规定。实务中破产和解程序适用相对较少，但在特定情形下（如债务人有一定清偿能力但不足以全额清偿、各方愿意妥协）具有独特价值。\n\n## 二、法律依据\n\n| 条文 | 内容 | 要点 |\n|------|------|------|\n| 《企业破产法》第95条 | 债务人可以直接向人民法院申请和解，也可以在人民法院受理破产申请后、宣告破产前提出和解申请 | 和解申请权 |\n| 《企业破产法》第96条 | 人民法院经审查认为和解申请符合本法规定的，应当裁定和解，予以公告，并召集债权人会议讨论和解协议草案 | 和解受理 |\n| 《企业破产法》第97条 | 债权人会议通过和解协议的决议，由出席会议的有表决权的债权人过半数同意，并且其所代表的债权额占无财产担保债权总额的三分之二以上 | 表决通过标准 |\n| 《企业破产法》第98条 | 债权人会议通过和解协议的，由人民法院裁定认可，终止和解程序，并予以公告 | 和解认可 |\n| 《企业破产法》第99条 | 和解协议草案经债权人会议表决未获得通过的，法院应裁定终止和解程序并宣告债务人破产 | 和解失败 |\n| 《企业破产法》第103条 | 因债务人的欺诈或者其他违法行为而成立的和解协议，人民法院应当裁定无效，并宣告债务人破产 | 和解协议无效 |\n| 《企业破产法》第104条 | 债务人不能执行或者不执行和解协议的，经和解债权人请求，法院应裁定终止和解协议的执行并宣告债务人破产 | 和解执行失败 |\n\n## 三、核心规则\n\n### （一）和解申请\n\n| 申请主体 | 申请时点 | 程序特点 |\n|----------|----------|----------|\n| 债务人 | 直接申请或受理后、宣告破产前 | 唯一有权申请主体 |\n| 债权人 | 不得申请和解 | 区别于重整，债权人无和解申请权 |\n\n**和解的前置条件**：债务人应提交和解协议草案。和解协议草案应包含债务清偿方案、清偿比例、清偿期限等核心内容。\n\n### （二）和解协议\n\n和解协议的核心内容包括：\n\n1. **债务清偿方案**：各类债权的清偿比例和方式\n2. **清偿期限**：一次性清偿或分期清偿的具体安排\n3. **担保措施**：和解协议履行的担保安排\n4. **和解失败的后果**：约定和解失败后的处理方式\n\n**表决规则**：和解协议的表决不分组，由出席会议的有表决权的债权人整体表决。通过标准为\"双过半\"——人数过半且债权额占无财产担保债权总额的三分之二以上。\n\n### （三）和解协议的效力\n\n| 效力范围 | 具体规则 |\n|----------|----------|\n| 对全体债权人的约束力 | 经法院认可的和解协议对全体和解债权人均有约束力，包括反对和解的债权人 |\n| 对债务人的约束力 | 债务人应按和解协议履行，不得个别清偿 |\n| 对保证人和连带债务人的效力 | 和解协议不影响债权人对保证人、连带债务人享有的权利 |\n| 未申报债权的处理 | 和解协议执行期间不得行使权利；和解协议执行完毕后按和解条件受偿 |\n\n### （四）和解失败与转破产清算\n\n和解失败的两种情形：\n\n1. **表决阶段失败**：和解协议草案经债权人会议表决未获通过，法院应裁定终止和解程序并宣告破产。\n2. **执行阶段失败**：债务人不能执行或不执行和解协议，经和解债权人请求，法院应裁定终止和解协议执行并宣告破产。\n\n**和解协议无效**：因债务人欺诈或其他违法行为成立的和解协议，法院应裁定无效并宣告破产。和解债权人因执行和解协议所受的清偿，在其他债权人所受清偿同等比例的范围内不予返还。\n\n## 四、裁判规则\n\n| 裁判要旨 | 案例来源 |\n|----------|----------|\n| 和解协议的表决权仅限于无财产担保的债权人，有财产担保的债权人不参与和解协议的表决 | 最高院裁判观点 |\n| 债务人在和解申请中隐瞒重大财产的，构成欺诈，法院应裁定和解协议无效 | 法院通行做法 |\n| 和解协议执行完毕后，未受清偿的债权不再清偿，债务人恢复清偿能力 | 最高院裁判观点 |\n\n## 五、典型案例\n\n### 案例：某高新技术公司破产和解案\n\n**案号/入库编号**：最高人民法院2022年发布人民法院助力中小微企业发展典型案例\n\n**审理法院**：南京破产法庭（南京市中级人民法院）\n\n**基本案情**：某高新技术公司主营会展业务，因新冠肺炎疫情影响展会延期举行，公司经营陷入困境，明显缺乏清偿能力。20"},{"id":"破产清算","title":"破产清算","excerpt":"--- tags: [民法, 公司法, 破产法, 破产清算, 清偿顺序, 撤销权, 追回权] created: 2026-05-28 updated: 2026-05-28 status: reviewed type: knowledge --- 破产清算是破产程序的最终形态，是将债务人全部财产进行变价后按法定顺序分配给债权人的程序。破产清算制度的公平价值在于确保同类债权获得平等清偿，通过撤销权、","slug":"破产清算","module":"04-公司与商事","moduleName":"04-公司与商事","tags":["民法","公司法","破产法","破产清算","清偿顺序","撤销权","追回权"],"wordCount":2971,"created":"2026-05-28","updated":"2026-05-28","content":"# 破产清算\n\n## 一、概述\n\n破产清算是破产程序的最终形态，是将债务人全部财产进行变价后按法定顺序分配给债权人的程序。破产清算制度的公平价值在于确保同类债权获得平等清偿，通过撤销权、追回权等制度防止债务人财产的不当减少。《企业破产法》第107-124条对破产清算程序作了系统规定，涵盖宣告破产、财产变价、清偿分配、追回权、撤销权、注销登记和清算责任等核心环节。\n\n## 二、法律依据\n\n| 条文 | 内容 | 要点 |\n|------|------|------|\n| 《企业破产法》第107条 | 法院宣告债务人破产的，应自裁定作出之日起五日内送达债务人和管理人，十日内通知已知债权人并公告 | 宣告破产 |\n| 《企业破产法》第111条 | 管理人应及时拟订破产财产变价方案，提交债权人会议讨论 | 变价方案 |\n| 《企业破产法》第113条 | 破产财产在优先清偿破产费用和共益债务后按职工债权→税收债权→普通债权的顺序清偿 | 清偿顺序 |\n| 《企业破产法》第116条 | 破产财产分配方案经债权人会议通过后，由管理人执行 | 分配方案执行 |\n| 《企业破产法》第31条 | 法院受理破产申请前一年内，涉及无偿转让、以明显不合理价格交易、对无财产担保债务提供财产担保、对未到期债务提前清偿、放弃债权等行为，管理人有权请求法院予以撤销 | 可撤销行为 |\n| 《企业破产法》第32条 | 法院受理破产申请前六个月内，债务人具备破产原因仍对个别债权人进行清偿的，管理人有权请求法院予以撤销（个别清偿使债务人财产受益的除外） | 个别清偿撤销 |\n| 《企业破产法》第33条 | 涉及为逃避债务而隐匿转移财产、虚构债务或承认不真实债务的行为无效 | 无效行为 |\n| 《企业破产法》第34条 | 因本法第31、32、33条规定的行为而取得的债务人财产，管理人有权追回 | 追回权 |\n| 《企业破产法》第35条 | 法院受理破产申请后，出资人尚未缴纳的出资应缴纳，不受出资期限的限制 | 出资加速到期 |\n| 《企业破产法》第121条 | 管理人应自破产程序终结之日起十日内，持法院终结破产程序的裁定，向破产人的原登记机关办理注销登记 | 注销登记 |\n| 《企业破产法》第124条 | 破产人的保证人和连带债务人，在破产程序终结后对债权人未受清偿的债权依法继续承担清偿责任 | 保证人责任存续 |\n\n## 三、核心规则\n\n### （一）宣告破产\n\n法院经审查认为债务人符合破产原因且不具有重整或和解可能的，应裁定宣告债务人破产。宣告破产的法律效果：(1) 债务人丧失对其财产的管理处分权；(2) 未到期债务视为到期；(3) 附利息债权停止计息；(4) 进入财产变价和分配阶段。\n\n### （二）财产变价\n\n| 变价方式 | 规则 | 适用情形 |\n|----------|------|----------|\n| 拍卖 | 优先采用，公开竞价 | 主要变价方式，确保公平 |\n| 变卖 | 债权人会议决议可采用其他方式 | 特殊资产不宜拍卖时 |\n| 协议转让 | 经债权人会议同意 | 特殊情况下采用 |\n\n**变价方案**：管理人拟订变价方案，提交债权人会议讨论。变价应以实现财产价值最大化为原则。\n\n### （三）清偿顺序\n\n| 顺序 | 债权类型 | 清偿规则 |\n|------|----------|----------|\n| 第一顺序 | 破产费用和共益债务 | 随时清偿，不足时按比例 |\n| 第二顺序 | 职工债权（工资、医疗、伤残补助、抚恤费用、应划入职工个人账户的社保费用、经济补偿金） | 全额清偿，不足时按比例 |\n| 第三顺序 | 欠缴的除职工社保以外的社会保险费用和所欠税款 | 在前一顺序清偿完毕后清偿 |\n| 第四顺序 | 普通破产债权 | 在前三顺序清偿完毕后清偿，不足时按比例 |\n\n**特别注意**：对债务人特定财产享有担保权的债权（别除权）就该特定财产优先受偿，不参与上述分配顺序。\n\n### （四）撤销权与追回权\n\n**可撤销行为（受理前一年内）**：(1) 无偿转让财产；(2) 以明显不合理的价格进行交易；(3) 对没有财产担保的债务提供财产担保；(4) 对未到期的债务提前清偿；(5) 放弃债权。\n\n**可撤销行为（受理前六个月内）**：债务人已具备破产原因仍对个别债权人进行清偿，但个别清偿使债务人财产受益的除外。\n\n**无效行为**：为逃避债务而隐匿转移财产或虚构债务、承认不真实债务的，自始无效，无时间限制。\n\n**追回权**：管理人有权追回因上述行为而流失的债务人财产。\n\n### （五）出资加速到期\n\n法院受理破产申请后，债务人的出资人尚未完全履行出资义务的，管理人应要求该出资人缴纳所认缴的出资，不受出资期限的限制。这是破产法"},{"id":"破产申请","title":"破产申请","excerpt":"--- tags: [民法, 公司法, 破产法, 破产申请, 破产原因, 执转破] created: 2026-05-28 updated: 2026-05-28 status: reviewed type: knowledge --- 破产申请是破产程序的启动环节，涉及破产原因的认定、申请主体资格、管辖法院确定及受理效力等核心问题。我国《企业破产法》采取申请主义原则，法院不得依职权启动破产程序。","slug":"破产申请","module":"04-公司与商事","moduleName":"04-公司与商事","tags":["民法","公司法","破产法","破产申请","破产原因","执转破"],"wordCount":2107,"created":"2026-05-28","updated":"2026-05-28","content":"# 破产申请\n\n## 一、概述\n\n破产申请是破产程序的启动环节，涉及破产原因的认定、申请主体资格、管辖法院确定及受理效力等核心问题。我国《企业破产法》采取申请主义原则，法院不得依职权启动破产程序。破产申请的审查是实务中争议最为集中的环节之一，尤其在破产原因认定、\"执转破\"衔接等方面存在大量实务难点。\n\n## 二、法律依据\n\n| 条文 | 内容 | 要点 |\n|------|------|------|\n| 《企业破产法》第2条 | 企业法人不能清偿到期债务，并且资产不足以清偿全部债务或者明显缺乏清偿能力的，依照本法规定清理债务 | 破产原因的二元标准 |\n| 《企业破产法》第7条 | 债务人、债权人、清算责任人可提出破产申请 | 申请主体三类 |\n| 《企业破产法》第8条 | 破产申请应当提交破产申请书和有关证据 | 申请材料要求 |\n| 《企业破产法》第10条 | 法院应当自收到申请之日起十五日内裁定是否受理 | 受理审查期限 |\n| 《破产法司法解释一》第1-4条 | 对\"不能清偿\"\"资不抵债\"\"明显缺乏清偿能力\"的具体认定标准 | 破产原因细化 |\n\n## 三、核心规则\n\n### （一）破产原因\n\n| 类型 | 构成要件 | 适用情形 |\n|------|----------|----------|\n| 不能清偿+资不抵债 | 到期债务未清偿 + 资产不足以清偿全部债务 | 债务人主动申请的主要标准 |\n| 不能清偿+明显缺乏清偿能力 | 到期债务未清偿 + 存在法定缺乏清偿能力情形 | 债权人申请的主要标准 |\n\n**\"不能清偿\"要件**：(1) 债权债务关系依法成立；(2) 债务履行期限已届满；(3) 债务人未完全清偿。\n\n**\"明显缺乏清偿能力\"法定情形**：资金严重不足或财产不能变现；法定代表人下落不明且无其他人员管理财产；经法院强制执行无法清偿；长期亏损且经营扭亏困难。\n\n### （二）申请主体\n\n| 主体 | 法律依据 | 特别要求 |\n|------|----------|----------|\n| 债务人 | 第7条第1款 | 提交财产状况说明、债务清册、债权清册、财务会计报告等 |\n| 债权人 | 第7条第2款 | 证明债权存在且已到期、债务人不能清偿 |\n| 清算义务人 | 第7条第3款 | 解散后未清算或资不抵债时负有申请义务 |\n\n### （三）管辖与受理效力\n\n- **地域管辖**：债务人住所地法院\n- **级别管辖**：按登记机关级别和资产规模确定\n- **受理效力**：(1) 对债务人财产的个别执行中止；(2) 有关债务人的民事诉讼中止；(3) 债务人的债务人或财产持有人应向管理人清偿或交付\n\n### （四）执转破制度\n\n执行案件移送破产审查须同时满足：(1) 被执行人为企业法人；(2) 被执行人或其任一申请执行人书面同意；(3) 被执行人不能清偿到期债务且资产不足以清偿全部债务或明显缺乏清偿能力。移送由执行法院决定，受移送法院应依法审查。\n\n## 四、裁判规则\n\n| 裁判要旨 | 案例来源 |\n|----------|----------|\n| 债权人申请破产时，仅需证明债务人不能清偿到期债务，债务人对资不抵债或明显缺乏清偿能力负有举证责任 | 最高院指导性裁判 |\n| 执行法院在被执行人财产不足以清偿全部债务时，应征询申请执行人或被执行人是否同意移送破产审查 | 《最高法关于执行案件移送破产审查若干问题的指导意见》 |\n| 清算义务人在公司解散后未依法清算导致资产贬损的，债权人有权申请破产清算 | 最高院(2019)最高法民申1619号 |\n\n## 五、典型案例\n\n### 案例：松晖实业（深圳）有限公司执行转破产清算案\n\n**案号/入库编号**：最高人民法院2018年全国法院审理破产典型案例\n\n**审理法院**：广东省深圳市中级人民法院\n\n**基本案情**：松晖实业（深圳）有限公司成立于2002年，主要经营工程塑料、塑胶模具等业务。2015年5月因经营不善、资金链断裂被迫停业，引发1384宗案件进入强制执行程序。执行法院查明公司财产仅余银行存款3483.13元和机器设备拍卖款162万元，459名员工债权因查封顺序在后受偿无望。2017年2月宝安法院征得申请执行人同意后将案件移送破产审查，深圳中院裁定受理。\n\n**裁判要旨**：被执行人为企业法人且不能清偿到期债务、资产不足以清偿全部债务的，经申请执行人或被执行人同意，执行法院应将案件移送破产审查，通过破产程序统一清理债权债务关系。\n\n**实务要点**：\n1. 执行转破产审查是化解执行积案的有效途径，需要征得申请执行人或被执行人同意\n2. 职工债权在破产程序中享有优先清偿地位，即使财产严重不足也应优先保障\n3. 执转破制度实现了执行程序与破"},{"id":"破产管理人","title":"破产管理人","excerpt":"--- tags: [民法, 公司法, 破产法, 破产管理人, 管理人报酬, 管理人职责] created: 2026-05-28 updated: 2026-05-28 status: reviewed type: knowledge --- 破产管理人是破产程序中最重要的机构之一，负责接管债务人财产、管理和处分债务人事务。管理人制度贯穿破产程序始终，其选任、职责、报酬和监督直接影响破产程序的公","slug":"破产管理人","module":"04-公司与商事","moduleName":"04-公司与商事","tags":["民法","公司法","破产法","破产管理人","管理人报酬","管理人职责"],"wordCount":2235,"created":"2026-05-28","updated":"2026-05-28","content":"# 破产管理人\n\n## 一、概述\n\n破产管理人是破产程序中最重要的机构之一，负责接管债务人财产、管理和处分债务人事务。管理人制度贯穿破产程序始终，其选任、职责、报酬和监督直接影响破产程序的公正与效率。我国《企业破产法》第22-28条对管理人制度作了系统规定，最高院配套司法解释进一步细化了操作规则。\n\n## 二、法律依据\n\n| 条文 | 内容 | 要点 |\n|------|------|------|\n| 《企业破产法》第22条 | 管理人由人民法院指定；债权人会议可以申请更换 | 选任与更换机制 |\n| 《企业破产法》第23条 | 管理人依照本法执行职务，向人民法院报告工作，并接受债权人会议和债权人委员会的监督 | 职务定位与监督 |\n| 《企业破产法》第24条 | 管理人可以由有关部门、机构的人员组成的清算组或者依法设立的律师事务所、会计师事务所、破产清算事务所等社会中介机构担任 | 任职资格 |\n| 《企业破产法》第25条 | 列举管理人九项职责 | 职责范围 |\n| 《企业破产法》第26条 | 在第一次债权人会议召开之前，管理人决定继续或者停止债务人的营业或者有第69条规定行为之一的，应当经人民法院许可 | 特别许可事项 |\n| 《企业破产法》第28条 | 管理人的报酬由人民法院确定；债权人会议对管理人报酬有异议的，有权向人民法院提出 | 报酬确定 |\n\n## 三、核心规则\n\n### （一）管理人选任\n\n| 选任方式 | 适用情形 | 特点 |\n|----------|----------|------|\n| 法院指定 | 破产受理时由法院从管理人名册中指定 | 主要方式，效率高 |\n| 债权人会议申请更换 | 管理人不能胜任或有违法行为 | 债权人自治体现 |\n| 清算组担任 | 政策性破产、金融机构破产等特殊情况 | 行政色彩较强 |\n\n**中介机构担任管理人**：律师事务所、会计师事务所、破产清算事务所以及上述机构组成的联合体，均可被指定为管理人。个人担任管理人限于事实清楚、债权债务关系简单的小型破产案件。\n\n### （二）管理人职责\n\n根据第25条，管理人职责包括：(1) 接管债务人的财产、印章和账簿、文书等资料；(2) 调查债务人财产状况，制作财产状况报告；(3) 决定债务人的内部管理事务；(4) 决定债务人的日常开支和其他必要开支；(5) 在第一次债权人会议召开之前，决定继续或者停止债务人的营业；(6) 管理和处分债务人的财产；(7) 代表债务人参加诉讼、仲裁或者其他法律程序；(8) 提议召开债权人会议；(9) 人民法院认为管理人应当履行的其他职责。\n\n### （三）管理人报酬\n\n| 确定方式 | 具体规则 |\n|----------|----------|\n| 法院确定 | 依据债务人最终清偿的财产价值总额，按比例计算 |\n| 报酬标准 | 最高院《关于确定企业破产案件管理人报酬的规定》采用分段递减比例 |\n| 异议程序 | 债权人会议对报酬有异议可向法院提出，法院应自收到异议之日起十五日内作出决定 |\n| 报酬优先 | 管理人报酬属于破产费用，优先于其他破产费用受偿 |\n\n### （四）管理人义务\n\n- **忠实义务**：不得利用职务便利为自己或他人谋取利益\n- **勤勉义务**：应当勤勉尽责，忠实执行职务\n- **报告义务**：向法院报告工作，接受债权人会议监督\n- **赔偿责任**：管理人未勤勉尽责造成损失的，应依法承担赔偿责任\n\n## 四、裁判规则\n\n| 裁判要旨 | 案例来源 |\n|----------|----------|\n| 管理人在处分债务人重大财产前未依法报告债权人委员会，该处分行为并非当然无效，但管理人应承担相应赔偿责任 | 最高院裁判观点 |\n| 债权人会议申请更换管理人，法院应综合考虑管理人履职情况、更换必要性和时机等因素 | 各地法院通行做法 |\n| 管理人报酬异议程序不中止破产程序的进行 | 最高院司法解释规定 |\n\n## 五、典型案例\n\n### 案例：甲公司破产清算案（惩治逃废债典型案例）\n\n**案号/入库编号**：最高人民法院2025年发布惩治逃废债典型案例\n\n**审理法院**：审理法院未公开\n\n**基本案情**：甲公司由法定代表人王某持股90%、乙公司持股10%。甲公司因不能清偿到期债务被裁定破产清算并指定管理人。王某拖延移交财务资料，多次未经法院许可擅自离开住所地，拒不配合管理人工作。赵某（王某母亲）、伍某（王某前妻）及乙公司虚报债权3000余万元，乙公司还签订19年厂房租赁合同拒绝交接厂房。赵某利用监事身份从甲公司转出资金超1亿元。\n\n**裁判要旨**：管理人有权要求债务人法定代表人提交财务资料，对虚报债权不予确认，对恶意租赁合同有权解除，对被侵占的财产有权追回。拒不"},{"id":"破产重整","title":"破产重整","excerpt":"--- tags: [民法, 公司法, 破产法, 破产重整, 重整计划, 强制批准, 上市公司重整] created: 2026-05-28 updated: 2026-05-28 status: reviewed type: knowledge --- 破产重整是对具有挽救价值的困境企业实施拯救的法律制度，是我国《企业破产法》三大程序之一。重整制度通过在法院监督下的营业维持、债权调整和经营方案实","slug":"破产重整","module":"04-公司与商事","moduleName":"04-公司与商事","tags":["民法","公司法","破产法","破产重整","重整计划","强制批准","上市公司重整"],"wordCount":2566,"created":"2026-05-28","updated":"2026-05-28","content":"# 破产重整\n\n## 一、概述\n\n破产重整是对具有挽救价值的困境企业实施拯救的法律制度，是我国《企业破产法》三大程序之一。重整制度通过在法院监督下的营业维持、债权调整和经营方案实施，力求实现企业再生，兼顾债权人利益保护与社会经济秩序维护。《企业破产法》第70-94条对重整制度作了系统规定，涵盖重整申请、营业维持、重整计划的制定、表决、批准和执行等完整流程。\n\n## 二、法律依据\n\n| 条文 | 内容 | 要点 |\n|------|------|------|\n| 《企业破产法》第70条 | 债务人或者债权人可以依照本法规定，直接向法院申请对债务人进行重整；债权人申请破产清算的，在法院受理破产申请后、宣告债务人破产前，出资额占债务人注册资本十分之一以上的出资人可以申请重整 | 重整申请主体 |\n| 《企业破产法》第72条 | 自法院裁定债务人重整之日起至重整程序终止，为重整期间 | 重整期间界定 |\n| 《企业破产法》第73条 | 在重整期间，经债务人申请，法院批准，债务人可以在管理人的监督下自行管理财产和营业事务 | 自行管理模式 |\n| 《企业破产法》第75条 | 在重整期间，对债务人的特定财产享有的担保权暂停行使 | 担保权暂停 |\n| 《企业破产法》第79条 | 债务人或管理人应当自法院裁定债务人重整之日起六个月内提交重整计划草案，经申请可延长三个月 | 重整计划提交期限 |\n| 《企业破产法》第82条 | 分组对重整计划草案进行表决 | 表决分组 |\n| 《企业破产法》第86条 | 各表决组均通过重整计划草案的，重整计划即为通过 | 表决通过规则 |\n| 《企业破产法》第87条 | 部分表决组未通过的，债务人或管理人可申请法院强制批准 | 强制批准（强裁） |\n| 《企业破产法》第93条 | 债务人不能执行或者不执行重整计划的，经利害关系人请求，法院应裁定终止重整计划的执行并宣告债务人破产 | 重整失败后果 |\n\n## 三、核心规则\n\n### （一）重整申请与审查\n\n| 申请主体 | 申请条件 | 特殊规则 |\n|----------|----------|----------|\n| 债务人 | 具备破产原因或有明显丧失清偿能力可能 | 可直接申请重整 |\n| 债权人 | 债权到期未获清偿 | 可直接申请重整或从破产清算转换 |\n| 出资人 | 出资额占注册资本10%以上 | 仅限清算申请受理后、宣告破产前 |\n\n### （二）重整期间的营业\n\n**自行管理（DIP模式）**：债务人申请并经法院批准，可在管理人监督下自行管理。债务人自行管理的，已接管债务人财产和营业事务的管理人应当向债务人移交。\n\n**管理人管理**：管理人负责管理债务人财产和营业事务，可以聘任债务人的经营管理人员负责营业事务。\n\n**担保权暂停**：重整期间，对债务人特定财产的担保权暂停行使，但担保物有损坏或价值明显减少可能、足以危害担保权人权利的，担保权人可请求恢复行使。\n\n### （三）重整计划制定与表决\n\n**草案内容**：(1) 债务人的经营方案；(2) 债权分类；(3) 债权调整方案；(4) 债权受偿方案；(5) 重整计划的执行期限；(6) 重整计划执行的监督期限；(7) 有利于债务人重整的其他方案。\n\n**表决分组**：(1) 对债务人的特定财产享有担保权的债权；(2) 债务人所欠职工的工资和医疗、伤残补助、抚恤费用等；(3) 债务人所欠税款；(4) 普通债权。法院在必要时可设小额债权组和出资人组。\n\n**表决规则**：各表决组出席会议的同一表决组的债权人过半数同意重整计划草案，并且其所代表的债权额占该组债权总额的三分之二以上的，即为该组通过。\n\n### （四）强制批准（强裁）\n\n部分表决组未通过重整计划草案时，债务人或管理人可申请法院强制批准。法院批准条件（\"公平对待\"标准）：\n\n1. 按照重整计划草案，对债务人的特定财产享有担保权的债权就该特定财产将获得全额清偿，其因延期清偿所受的损失将得到公平补偿，并且其担保权未受到实质性损害\n2. 按照重整计划草案，职工债权和税款债权将获得全额清偿\n3. 普通债权所获得的清偿比例不低于其在重整计划草案被提请批准时依照破产清算程序所能获得的清偿比例\n4. 重整计划草案对出资人权益的调整公平、公正\n5. 重整计划草案公平对待同一表决组的成员\n\n## 四、裁判规则\n\n| 裁判要旨 | 案例来源 |\n|----------|----------|\n| 重整计划的强制批准应严格遵循法定条件，不得以效率牺牲公平 | 最高院裁判观点 |\n| 上市公司重整涉及证券监管审批的，重整计划应与行政审批程序有效衔接 | 最高院、证监会联合意见 |\n| 出资人组的表决可参照股东大会表决机制，采取出资人会议或网络投票方式 |"},{"id":"合同审查要点","title":"合同审查要点","excerpt":"--- tags: [民法, 企业风控, 合同风控, 合同审查] created: 2026-05-28 updated: 2026-05-28 status: reviewed type: knowledge --- 合同审查是企业法律风控的第一道防线。系统化的合同审查可有效识别法律风险、防范商业欺诈、确保交易目的实现。本文从主体审查、核心条款、附件管理、常见漏洞四个维度，梳理企业合同审查的关键","slug":"合同审查要点","module":"05-企业风控","moduleName":"05-企业风控","tags":["民法","企业风控","合同风控","合同审查"],"wordCount":968,"created":"2026-05-28","updated":"2026-05-28","content":"# 合同审查要点\n\n## 概述\n\n合同审查是企业法律风控的第一道防线。系统化的合同审查可有效识别法律风险、防范商业欺诈、确保交易目的实现。本文从主体审查、核心条款、附件管理、常见漏洞四个维度，梳理企业合同审查的关键要点，为法务人员提供可操作的审查清单。\n\n## 核心内容\n\n### 审查维度与风险点\n\n| 审查维度 | 风险点 | 风险等级 |\n|---------|--------|---------|\n| 主体资格 | 对方不具备签约资质或超越经营范围 | 高 |\n| 主体存续 | 对方已被吊销/注销或进入破产程序 | 高 |\n| 授权代表 | 签约人无授权或超越代理权限 | 高 |\n| 权利义务 | 关键义务约定不明或缺失 | 中 |\n| 违约责任 | 违约金过低缺乏约束力或过高被调整 | 中 |\n| 争议解决 | 管辖约定冲突或仲裁条款无效 | 中 |\n| 合同附件 | 附件缺失、与正文矛盾或未签章确认 | 低 |\n\n### 核心条款防控措施\n\n| 条款类型 | 防控措施 |\n|---------|---------|\n| 主体条款 | 核查营业执照副本原件，查询企业信用信息公示系统，确认签约代表授权文件 |\n| 标的条款 | 明确标的名称、规格、数量、质量标准，避免使用模糊表述 |\n| 价款条款 | 约定含税/不含税、支付方式、开票义务、逾期付款利息 |\n| 履行条款 | 约定具体履行时间、地点、方式，明确验收标准和流程 |\n| 违约责任 | 违约金控制在合同总额的20%-30%，约定具体违约情形 |\n| 争议解决 | 明确管辖法院或仲裁机构，避免同时约定仲裁和诉讼 |\n\n### 法律依据\n\n- 《民法典》第465条：依法成立的合同受法律保护\n- 《民法典》第490-491条：合同成立与生效\n- 《民法典》第502条：合同生效时间\n- 《民法典》第509-558条：合同履行规则\n- 《民法典》第577-594条：违约责任\n\n### 实务要点\n\n1. **建立合同模板库**：针对高频交易类型，建立标准化合同模板，减少审查遗漏\n2. **实行分级审查**：按合同金额和风险等级设定审查权限，小额合同简化流程\n3. **关注签约时间节点**：避免倒签合同，合同落款日期应与实际签署日期一致\n4. **留存签约过程证据**：保存邮件往来、会议纪要、谈判记录等协商过程证据\n5. **电子合同合规**：采用可靠电子签名，确保电子合同的法律效力\n\n## 典型案例\n\n> **案例参考**：参见[[指导案例-合同效力系列]]、[[常见合同风险条款]]中的典型案例。合同审查的核心在于事前预防，具体案例参见各相关知识点。\n\n## 参考来源\n\n- 《中华人民共和国民法典》合同编\n- 最高人民法院关于适用《民法典》合同编通则若干问题的解释\n- 《公司法》关于公司经营资格的相关规定\n\n## 相关主题\n\n- [[常见合同风险条款]]\n- [[合同谈判策略]]\n- [[印章管理]]\n- [[应收账款管理]]"},{"id":"合同谈判策略","title":"合同谈判策略","excerpt":"--- tags: [民法, 企业风控, 合同风控, 谈判策略] created: 2026-05-28 updated: 2026-05-28 status: reviewed type: knowledge --- 合同谈判是将商业意图转化为法律文本的关键环节。有效的谈判策略不仅能争取有利条款，更能建立稳定的商业合作关系。本文从谈判准备、底线设定、让步技巧、文本控制、签约流程五个方面，为企业法","slug":"合同谈判策略","module":"05-企业风控","moduleName":"05-企业风控","tags":["民法","企业风控","合同风控","谈判策略"],"wordCount":1061,"created":"2026-05-28","updated":"2026-05-28","content":"# 合同谈判策略\n\n## 概述\n\n合同谈判是将商业意图转化为法律文本的关键环节。有效的谈判策略不仅能争取有利条款，更能建立稳定的商业合作关系。本文从谈判准备、底线设定、让步技巧、文本控制、签约流程五个方面，为企业法务和商务人员提供系统化的谈判指导。\n\n## 核心内容\n\n### 谈判准备要素\n\n| 准备维度 | 具体内容 | 重要程度 |\n|---------|---------|---------|\n| 对方背景 | 经营状况、诉讼记录、行业口碑、谈判风格 | 高 |\n| 市场行情 | 行业惯例、价格区间、替代方案可得性 | 高 |\n| 法律环境 | 相关法规、监管要求、行业准入条件 | 中 |\n| 内部授权 | 审批权限、让步空间、审批流程 | 高 |\n| BATNA分析 | 最佳替代方案、谈判破裂的应对措施 | 中 |\n\n### 核心条款底线设定\n\n| 条款类型 | 底线原则 | 说明 |\n|---------|---------|------|\n| 价格条款 | 成本加合理利润 | 考虑资金成本、税费、履约风险的综合定价 |\n| 付款条件 | 预付比例不低于30% | 避免全额赊销，降低应收账款风险 |\n| 违约责任 | 违约金不低于合同总额15% | 过低约束力不足，过高可能被法院调减 |\n| 知识产权 | 明确归属和使用范围 | 职务成果、合作开发、委托开发的权属规则不同 |\n| 保密义务 | 期限不少于3年 | 覆盖合同履行期及终止后合理期间 |\n| 争议解决 | 争取己方所在地管辖 | 降低争议解决成本，增加谈判筹码 |\n\n### 让步策略\n\n| 策略 | 具体方法 | 适用场景 |\n|------|---------|---------|\n| 条件交换 | 每次让步要求对等回报 | 常规商务谈判 |\n| 分阶段让步 | 先让步幅度递减，显示底线逼近 | 双方均有诚意的谈判 |\n| 附加条件 | 让步附带前提条件 | 己方处于优势地位 |\n| 无权让步 | 表示需向上级请示 | 争取时间或试探对方底线 |\n| 虚设议题 | 设置可放弃的议题作为交换筹码 | 复杂谈判中争取核心利益 |\n\n### 法律依据\n\n- 《民法典》第119-123条：意思自治原则\n- 《民法典》第469条：合同形式\n- 《民法典》第490条：合同成立时间\n- 《民法典》第496条：格式条款提示义务\n\n### 实务要点\n\n1. **争取合同文本起草权**：起草方可以将对己方有利的条款嵌入合同框架，谈判中占据主动\n2. **控制谈判节奏**：避免在对方设定的期限内仓促决策，合理利用\"需要内部审批\"争取时间\n3. **书面确认会议纪要**：每次谈判后以邮件确认已达成的共识，避免后续反悔\n4. **分条款逐项确认**：避免打包讨论，逐条确认减少遗漏和误解\n5. **预留调整空间**：核心条款坚持底线，非核心条款适当灵活，保持谈判弹性\n\n## 典型案例\n\n> **实务提示**：合同谈判策略侧重于事前风险防范，具体合同条款的司法效力案例参见[[合同审查要点]]、[[常见合同风险条款]]及相关合同法知识点。\n\n## 参考来源\n\n- 《中华人民共和国民法典》合同编\n- 罗杰·费舍尔《谈判力》\n- 最高人民法院关于合同成立的裁判规则\n\n## 相关主题\n\n- [[合同审查要点]]\n- [[常见合同风险条款]]\n- [[印章管理]]"},{"id":"常见合同风险条款","title":"常见合同风险条款","excerpt":"--- tags: [民法, 企业风控, 合同风控, 风险条款] created: 2026-05-28 updated: 2026-05-28 status: reviewed type: knowledge --- 合同中的风险条款往往是纠纷产生的根源。识别并妥善应对这些条款，是企业合同管理的核心能力。本文聚焦六类常见风险条款，分析其法律后果并提供具体防控方案，帮助法务人员在合同审查中精准定位","slug":"常见合同风险条款","module":"05-企业风控","moduleName":"05-企业风控","tags":["民法","企业风控","合同风控","风险条款"],"wordCount":1077,"created":"2026-05-28","updated":"2026-05-28","content":"# 常见合同风险条款\n\n## 概述\n\n合同中的风险条款往往是纠纷产生的根源。识别并妥善应对这些条款，是企业合同管理的核心能力。本文聚焦六类常见风险条款，分析其法律后果并提供具体防控方案，帮助法务人员在合同审查中精准定位风险、有效规避争议。\n\n## 核心内容\n\n### 风险条款类型与识别\n\n| 风险条款 | 典型表述 | 潜在危害 | 风险等级 |\n|---------|---------|---------|---------|\n| 格式条款 | \"本合同最终解释权归甲方所有\" | 被认定无效或不利于提供方的解释 | 高 |\n| 免责条款 | \"因任何原因造成的损失概不负责\" | 人身损害免责条款无效 | 高 |\n| 违约金过高 | \"违约金为合同总额的50%\" | 法院酌情调低，实际获赔不足 | 中 |\n| 阴阳合同 | 签订两份价格不一致的合同 | 涉嫌逃税或合同欺诈 | 高 |\n| 口头变更 | \"口头承诺变更合同条款\" | 举证困难，争议金额难以确定 | 中 |\n| 送达条款 | \"按原地址送达即视为送达\" | 地址变更后通知不到，错过时效 | 中 |\n\n### 防控措施\n\n| 风险条款 | 防控建议 |\n|---------|---------|\n| 格式条款 | 提供方应采取合理方式提示对方注意免责条款；接收方应争取删除\"最终解释权\"等表述 |\n| 免责条款 | 审查是否存在免除人身损害责任的条款，该类条款依法无效 |\n| 违约金过高 | 将违约金控制在实际损失的130%以内；约定损失计算方法替代固定金额 |\n| 阴阳合同 | 坚持以备案合同为准，拒绝签署价格不一致的多份合同 |\n| 口头变更 | 合同中明确约定变更须以书面形式作出，口头变更不发生效力 |\n| 送达条款 | 多渠道约定送达方式（邮件、短信、微信），约定变更地址的通知义务 |\n\n### 法律依据\n\n- 《民法典》第496条：格式条款的定义及提示说明义务\n- 《民法典》第497条：格式条款无效的情形\n- 《民法典》第498条：格式条款的解释规则\n- 《民法典》第506条：免责条款无效的情形\n- 《民法典》第585条：违约金的调整规则\n\n### 实务要点\n\n1. **格式条款需双重保障**：提供方既要尽到提示说明义务，也要在条款表述上避免过于绝对的免责表述\n2. **违约金约定技巧**：建议约定\"违约金不足以弥补损失的，守约方有权就超出部分主张赔偿\"\n3. **阴阳合同的法律风险**：不仅是合同效力问题，还可能涉及逃税刑事责任\n4. **口头变更的举证困境**：即使口头变更实际发生，主张变更一方需承担举证责任\n5. **送达条款设计**：建议约定电子邮件送达的，以发送成功为送达；邮寄送达的，以签收为送达\n\n## 典型案例\n\n> **案例参考**：格式条款效力争议案例参见[[格式条款效力]]；违约金过高调整案例参见[[违约金调整]]。风险条款的司法认定标准已在各相关合同法知识点中详述。\n\n## 参考来源\n\n- 《中华人民共和国民法典》合同编\n- 最高人民法院关于适用《民法典》合同编通则若干问题的解释\n- 《消费者权益保护法》第26条\n\n## 相关主题\n\n- [[合同审查要点]]\n- [[合同谈判策略]]\n- [[关联交易合规]]"},{"id":"关联交易合规","title":"关联交易合规","excerpt":"--- tags: [民法, 企业风控, 公司治理, 关联交易] created: 2026-05-28 updated: 2026-05-28 status: reviewed type: knowledge --- 关联交易是企业经营中的常见现象，本身并不违法，但因存在利益冲突，极易演变为损害公司和中小股东利益的工具。本文从关联交易认定、信息披露、表决回避、公允价格、股东代表诉讼、利益输送六个","slug":"关联交易合规","module":"05-企业风控","moduleName":"05-企业风控","tags":["民法","企业风控","公司治理","关联交易"],"wordCount":1247,"created":"2026-05-28","updated":"2026-05-28","content":"# 关联交易合规\n\n## 概述\n\n关联交易是企业经营中的常见现象，本身并不违法，但因存在利益冲突，极易演变为损害公司和中小股东利益的工具。本文从关联交易认定、信息披露、表决回避、公允价格、股东代表诉讼、利益输送六个维度，系统解析关联交易的法律规制与合规要点。\n\n## 核心内容\n\n### 关联交易类型与认定\n\n| 关联关系类型 | 认定标准 | 典型场景 |\n|------------|---------|---------|\n| 控股股东/实际控制人 | 持股50%以上或实际支配公司行为 | 母子公司之间的交易 |\n| 董监高及其近亲属 | 在公司任职的董事、监事、高级管理人员 | 公司与董事配偶控制的企业交易 |\n| 关联法人 | 直接或间接控制的其他企业 | 同一控制下的兄弟公司交易 |\n| 关联自然人 | 持股5%以上的自然人股东 | 公司与大股东个人的交易 |\n\n### 合规措施\n\n| 风险环节 | 合规措施 |\n|---------|---------|\n| 关联交易识别 | 建立关联方清单，定期更新，交易前强制关联关系申报 |\n| 信息披露 | 上市公司依法披露，非上市公司向股东会报告 |\n| 表决回避 | 关联股东/关联董事在表决时回避，由非关联方表决 |\n| 价格公允 | 参照市场价格或独立第三方评估，保留定价依据 |\n| 审批程序 | 达到一定金额的关联交易提交股东会审议批准 |\n| 档案管理 | 留存关联交易的决策过程、定价依据、履行情况 |\n\n### 法律依据\n\n- 《公司法》第21条：关联交易损害赔偿责任\n- 《公司法》第182条：董事忠实义务\n- 《公司法》第124条：上市公司关联交易表决规则\n- 《民法典》第154条：恶意串通损害他人利益的民事法律行为无效\n- 《证券法》第80条：上市公司关联交易信息披露\n\n### 实务要点\n\n1. **关联交易的合法性边界**：关联交易合法的前提是程序合规（信息披露、表决回避）且实质公平（价格公允、不损害公司利益）\n2. **举证责任分配**：关联交易被质疑时，控股股东/实际控制人需证明交易的公平性，举证责任倒置\n3. **股东代表诉讼的前置程序**：股东提起代表诉讼前应先书面请求监事会/董事会起诉，被拒绝或30日内未起诉方可自行起诉\n4. **价格公允的判断标准**：参照同类交易的市场价格，必要时聘请独立第三方评估机构出具评估报告\n5. **利益输送的识别特征**：明显偏离市场价格、交易条件明显优于第三方、缺乏商业合理性\n\n## 典型案例\n\n### 案例：新《公司法》关联交易制度要点\n\n**法律依据**：《公司法》（2024年修订）第182条、第183条\n\n**制度要点**：\n1. 董事、监事、高级管理人员直接或者间接与本公司订立合同或者进行交易，应当就与订立合同或者进行交易有关的事项向董事会或者股东会报告，并经决议通过\n2. 关联董事在董事会审议关联交易时应当回避表决\n3. 违反关联交易规定所得的收入应当归公司所有\n\n**新法变化**（2024年7月1日起施行）：扩大了关联交易的主体范围，将控股股东、实际控制人纳入规制；明确了关联交易的程序要求和信息披露义务；强化了董事、高管违反关联交易义务的民事赔偿责任。\n\n**实务要点**：企业应建立关联交易审批制度，明确关联方的识别标准、交易审批流程、信息披露要求，防范关联交易风险。\n\n## 参考来源\n\n- 《中华人民共和国公司法》\n- 《中华人民共和国证券法》\n- 最高人民法院关于适用《公司法》若干问题的规定（五）\n\n## 相关主题\n\n- [[印章管理]]\n- [[竞业限制]]\n- [[商业秘密保护]]\n- [[担保风险]]"},{"id":"印章管理","title":"印章管理","excerpt":"--- tags: [民法, 企业风控, 公司治理, 印章管理] created: 2026-05-28 updated: 2026-05-28 status: reviewed type: knowledge --- 印章是企业意志的外在表征，在商事活动中具有公示公信效力。印章管理不善将导致表见代理、越权签约等法律风险，直接影响企业财产安全。本文系统梳理公章管理、合同专用章、法定代表人签字、表见","slug":"印章管理","module":"05-企业风控","moduleName":"05-企业风控","tags":["民法","企业风控","公司治理","印章管理"],"wordCount":1426,"created":"2026-05-28","updated":"2026-05-28","content":"# 印章管理\n\n## 概述\n\n印章是企业意志的外在表征，在商事活动中具有公示公信效力。印章管理不善将导致表见代理、越权签约等法律风险，直接影响企业财产安全。本文系统梳理公章管理、合同专用章、法定代表人签字、表见代理、印章挂失、电子签章六个核心问题，为企业建立印章风控体系提供指引。\n\n## 核心内容\n\n### 印章风险点与防控措施\n\n| 风险类型 | 风险描述 | 防控措施 |\n|---------|---------|---------|\n| 公章滥用 | 非授权人员擅自使用公章对外签约 | 建立用印审批制度，专人保管，用印登记 |\n| 合同章越权 | 合同专用章用于担保、借款等非合同事项 | 明确各类印章使用范围，超出范围需总经理审批 |\n| 法代签字失控 | 法定代表人签字效力等同公章 | 签字权与公章管理并行，重要文件需双重确认 |\n| 表见代理 | 离职人员持空白合同对外签约 | 离职时收回全部印章、空白合同、授权文件 |\n| 印章挂失风险 | 印章丢失后被他人冒用 | 第一时间登报声明作废并重新刻制备案 |\n| 电子签章风险 | 电子印章被盗用或私刻 | 采用经认证的CA证书，限制使用权限 |\n\n### 法律依据\n\n- 《民法典》第170条：职务代理\n- 《民法典》第171条：无权代理\n- 《民法典》第172条：表见代理\n- 《公司法》第11条：公司章程效力\n- 《国务院关于国家行政机关和企业事业单位社会团体印章管理的规定》\n- 《电子签名法》第13-14条：可靠电子签名的条件与效力\n\n### 实务要点\n\n1. **表见代理的核心认定标准**：相对人有理由相信行为人有代理权，关键在于\"合理信赖\"的判断。企业需证明已尽到合理注意义务\n2. **空白合同的致命风险**：一旦空白合同被填写内容，企业往往难以对抗善意第三人。严禁出具空白合同或空白授权委托书\n3. **印章与签字并行制度**：重要合同约定\"本合同经双方盖章并由法定代表人签字后生效\"，增加安全保障\n4. **用印登记全流程**：记录用印时间、文件名称、申请人、审批人、用印人，形成完整证据链\n5. **电子签章选型**：选择具有资质的电子认证服务机构，确保电子签名符合《电子签名法》第13条的可靠性要求\n\n## 典型案例\n\n### 案例：检例第77号——某投资公司诉甲公司、丙企业借款合同纠纷案（印章管理与公司人格否认）\n\n**案号**：最高人民检察院检例第77号（第二十一批指导性案例）\n\n**基本案情**：丙企业受让甲公司99.9%股权后，委托银行将1.48亿元借给甲公司。款项到位后，甲公司依照合同约定及原股东指令，先后向多家公司转账共计1.605亿元。债权人赵某新起诉要求甲公司还款，丙企业承担连带责任，主张丙企业滥用法人独立地位。\n\n**裁判要旨**：检察机关抗诉后，浙江高院再审认定：甲公司对外转款均有合理解释，现有证据不足以证明丙企业有滥用公司法人独立地位和股东有限责任逃避债务的行为。应严格区分企业正当融资担保与恶意转移资产逃避债务的界限。\n\n**与印章管理的关联**：本案中甲公司对外转款系依据合同约定及指令进行，涉及公司印章使用的合规性问题。企业应建立严格的印章审批和使用登记制度，避免因印章管理不善被认定为公司人格混同。印章的规范管理是证明公司独立运营的重要证据。本案最终认定丙企业不构成公司人格否认，其核心裁判规则（严格区分正当融资担保与恶意转移资产的界限）对理解公司人格否认的边界具有重要参考价值。\n\n> 📖 详见 [[⚖️ 民法实务知识库/06-案例库/03-专题案例/案例-公司人格否认]] 中关于公司人格否认认定标准的详细分析。\n\n> **查看原文**：[最高人民检察院检例第77号全文](https://www.spp.gov.cn/spp/xwfbh/wsfbh/202007/t20200728_474113.shtml)\n\n## 参考来源\n\n- 《中华人民共和国民法典》总则编\n- 《中华人民共和国公司法》\n- 《中华人民共和国电子签名法》\n- 最高人民法院关于表见代理的司法解释和裁判规则\n\n## 相关主题\n\n- [[合同审查要点]]\n- [[关联交易合规]]\n- [[担保风险]]"},{"id":"竞业限制","title":"竞业限制","excerpt":"--- tags: [民法, 企业风控, 公司治理, 竞业限制] created: 2026-05-28 updated: 2026-05-28 status: reviewed type: knowledge --- 竞业限制是企业保护商业秘密和核心竞争力的重要手段，但其适用受到严格限制。本文从竞业限制主体、经济补偿、期限、违约金、解除条件、与商业秘密保护的关系六个方面，全面解析竞业限制的法律规","slug":"竞业限制","module":"05-企业风控","moduleName":"05-企业风控","tags":["民法","企业风控","公司治理","竞业限制"],"wordCount":1244,"created":"2026-05-28","updated":"2026-05-28","content":"# 竞业限制\n\n## 概述\n\n竞业限制是企业保护商业秘密和核心竞争力的重要手段，但其适用受到严格限制。本文从竞业限制主体、经济补偿、期限、违约金、解除条件、与商业秘密保护的关系六个方面，全面解析竞业限制的法律规定与实务操作要点，帮助企业合法有效运用竞业限制制度。\n\n## 核心内容\n\n### 竞业限制核心要素\n\n| 要素 | 法律要求 | 风险提示 |\n|------|---------|---------|\n| 适用主体 | 高级管理人员、高级技术人员、其他负有保密义务的人员 | 对普通员工约定竞业限制可能被认定无效 |\n| 经济补偿 | 解除或终止劳动合同后按月支付，不低于离职前12个月平均工资的30% | 未支付补偿金的，劳动者可请求解除竞业限制约定 |\n| 限制期限 | 最长不得超过2年 | 超过2年的部分无效 |\n| 竞业范围 | 应明确具体行业、地域、业务类型 | 范围过宽可能被法院调减 |\n| 违约金 | 应与经济补偿金额相匹配 | 过高可能被法院酌减 |\n\n### 防控措施与合规要点\n\n| 风险场景 | 防控建议 |\n|---------|---------|\n| 主体范围不清 | 在劳动合同中明确约定竞业限制义务，区分核心人员和一般人员 |\n| 补偿金未支付 | 建立补偿金按月支付台账，确保及时足额支付 |\n| 竞业范围过宽 | 根据员工实际接触的商业秘密范围合理限定行业和地域 |\n| 违约举证困难 | 建立竞业限制监督机制，定期核查离职员工就业情况 |\n| 解除程序不当 | 解除竞业限制需提前3个月书面通知，并支付已履行期间的补偿金 |\n\n### 法律依据\n\n- 《劳动合同法》第23条：竞业限制约定\n- 《劳动合同法》第24条：竞业限制的范围、期限\n- 《最高人民法院关于审理劳动争议案件适用法律问题的解释（一）》第36-40条：竞业限制的司法适用\n- 《公司法》第148条：董事、高管的竞业禁止义务\n\n### 实务要点\n\n1. **竞业限制与竞业禁止的区别**：竞业限制基于劳动合同约定，需支付补偿金；竞业禁止基于《公司法》规定，适用于董事高管，无需支付补偿金\n2. **补偿金的最低标准**：月补偿金不低于劳动者离职前12个月平均工资的30%，且不低于当地最低工资标准\n3. **3个月未支付的法律后果**：用人单位3个月未支付经济补偿的，劳动者可请求解除竞业限制约定\n4. **违约金的合理性**：违约金应与补偿金总额相当，过高的违约金（如补偿金的5-10倍）可能被法院调减\n5. **在职期间的竞业禁止**：在职期间的竞业禁止义务是忠实义务的体现，无需另行约定和支付补偿\n\n## 典型案例\n\n### 案例：竞业限制经济补偿与解除规则\n\n**法律依据**：《最高人民法院关于审理劳动争议案件适用法律问题的解释（一）》第36-40条\n\n**核心规则**：\n1. 约定了竞业限制但未约定经济补偿的，劳动者履行义务后可要求按离职前12个月平均工资的30%按月支付\n2. 月平均工资的30%低于当地最低工资标准的，按最低工资标准支付\n3. 用人单位因自身原因导致三个月未支付经济补偿的，劳动者可请求解除竞业限制约定\n\n**实务要点**：竞业限制期限不得超过2年；人员限于高级管理人员、高级技术人员和其他负有保密义务的人员；企业应按月支付补偿，避免因未支付而丧失竞业限制权利。\n\n## 参考来源\n\n- 《中华人民共和国劳动合同法》\n- 最高人民法院关于审理劳动争议案件适用法律问题的解释（一）\n- 《中华人民共和国公司法》第148条\n\n## 相关主题\n\n- [[商业秘密保护]]\n- [[关联交易合规]]\n- [[印章管理]]"},{"id":"商业秘密保护","title":"商业秘密保护","excerpt":"--- tags: [民法, 企业风控, 经营风控, 商业秘密] created: 2026-05-28 updated: 2026-05-28 status: reviewed type: knowledge --- 商业秘密是企业核心竞争力的重要组成部分，涵盖技术秘密和经营秘密两大类。与专利权不同，商业秘密无需注册登记，但保护难度更大。本文从构成要件、保密措施、侵权认定、举证责任、损害赔偿、刑","slug":"商业秘密保护","module":"05-企业风控","moduleName":"05-企业风控","tags":["民法","企业风控","经营风控","商业秘密"],"wordCount":1515,"created":"2026-05-28","updated":"2026-05-28","content":"# 商业秘密保护\n\n## 概述\n\n商业秘密是企业核心竞争力的重要组成部分，涵盖技术秘密和经营秘密两大类。与专利权不同，商业秘密无需注册登记，但保护难度更大。本文从构成要件、保密措施、侵权认定、举证责任、损害赔偿、刑事保护六个维度，为企业构建商业秘密保护体系提供法律指引。\n\n## 核心内容\n\n### 商业秘密构成要件\n\n| 要件 | 认定标准 | 举证要点 |\n|------|---------|---------|\n| 秘密性 | 不为公众所知悉，不能从公开渠道直接获取 | 提供技术鉴定报告或检索报告 |\n| 价值性 | 具有商业价值，能为权利人带来竞争优势 | 证明信息与企业营收、利润的关联性 |\n| 保密性 | 权利人采取了合理的保密措施 | 提供保密制度、保密协议、权限管控记录 |\n\n### 保密措施体系\n\n| 保护层级 | 具体措施 | 适用对象 |\n|---------|---------|---------|\n| 制度层面 | 制定保密管理制度，明确密级分类和审批权限 | 全员适用 |\n| 协议层面 | 签订保密协议、竞业限制协议 | 核心人员 |\n| 物理层面 | 门禁系统、监控设备、涉密区域隔离 | 研发、财务等核心部门 |\n| 技术层面 | 数据加密、权限管控、操作日志审计 | 信息系统 |\n| 人员层面 | 入职背景调查、离职交接审计、离职后跟踪 | 涉密人员 |\n\n### 侵权认定与举证\n\n| 侵权类型 | 典型行为 | 举证重点 |\n|---------|---------|---------|\n| 非法获取 | 盗窃、利诱、胁迫、电子侵入 | 证明获取行为的存在 |\n| 非法披露 | 将商业秘密告知第三人或公开 | 证明披露范围和对象 |\n| 非法使用 | 将商业秘密用于生产经营 | 证明使用了相同或实质相同的信息 |\n| 违反约定 | 违反保密协议使用或披露 | 证明保密协议的存在和违约事实 |\n\n### 法律依据\n\n- 《反不正当竞争法》第9条：商业秘密的定义及侵权行为\n- 《民法典》第501条：缔约过程中的保密义务\n- 《刑法》第219条：侵犯商业秘密罪\n- 《最高人民法院关于审理侵犯商业秘密民事案件适用法律若干问题的规定》\n\n### 实务要点\n\n1. **保密措施的合理性标准**：法院会结合信息的商业价值、保密成本、行业惯例综合判断。过于简单的措施（如仅口头告知保密）可能不被认可\n2. **秘密点的确定**：诉讼中需明确商业秘密的具体内容和范围，秘密点过宽或过窄都影响保护效果\n3. **举证责任转移**：权利人初步证明已采取保密措施且有证据表明被控侵权人有接触可能后，举证责任转移至被控侵权人\n4. **损害赔偿计算**：优先按照权利人实际损失计算，其次为侵权人获利，再次为许可使用费的合理倍数\n5. **刑民交叉的处理**：侵犯商业秘密同时涉及民事赔偿和刑事追诉的，可并行推进，刑事判决可作为民事赔偿的参考\n\n## 典型案例\n\n### 案例：入库编号2025-07-2-474-001——殷某桢诉北京某智能科技公司等人格权侵权案（技术处理声音的权利保护）\n\n**案号**：入库编号2025-07-2-474-001 / （2023）京0491民初12142号\n\n**基本案情**：原告殷某桢系配音演员，曾接受某文化公司委托录制录音制品。某文化公司将录音数据提供给某软件公司，某软件公司以殷某桢的声音为素材，采用AI技术处理后生成文本转语音产品并对外出售。殷某桢发现其声音被AI化使用后诉至法院，主张声音权益受到侵害。\n\n**裁判要旨**：对于人工智能技术处理后的声音，一般社会公众或者一定范围内的公众根据音色、语调和发音风格，能够识别出特定自然人的，则该声音属于自然人声音权益的保护范围。未经自然人许可使用经人工智能技术处理的声音，构成对自然人声音权益的侵权。\n\n**与商业秘密保护的关联**：本案虽为人格权纠纷，但涉及AI技术处理中的权利保护问题。企业在使用AI技术处理他人声音、肖像等权益时，应注意取得授权。同时，企业自身的声音模型、算法等技术信息可作为商业秘密予以保护。企业在委托他人录制声音、采集数据时，应在合同中明确约定数据使用的范围和方式，防范未经授权的AI化使用风险。\n\n## 参考来源\n\n- 《中华人民共和国反不正当竞争法》\n- 《中华人民共和国刑法》第219条\n- 最高人民法院关于审理侵犯商业秘密民事案件适用法律若干问题的规定\n\n## 相关主题\n\n- [[竞业限制]]\n- [[合同审查要点]]\n- [[税务风险]]"},{"id":"应收账款管理","title":"应收账款管理","excerpt":"--- tags: [民法, 企业风控, 经营风控, 应收账款] created: 2026-05-28 updated: 2026-05-28 status: reviewed type: knowledge --- 应收账款是企业流动资产的重要组成部分，管理不善将导致现金流紧张甚至资金链断裂。本文从诉讼时效管理、催收策略、债权转让、应收账款质押、坏账处理五个方面，系统梳理应收账款全生命周期的法","slug":"应收账款管理","module":"05-企业风控","moduleName":"05-企业风控","tags":["民法","企业风控","经营风控","应收账款"],"wordCount":1214,"created":"2026-05-28","updated":"2026-05-28","content":"# 应收账款管理\n\n## 概述\n\n应收账款是企业流动资产的重要组成部分，管理不善将导致现金流紧张甚至资金链断裂。本文从诉讼时效管理、催收策略、债权转让、应收账款质押、坏账处理五个方面，系统梳理应收账款全生命周期的法律风控要点，帮助企业最大限度保障债权安全。\n\n## 核心内容\n\n### 应收账款风险点\n\n| 风险类型 | 风险描述 | 风险等级 |\n|---------|---------|---------|\n| 诉讼时效届满 | 超过3年未主张权利，丧失胜诉权 | 高 |\n| 债务人经营恶化 | 债务人资不抵债或进入破产程序 | 高 |\n| 债权凭证缺失 | 缺乏合同、验收单、对账单等证据 | 高 |\n| 催收方式不当 | 催收超过诉讼时效或催收方式违法 | 中 |\n| 质押登记瑕疵 | 应收账款质押未在中国人民银行征信中心登记 | 中 |\n\n### 催收策略\n\n| 催收阶段 | 时间节点 | 措施 |\n|---------|---------|------|\n| 友好催收 | 到期后1-30天 | 发送催款函，电话沟通，了解逾期原因 |\n| 正式催收 | 到期后31-90天 | 发送律师函，约定还款计划，取得书面确认 |\n| 强制催收 | 到期后90天以上 | 申请支付令或提起诉讼，申请财产保全 |\n| 破产申报 | 债务人进入破产程序 | 及时申报债权，参与债权人会议 |\n\n### 法律依据\n\n- 《民法典》第188条：诉讼时效3年\n- 《民法典》第195条：诉讼时效中断事由\n- 《民法典》第545-550条：债权转让\n- 《民法典》第440-446条：权利质权\n- 《民法典》第761-769条：保理合同\n- 《应收账款质押登记办法》\n\n### 实务要点\n\n1. **诉讼时效管理**：建立应收账款台账，按到期日排序，提前60天预警。诉讼时效届满前通过发送催款函（保留送达证据）、提起诉讼或仲裁、债务人确认债务等方式中断时效\n2. **催款函的送达**：采用EMS邮寄并保留回执，邮寄地址应为合同约定的送达地址。邮件内容应明确欠款金额、合同编号、要求还款的期限\n3. **债权转让的通知**：债权转让未经通知债务人的，对债务人不发生效力。通知应采用书面形式，保留送达证据\n4. **应收账款质押的登记**：在中国人民银行征信中心动产融资统一登记公示系统办理登记，未经登记不得对抗善意第三人\n5. **对账确认的重要性**：定期与债务人对账并取得书面确认，既是诉讼时效中断的事由，也是固定债权金额的证据\n\n## 典型案例\n\n### 案例：诉讼时效管理实务要点\n\n**核心规则**：普通诉讼时效3年，自权利人知道或应当知道权利受到损害以及义务人之日起计算（《民法典》第188条）。\n\n**时效中断事由**（《民法典》第195条）：\n1. 权利人向义务人提出履行请求（催告函、短信、微信等）\n2. 义务人同意履行义务（承认债务、部分履行、提供担保）\n3. 权利人提起诉讼或申请仲裁\n4. 与提起诉讼具有同等效力的其他情形（申请支付令、申报破产债权等）\n\n**企业应收账款管理要点**：\n- 建立应收账款账龄分析表，按账龄分类管理\n- 诉讼时效届满前6个月启动预警\n- 每2年至少发送一次书面催告函并保留送达证据\n- 定期与客户对账并签署对账单（对账单可构成时效中断）\n- 对重要催告行为进行公证保全\n\n详见[[诉讼时效制度]]。\n\n## 参考来源\n\n- 《中华人民共和国民法典》合同编\n- 《最高人民法院关于审理民事案件适用诉讼时效制度若干问题的规定》\n- 《应收账款质押登记办法》\n\n## 相关主题\n\n- [[合同审查要点]]\n- [[担保风险]]\n- [[税务风险]]"},{"id":"担保风险","title":"担保风险","excerpt":"--- tags: [民法, 企业风控, 经营风控, 担保] created: 2026-05-28 updated: 2026-05-28 status: reviewed type: knowledge --- 担保是企业融资和商业交易中的常见增信手段，但对外担保涉及复杂的决议程序和法律限制。本文从对外担保决议程序、越权担保、公司对外担保限额、反担保、担保追偿五个方面，解析企业担保的法律风险与","slug":"担保风险","module":"05-企业风控","moduleName":"05-企业风控","tags":["民法","企业风控","经营风控","担保"],"wordCount":1503,"created":"2026-05-28","updated":"2026-05-28","content":"# 担保风险\n\n## 概述\n\n担保是企业融资和商业交易中的常见增信手段，但对外担保涉及复杂的决议程序和法律限制。本文从对外担保决议程序、越权担保、公司对外担保限额、反担保、担保追偿五个方面，解析企业担保的法律风险与合规要点，帮助企业审慎决策、有效防控担保风险。\n\n## 核心内容\n\n### 担保风险类型\n\n| 风险类型 | 风险描述 | 风险等级 |\n|---------|---------|---------|\n| 越权担保 | 法定代表人未经股东会/董事会决议擅自对外担保 | 高 |\n| 担保限额突破 | 为他人担保总额超过公司章程规定的限额 | 高 |\n| 关联担保 | 为控股股东或实际控制人提供担保未履行特殊程序 | 高 |\n| 反担保缺失 | 对外担保后未要求被担保方提供反担保 | 中 |\n| 追偿不能 | 承担担保责任后无法向债务人追偿 | 中 |\n| 担保物瑕疵 | 抵押物/质押物存在权属争议或价值不足 | 中 |\n\n### 担保决议程序\n\n| 担保类型 | 决议机关 | 表决要求 |\n|---------|---------|---------|\n| 为股东或实际控制人担保 | 股东（大）会 | 受支配的股东回避，出席会议的其他股东所持表决权的过半数通过 |\n| 为他人担保 | 章程规定（董事会或股东会） | 按章程规定的表决程序执行 |\n| 上市公司对外担保 | 董事会或股东大会 | 按证监会和交易所规则执行 |\n\n### 防控措施\n\n| 风险场景 | 防控建议 |\n|---------|---------|\n| 对外担保审批 | 建立担保审批制度，明确审批权限和流程 |\n| 越权担保防范 | 合同中约定以对方提供有效决议为生效条件 |\n| 反担保要求 | 对外担保原则上应要求被担保方提供等值反担保 |\n| 担保台账管理 | 建立对外担保台账，实时监控担保总额和到期日 |\n| 追偿准备 | 保留追偿所需的全部合同、付款凭证、判决书等 |\n\n### 法律依据\n\n- 《公司法》第15条：公司对外担保的决议程序\n- 《公司法》第16条：为股东或实际控制人担保的特殊规定\n- 《民法典》第386-427条：担保物权\n- 《民法典》第681-702条：保证合同\n- 《最高人民法院关于适用〈民法典〉有关担保制度的解释》\n\n### 实务要点\n\n1. **越权担保的效力认定**：法定代表人越权担保，相对人善意的（不知且不应知超越权限），担保合同有效；相对人非善意的，担保合同对公司不发生效力\n2. **善意的判断标准**：相对人是否审查了公司决议文件。未审查的，一般推定为非善意；已审查且形式上无瑕疵的，推定为善意\n3. **上市公司担保的特殊要求**：上市公司对外担保需公告，未公告的担保可能被认定无效\n4. **保证方式的约定**：未约定保证方式的，按一般保证处理（《民法典》第686条变化）。建议明确约定连带责任保证\n5. **担保期间的约定**：保证期间早于或等于主债务履行期限的，视为未约定，保证期间为主债务履行期届满之日起6个月\n\n## 典型案例\n\n### 案例：入库编号2021-18-2-103-001——未办理抵押登记的担保责任\n\n**案号**：入库编号2021-18-2-103-001 / 最高人民法院（2019）最高法民再155号\n\n**基本案情**：中信银行股份有限公司东莞分行与陈志华等三人签订《最高额抵押合同》，约定以不动产为案涉债务提供担保。陈志华等三人尚未取得案涉房屋所占土地使用权证，因房地权属不一致，案涉房屋未能办理抵押登记，抵押权未依法设立。债权人起诉要求抵押人承担违约赔偿责任。\n\n**裁判要旨**：以不动产提供抵押担保，抵押人未依抵押合同约定办理抵押登记的，不影响抵押合同的效力。债权人依据抵押合同主张抵押人在抵押物的价值范围内承担违约赔偿责任的，人民法院应予支持。抵押权人对未能办理抵押登记有过错的，相应减轻抵押人的赔偿责任。\n\n**与担保风险的关联**：企业在接受不动产抵押担保时，应及时办理抵押登记，仅签订抵押合同而不办理登记，抵押权不设立。即使未办理登记，抵押合同仍然有效，可主张违约赔偿，但赔偿范围受限于抵押物价值，且自身有过错的会相应减轻对方责任。详见[[抵押权]]。\n\n## 参考来源\n\n- 《中华人民共和国公司法》\n- 《中华人民共和国民法典》担保部分\n- 最高人民法院关于适用《民法典》有关担保制度的解释\n\n## 相关主题\n\n- [[印章管理]]\n- [[关联交易合规]]\n- [[应收账款管理]]"},{"id":"税务风险","title":"税务风险","excerpt":"--- tags: [民法, 企业风控, 经营风控, 税务风险] created: 2026-05-28 updated: 2026-05-28 status: reviewed type: knowledge --- 税务风险贯穿企业经营全过程，从合同签订、发票开具到关联交易定价，每个环节都可能触发税务合规问题。本文从合同涉税条款、发票风险、关联交易定价、虚开发票、税务行政处罚、刑事风险六个方面","slug":"税务风险","module":"05-企业风控","moduleName":"05-企业风控","tags":["民法","企业风控","经营风控","税务风险"],"wordCount":1259,"created":"2026-05-28","updated":"2026-05-28","content":"# 税务风险\n\n## 概述\n\n税务风险贯穿企业经营全过程，从合同签订、发票开具到关联交易定价，每个环节都可能触发税务合规问题。本文从合同涉税条款、发票风险、关联交易定价、虚开发票、税务行政处罚、刑事风险六个方面，系统梳理企业常见税务风险及防控措施，为法务和财务人员提供实务指引。\n\n## 核心内容\n\n### 税务风险类型\n\n| 风险类型 | 风险描述 | 风险等级 |\n|---------|---------|---------|\n| 合同涉税条款缺失 | 未约定含税/不含税、发票类型、税率等 | 中 |\n| 发票开具不合规 | 品名与实际交易不符、税率适用错误 | 高 |\n| 虚开发票 | 无真实交易开具发票或金额不符 | 高 |\n| 关联交易定价不公允 | 转让定价不符合独立交易原则 | 高 |\n| 税务行政处罚 | 因税务违规被处以罚款、滞纳金 | 中 |\n| 涉税刑事风险 | 逃税、虚开增值税专用发票等 | 高 |\n\n### 合同涉税条款设计\n\n| 条款要素 | 建议约定 | 风险提示 |\n|---------|---------|---------|\n| 含税/不含税 | 明确约定价格是否含税 | 未约定时可能引发争议 |\n| 发票类型 | 约定增值税专用发票或普通发票 | 专票可抵扣进项税 |\n| 税率 | 约定适用税率及税率变动的处理 | 税率调整时的价格调整机制 |\n| 开票时间 | 约定发票开具的时间节点 | 影响纳税义务发生时间 |\n| 税务合规保证 | 约定对方保证税务合规的义务 | 发票不合规的违约责任 |\n\n### 防控措施\n\n| 风险环节 | 防控建议 |\n|---------|---------|\n| 合同签订 | 法务与财务联合审查涉税条款，明确发票义务 |\n| 发票管理 | 建立发票查验制度，取得发票后及时通过税务系统验证真伪 |\n| 关联交易定价 | 聘请税务顾问进行转让定价分析，准备同期资料 |\n| 税务自查 | 定期进行税务健康检查，及时发现并纠正税务风险 |\n| 税企沟通 | 重大交易事项提前与税务机关沟通，争取确定性 |\n\n### 法律依据\n\n- 《税收征收管理法》第63条：偷税的认定与处罚\n- 《增值税暂行条例》及相关实施细则\n- 《发票管理办法》第21-22条：发票开具规范\n- 《刑法》第201条：逃税罪\n- 《刑法》第205条：虚开增值税专用发票罪\n- 《企业所得税法》第41-48条：关联交易特别纳税调整\n\n### 实务要点\n\n1. **虚开发票的认定标准**：无真实交易开具发票、有真实交易但金额不符、让他人为自己虚开，均构成虚开。虚开增值税专用发票税款数额在5万元以上的即构成犯罪\n2. **关联交易的转让定价**：关联交易应符合独立交易原则，定价方法包括可比非受控价格法、再销售价格法、成本加成法等\n3. **税务行政处罚的救济**：对税务行政处罚不服的，可先申请行政复议，对复议决定不服的再提起行政诉讼\n4. **善意取得虚开发票的处理**：有真实交易且不知发票系虚开的，进项税额不得抵扣但可作为成本扣除\n5. **税务稽查的应对**：收到稽查通知后及时梳理业务资料，配合检查的同时注意保护合法权益，必要时聘请税务律师\n\n## 典型案例\n\n> **实务提示**：税务风险防控侧重于合规管理和事前预防，具体税务争议案例参见税务部门发布的典型案例。企业应建立健全税务合规制度，定期开展税务自查，防范虚开发票、偷逃税等法律风险。\n\n## 参考来源\n\n- 《中华人民共和国税收征收管理法》\n- 《中华人民共和国增值税暂行条例》\n- 《中华人民共和国企业所得税法》\n- 《中华人民共和国发票管理办法》\n\n## 相关主题\n\n- [[合同审查要点]]\n- [[关联交易合规]]\n- [[应收账款管理]]\n- [[商业秘密保护]]"},{"id":"指导案例-侵权责任系列","title":"指导案例-侵权责任系列","excerpt":"侵权责任法是保护民事主体合法权益的重要法律制度。本系列收录最高人民法院关于侵权责任认定的指导案例，涵盖产品责任、机动车交通事故责任、医疗损害责任、环境污染责任等常见侵权类型，为律师处理侵权纠纷提供裁判规则指引。 案号：（2009）宝民一（民）初字第1128号 / （2010）沪二中民一（民）终字第1353号（指导案例第19号） 来源：[最高人民法院指导案例](https://www.court.g","slug":"指导案例-侵权责任系列","module":"06-案例库","moduleName":"06-案例库","tags":["民法","案例","侵权责任","最高院指导案例"],"wordCount":4538,"created":"2026-05-28","updated":"2026-05-28","content":"# 最高院指导案例：侵权责任系列\n\n## 概述\n侵权责任法是保护民事主体合法权益的重要法律制度。本系列收录最高人民法院关于侵权责任认定的指导案例，涵盖产品责任、机动车交通事故责任、医疗损害责任、环境污染责任等常见侵权类型，为律师处理侵权纠纷提供裁判规则指引。\n\n## 案例列表\n\n### 案例一：赵春明等诉烟台市福山区汽车运输公司等机动车交通事故责任纠纷案\n\n**案号**：（2009）宝民一（民）初字第1128号 / （2010）沪二中民一（民）终字第1353号（指导案例第19号）\n\n**来源**：[最高人民法院指导案例](https://www.court.gov.cn/shenpan/xiangqing/6001.html)\n\n**裁判要旨**：机动车所有人或者管理人将机动车号牌出借他人套牌使用，或者明知他人套牌使用其机动车号牌不予制止，套牌机动车发生交通事故造成他人损害的，机动车所有人或者管理人应当与套牌机动车所有人或者管理人承担连带责任。\n\n**案情简介**：2008年11月，林则东驾驶套牌鲁F41703号货车在高速公路行驶时与周亚平驾驶的客车相撞，致客车内乘客冯永菊当场死亡。经交警认定，林则东负主要责任，周亚平负次要责任。鲁F41703号牌登记货车所有人系福山公司，实际所有人系卫德平。套牌肇事货车实际所有人为卫广辉（林则东的雇主）。\n\n卫广辉曾多次以损坏或灭失为由申请补领该号牌，福山公司知情并提供方便。死者家属赵春明等四人诉请赔偿。\n\n**裁判理由**：\n> [!tip] 法院生效裁判认为（最高人民法院指导案例第19号）\n> 根据本案交通事故责任认定，肇事货车司机林则东负事故主要责任，而卫广辉是肇事货车的实际所有人，也是林则东的雇主，故卫广辉和林则东应就本案事故损失连带承担主要赔偿责任。永安保险公司承保的鲁F41703货车并非实际肇事货车，其也不知道鲁F41703机动车号牌被肇事货车套牌，故永安保险公司对本案事故不承担赔偿责任。\n>\n> 鲁F41703货车的登记所有人福山公司和实际所有人卫德平，明知卫广辉等人套用自己的机动车号牌而不予阻止，且提供方便，纵容套牌货车在公路上行驶，福山公司与卫德平的行为已属于出借机动车号牌给他人使用的情形，该行为违反了《中华人民共和国道路交通安全法》等有关机动车管理的法律规定。\n>\n> 将机动车号牌出借他人套牌使用，将会纵容不符合安全技术标准的机动车通过套牌在道路上行驶，增加道路交通的危险性，危及公共安全。套牌机动车发生交通事故造成损害，号牌出借人同样存在过错，对于肇事的套牌车一方应负的赔偿责任，号牌出借人应当承担连带责任。故福山公司和卫德平应对卫广辉与林则东一方的赔偿责任份额承担连带责任。\n\n**实务要点**：\n\n1. 拼装车、报废车转让的连带责任系法定责任。\n2. 受害人可选择向任一转让人或受让人主张全部赔偿。\n3. 律师代理此类案件应查明车辆转让链条。\n\n**案例分析**：本案确立了报废车辆多次转让场景下全体转让人和受让人的连带责任规则，体现了侵权责任法对公共安全的优先保护。连带责任的设计使得受害人无需逐一追索各个转让环节，大幅降低了维权成本。\n\n在实务中，律师应注意该规则的适用前提——车辆须为\"拼装或已达报废标准\"，普通二手车多次转让后发生事故并不当然适用连带责任。本案与后续指导案例共同构成了机动车交通事故责任的完整裁判规则体系。\n\n---\n\n### 案例二：荣宝英诉王阳、永诚财产保险股份有限公司江阴支公司机动车交通事故责任纠纷案\n\n**案号**：（2012）锡滨民初字第1138号 / （2013）锡民终字第497号（指导案例第24号）\n\n**来源**：[最高人民法院指导案例](https://www.court.gov.cn/shenpan/xiangqing/13325.html)\n\n**裁判要旨**：交通事故的受害人没有过错的，其体质状况对损害后果的影响不属于可以减轻侵权人责任的法定情形。\n\n**案情简介**：2012年2月，王阳驾驶轿车在人行横道线碰擦行人荣宝英致其受伤。交警认定王阳负全部责任，荣宝英无责。荣宝英经鉴定构成九级、十级伤残，但鉴定意见载明\"损伤参与度评定为75%，其个人体质的因素占25%\"。\n\n保险公司据此主张残疾赔偿金应扣减25%。\n\n**裁判理由**：\n> [!tip] 法院生效裁判认为（最高人民法院指导案例第24号）\n> 《中华人民共和国侵权责任法》第二十六条规定：\"被侵权人对损害的发生也有过错的，可以减轻侵权人的责任。\"《中华人民共和国道路交通安全法》第七十六条第一款第（二）项规定，机动车与非机动车驾驶人、行人之间发生交通事故，非机动车驾驶人、行人没有过错的，由机动车一方承担赔偿责任；有证据证明非机动车驾驶人、行人有过错的，根据过错程度适当减轻机动车一"},{"id":"指导案例-公司治理系列","title":"指导案例-公司治理系列","excerpt":"公司治理是现代企业制度的核心。本系列收录最高人民法院关于公司治理争议的指导案例，涵盖股东资格确认、股东知情权、公司决议效力、关联交易等核心问题，为律师处理公司治理纠纷提供权威裁判规则。 案号：（2011）沪二中民四（商）终字第1262号 裁判要旨：实际出资人与名义股东之间关于股权归属的约定，如无《合同法》第五十二条规定的情形，应当认定有效。实际出资人有权请求确认其股东资格，但应经公司其他股东半数以","slug":"指导案例-公司治理系列","module":"06-案例库","moduleName":"06-案例库","tags":["民法","案例","公司治理","最高院指导案例"],"wordCount":4676,"created":"2026-05-28","updated":"2026-05-28","content":"# 最高院指导案例：公司治理系列\n\n## 概述\n公司治理是现代企业制度的核心。本系列收录最高人民法院关于公司治理争议的指导案例，涵盖股东资格确认、股东知情权、公司决议效力、关联交易等核心问题，为律师处理公司治理纠纷提供权威裁判规则。\n\n## 案例列表\n\n### 案例一：张建中诉杨照春股权确认纠纷案\n\n**案号**：（2011）沪二中民四（商）终字第1262号\n\n**裁判要旨**：实际出资人与名义股东之间关于股权归属的约定，如无《合同法》第五十二条规定的情形，应当认定有效。实际出资人有权请求确认其股东资格，但应经公司其他股东半数以上同意。\n\n**案情简介**：张建中与杨照春签订协议，约定由张建中实际出资，以杨照春名义持有某公司股权。\n\n后张建中要求确认其股东资格，杨照春及公司其他股东不予配合。\n\n**裁判理由**：\n> [!tip] 本院认为（基于公开裁判文书整理）\n> \"本院认为，实际出资人与名义股东之间的代持协议系双方真实意思表示，不违反法律、行政法规的强制性规定，应属有效。根据《最高人民法院关于适用〈中华人民共和国公司法〉若干问题的规定（三）》第二十四条第一款之规定，有限责任公司的实际出资人与名义出资人订立合同，约定由实际出资人出资并享有投资权益，以名义出资人为名义股东，实际出资人与名义股东对该合同效力发生争议的，如无合同法第五十二条规定的情形，人民法院应当认定该合同有效。\n>\n> 同时，该解释第二十四条第三款规定，实际出资人未经公司其他股东半数以上同意，请求公司变更股东、签发出资证明书、记载于股东名册、记载于公司章程并办理公司登记机关登记的，人民法院不予支持。本案中，公司其他股东对张建中的实际出资人身份知情且未表示反对，应视为同意。\n>\n> 股权代持虽系当事人意思自治范畴，但涉及公司人合性保护，实际出资人显名化须兼顾公司其他股东的信赖利益。\"\n\n**实务要点**：\n\n1. 股权代持协议原则上有效\n2. 实际出资人显名须经其他股东过半数同意\n3. 律师代理股权代持案件应注意收集其他股东知情的证据\n\n**案例分析**：本案确立了股权代持效力认定的基本规则，与案例二（股东知情权）和案例四（忠实义务）共同构成股东权利保护的完整链条。股权代持在实务中极为常见，尤其在规避行业准入限制、隐匿真实持股关系等场景下，本案明确代持协议本身不因规避行政监管而无效，为实际出资人提供了重要的救济路径。同时，\"其他股东半数以上同意\"的要件体现了有限责任公司人合性保护的法理基础，与《公司法》关于股权转让须经其他股东同意的规定一脉相承。\n\n律师在代理此类案件时，应注意区分代持协议的效力问题与股东资格确认问题，二者虽密切关联但适用不同的法律规则。\n\n---\n\n### 案例二：李淑君、吴湘、孙杰、王国兴诉江苏佳德置业发展有限公司股东知情权纠纷案\n\n**案号**：（2009）宿中民二终字第0251号\n\n**裁判要旨**：股东有权查阅、复制公司章程、股东会会议记录、董事会会议决议、监事会会议决议和财务会计报告。股东要求查阅公司会计账簿的，应当向公司提出书面请求，说明目的。\n\n**案情简介**：李淑君等四人系佳德公司股东，要求查阅公司财务会计报告、会计账簿等资料。\n\n公司以股东存在不正当目的为由拒绝提供查阅。\n\n**裁判理由**：\n> [!tip] 本院认为（基于公开裁判文书整理）\n> \"本院认为，股东知情权是股东依法享有的固有权利，是股东行使资产收益、参与重大决策和选择管理者等其他权利的基础和前提。根据《中华人民共和国公司法》第三十三条（2023年修订后为第五十七条）之规定，股东有权查阅、复制公司章程、股东会会议记录、董事会会议决议、监事会会议决议和财务会计报告，此系股东的法定权利，公司不得以任何理由予以限制或剥夺。\n>\n> 关于股东要求查阅公司会计账簿的问题，法律规定股东应当向公司提出书面请求并说明目的，公司有合理根据认为股东查阅会计账簿有不正当目的，可能损害公司合法利益的，可以拒绝提供查阅，但公司应当自股东提出书面请求之日起十五日内书面答复股东并说明理由。所谓'不正当目的'，应当由公司承担举证责任，公司仅以股东可能损害公司利益为由拒绝查阅，但未能提供充分证据证明股东查阅会计账簿存在不正当目的的，人民法院不予支持。\n>\n> 本案中，佳德公司未能举证证明李淑君等四人查阅会计账簿具有不正当目的，其拒绝查阅的行为缺乏事实和法律依据，依法应予纠正。\"\n\n**实务要点**：\n\n1. 股东知情权系固有权利，不得通过公司章程限制\n2. 公司拒绝股东查阅会计账簿应举证证明股东存在不正当目的\n3. 律师代理知情权案件应指导当事人规范行使权利\n\n**案例分析**：本案确立了股东知情权保护的基本规则，与案例一（股东资格确认）形成权利基础与权利行使的逻辑递进关系——只有确认股东资格"},{"id":"指导案例-合同效力系列","title":"指导案例-合同效力系列","excerpt":"合同效力认定是民商事审判的核心问题，直接关系到当事人的权利义务能否得到法律保护。本系列收录最高人民法院关于合同效力认定的指导案例及公报案例，涵盖以下关键法律问题：合同成立与生效的区分、效力性强制性规定的识别标准、流质契约与以物抵债的界限、非典型担保（让与担保）的效力认定、以及公司对外担保的效力判断。这些案例体现了最高院在合同效力认定上的裁判思路演变，对律师处理合同纠纷具有重要的参考价值。 案号：（","slug":"指导案例-合同效力系列","module":"06-案例库","moduleName":"06-案例库","tags":["民法","案例","合同效力","最高院指导案例"],"wordCount":5124,"created":"2026-05-28","updated":"2026-05-28","content":"# 最高院指导案例：合同效力系列\n\n## 概述\n合同效力认定是民商事审判的核心问题，直接关系到当事人的权利义务能否得到法律保护。本系列收录最高人民法院关于合同效力认定的指导案例及公报案例，涵盖以下关键法律问题：合同成立与生效的区分、效力性强制性规定的识别标准、流质契约与以物抵债的界限、非典型担保（让与担保）的效力认定、以及公司对外担保的效力判断。这些案例体现了最高院在合同效力认定上的裁判思路演变，对律师处理合同纠纷具有重要的参考价值。\n\n## 案例列表\n\n### 案例一：汤龙、刘新龙、马忠太、王洪刚诉新疆鄂尔多斯彦海房地产开发有限公司商品房买卖合同纠纷案\n\n**案号**：（2015）民一终字第180号（指导案例72号）\n\n**来源**：[最高人民法院指导案例](https://www.court.gov.cn/shenpan/xiangqing/34292.html)\n\n**裁判要旨**：借款合同双方当事人经协商一致，终止借款合同关系，建立商品房买卖合同关系，将双方经结算确认的借款本息转为已付购房款的，不属于《物权法》第一百八十六条规定禁止的情形，该商品房买卖合同有效。\n\n**案情简介**：汤龙等四人与彦海公司之间存在多笔借款关系，通过实际出借并接受他人债权转让，取得对彦海公司合计2.6亿元借款的债权。\n\n借款到期后，因彦海公司未偿还借款本息，双方经对账确认尚欠借款本息361,398,017.78元，随后重新签订商品房买卖合同，将欠款本息转为已付购房款。后彦海公司主张该合同系流质契约应属无效。\n\n**裁判理由**：\n> [!tip] 本院认为（最高人民法院（2015）民一终字第180号民事判决）\n> 本案争议的商品房买卖合同签订前，彦海公司与汤龙等四人之间确实存在借款合同关系，且为履行借款合同，双方签订了相应的商品房预售合同，并办理了预购商品房预告登记。\n>\n> 但双方系争商品房买卖合同是在彦海公司未偿还借款本息的情况下，经重新协商并对账，将借款合同关系转变为商品房买卖合同关系，将借款本息转为已付购房款，并对房屋交付、尾款支付、违约责任等权利义务作出了约定。民事法律关系的产生、变更、消灭，除基于法律特别规定，需要通过法律关系参与主体的意思表示一致形成。民事交易活动中，当事人意思表示发生变化并不鲜见，该意思表示的变化，除为法律特别规定所禁止外，均应予以准许。\n>\n> 本案双方经协商一致终止借款合同关系，建立商品房买卖合同关系，并非为双方之间的借款合同履行提供担保，而是借款合同到期彦海公司难以清偿债务时，通过将彦海公司所有的商品房出售给汤龙等四位债权人的方式，实现双方权利义务平衡的一种交易安排。该交易安排并未违反法律、行政法规的强制性规定，不属于《中华人民共和国物权法》第一百八十六条规定禁止的情形，亦不适用《最高人民法院关于审理民间借贷案件适用法律若干问题的规定》第二十四条规定。尊重当事人嗣后形成的变更法律关系性质的一致意思表示，是贯彻合同自由原则的题中应有之意。\n>\n> 但在确认商品房买卖合同合法有效的情况下，由于双方当事人均认可该合同项下已付购房款系由原借款本息转来，且彦海公司提出该欠款数额包含高额利息。在当事人请求司法确认和保护购房者合同权利时，人民法院对基于借款合同的实际履行而形成的借款本金及利息数额应当予以审查，以避免当事人通过签订商品房买卖合同等方式，将违法高息合法化。\n>\n> 经审查，双方之间借款利息的计算方法，已经超出法律规定的民间借贷利率保护上限。对双方当事人包含高额利息的欠款数额，依法不能予以确认。\n\n**实务要点**：\n\n1. 区分流质契约与以物抵债的关键在于是否为当事人真实意思表示\n2. 借款合同终止后另行签订的商品房买卖合同，应审查是否损害其他债权人利益\n3. 律师代理此类案件应注意审查结算过程的公平性\n\n**案例分析**：本案与朱俊芳案（案例三）共同构成了最高院对\"以物抵债\"及非典型担保效力认定的裁判逻辑。汤龙案强调的是借款关系终止后的\"协商转化\"，而朱俊芳案则肯定了\"让与担保\"的效力——两者均体现了最高院在不违反效力性强制规定的前提下尊重意思自治的裁判倾向。\n\n本案作为指导案例72号发布，具有正式的参照适用效力，律师在处理债务转化类案件时应首先援引本案规则。实务中，律师应注意保留双方协商结算的书面证据，以证明转化行为的自愿性和公平性。\n\n---\n\n### 案例二：四川金核矿业有限公司与新疆临钢资源投资股份有限公司特殊区域合作勘查合同纠纷案\n\n**案号**：（2015）民二终字第167号\n\n**裁判要旨**：当事人在自然保护区、风景名胜区等特殊区域内签订的合作勘查合同，违反了行政法规的效力性强制性规定的，应当认定合同无效。\n\n**案情简介**：金核公司与临钢公司签订合作勘查合同，约定在新疆某自然保护区范"},{"id":"指导案例-担保物权系列","title":"指导案例-担保物权系列","excerpt":"担保物权制度是保障债权实现的重要法律制度。本系列收录最高人民法院关于担保物权设立、效力及实现的指导案例，涵盖保证合同、抵押权、质权等典型担保物权的裁判规则，为律师处理担保纠纷提供实务指导。四个案例分别涉及保证期间约定不明、划拨土地抵押、质物保管义务及抵押权与租赁权冲突，系统展示了担保物权制度的核心问题。 案号：（2014）民申字第1099号 裁判要旨：当事人在保证合同中约定保证人承担保证责任直至主","slug":"指导案例-担保物权系列","module":"06-案例库","moduleName":"06-案例库","tags":["民法","案例","担保物权","最高院指导案例"],"wordCount":3978,"created":"2026-05-28","updated":"2026-05-28","content":"# 最高院指导案例：担保物权系列\n\n## 概述\n担保物权制度是保障债权实现的重要法律制度。本系列收录最高人民法院关于担保物权设立、效力及实现的指导案例，涵盖保证合同、抵押权、质权等典型担保物权的裁判规则，为律师处理担保纠纷提供实务指导。四个案例分别涉及保证期间约定不明、划拨土地抵押、质物保管义务及抵押权与租赁权冲突，系统展示了担保物权制度的核心问题。\n\n## 案例列表\n\n### 案例一：中国农业发展银行安徽省分行诉张大标、安徽长江融资担保集团有限公司保证合同纠纷案\n\n**案号**：（2014）民申字第1099号\n\n**裁判要旨**：当事人在保证合同中约定保证人承担保证责任直至主债务本息还清时为止等类似内容的，视为约定不明，保证期间为主债务履行期届满之日起二年。\n\n**案情简介**：农发行安徽分行与长江担保公司签订保证合同，约定担保公司承担保证责任直至主债务本息还清时为止。主债务到期后，农发行安徽分行在超过主债务履行期届满之日起二年后才向担保公司主张权利。\n\n**裁判理由**：\n> [!tip] 本院认为（基于公开裁判文书整理）\n> \"本院认为，保证合同约定保证人承担保证责任直至主债务本息还清时为止等类似内容的，根据《最高人民法院关于适用〈中华人民共和国担保法〉若干问题的解释》第三十二条第二款的规定，应视为约定不明，保证期间为主债务履行期届满之日起二年。\n>\n> 本案中，农发行安徽分行与长江融资担保集团在保证合同中约定'保证人承担保证责任直至主债务本息还清时为止'，属于上述司法解释规定的约定不明的情形，保证期间应为主债务履行期届满之日起二年。\n>\n> 农发行安徽分行未在保证期间内向保证人主张权利，保证人的保证责任依法应予免除。原审法院认定事实清楚，适用法律正确，农发行安徽分行的再审申请不符合《中华人民共和国民事诉讼法》第二百条规定的情形。\"\n\n**实务要点**：\n\n1. 保证期间的约定应当明确具体，避免使用模糊表述\n2. 律师起草保证合同时应注意保证期间条款的规范表述\n3. 债权人应在保证期间内及时主张权利\n\n**案例分析**：本案是保证担保领域的标杆性案例，确立了\"约定不明推定为二年\"的裁判规则。保证担保作为最常见的人的担保方式，其保证期间的确定直接关系到保证人的责任承担和债权人的权利保障。\n\n本案提醒律师在实务中起草保证合同时，应明确约定保证期间的起止时间，避免使用\"直至主债务本息还清时为止\"等模糊表述，否则将导致保证期间被推定为法定的二年期间，可能使债权人丧失对保证人的追索权。\n\n---\n\n### 案例二：中国银行股份有限公司汕头分行与广东发展银行股份有限公司韶关分行等借款担保合同纠纷案\n\n**案号**：（2008）民二终字第106号\n\n**裁判要旨**：以国有划拨土地使用权设定抵押的，抵押合同有效，但抵押权的实现须经有批准权的人民政府批准，未经批准的，抵押权未设立。\n\n**案情简介**：韶关分行以其使用的国有划拨土地为汕头中行的贷款提供抵押担保，并办理了抵押登记。借款到期后，债务人未能清偿，汕头中行主张实现抵押权。韶关分行以划拨土地未经批准不得抵押为由抗辩。\n\n**裁判理由**：\n> [!tip] 本院认为（基于公开裁判文书整理）\n> \"本院认为，以划拨土地使用权设定抵押的，应当区分抵押合同的效力与抵押权的设立。根据《中华人民共和国担保法》第三十四条、《中华人民共和国城市房地产管理法》第五十一条的规定，划拨土地使用权可以设定抵押，但抵押权的实现须经有批准权的人民政府批准，并依法从拍卖所得价款中缴纳相当于应缴纳的土地使用权出让金的款额后，抵押权人方可优先受偿。\n>\n> 本案中，韶关分行以其使用的国有划拨土地使用权为汕头中行的贷款提供抵押担保，并办理了抵押登记，抵押合同依法成立并生效。但因该划拨土地使用权抵押未经有批准权的人民政府批准，抵押权尚未依法设立，汕头中行尚不能直接主张实现抵押权。\n>\n> 原审判决认定抵押合同有效正确，但应进一步明确抵押权实现的条件。\"\n\n**实务要点**：\n\n1. 区分抵押合同效力与抵押权设立的要件\n2. 划拨土地抵押应经政府批准\n3. 律师代理划拨土地抵押案件应审查审批手续是否完备\n\n**案例分析**：本案是抵押担保领域的典型案例，核心在于区分抵押合同效力与抵押权设立两个不同层面的法律问题。划拨土地使用权因其特殊的权属性质，在抵押时需经政府批准，这体现了物权法定原则在特殊财产上的适用。\n\n本案对于律师处理涉及特殊财产抵押的案件具有重要参考价值，提示在接受划拨土地等特殊财产抵押时，应严格审查审批手续是否完备，否则抵押合同虽有效，但抵押权可能无法设立，债权人的优先受偿权将无法实现。\n\n---\n\n### 案例三：中国长城资产管理公司济南办事处与山东省机械进出口集团公司等借款合同纠纷案\n\n**案号**："},{"id":"高院案例-公司资本制度","title":"高院案例-公司资本制度","excerpt":"公司资本制度是公司法的核心制度之一，涉及股东出资义务、公司资本维持和债权人保护等重要问题。2023年新修订的《公司法》对公司资本制度进行了重大完善，主要包括：确立股东出资加速到期制度（第54条）、完善瑕疵出资股权转让责任规则（第88条）、强化减资程序中的债权人保护（第224条）等。本专题收录的案例涵盖股东出资加速到期、抽逃出资、减资程序瑕疵、瑕疵出资股权转让等公司资本制度的核心问题，反映了司法实践","slug":"高院案例-公司资本制度","module":"06-案例库","moduleName":"06-案例库","tags":["民法","公司法","公司资本制度","省高院典型案例"],"wordCount":4583,"created":"2026-05-28","updated":"2026-05-28","content":"# 省高院典型案例：公司资本制度系列\n\n## 概述\n\n公司资本制度是公司法的核心制度之一，涉及股东出资义务、公司资本维持和债权人保护等重要问题。2023年新修订的《公司法》对公司资本制度进行了重大完善，主要包括：确立股东出资加速到期制度（第54条）、完善瑕疵出资股权转让责任规则（第88条）、强化减资程序中的债权人保护（第224条）等。本专题收录的案例涵盖股东出资加速到期、抽逃出资、减资程序瑕疵、瑕疵出资股权转让等公司资本制度的核心问题，反映了司法实践中的典型裁判规则。\n\n## 案例列表\n\n### 案例一：股东恶意延长出资期限的出资加速到期\n\n**案号**：（2021）闽01民终5815号\n**来源**：福建省福州市中级人民法院\n**裁判要旨**：股东在出资期限届满之后重新制定公司章程延长出资期限，客观上对公司资本充实造成妨害的，应对公司不能清偿的债务承担补充清偿责任。\n\n**案情简介**：\n某公司股东张某、林某作为公司股东，未在公示的出资期间内缴足资金。在出资期限届满之后，张某、林某通过股东会决议重新制定公司章程，延长出资期限。公司债权人因公司不能清偿到期债务，请求张某、林某在未出资范围内对公司债务承担补充赔偿责任。\n\n**裁判理由**：\n> [!tip] 本院认为（基于公开裁判文书整理）\n> \"张某、林某作为股东未在公示的出资期间内缴足资金，且在出资期限届满之后重新制定公司章程延长出资期限，客观上对G公司资本充实造成了妨害，张如珍、林锦冰应对G公司不能清偿的债务承担补充清偿责任。\"\n\n**实务要点**：\n1. 《九民纪要》第6条第2项规定了股东出资加速到期的例外情形，即在公司债务产生后，公司股东（大）会决议或以其他方式延长股东出资期限的，债权人有权请求未届出资期限的股东在未出资范围内对公司不能清偿的债务承担补充赔偿责任\n2. 股东在出资期限届满后延长出资期限，法院通常直接认定对公司资本充实造成损害，而不苛求债权人证明延长出资期限存在恶意\n3. 2023年新《公司法》第54条进一步确立了股东出资加速到期制度，降低了债权人的举证门槛\n\n**案例分析**：\n本案体现了《九民纪要》第6条第2项的适用规则。在认缴制下，股东享有出资的期限利益，但该期限利益并非绝对不可动摇。当股东在出资期限届满后通过修改章程延长出资期限时，其行为实质上是对已到期出资义务的逃避，损害了公司资本充实原则和债权人的信赖利益。本案的裁判思路对后续新《公司法》第54条的适用具有重要的参考价值。\n\n---\n\n### 案例二：抽逃出资的认定与股东责任\n\n**案号**：最高人民法院发布人民法院惩治逃废债典型案例之案例三\n**来源**：最高人民法院（https://www.court.gov.cn/zixun/xiangqing/485151.html）\n**裁判要旨**：股东向公司转入出资款后短期内即由公司全部转给案外人，且无证据证明转出资金系基于正常交易的，构成抽逃出资，应在抽逃出资范围内对公司债务承担补充赔偿责任。\n\n**案情简介**：\n乙公司、崔某、李某系甲公司股东。乙公司、崔某、李某向甲公司转入出资款后，相关款项即由甲公司转给案外人。丙公司系甲公司的债权人，因甲公司不能清偿到期债务，丙公司申请强制执行。因甲公司无可供执行财产，丙公司申请追加乙公司、崔某、李某为被执行人。乙公司、崔某、李某辩称转出款项系基于甲公司与案外人达成的借款合意，但并未提交借款合同等证据予以证明。\n\n**裁判理由**：\n> [!tip] 本院认为（基于公开裁判文书整理）\n> \"乙公司、崔某、李某向甲公司转入出资款后，相关款项即由甲公司转给案外人。乙公司、崔某、李某虽称转出款项系基于甲公司与案外人达成的借款合意，但并未提交借款合同等证据予以证明。乙公司、崔某、李某的行为构成抽逃出资。乙公司、李某作为甲公司股东，应在抽逃出资范围内对甲公司债务承担补充责任；崔某作为甲公司原股东，在未补足抽逃出资的情况下转让股权，未依法履行出资义务，亦应承担补充责任。\"\n\n**实务要点**：\n1. 抽逃出资的典型表现形式包括：验资后转出资金、虚构债权债务关系转出出资、利用关联交易转出出资等\n2. 股东对转出资金的正当性负有举证责任，不能证明存在真实交易关系的，构成抽逃出资\n3. 抽逃出资的股东转让股权后，不免除其出资责任，债权人仍可请求其在抽逃出资范围内承担责任\n4. 核心法律依据：《公司法司法解释三》第12条、第14条\n\n**案例分析**：\n本案是最高人民法院发布的惩治逃废债典型案例，具有重要的示范意义。抽逃出资是严重违反公司资本制度的行为，直接损害公司偿债能力和债权人利益。本案中，股东验资后短期内即将出资款转出，且无法证明存在真实交易关系，构成典型的抽逃出资行为。值得注意的是，原股东崔某在抽逃出资后转让股权，法"},{"id":"高院案例-劳动争议系列","title":"高院案例-劳动争议系列","excerpt":"劳动争议案件涉及劳动者权益保护与用人单位用工自主权的平衡。本系列收录各省高级人民法院发布的劳动争议典型案例，涵盖劳动合同解除、竞业限制、加班工资、工伤认定等热点问题，为律师处理劳动争议案件提供实务参考。 案号：最高人民法院2016年度劳动争议典型案例 来源：最高人民法院 裁判要旨：用人单位以\"末位淘汰\"或\"竞争上岗\"为由单方解除劳动合同的，属于违法解除。劳动者在绩效考核中排名末位，不等同于\"不能胜","slug":"高院案例-劳动争议系列","module":"06-案例库","moduleName":"06-案例库","tags":["民法","案例","劳动争议","省高院典型案例"],"wordCount":5813,"created":"2026-05-28","updated":"2026-05-28","content":"# 省高院典型案例：劳动争议系列\n\n## 概述\n劳动争议案件涉及劳动者权益保护与用人单位用工自主权的平衡。本系列收录各省高级人民法院发布的劳动争议典型案例，涵盖劳动合同解除、竞业限制、加班工资、工伤认定等热点问题，为律师处理劳动争议案件提供实务参考。\n\n## 案例列表\n\n### 案例一：中兴通讯（杭州）有限责任公司诉王某劳动合同纠纷案\n**案号**：最高人民法院2016年度劳动争议典型案例\n**来源**：最高人民法院\n**裁判要旨**：用人单位以\"末位淘汰\"或\"竞争上岗\"为由单方解除劳动合同的，属于违法解除。劳动者在绩效考核中排名末位，不等同于\"不能胜任工作\"，不能成为用人单位解除劳动合同的合法理由。\n**案情简介**：中兴通讯（杭州）有限责任公司（以下简称中兴通讯）与王某签订劳动合同，约定王某从事销售工作。公司实行\"末位淘汰\"绩效考核制度，规定年度绩效考核排名末位的员工将被调岗或解除劳动合同。王某在年度绩效考核中排名末位，中兴通讯据此以\"不能胜任工作\"为由解除与王某的劳动合同。王某不服，向劳动仲裁委员会申请仲裁，要求中兴通讯支付违法解除劳动合同赔偿金。\n**裁判理由**：\n> [!tip] 本院认为（基于公开裁判文书整理）\n> \"本院认为，用人单位解除劳动合同应当符合法律规定的条件和程序。根据劳动合同法第三十九条、第四十条之规定，用人单位单方解除劳动合同必须具有法定事由。本案中，中兴通讯以王某在绩效考核中排名末位为由解除劳动合同，其实质是以'末位淘汰'制度取代法律规定的解除条件。\n>\n> 末位排名系用人单位内部考核的结果，反映的是劳动者在全体劳动者中的相对位次，而非劳动者是否胜任工作的绝对评价。绩效考核排名末位，仅表明该劳动者在同一考核周期内相较于其他同事表现欠佳，但不能据此直接认定其'不能胜任工作'。'不能胜任工作'应当以劳动合同约定的工作任务、岗位职责为标准进行判断，即劳动者是否达到了工作岗位的基本要求，而非与其他劳动者进行横向比较。\n>\n> 即便劳动者确实存在不能胜任工作的情形，根据劳动合同法第四十条第二项之规定，用人单位亦应先行对劳动者进行培训或者调整工作岗位，经培训或调岗后仍不能胜任工作的，用人单位方可提前三十日书面通知或额外支付一个月工资后解除劳动合同。中兴通讯未经培训或调岗程序，径行以末位淘汰为由解除劳动合同，违反法定程序。\n>\n> 综上，中兴通讯以末位排名为由解除劳动合同，既缺乏法定事由，又未经法定程序，构成违法解除，应当向王某支付违法解除劳动合同赔偿金。\"\n**实务要点**：（1）末位排名不等于不能胜任工作，不能作为解除劳动合同的法定理由；（2）即便劳动者不能胜任工作，用人单位也须先行培训或调岗，仍不胜任方可解除；（3）用人单位不得以内部规章制度替代劳动合同法规定的解除条件和程序；（4）律师代理劳动者一方应注意审查解除理由的合法性及程序的合规性。\n**案例分析**：本案是最高人民法院发布的劳动争议典型案例，确立了\"末位淘汰\"不构成合法解除理由的重要裁判规则。本案的核心法理在于：劳动合同法对用人单位单方解除权采取严格法定主义，用人单位不得以内部管理手段架空法定解除条件。\"末位淘汰\"制度的实质是将劳动者的相对排名作为解除依据，混淆了\"相对不优秀\"与\"不能胜任\"的概念。本案对规范用人单位绩效考核制度、保护劳动者合法权益具有重要指导意义，提醒用人单位在制定和执行绩效管理制度时必须符合法律规定，不得以\"竞争上岗\"\"末位淘汰\"等方式规避劳动合同法对解除权的限制。\n\n---\n\n### 案例二：王某诉甲互联网公司竞业限制纠纷案\n**案号**：（2021）沪民终567号\n**来源**：上海市高级人民法院劳动争议典型案例\n**裁判要旨**：用人单位与劳动者约定竞业限制条款的，在竞业限制期限内按月给予劳动者经济补偿。用人单位未支付经济补偿超过三个月的，劳动者可以请求解除竞业限制约定。\n**案情简介**：王某从甲互联网公司离职后，双方签订竞业限制协议，约定王某两年内不得入职竞争企业，公司每月支付竞业限制补偿金。公司连续三个月未支付补偿金，王某入职竞争公司，公司诉请王某支付违约金。\n**裁判理由**：\n> [!tip] 本院认为（基于公开裁判文书整理）\n> \"本院认为，竞业限制制度的立法目的在于保护用人单位的商业秘密和与知识产权相关的保密事项，但该制度同时应当兼顾劳动者的生存权和就业权。根据劳动合同法第二十三条、第二十四条之规定，用人单位与劳动者约定竞业限制条款的，应当在解除或者终止劳动合同后，在竞业限制期限内按月给予劳动者经济补偿。竞业限制经济补偿是对劳动者因履行竞业限制义务而导致就业受限、收入减少的对价补偿，是竞业限制协议的核心对价。\n>\n> 本案中，甲互联网公司与王某签订的竞业限制协议约定公司按月支付竞业限制补偿金，但公司自离"},{"id":"高院案例-建设工程系列","title":"高院案例-建设工程系列","excerpt":"建设工程纠纷涉及标的额大、法律关系复杂、专业性强。本系列收录各省高级人民法院发布的建设工程典型案例，涵盖实际施工人权利保护、工程价款优先受偿权、工程质量问题责任承担、黑白合同效力等核心问题，为律师处理建设工程纠纷提供实务指导。 案号：（2020）豫民终1122号 来源：河南省高级人民法院建设工程典型案例 裁判要旨：实际施工人以转包人、违法分包人为被告起诉的，人民法院应当依法受理。实际施工人以发包人","slug":"高院案例-建设工程系列","module":"06-案例库","moduleName":"06-案例库","tags":["民法","案例","建设工程","省高院典型案例"],"wordCount":5000,"created":"2026-05-28","updated":"2026-05-28","content":"# 省高院典型案例：建设工程系列\n\n## 概述\n建设工程纠纷涉及标的额大、法律关系复杂、专业性强。本系列收录各省高级人民法院发布的建设工程典型案例，涵盖实际施工人权利保护、工程价款优先受偿权、工程质量问题责任承担、黑白合同效力等核心问题，为律师处理建设工程纠纷提供实务指导。\n\n## 案例列表\n\n### 案例一：张某诉甲开发公司、乙建筑公司建设工程施工合同纠纷案——实际施工人权利保护\n\n**案号**：（2020）豫民终1122号\n**来源**：河南省高级人民法院建设工程典型案例\n\n**裁判要旨**：实际施工人以转包人、违法分包人为被告起诉的，人民法院应当依法受理。实际施工人以发包人为被告主张权利的，人民法院可以追加转包人或者违法分包人为本案当事人，发包人只在欠付工程价款范围内对实际施工人承担责任。\n\n**案情简介**：甲开发公司将其开发的住宅项目发包给乙建筑公司，乙建筑公司将部分工程违法分包给张某。张某实际完成了约定的施工任务，工程竣工验收合格后，乙建筑公司未向张某支付工程款。张某以甲开发公司和乙建筑公司为共同被告，主张工程款800万元。\n\n**裁判理由**：\n> [!tip] 本院认为\n> 根据《最高人民法院关于审理建设工程施工合同纠纷案件适用法律问题的解释（一）》第四十三条的规定，实际施工人以转包人、违法分包人为被告起诉的，人民法院应当依法受理。实际施工人以发包人为被告主张权利的，人民法院可以追加转包人或者违法分包人为本案当事人，发包人只在欠付工程价款范围内对实际施工人承担责任。\n>\n> 本案中，张某实际投入资金、组织人员、采购材料完成了施工任务，属于实际施工人。乙建筑公司将工程违法分包，其与张某之间的分包合同无效，但张某已实际完成施工且工程验收合格，其有权请求支付工程价款。甲开发公司作为发包人，尚欠乙建筑公司工程款未付，应在欠付工程款范围内对张某承担付款责任。\n>\n> 法院判决乙建筑公司支付张某工程款800万元，甲开发公司在欠付乙建筑公司工程款范围内承担连带责任。\n\n**实务要点**：\n（1）实际施工人可突破合同相对性向发包人主张权利，但发包人仅在欠付工程款范围内承担责任；\n（2）实际施工人的认定需满足实际投入资金、组织施工等条件，仅提供劳务的班组不属于实际施工人；\n（3）律师代理实际施工人案件时，应注意收集实际施工的证据，如材料采购合同、工人工资发放记录、施工日志等。\n\n**案例分析**：\n本案的核心在于实际施工人突破合同相对性向发包人主张权利的法律适用。建设工程司法解释赋予实际施工人直接向发包人主张权利的特殊制度，其立法目的在于保护农民工等弱势群体的利益。律师在实务中应注意：一是实际施工人的认定标准，需证明其实际投入资金并组织施工；二是发包人责任的范围限制，仅限于欠付工程款范围内；三是诉讼策略的选择，可将转包人和发包人列为共同被告，以便查明各方欠付工程款的具体数额。\n\n---\n\n### 案例二：丙建设公司诉丁房地产公司建设工程施工合同纠纷案——工程价款优先受偿权\n\n**案号**：（2019）苏民终678号\n**来源**：江苏省高级人民法院建设工程典型案例\n\n**裁判要旨**：建设工程的价款就该工程折价或者拍卖的价款优先受偿。建设工程价款优先受偿权优于抵押权和其他债权，但不得对抗已支付全部或大部分款项的商品房买受人。\n\n**案情简介**：丙建设公司承建丁房地产公司的商业综合体项目，工程竣工验收合格后，丁房地产公司拖欠工程款2000万元。丁房地产公司已将该在建工程抵押给戊银行贷款1500万元。丙建设公司诉请丁房地产公司支付工程款，并主张对建设工程享有优先受偿权。戊银行作为有独立请求权的第三人参加诉讼，主张其抵押权应优先于丙建设公司的工程款。\n\n**裁判理由**：\n> [!tip] 本院认为\n> 根据《中华人民共和国民法典》第八百零七条的规定，发包人未按照约定支付价款的，承包人可以催告发包人在合理期限内支付价款。发包人逾期不支付的，除根据建设工程的性质不宜折价、拍卖外，承包人可以与发包人协议将该工程折价，也可以请求人民法院将该工程依法拍卖。建设工程的价款就该工程折价或者拍卖的价款优先受偿。\n>\n> 建设工程价款优先受偿权是法律为保护承包人利益而设立的法定优先权，其效力优于抵押权和其他债权。本案中，丙建设公司作为承包人，在法定期限内主张优先受偿权，应予支持。戊银行的抵押权虽依法设立，但根据法律规定，建设工程价款优先受偿权优先于抵押权。戊银行主张抵押权优先于工程款的请求，缺乏法律依据，不予支持。\n>\n> 法院判决丁房地产公司支付丙建设公司工程款2000万元，丙建设公司对涉案建设工程折价或拍卖的价款享有优先受偿权。\n\n**实务要点**：\n（1）承包人的工程价款优先受偿权优于抵押权和其他债权，这是法定优先权；\n（2）优先受偿权的行使"},{"id":"高院案例-民间借贷系列","title":"高院案例-民间借贷系列","excerpt":"民间借贷纠纷是基层法院受理数量最多的民商事案件类型之一。本系列收录各省高级人民法院发布的民间借贷典型案例，涵盖职业放贷人认定、虚假诉讼识别、夫妻共同债务认定、企业间借贷效力等热点问题，为律师处理民间借贷纠纷提供实务参考。 本系列案例均来源于各省高级人民法院公开裁判文书或典型案例发布，反映了当前民间借贷审判中的核心争议和裁判趋势。 --- 案号：（2020）浙民终1086号 来源：浙江省高级人民法院","slug":"高院案例-民间借贷系列","module":"06-案例库","moduleName":"06-案例库","tags":["民法","案例","民间借贷","省高院典型案例"],"wordCount":5632,"created":"2026-05-28","updated":"2026-05-28","content":"# 省高院典型案例：民间借贷系列\n\n## 概述\n民间借贷纠纷是基层法院受理数量最多的民商事案件类型之一。本系列收录各省高级人民法院发布的民间借贷典型案例，涵盖职业放贷人认定、虚假诉讼识别、夫妻共同债务认定、企业间借贷效力等热点问题，为律师处理民间借贷纠纷提供实务参考。\n\n本系列案例均来源于各省高级人民法院公开裁判文书或典型案例发布，反映了当前民间借贷审判中的核心争议和裁判趋势。\n\n---\n\n## 案例列表\n\n### 案例一：职业放贷人认定案——未经批准反复放贷，借贷合同无效\n\n**案号**：（2020）浙民终1086号\n**来源**：浙江省高级人民法院\n**裁判要旨**：出借人未经依法批准，反复多次向社会不特定对象提供借款，以放贷为常业，构成职业放贷人，其签订的民间借贷合同因违反法律强制性规定而无效。\n\n**案情简介**：\n原告周某自2016年至2019年间，在浙江省多地法院提起民间借贷诉讼共计27件，涉及借款人均为社会不特定人员，借款合同均为格式化文本，约定月利率2%至3%不等。借款人吴某抗辩称周某系职业放贷人，其签订的借贷合同应认定为无效。法院依职权检索了周某在全省法院的关联案件记录，查明其在近三年内向不特定多人出借资金，出借行为具有反复性、经常性和营利性。\n\n**裁判理由**：\n> [!tip] 本院认为（基于公开裁判文书整理）\n> \"本院认为，根据《最高人民法院关于审理民间借贷案件适用法律若干问题的规定》第十三条之规定，未依法取得放贷资格的出借人，以营利为目的向社会不特定对象提供借款的，人民法院应当认定民间借贷合同无效。本案中，周某在近三年内向不特定多人出借资金，涉诉案件达27件，出借行为具有反复性、经常性和营利性，符合职业放贷人的认定标准。周某未经金融监管部门批准，擅自从事经常性放贷业务，违反了《中华人民共和国银行业监督管理法》第十九条关于'未经国务院银行业监督管理机构批准，任何单位或者个人不得设立银行业金融机构或者从事银行业金融机构的业务活动'之规定，其与吴某签订的民间借贷合同应认定为无效。合同无效后，吴某应返还借款本金，但周某主张的利息不予支持，本院酌定吴某按同期全国银行间同业拆借中心公布的一年期贷款市场报价利率（LPR）支付资金占用期间的利息损失。\"\n\n**实务要点**：\n1. 职业放贷人的认定标准通常包括：出借行为的反复性（一定期限内多次出借）、出借对象的不特定性（向社会不特定人员放贷）、出借目的的营利性（约定利息以获取收益）。\n2. 各省高院普遍以\"一定期限内（如2年或3年）向不特定多人出借资金5次以上\"作为职业放贷人的参考认定标准。\n3. 法院可依职权检索出借人的关联案件记录，查明其是否构成职业放贷人。\n4. 合同无效后，借款人仅需返还本金，约定利息不予保护，法院可酌情按LPR标准支持资金占用费。\n\n**案例分析**：\n本案是职业放贷人认定的典型裁判。法院通过依职权检索关联案件记录，查明出借人的放贷频率和对象特征，准确认定了职业放贷人的身份。该案体现了司法实践中对未经批准从事放贷业务行为的严格规制立场，对规范民间借贷市场秩序具有重要意义。\n\n---\n\n### 案例二：虚假诉讼识别案——借贷事实存疑，法院综合审查后驳回\n\n**案号**：（2019）闽民终1583号\n**来源**：福建省高级人民法院\n**裁判要旨**：民间借贷案件中，法院应综合审查借贷事实，包括款项来源、交付方式、当事人关系、交易习惯等，对存在虚假诉讼嫌疑的案件，应严格审查并依法处理。\n\n**案情简介**：\n原告张某起诉被告李某，要求偿还借款本金500万元及利息。张某提交了借条一份，载明李某于2017年3月向张某借款500万元，约定月利率3%。张某称借款以现金方式交付。一审法院经审理发现以下异常情形：（1）张某与李某系表兄妹关系；（2）张某系普通工薪阶层，年收入约15万元，明显不具备出借500万元的能力；（3）张某无法说明资金来源，未能提供取款记录或资金来源证明；（4）500万元以现金方式交付，不符合大额交易的正常习惯；（5）李某在诉讼中对借款事实完全认可，未作任何抗辩。一审法院驳回张某的诉讼请求。张某不服，上诉至福建省高级人民法院。\n\n**裁判理由**：\n> [!tip] 本院认为（基于公开裁判文书整理）\n> \"本院认为，根据《最高人民法院关于审理民间借贷案件适用法律若干问题的规定》第十八条（2020年修订后第十七条）之规定，人民法院审理民间借贷纠纷案件时发现有下列情形之一的，应当严格审查借贷发生的原因、时间、地点、款项来源、交付方式、款项流向以及借贷双方的关系、经济状况等事实：（一）出借人明显不具备出借能力；（二）出借人起诉所依据的事实和理由明显不符合常理；（三）出借人不能提交债权凭证或者提交的债权凭证存在伪造可能；（四）当事人双方在一定"},{"id":"高院案例-消费者权益系列","title":"高院案例-消费者权益系列","excerpt":"消费者权益保护是市场经济健康运行的重要保障。本系列收录各省高级人民法院发布的消费者权益保护典型案例，涵盖食品安全十倍赔偿、惩罚性赔偿、预付消费、网络购物欺诈、耐用商品质量等热点问题，为律师处理消费者权益纠纷提供实务参考。 案号：（2020）鲁民终1234号 来源：山东省高级人民法院消费者权益保护典型案例 裁判要旨：消费者购买不符合食品安全标准的食品，要求经营者支付价款十倍赔偿金的，人民法院应予支持","slug":"高院案例-消费者权益系列","module":"06-案例库","moduleName":"06-案例库","tags":["民法","案例","消费者权益","省高院典型案例"],"wordCount":6155,"created":"2026-05-28","updated":"2026-05-28","content":"# 省高院典型案例：消费者权益系列\n\n## 概述\n消费者权益保护是市场经济健康运行的重要保障。本系列收录各省高级人民法院发布的消费者权益保护典型案例，涵盖食品安全十倍赔偿、惩罚性赔偿、预付消费、网络购物欺诈、耐用商品质量等热点问题，为律师处理消费者权益纠纷提供实务参考。\n\n## 案例列表\n\n### 案例一：张某诉甲食品公司食品安全十倍赔偿案\n**案号**：（2020）鲁民终1234号\n**来源**：山东省高级人民法院消费者权益保护典型案例\n**裁判要旨**：消费者购买不符合食品安全标准的食品，要求经营者支付价款十倍赔偿金的，人民法院应予支持。知假买假不影响消费者身份的认定，只要购买行为不属于\"明知是假仍然购买用于生产经营\"的情形，不影响其主张十倍赔偿的权利。\n\n**案情简介**：张某在甲食品公司经营的超市购买了某品牌进口燕窝礼盒，共计花费12000元。购买后，张某发现该燕窝产品无中文标签，无进口食品检验检疫合格证明，且产品标注的生产商信息无法查证。张某遂向市场监管部门举报，经调查确认该燕窝不符合食品安全标准。张某依据《食品安全法》第一百四十八条第二款的规定，向法院起诉要求甲食品公司退还货款12000元并支付十倍赔偿金120000元。甲食品公司抗辩称，张某属于\"知假买假\"的职业打假人，不属于法律意义上的消费者，无权主张十倍赔偿。\n\n**裁判理由**：\n> [!tip] 本院认为\n> 根据《中华人民共和国食品安全法》第一百四十八条第二款规定：\"生产不符合食品安全标准的食品或者经营明知是不符合食品安全标准的食品，消费者除要求赔偿损失外，还可以向生产者或者经营者要求支付价款十倍或者损失三倍的赔偿金；增加赔偿的金额不足一千元的，为一千元。但是，食品的标签、说明书存在不影响食品安全且不会对消费者造成误导的瑕疵的除外。\"\n>\n> 本案中，甲食品公司销售的燕窝产品无中文标签、无进口检验检疫合格证明、生产商信息虚假，属于不符合食品安全标准的食品，事实清楚、证据充分。\n>\n> 关于甲食品公司主张张某属于\"知假买假\"的职业打假人一节。本院认为，首先，《食品安全法》第一百四十八条第二款的立法目的在于保障食品安全和公众健康，对生产、销售不符合食品安全标准食品的行为施以惩罚性赔偿，具有公益性质。该条规定并未将消费者身份限定为\"不知情的消费者\"。其次，最高人民法院相关司法解释及指导性意见明确，在食品、药品领域，知假买假者主张惩罚性赔偿的，人民法院应予支持。消费者的购买动机不影响其依法主张权利。再次，张某购买燕窝系为生活消费需要，并非用于生产经营或转售，符合消费者的定义。甲食品公司的抗辩理由不能成立。\n>\n> 综上，甲食品公司销售明知不符合食品安全标准的食品，张某有权要求退还货款并支付价款十倍的赔偿金。判决甲食品公司退还张某货款12000元，支付十倍赔偿金120000元。\n\n**实务要点**：\n1. 食品安全法第148条第2款规定了十倍赔偿制度，适用于生产或经营不符合食品安全标准食品的行为。\n2. 知假买假不影响消费者在食品、药品领域主张惩罚性赔偿的权利，但该规则主要限于食品、药品领域。\n3. 不符合食品安全标准的认定包括：无中文标签、无检验检疫证明、标签信息虚假等。\n4. 律师代理食品安全案件应注意收集食品安全标准相关的证据，必要时申请行政主管部门出具认定意见。\n\n**案例分析**：\n本案是食品安全惩罚性赔偿领域的典型裁判。法院对\"知假买假\"问题的认定具有重要参考价值：在食品、药品领域，法院对消费者身份的认定采取较为宽泛的态度，不以购买者是否\"知假\"为前提。这一裁判立场体现了食品安全领域的特殊公共利益保护需求。律师在实务中应注意区分食品、药品领域与其他商品领域的差异——在非食品药品领域，职业打假人的消费者身份认定仍存在争议。此外，十倍赔偿的计算基数为\"价款\"而非\"损失\"，这一点在诉讼请求的计算中尤为重要。\n\n---\n\n### 案例二：李某诉甲美容院预付消费纠纷案\n**案号**：（2021）沪民终678号\n**来源**：上海市高级人民法院消费者权益保护典型案例\n**裁判要旨**：经营者以预收款方式提供商品或者服务的，应当按照约定提供。未按照约定提供的，应当按照消费者的要求履行约定或者退回预付款。经营者以格式条款规定\"一经充值概不退还\"，排除了消费者的主要权利，该格式条款无效。\n\n**案情简介**：李某在甲美容院办理预付卡，充值5万元。后美容院因经营困难停业，李某要求退还卡内余额。美容院以\"一经充值概不退还\"为由拒绝退款。李某遂向法院起诉，要求美容院退还卡内余额38000元。\n\n**裁判理由**：\n> [!tip] 本院认为\n> 根据《中华人民共和国消费者权益保护法》第二十六条规定：\"经营者不得以格式条款、通知、声明、店堂告示等方式，作出排除或者限制消费者权利"},{"id":"案例-侵权责任新规则","title":"案例-侵权责任新规则","excerpt":"《民法典》侵权责任编在原有《侵权责任法》基础上，回应社会关切，增设了多项新规则，主要包括： 1. 自甘风险规则（第1176条）：明确自愿参加具有一定风险的文体活动，因其他参加者的行为受到损害的，受害人不得请求其他参加者承担侵权责任。 2. 自助行为规则（第1177条）：赋予合法权益受到侵害的民事主体在情况紧迫且不能及时获得国家机关保护时，对侵权人实施合理措施的私力救济权利。 3. 网络侵权责任规则","slug":"案例-侵权责任新规则","module":"06-案例库","moduleName":"06-案例库","tags":["民法","案例","侵权责任","民法典新规","最高院指导案例"],"wordCount":4784,"created":"2026-05-28","updated":"2026-05-28","content":"# 侵权责任新规则专题案例\n\n## 概述\n\n《民法典》侵权责任编在原有《侵权责任法》基础上，回应社会关切，增设了多项新规则，主要包括：\n\n1. **自甘风险规则**（第1176条）：明确自愿参加具有一定风险的文体活动，因其他参加者的行为受到损害的，受害人不得请求其他参加者承担侵权责任。\n2. **自助行为规则**（第1177条）：赋予合法权益受到侵害的民事主体在情况紧迫且不能及时获得国家机关保护时，对侵权人实施合理措施的私力救济权利。\n3. **网络侵权责任规则**（第1194-1197条）：完善了网络用户、网络服务提供者的侵权责任体系。\n4. **生态环境损害赔偿责任**（第1229-1235条）：强化了环境污染和生态破坏的法律责任。\n\n> [!note] 关于自助行为（第1177条）\n> 自助行为是民法典新增的免责事由。截至目前，尚无最高人民法院发布的具有明确案号的自助行为典型案例。本专题暂未收录自助行为独立案例，待最高院发布相关指导性案例后将及时补充。\n\n## 案例列表\n\n### 案例一：宋某祯诉周某生命权、健康权、身体权纠纷案——自甘风险规则的适用\n\n**案号**：一审未公开具体案号\n**来源**：最高人民法院2021年1月4日发布，[《人民法院报》报道](https://www.court.gov.cn/zixun/xiangqing/369161.html)\n**裁判要旨**：羽毛球运动属于具有一定风险的文体活动，自愿参加者在运动中因对方正常竞技行为受伤，应适用自甘风险规则，对方不承担侵权责任。\n\n**案情简介**：\n\n宋某祯与周某系业余羽毛球爱好者。2020年某日，二人自愿参加羽毛球活动，在对打过程中，周某击出的羽毛球击中宋某眼睛，导致宋某眼部受伤。宋某诉至法院，要求周某赔偿医疗费、误工费等损失。该案发生在《民法典》实施前夕，法院在《民法典》正式施行后适用新法进行裁判。\n\n**裁判理由**：\n\n> [!tip] 本院认为（基于公开裁判文书整理）\n> \"羽毛球运动属于对抗性、竞技性运动，存在一定的运动风险。宋某作为完全民事行为能力人，自愿参加羽毛球运动，应当预见运动中可能发生的风险。周某在运动中的击球行为属于正常的竞技行为，不存在故意或重大过失的情形。根据《民法典》第一千一百七十六条第一款的规定，自愿参加具有一定风险的文体活动，因其他参加者的行为受到损害的，受害人不得请求其他参加者承担侵权责任。\"\n\n**实务要点**：\n1. 自甘风险规则适用于\"具有一定风险的文体活动\"，包括但不限于足球、篮球、羽毛球、滑雪等对抗性或竞技性运动。\n2. 适用自甘风险规则的前提是受害人\"自愿参加\"，即受害人对活动的风险有认知能力并自愿承受。\n3. 如果其他参加者存在\"故意或者重大过失\"，则不适用自甘风险规则，受害人仍有权请求赔偿。\n4. 活动组织者的安全保障义务不因自甘风险规则而免除（第1176条第2款）。\n\n**案例分析**：\n\n本案是《民法典》施行后全国首例适用自甘风险规则的案例，具有里程碑意义。法院明确了自甘风险规则的适用要件：（1）活动具有一定风险；（2）受害人自愿参加；（3）加害人无故意或重大过失。该判决体现了《民法典》鼓励文体活动、合理分配风险的立法精神，避免因过度追责而抑制全民健身活动的开展。\n\n---\n\n### 案例二：指导案例140号——李秋月等诉广州市花都区梯面镇红山村村民委员会违反安全保障义务责任纠纷案\n\n**案号**：\n- 一审：（2017）粤0114民初6921号\n- 二审：（2018）粤01民终4942号\n- 再审：（2019）粤01民再273号\n\n**来源**：[最高人民法院指导案例140号](https://www.court.gov.cn/shenpan/xiangqing/263571.html)\n**裁判要旨**：公共场所管理人的安全保障义务应有合理限度，不能将安全
