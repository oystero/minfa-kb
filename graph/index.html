    const width = container.clientWidth;
    const height = container.clientHeight;

    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('width', width);
    svg.setAttribute('height', height);
    svg.style.background = 'transparent';
    container.appendChild(svg);

    const nodes = graphData.nodes.map(n => ({ ...n }));
    const links = graphData.links.map(l => ({ ...l }));

    const nodeMap = {};
    nodes.forEach(n => { nodeMap[n.id] = n; });

    nodes.forEach(n => {
      n.x = width / 2 + (Math.random() - 0.5) * width * 0.6;
      n.y = height / 2 + (Math.random() - 0.5) * height * 0.6;
      n.vx = 0;
      n.vy = 0;
    });

    const alpha = 0.3;
    const alphaDecay = 0.02;
    let currentAlpha = 1;

    function tick() {
      currentAlpha *= (1 - alphaDecay);
      if (currentAlpha < 0.001) return;

      nodes.forEach(n => {
        n.vx += (width / 2 - n.x) * 0.01 * currentAlpha;
        n.vy += (height / 2 - n.y) * 0.01 * currentAlpha;
      });

      links.forEach(l => {
        const s = nodeMap[l.source];
        const t = nodeMap[l.target];
        if (!s || !t) return;
        const dx = t.x - s.x;
        const dy = t.y - s.y;
        const dist = Math.sqrt(dx * dx + dy * dy) || 1;
        const force = (dist - 100) * 0.05 * currentAlpha;
        s.vx += dx / dist * force;
        s.vy += dy / dist * force;
        t.vx -= dx / dist * force;
        t.vy -= dy / dist * force;
      });

      for (let i = 0; i < nodes.length; i++) {
        for (let j = i + 1; j < nodes.length; j++) {
          const a = nodes[i];
          const b = nodes[j];
          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const dist = Math.sqrt(dx * dx + dy * dy) || 1;
          const force = 500 / (dist * dist) * currentAlpha;
          a.vx -= dx / dist * force;
          a.vy -= dy / dist * force;
          b.vx += dx / dist * force;
          b.vy += dy / dist * force;
        }
      }

      nodes.forEach(n => {
        n.vx *= 0.6;
        n.vy *= 0.6;
        n.x += n.vx;
        n.y += n.vy;
        n.x = Math.max(20, Math.min(width - 20, n.x));
        n.y = Math.max(20, Math.min(height - 20, n.y));
      });

      render();
      if (currentAlpha > 0.001) requestAnimationFrame(tick);
    }

    function render() {
      svg.innerHTML = '';

      links.forEach(l => {
        const s = nodeMap[l.source];
        const t = nodeMap[l.target];
        if (!s || !t) return;
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('x1', s.x);
        line.setAttribute('y1', s.y);
        line.setAttribute('x2', t.x);
        line.setAttribute('y2', t.y);
        line.setAttribute('stroke', '#94a3b8');
        line.setAttribute('stroke-opacity', '0.3');
        line.setAttribute('stroke-width', '1');
        svg.appendChild(line);
      });

      nodes.forEach(n => {
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        g.style.cursor = 'pointer';

        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', n.x);
        circle.setAttribute('cy', n.y);
        circle.setAttribute('r', '6');
        circle.setAttribute('fill', moduleColors[n.module] || '#94a3b8');
        g.appendChild(circle);

        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', n.x);
        text.setAttribute('y', n.y - 10);
        text.setAttribute('text-anchor', 'middle');
        text.setAttribute('fill', '#64748b');
        text.setAttribute('font-size', '10');
        text.textContent = n.title.length > 12 ? n.title.slice(0, 12) + '...' : n.title;
        g.appendChild(text);

        g.addEventListener('click', () => {
          window.location.href = base + 'articles/' + n.id + '/';
        });

        svg.appendChild(g);
      });
    }

    tick();

    document.getElementById('reset-btn')?.addEventListener('click', () => {
      nodes.forEach(n => {
        n.x = width / 2 + (Math.random() - 0.5) * width * 0.6;
        n.y = height / 2 + (Math.random() - 0.5) * height * 0.6;
        n.vx = 0;
        n.vy = 0;
      });
      currentAlpha = 1;
      tick();
    });
  })();</script>  </div> </main> </div> <!-- Footer --> <footer class="border-t border-primary-200/60 dark:border-primary-800/30 mt-auto"> <div class="max-w-[1400px] mx-auto px-6 py-6 flex items-center justify-between text-[11px] text-gray-400 dark:text-gray-600"> <span class="font-display">民法实务知识库</span> <div class="flex items-center gap-4"> <a href="https://github.com/oystero" target="_blank" rel="noopener" class="hover:text-accent-600 dark:hover:text-accent-400 transition-colors">GitHub</a> <a href="mailto:oystero185@gmail.com" class="hover:text-accent-600 dark:hover:text-accent-400 transition-colors">oystero185@gmail.com</a> </div> </div> </footer> <div id="sidebar-overlay" class="fixed inset-0 z-20 bg-black/40 hidden lg:hidden"></div> <script type="module">const g=document.getElementById("theme-toggle"),o=document.getElementById("theme-light-icon"),s=document.getElementById("theme-dark-icon"),u=document.documentElement.classList.contains("dark");u?(o?.classList.add("hidden"),s?.classList.remove("hidden")):(o?.classList.remove("hidden"),s?.classList.add("hidden"));g?.addEventListener("click",()=>{const e=!document.documentElement.classList.contains("dark");document.documentElement.style.transition="background-color 0.3s, color 0.3s",document.body.style.transition="background-color 0.3s, color 0.3s",e?(document.documentElement.classList.add("dark"),o?.classList.add("hidden"),s?.classList.remove("hidden"),localStorage.setItem("theme","dark")):(document.documentElement.classList.remove("dark"),o?.classList.remove("hidden"),s?.classList.add("hidden"),localStorage.setItem("theme","light")),setTimeout(()=>{document.documentElement.style.transition="",document.body.style.transition=""},300)});const h=document.getElementById("mobile-menu-toggle"),y=document.getElementById("sidebar"),r=document.getElementById("sidebar-overlay");function a(){y?.classList.toggle("-translate-x-full"),r?.classList.toggle("hidden")}h?.addEventListener("click",a);r?.addEventListener("click",a)
